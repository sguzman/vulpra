name: Integrate Firefox 160.0.1 Source Into Vulpra Main
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-firefox160-main.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vulpra-firefox160-main-source-integration
  cancel-in-progress: false
jobs:
  source-integration:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VULPRA_INTEGRATE_FIREFOX160: '1'
    steps:
      - name: Checkout Vulpra main source overlays and project-owned infrastructure
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            ci
            nix
            scripts
            packaging
            docs/vulpra
            README.md
            AGENTS.md
            CLAUDE.md
            browser/config/version.txt
            ci/land-firefox160-on-main.sh
            ci/security-160-stage-overlay.sh
            ci/security-160-stage-byob-branding.sh
            ci/security-160-hotfix-assemble-tree.sh
            ci/fixtures/firefox160-original-branding.js
            browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/PromoCard/PromoCardOptOut.jsx
            toolkit/components/nimbus/NimbusBootstrap.sys.mjs
            browser/branding/unofficial/configure.sh
            browser/branding/unofficial/locales/en-US/brand.ftl
            browser/branding/unofficial/pref/firefox-branding.js
            browser/moz.configure
            browser/app/profile/firefox.js
            toolkit/components/normandy/jar.mn
            toolkit/components/normandy/lib/NormandyApi.sys.mjs
            toolkit/components/normandy/lib/NormandyUtils.sys.mjs
            toolkit/components/normandy/schemas/LegacyHeartbeat.schema.json
            browser/extensions/newtab/webext-glue/moz.build
            browser/extensions/newtab/lib/ActivityStream.sys.mjs
            browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs
            browser/extensions/newtab/lib/TopSitesFeed.sys.mjs
            taskcluster/kinds/toolchain/android.yml
            python/mozbuild/mozbuild/frontend/emitter.py
            browser/components/asrouter/modules/ASRouter.sys.mjs
            toolkit/components/moz.build
            browser/components/BrowserComponents.manifest
            browser/components/DesktopActorRegistry.sys.mjs
            browser/components/asrouter/moz.build
            browser/extensions/newtab/addon-jar.mn
            browser/extensions/newtab/build-newtab-bundles.py
            browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx
            browser/extensions/newtab/webpack.system-addon.config.js
            dom/webgpu/tests/cts/checkout/node.tsconfig.json
            python/mozbuild/mozbuild/testing.py
            toolkit/components/nimbus/moz.build
            toolkit/components/normandy/moz.build
            toolkit/modules/AppConstants.sys.mjs
      - name: Checkout pinned official Firefox 160 release overlay bases only
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: 2887d9de1f69c0e9776413da80e7ba0d1225dd9b
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          path: upstream160
          sparse-checkout: |
            browser/branding/unofficial/configure.sh
            browser/branding/unofficial/locales/en-US/brand.ftl
            browser/branding/unofficial/pref/firefox-branding.js
            browser/moz.configure
            browser/app/profile/firefox.js
            toolkit/components/normandy/jar.mn
            toolkit/components/normandy/lib/NormandyApi.sys.mjs
            toolkit/components/normandy/lib/NormandyUtils.sys.mjs
            toolkit/components/normandy/schemas/LegacyHeartbeat.schema.json
            browser/extensions/newtab/webext-glue/moz.build
            browser/extensions/newtab/lib/ActivityStream.sys.mjs
            browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs
            browser/extensions/newtab/lib/TopSitesFeed.sys.mjs
            taskcluster/kinds/toolchain/android.yml
            python/mozbuild/mozbuild/frontend/emitter.py
            browser/components/asrouter/modules/ASRouter.sys.mjs
            toolkit/components/moz.build
            browser/components/BrowserComponents.manifest
            browser/components/DesktopActorRegistry.sys.mjs
            browser/components/asrouter/moz.build
            browser/extensions/newtab/addon-jar.mn
            browser/extensions/newtab/build-newtab-bundles.py
            browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx
            browser/extensions/newtab/webpack.system-addon.config.js
            dom/webgpu/tests/cts/checkout/node.tsconfig.json
            python/mozbuild/mozbuild/testing.py
            toolkit/components/nimbus/moz.build
            toolkit/components/normandy/moz.build
            toolkit/modules/AppConstants.sys.mjs
      - name: Checkout official Firefox 160.0.1 Git tree with sparse overlay bases
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: 58fed86b1b6864ad71b83c910a879d6f1a6b678b
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          path: upstream160hotfix
          sparse-checkout: |
            browser/branding/unofficial/configure.sh
            browser/branding/unofficial/locales/en-US/brand.ftl
            browser/branding/unofficial/pref/firefox-branding.js
            browser/moz.configure
            browser/app/profile/firefox.js
            toolkit/components/normandy/jar.mn
            toolkit/components/normandy/lib/NormandyApi.sys.mjs
            toolkit/components/normandy/lib/NormandyUtils.sys.mjs
            toolkit/components/normandy/schemas/LegacyHeartbeat.schema.json
            browser/extensions/newtab/webext-glue/moz.build
            browser/extensions/newtab/lib/ActivityStream.sys.mjs
            browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs
            browser/extensions/newtab/lib/TopSitesFeed.sys.mjs
            taskcluster/kinds/toolchain/android.yml
            python/mozbuild/mozbuild/frontend/emitter.py
            browser/components/asrouter/modules/ASRouter.sys.mjs
            toolkit/components/moz.build
            browser/components/BrowserComponents.manifest
            browser/components/DesktopActorRegistry.sys.mjs
            browser/components/asrouter/moz.build
            browser/extensions/newtab/addon-jar.mn
            browser/extensions/newtab/build-newtab-bundles.py
            browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx
            browser/extensions/newtab/webpack.system-addon.config.js
            dom/webgpu/tests/cts/checkout/node.tsconfig.json
            python/mozbuild/mozbuild/testing.py
            toolkit/components/nimbus/moz.build
            toolkit/components/normandy/moz.build
            toolkit/modules/AppConstants.sys.mjs
            dom/media/ChannelMediaDecoder.cpp
            gfx/gl/GLBlitHelper.cpp
            browser/config/version.txt
      - name: Restore exact pinned Vulpra-only source files when sparse checkout omits them
        shell: bash
        run: |
          set -euo pipefail
          for entry in \
            "browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/PromoCard/PromoCardOptOut.jsx 717e107fa4af5dbffbb0b98083fe84bc5f0c6705" \
            "toolkit/components/nimbus/NimbusBootstrap.sys.mjs df7e5b95aa96d930550d794753c1acef942c70da"; do
            read -r file expected <<< "$entry"
            git cat-file -e "HEAD:$file"
            test "$(git rev-parse "HEAD:$file")" = "$expected"
            if ! test -f "$file"; then
              mkdir -p -- "$(dirname -- "$file")"
              git show "HEAD:$file" > "$file"
            fi
            test -f "$file" && test ! -L "$file"
            test "$(git hash-object "$file")" = "$expected"
          done
          echo 'PASS: exact Vulpra-added upstream-absent source blobs materialized in sparse CI'
      - name: Verify pinned Firefox160.0.1 and integrate actual source directly on main
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/land-firefox160-on-main.sh
          bash ci/land-firefox160-on-main.sh
