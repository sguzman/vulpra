# Compare original pinned native Vulpra glibc lazy-allowed vs eager-PLT binding startup.
# Rust observer exports only counts and safe provider basenames, never symbols or raw traces.
name: M3 Original libxul Eager PLT vs Default Runtime Bindings
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-libxul-eager-vs-default-bindings.yml
      - ci/m3-native-libxul-bindings.rs
      - ci/smoke-newtab-asrouter-native-bridge.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-compiled-libxul-default-and-now-binding-comparison:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout read-only native smoke and bounded parser
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Unit-test bounded Rust parser and authenticate original source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-native-libxul-bindings.rs -o "$RUNNER_TEMP/m3-bindings-tests"
          "$RUNNER_TEMP/m3-bindings-tests"
          rustc --edition=2021 -O ci/m3-native-libxul-bindings.rs -o "$RUNNER_TEMP/m3-libxul-parser"
          python3 ci/smoke-newtab-asrouter-native-bridge.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA"               '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
      - name: Download original compiled full-Normandy archive with checksum provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path(os.environ["RUNNER_TEMP"])/"original"
          archive=root/"full-normandy-baseline.tar.xz"
          m=json.loads((root/"m3-full-normandy-baseline.json").read_text())
          assert m["schema_version"]==1
          assert m["source_commit"]==os.environ["SOURCE_SHA"]
          assert m["variant"]=="full-normandy"
          assert m["required_newtab_modules_present"] is True
          assert m["normandy_runner_present"] is True
          assert m["sha256"]==os.environ["ARCHIVE_SHA256"]==hashlib.sha256(archive.read_bytes()).hexdigest()
          assert m["compressed_bytes"]==archive.stat().st_size==87154544
          print("PASS: original compiled Vulpra source and archive authenticated")
          PY
          mkdir -p .git/vulpra-native-build/packages
          cp "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" \
            .git/vulpra-native-build/packages/vulpra-local-loader-observation.tar.xz
          (cd .git/vulpra-native-build/packages && \
           sha256sum vulpra-local-loader-observation.tar.xz > \
               vulpra-local-loader-observation.tar.xz.sha256)
      - name: Install runtime libraries and pinned GeckoDriver only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 \
            libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
      - name: Compare original compiled browser default vs LD_BIND_NOW headless launch
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-default-binding-traces" "$RUNNER_TEMP/m3-eager-binding-traces"
          trap 'rm -rf -- "$RUNNER_TEMP/m3-default-binding-traces" "$RUNNER_TEMP/m3-eager-binding-traces"' EXIT

          # Both execute the exact checksum-authenticated original native browser
          # New Tab QA with disposable profiles, no permanent installations.
          env PATH="$RUNNER_TEMP:$PATH" MOZ_HEADLESS=1 LD_DEBUG=bindings \
            LD_DEBUG_OUTPUT="$RUNNER_TEMP/m3-default-binding-traces/m3-bindings" \
            python3 ci/smoke-newtab-asrouter-native-bridge.py "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/m3-libxul-parser" "$RUNNER_TEMP/m3-default-binding-traces" \
            "$RUNNER_TEMP/m3-default-libxul-bindings.json"

          # LD_BIND_NOW=1 forces immediate PLT relocation of libraries *loaded
          # in this process/workload*, not arbitrary future dlopen modules.
          env PATH="$RUNNER_TEMP:$PATH" MOZ_HEADLESS=1 LD_BIND_NOW=1 LD_DEBUG=bindings \
            LD_DEBUG_OUTPUT="$RUNNER_TEMP/m3-eager-binding-traces/m3-bindings" \
            python3 ci/smoke-newtab-asrouter-native-bridge.py "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/m3-libxul-parser" "$RUNNER_TEMP/m3-eager-binding-traces" \
            "$RUNNER_TEMP/m3-eager-libxul-bindings.json"

          jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA256" \
            --slurpfile b "$RUNNER_TEMP/m3-default-libxul-bindings.json" \
            --slurpfile e "$RUNNER_TEMP/m3-eager-libxul-bindings.json" '
            ($b[0]) as $before | ($e[0]) as $after |
            if ([$before,$after]|all(.[];
                .schema_version==1 and
                .status=="observed_original_native_libxul_glibc_symbol_bindings" and
                .original_source_commit==$src and .original_archive_sha256==$sha and
                .browser_pid_traces_with_libxul_bindings>=1 and
                .libxul_normal_symbol_binding_events>=1 and
                .distinct_symbol_provider_pairs_observed>=1 and
                (.observed_provider_basename_count==(.observed_provider_basenames|length)) and
                .actual_runtime_binding_proven_for_this_workload==true and
                .raw_loader_logs_exported==false and .symbol_names_exported==false and
                .complete_relocation_coverage_proven==false and
                .lazy_and_transitive_feature_coverage_proven==false and
                .new_source_pruning_authorized==false
            )) then {
              schema_version:1,
              status:"original_libxul_default_vs_eager_plt_bindings_observed",
              original_source_commit:$src,
              original_archive_sha256:$sha,
              default_normal_symbol_binding_events:$before.libxul_normal_symbol_binding_events,
              eager_normal_symbol_binding_events:$after.libxul_normal_symbol_binding_events,
              observed_binding_event_delta:($after.libxul_normal_symbol_binding_events-$before.libxul_normal_symbol_binding_events),
              default_distinct_symbol_provider_pairs:$before.distinct_symbol_provider_pairs_observed,
              eager_distinct_symbol_provider_pairs:$after.distinct_symbol_provider_pairs_observed,
              distinct_pair_count_delta:($after.distinct_symbol_provider_pairs_observed-$before.distinct_symbol_provider_pairs_observed),
              default_pid_traces:$before.browser_pid_traces_with_libxul_bindings,
              eager_pid_traces:$after.browser_pid_traces_with_libxul_bindings,
              observed_provider_basename_union:([$before.observed_provider_basenames[],$after.observed_provider_basenames[]]|unique),
              actual_original_browser_headless_qa_passed_in_both_modes:true,
              eager_plt_applied_to_process:true,
              no_raw_symbol_names_or_pids_exported:true,
              proves_all_possible_lazy_dl_lookups:false,
              proves_arch_platform_compatibility:false,
              feature_or_source_pruning_authorized:false,
              new_package_size_savings_bytes:null
            } else error("untrusted or incomplete original libxul binding samples") end' \
            >"$RUNNER_TEMP/m3-original-libxul-plt-eager-vs-default.json"
          jq -e '.schema_version==1 and
            .actual_original_browser_headless_qa_passed_in_both_modes==true and
            .eager_plt_applied_to_process==true and
            .default_normal_symbol_binding_events>=1 and
            .eager_normal_symbol_binding_events>=1 and
            .no_raw_symbol_names_or_pids_exported==true and
            .proves_all_possible_lazy_dl_lookups==false and
            .feature_or_source_pruning_authorized==false and
            .new_package_size_savings_bytes==null' \
            "$RUNNER_TEMP/m3-original-libxul-plt-eager-vs-default.json" >/dev/null
          echo 'PASS: same original compiled browser headless QA under default and eager PLT binding modes'
      - name: Preserve only sanitized original libxul eager/default comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-libxul-eager-vs-default-sanitized
          path: |
            ${{ runner.temp }}/m3-original-libxul-plt-eager-vs-default.json
            ${{ runner.temp }}/m3-default-libxul-bindings.json
            ${{ runner.temp }}/m3-eager-libxul-bindings.json
          if-no-files-found: warn
          retention-days: 14
