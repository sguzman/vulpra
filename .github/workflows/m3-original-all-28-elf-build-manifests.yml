# Historical exact-source native output origins, without rebuild or pruning.
name: M3 Original All 28 ELF Pinned Build Source Declarations
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-all-28-elf-build-manifests.yml
      - ci/m3-original-all-28-elf-build-manifest-anchors.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-pinned-original-all-28-package-member-declarations:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout only bounded original source declaration verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Checkout exact historical source for only selected build manifests
        uses: actions/checkout@v4
        with:
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          path: original-source
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            toolkit/crashreporter/crash_helper/moz.build
            toolkit/crashreporter/client/app/moz.build
            toolkit/xre/gfxtest/moz.build
            media/gmp-clearkey/0.1/moz.build
            security/nss/lib/freebl/manifest.mn
            config/external/gkcodecs/moz.build
            config/external/lgpllibs/moz.build
            media/ffvpx/libavcodec/moz.build
            media/ffvpx/libavutil/moz.build
            widget/gtk/mozgtk/moz.build
            config/external/mozinference/moz.build
            security/sandbox/linux/moz.build
            config/external/sqlite/moz.build
            widget/gtk/mozwayland/moz.build
            config/external/nspr/pr/moz.build
            security/nss/lib/nss/manifest.mn
            security/nss/lib/util/manifest.mn
            toolkit/components/ml/moz.build
            config/external/nspr/libc/moz.build
            config/external/nspr/ds/moz.build
            security/nss/lib/smime/manifest.mn
            security/nss/lib/softoken/manifest.mn
            security/nss/lib/ssl/manifest.mn
            toolkit/library/moz.build
            toolkit/components/telemetry/pingsender/moz.build
            toolkit/mozapps/update/updater/moz.build
            browser/app/moz.build
      - name: Verify original exact source SHA and compile bounded Rust parser
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-source rev-parse HEAD)" = "$SOURCE_SHA"
          rustc --edition=2021 --test ci/m3-original-all-28-elf-build-manifest-anchors.rs -o "$RUNNER_TEMP/original-m3-build-anchors-test"
          "$RUNNER_TEMP/original-m3-build-anchors-test"
          rustc --edition=2021 -O ci/m3-original-all-28-elf-build-manifest-anchors.rs -o "$RUNNER_TEMP/original-m3-build-anchors"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
      - name: Retrieve only checksum-authenticated original compiled native archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
      - name: Crosswalk each original ELF member against one pinned source build declaration
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/original-m3-build-anchors" \
            "$GITHUB_WORKSPACE/original-source" "$RUNNER_TEMP/package/vulpra" \
            "$RUNNER_TEMP/m3-original-all-28-build-manifests.json"
          jq -e --arg sha "$ARCHIVE_SHA" --arg source "$SOURCE_SHA" '
            .schema_version==1 and
            .status=="all_original_28_elf_source_manifest_declarations_crosswalked" and
            .original_source_commit==$source and .original_archive_sha256==$sha and
            .original_regular_elf_count==28 and
            .source_manifest_anchor_matches==28 and
            ((.per_original_elf|keys|length)==28) and
            (all(.per_original_elf[]; .anchor_line>0 and
              (.source_manifest|type)=="string" and
              (.declaration_class|type)=="string")) and
            .source_manifest_declaration_classes_only==true and
            .nss_subbuilds_separately_anchored==true and
            .config_guards_not_evaluated==true and
            .generated_ninja_or_linker_ownership_not_proven==true and
            .all_feature_bundle_reachability_not_proven==true and
            .no_browser_profile_or_production_mutation==true and
            .source_removal_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-original-all-28-build-manifests.json" >/dev/null
          echo 'PASS: source-pinned build declaration anchored for every one of 28 original packaged ELF members'
      - name: Upload only bounded build-source declaration paths and line numbers
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-all-28-elf-source-build-declarations
          path: ${{ runner.temp }}/m3-original-all-28-build-manifests.json
          if-no-files-found: error
          retention-days: 14
