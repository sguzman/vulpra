name: Firefox 160.0.1 BYOB Artifact-Only WebDriver Replay (No Browser Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-hotfix-byob-artifact-webdriver-replay.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay-verified-native-artifact:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authenticate original hotfix compiled package and specific passed CI steps
        id: inspect
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const original=await github.rest.actions.getWorkflowRun({owner,repo,run_id:44543911014});
            const r=original.data;
            if (r.repository?.full_name!=='sguzman/vulpra' ||
                r.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
                r.head_sha!=='7b66694c9efc417ed2088be83a2512f34428c678' ||
                r.name!=='Firefox 160.0.1 BYOB Manual Native Preview (Unreleased)' ||
                r.status!=='completed' || r.conclusion!=='failure')
              throw Error('Original native browser build is unauthenticated');
            // The producer deliberately FAILED at the later WebDriver
            // UA check. Require that the original real browser build,
            // package, Wayland smoke and its artifact upload all succeeded.
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {owner,repo,run_id:44543911014,per_page:100});
            const stage=jobs.filter(j=>j.name==='stage-twenty-eight-exact-source-overlays');
            const native=jobs.filter(j=>j.name==='materialize-verified-firefox160-candidate');
            if(stage.length!==1 || stage[0].conclusion!=='success' ||
               native.length!==1 || native[0].conclusion!=='failure')
              throw Error('Producer source/native jobs did not match recorded state');
            const steps=native[0].steps||[];
            for(const name of [
              'Materialize ONLY verified source patches, prove exact complete Git tree',
              'Configure exact-tree Firefox 160.0.1 Vulpra Linux candidate',
              'Compile exact materialized Firefox 160.0.1 Vulpra candidate',
              'Package and verify exact-source Firefox 160.0.1 native browser',
              'Archive unreleased Firefox 160.0.1 native CI package for independent QA replay',
              'Smoke-test isolated packaged Firefox 160.0.1 Vulpra on Linux and Wayland'
            ]){
              const result=steps.filter(s=>s.name===name);
              if(result.length!==1 || result[0].conclusion!=='success')
                throw Error('Missing required native pass: '+name);
            }
            const failure=steps.filter(s=>s.name===
              'Real packaged Firefox 160.0.1 JavaScript, WebExtension, TLS and Nimbus runtime acceptance');
            if(failure.length!==1 || failure[0].conclusion!=='failure')
              throw Error('Producer did not fail exclusively at the known WebDriver gate');
            const list=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:44543911014,per_page:100});
            for(const [name,id] of [
              ['firefox160-hotfix-byob-vulpra-unreleased-native-preview-not-approved',14557917682],
              ['firefox160-hotfix-byob-materialized-source-proof',14540871295]
            ]){
              const matches=list.filter(a=>a.name===name && a.id===id && !a.expired &&
                a.size_in_bytes>0 && new Date(a.expires_at)>new Date());
              if(matches.length!==1) throw Error('Compiled package or source identity missing: '+name);
            }
            core.info('PASS: exact Firefox 160.0.1 native producer, stage, compile, package and Wayland authenticated');
            core.setOutput('ready','true');
      - name: Checkout current QA-only WebDriver script, not browser source
        if: steps.inspect.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          # QA harness source only. Archived browser/source identity below
          # remains pinned to the original exact Firefox 160 build.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/smoke-webextension-package-local.py
      - name: Download unreleased native archive and checksum from same run
        if: steps.inspect.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: firefox160-hotfix-byob-vulpra-unreleased-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 44543911014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-package
      - name: Download exact complete-source identity from same run
        if: steps.inspect.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: firefox160-hotfix-byob-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 44543911014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-source
      - name: Verify source Git tree, original archive SHA-256 and stage locally
        if: steps.inspect.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/firefox160-source/materialized-candidate.json"
          archive="$RUNNER_TEMP/firefox160-package/vulpra-firefox160-hotfix-byob-native-ci.tar.xz"
          test -s "$src" && test -s "$archive" && test -s "$archive.sha256"
          jq -e '
            .upstream_release_commit == "58fed86b1b6864ad71b83c910a879d6f1a6b678b" and
            .complete_materialized_source_tree == "d6f7faf6583831a58d127480db54b5bcd5ab5949" and
            .verified_overlays == 28 and .exact_assembly_tree_match == true and
            .byob_source_variant_verified == true and
            .byob_branding_blob == "ae3fd50a6aee0ad58933dca09db39b7b87c0eb5e" and
            .security_current == false and
            .upstream_paths_otherwise_preserved == true
          ' "$src" > /dev/null
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp -- "$archive" "$dest/vulpra-local-firefox160-verified-replay.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-firefox160-verified-replay.tar.xz > vulpra-local-firefox160-verified-replay.tar.xz.sha256)
          echo 'PASS: exact Firefox 160.0.1 source tree, compiled package and original archive checksum'
      - name: Install native browser shared libraries and SHA-256-verified geckodriver
        if: steps.inspect.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 openssl jq libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          file="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl --fail --location --show-error --silent --retry 3 --max-time 90 \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz' -o "$file"
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/verified-driver"
          tar -xzf "$file" -C "$RUNNER_TEMP/verified-driver" geckodriver
          test -x "$RUNNER_TEMP/verified-driver/geckodriver"
          "$RUNNER_TEMP/verified-driver/geckodriver" --version
          echo "$RUNNER_TEMP/verified-driver" >> "$GITHUB_PATH"
      - name: Replay real compiled 160.0.1 browser JS, WebExtension, UA, BYOB defaults, TLS and Nimbus
        id: replay
        if: steps.inspect.outputs.ready == 'true'
        shell: bash
        env:
          VULPRA_M3_VERIFY_NIMBUS: "1"
          VULPRA_VERIFY_UA_COMPAT: "1"
          VULPRA_VERIFY_BYOB_DEFAULTS: "1"
        run: |
          set -euo pipefail
          python3 ci/smoke-webextension-package-local.py --self-test-cert-parser
          python3 ci/smoke-webextension-package-local.py --self-test-user-agent-parser
          python3 ci/smoke-webextension-package-local.py --self-test-byob-assertions
          python3 ci/smoke-webextension-package-local.py --self-test-synthetic-extension-fixture
          python3 ci/smoke-webextension-package-local.py "$GITHUB_WORKSPACE" 2>&1 | tee "$RUNNER_TEMP/firefox160-hotfix-replay-webdriver.log"
          report="$(find .git/vulpra-native-build -maxdepth 1 -name 'webextension-smoke-*.json' -type f -print -quit)"
          test -s "$report"
          archive="$RUNNER_TEMP/firefox160-package/vulpra-firefox160-hotfix-byob-native-ci.tar.xz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          jq --arg sha "$digest" '
            . + {
              original_native_ci_run_id: "44543911014",
              original_native_ci_commit: "7b66694c9efc417ed2088be83a2512f34428c678",
              firefox160_verified_git_tree: "d6f7faf6583831a58d127480db54b5bcd5ab5949",
              firefox160_staged_archive_sha256: $sha,
              tested_native_binary_without_rebuild: true,
              release_ready: false,
              security_current: false
            }
          ' "$report" > "$RUNNER_TEMP/firefox160-hotfix-replay-webdriver-proof.json"
          jq -e --arg sha "$digest" '
            .status == "pass" and
            .javascript_navigation.verified == true and
            .user_agent_compatibility.verified == true and
            .user_agent_compatibility.firefox_compat_token == true and
            .user_agent_compatibility.vulpra_brand_token == true and
            (.user_agent_compatibility.browser_version | startswith("160.")) and
            .user_agent_compatibility.default_profile_with_no_user_agent_override == true and
            .byob_default_preferences.verified == true and
            .byob_default_preferences.account_and_builtin_login_defaults_disabled == true and
            .byob_default_preferences.preference_names_checked == 4 and
            .byob_default_preferences.no_profile_overrides == true and
            .byob_default_preferences.passwords_read_or_written == false and
            .webextension.temporary_unsigned_install == true and
            .webextension.content_scripts == true and
            .webextension.background_messaging == true and
            .webextension.storage_local == true and
            .webextension.uninstall == true and
            .security.original_firefox_profile_preserved == true and
            .security.local_untrusted_tls_denial.verified == true and
            .security.local_untrusted_tls_denial.webdriver_accept_insecure_certs == false and
            .nimbus.store_ready == true and .nimbus.api_ready == true and
            .firefox160_staged_archive_sha256 == $sha and
            .tested_native_binary_without_rebuild == true and
            .release_ready == false and .security_current == false
          ' "$RUNNER_TEMP/firefox160-hotfix-replay-webdriver-proof.json" > /dev/null
          echo 'PASS: real Firefox 160.0.1 WebDriver runtime replay on original package, with no native rebuild'
          echo 'LIMIT: no general security-current or release acceptance'
      - name: Upload authenticated Firefox 160 artifact-only runtime proof
        id: proof
        if: success() && steps.inspect.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-hotfix-byob-vulpra-artifact-only-webdriver-proof
          path: ${{ runner.temp }}/firefox160-hotfix-replay-webdriver-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Save bounded replay diagnostics when WebDriver fails
        if: failure()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/firefox160-hotfix-replay-webdriver.log"; then
            tail -n 350 "$RUNNER_TEMP/firefox160-hotfix-replay-webdriver.log" > "$RUNNER_TEMP/firefox160-hotfix-replay-webdriver-failure-tail.log"
          fi
      - name: Upload bounded replay diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-hotfix-byob-vulpra-artifact-only-runtime-failure
          path: ${{ runner.temp }}/firefox160-hotfix-replay-webdriver-failure-tail.log
          if-no-files-found: ignore
          retention-days: 14
      # A successful metadata lookup is not a passed browser replay. In
      # particular, fail if a nonexistent/renamed step ID silently skipped
      # all tests. The positive gate is enforced even on manual dispatch.
      - name: Fail closed if authenticated native browser replay did not execute
        if: always()
        shell: bash
        env:
          INSPECT_STATUS: ${{ steps.inspect.outcome }}
          INSPECT_READY: ${{ steps.inspect.outputs.ready }}
          REPLAY_STATUS: ${{ steps.replay.outcome }}
          PROOF_STATUS: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          if [[ "$INSPECT_STATUS" != success || "$INSPECT_READY" != true ||
                "$REPLAY_STATUS" != success || "$PROOF_STATUS" != success ]]; then
            echo 'FAIL: Firefox 160.0.1 replay or authenticated proof was skipped/failed; green metadata-only run forbidden.' >&2
            exit 1
          fi
          echo 'PASS: actual archived native browser replay and proof upload both executed successfully.'
