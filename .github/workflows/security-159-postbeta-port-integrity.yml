name: Security 159 Post-Beta Hotfix Source Integrity
on:
  push:
    branches:
      - security/firefox-159-postbeta-hotfixes
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-preflight:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/security/firefox-159-postbeta-hotfixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact upstream security patch-result code and test
        shell: bash
        run: bash ci/security-159-postbeta-port-check.sh
