# Original source-pinned ONNX C API custom-ops library registration path.
# This is NOT GPU execution-provider activation, nor browser ML feature QA.
# In-memory float32 Constant CPU Run still validated in both test modes.
name: M3 Original ONNX Internal Custom Ops Loader Activation
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-onnx-constant-session.rs
      - ci/m3-original-onnx-inert-customops.c
      - .github/workflows/m3-original-onnx-customops-loader.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-onnx-internal-customops-loader:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
      OBSERVER_RUN: '41524996253'
      OBSERVER_HEAD: 4806a2b5da13ad63fd4197e0896b52cea61999fb
      NUMERIC_RUN: '41528669862'
      NUMERIC_HEAD: 31a3a5f7047ec367bdb050c2e3fd5dfc319f84dd
    steps:
      - name: Checkout only original Rust numerical probe and CI-only custom-ops observer fixtures
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-onnx-constant-session.rs
            ci/m3-original-onnx-inert-customops.c
            ci/m3-original-onnx-inner-dlopen-observe.c
      - name: Compile original ONNX API probe, inert plugin and independently checked origin observer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-original-onnx-constant-session.rs \
            -o "$RUNNER_TEMP/onnx-plugin-unit-tests"
          "$RUNNER_TEMP/onnx-plugin-unit-tests"
          rustc --edition=2021 -C opt-level=1 \
            ci/m3-original-onnx-constant-session.rs -o "$RUNNER_TEMP/onnx-plugin-probe"
          cc -std=c11 -Wall -Wextra -Werror -O2 -fPIC -shared \
            ci/m3-original-onnx-inert-customops.c \
            -o "$RUNNER_TEMP/libvulpra-onnx-test-customops.so"
          cc -std=c11 -Wall -Wextra -Werror -O2 -fPIC -fno-omit-frame-pointer -shared \
            ci/m3-original-onnx-inner-dlopen-observe.c \
            -o "$RUNNER_TEMP/onnx-origin-observer.so" -ldl
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-test-customops.so" |
            grep -Eq ' RegisterCustomOps$'
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-test-customops.so" |
            grep -Eq ' m3_customops_callback_count$'
          # Verify the actual upstream C header's index 29 in the stable v1
          # OrtApi layout. Avoid treating a guessed Rust slot as a real ABI.
          gh api repos/microsoft/onnxruntime/git/blobs/b01b7e48dc87bbeeb026c61fb06c591053853ad1 \
            --jq .content | base64 -d >"$RUNNER_TEMP/onnxruntime_c_api.h"
          test "$(git hash-object "$RUNNER_TEMP/onnxruntime_c_api.h")" = \
            b01b7e48dc87bbeeb026c61fb06c591053853ad1
          cat >"$RUNNER_TEMP/verify-onnx-customops-slot.c" <<'C'
          #include <stddef.h>
          #include "onnxruntime_c_api.h"
          _Static_assert(offsetof(OrtApi, RegisterCustomOpsLibrary) ==
                         29 * sizeof(void*),
                         "original ONNX OrtApi RegisterCustomOpsLibrary slot mismatch");
          int main(void) { return 0; }
          C
          cc -std=c11 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP" \
            "$RUNNER_TEMP/verify-onnx-customops-slot.c" \
            -o "$RUNNER_TEMP/verify-onnx-customops-slot"
          "$RUNNER_TEMP/verify-onnx-customops-slot"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN" |
            jq -e --arg sha "$OBSERVER_HEAD" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and
              .path==".github/workflows/m3-original-onnx-inner-dlopen.yml"
            ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NUMERIC_RUN" |
            jq -e --arg sha "$NUMERIC_HEAD" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and
              .path==".github/workflows/m3-original-onnx-constant-session.yml"
            ' >/dev/null
          echo 'PASS: native plugin, test probe, original observer and pinned upstream ABI field independently checked'
      - name: Authenticate and extract only original compiled full-normal ONNX library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/package"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -s "$RUNNER_TEMP/package/vulpra/libonnxruntime.so"
          nm -D --defined-only "$RUNNER_TEMP/package/vulpra/libonnxruntime.so" |
            grep -Eq ' OrtGetApiBase(@|$)'
      - name: Execute exact-original internal custom ops dlopen on CPU in two no-egress processes
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/package/vulpra"
          probe="$RUNNER_TEMP/onnx-plugin-probe"
          plugin="$RUNNER_TEMP/libvulpra-onnx-test-customops.so"
          observer="$RUNNER_TEMP/onnx-origin-observer.so"
          report="$RUNNER_TEMP/original-onnx-customops-origin.json"
          # The actual original ONNX library, not our Rust harness, is
          # responsible for loading plugin via OrtApi.RegisterCustomOpsLibrary.
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$pkg" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 35s \
            "$probe" "$pkg/libonnxruntime.so" "$plugin" |
            tee "$RUNNER_TEMP/original-onnx-plugin-control.stdout" >/dev/null
          grep -Fxq 'PASS: original ONNX custom ops plugin callback invoked and CPU Constant output equals float32[1] value 1.25' \
            "$RUNNER_TEMP/original-onnx-plugin-control.stdout"
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$pkg" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 35s \
            env LD_PRELOAD="$observer" M3_ONNX_INNER_DLOPEN_REPORT="$report" \
            "$probe" "$pkg/libonnxruntime.so" "$plugin" |
            tee "$RUNNER_TEMP/original-onnx-plugin-observed.stdout" >/dev/null
          grep -Fxq 'PASS: original ONNX custom ops plugin callback invoked and CPU Constant output equals float32[1] value 1.25' \
            "$RUNNER_TEMP/original-onnx-plugin-observed.stdout"
          test -s "$report"
          sudo chmod 0644 "$report"
          jq -e '
            .schema_version==1 and .diagnostic_interposition_used==true and
            .target_origin_basename=="libonnxruntime.so" and
            .all_interposed_dlopen_calls>=2 and
            .onnx_origin_dlopen_calls>=1 and
            .onnx_origin_successful_dlopen_calls>=1 and
            .onnx_origin_dlopen_calls==
              (.onnx_origin_successful_dlopen_calls+.onnx_origin_failed_dlopen_calls) and
            .other_origin_dlopen_calls>=1 and
            .all_interposed_dlopen_calls==
              (.onnx_origin_dlopen_calls+.other_origin_dlopen_calls) and
            .raw_caller_addresses_or_library_names_retained==false and
            .complete_native_loader_graph_proven==false
          ' "$report" >/dev/null
          jq -n --arg source "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
            --slurpfile observed "$report" '
            ($observed[0]) as $o |
            {
              schema_version:1,
              status:"original_onnx_library_origin_customops_dlopen_observed",
              exact_original_source_commit:$source,
              original_native_package_sha256:$sha,
              original_onnx_registration_api_slot:29,
              original_register_custom_ops_library_called:true,
              inert_ci_customops_registration_callback_invoked:true,
              original_cpu_constant_session_run_verified_both_modes:true,
              original_cpu_float32_1x1_value_exactly_1_25_verified:true,
              genuine_original_onnx_origin_dlopen_calls:$o.onnx_origin_dlopen_calls,
              genuine_original_onnx_origin_dlopen_successes:$o.onnx_origin_successful_dlopen_calls,
              genuine_original_onnx_origin_dlopen_failures:$o.onnx_origin_failed_dlopen_calls,
              separately_classified_harness_dlopen_calls:$o.other_origin_dlopen_calls,
              original_onnx_internal_dlopen_boundary_runtime_exercised:($o.onnx_origin_dlopen_calls>0),
              loader_call_origin_only_not_specific_machine_instruction:true,
              plugin_is_ci_owned_noop_custom_operator_fixture:true,
              plugin_is_not_execution_provider_or_GPU:true,
              real_browser_ml_frontend_exercised:false,
              all_provider_optional_dynamic_paths_exercised:false,
              all_other_native_ffi_or_dlopen_callpaths_proven:false,
              no_network_egress:true,
              external_model_or_user_data_consumed:false,
              installed_browser_or_profile_changed:false,
              source_pruning_authorized:false,
              m3_sixth_gate_closed:false
            }' >"$RUNNER_TEMP/m3-original-onnx-customops-runtime-boundary.json"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_onnx_library_origin_customops_dlopen_observed" and
            .exact_original_source_commit==$src and .original_native_package_sha256==$sha and
            .original_onnx_registration_api_slot==29 and
            .original_register_custom_ops_library_called==true and
            .inert_ci_customops_registration_callback_invoked==true and
            .original_cpu_constant_session_run_verified_both_modes==true and
            .original_cpu_float32_1x1_value_exactly_1_25_verified==true and
            .genuine_original_onnx_origin_dlopen_calls>=1 and
            .genuine_original_onnx_origin_dlopen_successes>=1 and
            .separately_classified_harness_dlopen_calls>=1 and
            .original_onnx_internal_dlopen_boundary_runtime_exercised==true and
            .loader_call_origin_only_not_specific_machine_instruction==true and
            .plugin_is_ci_owned_noop_custom_operator_fixture==true and
            .plugin_is_not_execution_provider_or_GPU==true and
            .real_browser_ml_frontend_exercised==false and
            .all_provider_optional_dynamic_paths_exercised==false and
            .all_other_native_ffi_or_dlopen_callpaths_proven==false and
            .no_network_egress==true and
            .external_model_or_user_data_consumed==false and
            .installed_browser_or_profile_changed==false and
            .source_pruning_authorized==false and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-original-onnx-customops-runtime-boundary.json" >/dev/null
          echo 'PASS: actual original ONNX module-origin dlopen and fixture RegisterCustomOps, with exact CPU output; no provider claim'
      - name: Archive only bounded origin-count evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-onnx-customops-internal-loader-runtime
          path: ${{ runner.temp }}/m3-original-onnx-customops-runtime-boundary.json
          if-no-files-found: error
          retention-days: 14
