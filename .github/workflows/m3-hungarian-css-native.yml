# Headless package-only diagnostic; no language pattern omission or native compilation.
name: M3 Archived Hungarian Hyphenation CSS Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-hungarian-css-native.yml
      - ci/smoke-hungarian-hyphenation-package.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vulpra-m3-hungarian-css-native
  cancel-in-progress: false

jobs:
  check-real-layout:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Sparse checkout only packaged browser runtime test scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci

      - name: Reject malformed CSS geometry and assert identical historical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/smoke-hungarian-hyphenation-package.py
          python3 ci/smoke-hungarian-hyphenation-package.py --self-test
          python3 - <<'PY'
          import subprocess
          expected={
            "intl/hyphenation/glue/nsHyphenationManager.cpp":"719685cbf396544debeb075ac5e33fe2850b3d6e",
            "intl/hyphenation/glue/nsHyphenator.cpp":"c004801d30f6728fdb39f62b151f4f0fbebeb709",
            "intl/locales/moz.build":"5688314462c802444765cb76b6893da4ed46993a",
          }
          for path,blob in expected.items():
            actual=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
            assert actual==blob,(path,actual,blob)
          print("PASS: three hyphenation sources match checksum-verified original compiled source")
          print("LIMIT: rest of historical native browser is not current-source-matched")
          PY

      - name: Retrieve checksum-verified normal historical native Vulpra
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40567473401 --repo "$GITHUB_REPOSITORY" \
            --name m3-asrouter-promo-matched-baseline --dir "$RUNNER_TEMP/archived"
          (
            cd "$RUNNER_TEMP/archived"
            sha256sum -c vulpra-promo-full-baseline.tar.xz.sha256
            jq -e '.source_commit == "1683ca67b69389a879717bcd537772c3b40624b6" and .full_promo_resources_present == true' m3-promo-matched-size.json >/dev/null
          )
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/archived/vulpra-promo-full-baseline.tar.xz" "$dest/vulpra-local-hyph-css.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-hyph-css.tar.xz > vulpra-local-hyph-css.tar.xz.sha256)

      - name: Install actual browser runtime requirements and geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1 \
            fonts-dejavu-core
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"

      - name: Measure actual CSS Hungarian and control line geometries
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP:$PATH" python3 ci/smoke-hungarian-hyphenation-package.py "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(".git/vulpra-native-build/m3-hungarian-hyphenation-native-css.json")
          x=json.loads(p.read_text())
          assert x["status"]=="real_native_hungarian_css_layout_diagnostic_completed"
          assert x["private_profile_preserved"] is True
          assert x["packaged_hungarian_pattern_not_removed"] is True
          assert x["source_removal_authorized"] is False
          assert x["compressed_tar_xz_savings"] is None
          x["original_archive_run_id"]=40567473401
          x["archive_compiled_source_sha"]="1683ca67b69389a879717bcd537772c3b40624b6"
          x["diagnostic_source_sha"]=os.environ["GITHUB_SHA"]
          x["three_hyphenation_source_blobs_identical"]=True
          x["whole_browser_source_matched"]=False
          x["native_runtime_workflow_run_id"]=int(os.environ["GITHUB_RUN_ID"])
          p.write_text(json.dumps(x,indent=2)+"\n")
          print("PASS: native CSS geometry observed, no untested omission claimed")
          PY

      - name: Save bounded CSS metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-hungarian-archived-css-runtime
          path: .git/vulpra-native-build/m3-hungarian-hyphenation-native-css.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
