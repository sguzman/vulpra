# Real signed extension WebExtension storage and popup/background probe, no browser build.
name: Firefox 160 Signed WebExtension Background and Storage Across Restart (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-signed-extension-storage-restart.yml
      - ci/security-160-signed-extension-storage-restart.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-storage-restart:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Authenticate original successful native Firefox 160 source and package
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo,id=43138458940;
            const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
            if(r.repository?.full_name!=='sguzman/vulpra' ||
               r.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               r.head_sha!=='0624235fdc956ab18af3c3f310b3588ca72fff61' ||
               r.name!=='Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate' ||
               r.status!=='completed' || r.conclusion!=='success')
              throw Error('Refusing unauthenticated original native browser build');
            const all=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:id,per_page:100});
            for(const name of ['firefox160-vulpra-unreleased-native-preview-not-approved',
                               'firefox160-vulpra-materialized-source-proof',
                               'firefox160-vulpra-complete-git-tree-candidate']){
              if(!all.some(a=>a.name===name&&!a.expired&&a.size_in_bytes>0))
                throw Error('Pinned Firefox 160 proof unavailable/expired '+name);
            }
            core.info('PASS: immutable Firefox 160 archive and source provenance');
      - name: Checkout only signed WebExtension WebDriver smoke and helpers
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/security-160-signed-extension-storage-restart.py
            ci/security-160-persistent-extension-restart.py
            ci/smoke-webextension-package-local.py
      - name: Download verified original native Firefox 160 package
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-unreleased-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native-archive
      - name: Download matching immutable candidate tree identity
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source-proof
      - name: Download original 28-overlay source ledger
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-complete-git-tree-candidate
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/candidate-ledger
      - name: Reject falsified extension runtime outcomes and authenticate native source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/security-160-signed-extension-storage-restart.py
          python3 ci/security-160-signed-extension-storage-restart.py --self-test
          source="$RUNNER_TEMP/source-proof/materialized-candidate.json"
          ledger="$RUNNER_TEMP/candidate-ledger/candidate-tree-report.json"
          overlays="$RUNNER_TEMP/candidate-ledger/overlay-paths.txt"
          package="$RUNNER_TEMP/native-archive/vulpra-firefox160-native-ci.tar.xz"
          test -s "$source" && test -s "$ledger" && test -s "$overlays" &&
          test -s "$package" && test -s "$package.sha256"
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true and .security_current==false
          ' "$source" >/dev/null
          jq -e '
            .firefox160_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .assembled_git_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .source_files_modified==26 and .vulpra_source_files_added==2 and
            .upstream_files_deleted==0 and
            .all_other_upstream_files_preserved==true and .security_current==false
          ' "$ledger" >/dev/null
          test "$(wc -l < "$overlays")" -eq 28
          test "$(sort -u "$overlays" | wc -l)" -eq 28
          (cd "$(dirname "$package")" && sha256sum -c "$(basename "$package").sha256")
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp -- "$package" "$dest/vulpra-local-firefox160-signed-storage-ci.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-firefox160-signed-storage-ci.tar.xz > vulpra-local-firefox160-signed-storage-ci.tar.xz.sha256)
          echo 'PASS: real Firefox 160 archive and exact 28-overlay source proof verified'
      - name: Install native shared libraries and pinned geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends curl jq python3 libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          file="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl -fLsS --retry 3 --max-time 90 -o "$file" \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz'
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/geckodriver-bin"
          tar -xzf "$file" -C "$RUNNER_TEMP/geckodriver-bin" geckodriver
          test -x "$RUNNER_TEMP/geckodriver-bin/geckodriver"
          echo "$RUNNER_TEMP/geckodriver-bin" >> "$GITHUB_PATH"
      - name: Authenticate exact Mozilla-signed Multi-Account Containers 8.4.0 XPI
        shell: bash
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/mozilla-mac-8.4.0-metadata.json"
          curl -fLsS --retry 3 --max-time 90 -o "$meta" \
            'https://addons.mozilla.org/api/v5/addons/addon/multi-account-containers/versions/8.4.0/'
          url="$(jq -er '.file.url | select(type=="string")' "$meta")"
          hash="$(jq -er '.file.hash | select(type=="string")' "$meta")"
          test "$url" = 'https://addons.mozilla.org/firefox/downloads/file/5168122/multi_account_containers-8.4.0.xpi'
          [[ "$hash" =~ ^sha256:[a-fA-F0-9]{64}$ ]]
          sha="$(printf '%s' "$hash" | cut -c8- | tr '[:upper:]' '[:lower:]')"
          xpi="$RUNNER_TEMP/mozilla-multi-account-containers-8.4.0-signed.xpi"
          curl -fLsS --retry 3 --max-time 90 -o "$xpi" "$url"
          printf '%s  %s\n' "$sha" "$xpi" | sha256sum -c -
          test "$(stat -c %s "$xpi")" -gt 100000
          printf '%s\n' "$sha" > "$RUNNER_TEMP/signed-xpi-sha256.txt"
          echo 'PASS: exact AMO XPI, version, official SHA-256 and download origin verified'
      - name: Execute signed extension background message, content-script DOM and storage across two real launches
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sha="$(cat "$RUNNER_TEMP/signed-xpi-sha256.txt")"
          python3 ci/security-160-signed-extension-storage-restart.py \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/mozilla-multi-account-containers-8.4.0-signed.xpi" \
            "$sha" \
            "$RUNNER_TEMP/firefox160-signed-extension-storage-proof.json" \
            2>&1 | tee "$RUNNER_TEMP/signed-extension-storage-test.log"
          archive="$RUNNER_TEMP/native-archive/vulpra-firefox160-native-ci.tar.xz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          jq -e --arg digest "$digest" '
            .schema_version==1 and .status=="pass" and
            .native_package_sha256==$digest and
            .signed_extension_id=="@testpilot-containers" and
            .signed_extension_version=="8.4.0" and
            .real_signed_addon_persisted_after_full_restart==true and
            .same_disposable_profile_across_two_full_browser_processes==true and
            .signed_popup_executed_extension_webdriver_js_before_and_after_restart==true and
            .signed_background_page_loaded_before_and_after_restart==true and
            .signed_storage_local_marker_written_before_restart==true and
            .signed_storage_local_marker_read_and_removed_after_restart==true and
            .signed_extension_origin_unchanged_across_restart==true and
            .signed_addon_uninstalled_after_test==true and
            .other_firefox_profile_sentinel_preserved==true and
            .actual_background_message_delivery_verified==true and
            .signed_extension_content_script_injection_verified==true and
            .signed_background_getShortcuts_response_before_and_after_restart==true and
            .signed_content_script_tab_message_notified_dom_before_and_after_restart==true and
            .whole_addon_ecosystem_certified==false and
            .sandbox_syscall_denial_executed==false and
            .safe_browsing_provider_ready==false and
            .security_current==false and .release_ready==false
          ' "$RUNNER_TEMP/firefox160-signed-extension-storage-proof.json" >/dev/null
          echo 'PASS: real Mozilla-signed WebExtension storage, background message reply and content-script DOM persisted across restart'
          echo 'LIMIT: one signed AMO extension only; no cross-addon matrix, Safe Browsing or sandbox enforcement proof'
      - name: Archive bounded signed extension storage and background proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-signed-extension-storage-background-restart-proof
          path: ${{ runner.temp }}/firefox160-signed-extension-storage-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve bounded browser diagnostic tail on failure
        if: failure()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/signed-extension-storage-test.log"; then
            tail -n 160 "$RUNNER_TEMP/signed-extension-storage-test.log" > "$RUNNER_TEMP/signed-extension-storage-failure-tail.log"
          fi
      - name: Archive failure diagnostics without signed XPI or browser package
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-signed-extension-storage-restart-failure
          path: ${{ runner.temp }}/signed-extension-storage-failure-tail.log
          if-no-files-found: ignore
          retention-days: 14
