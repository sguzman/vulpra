# Twenty-one observed graphical loader edges: fourteen real XPCOM bootstrap
# manifest dependencies + seven verified source candidates. No full graph claim.
name: M3 Original 21 Observed Dynamic Source Candidates
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-nss-security-dlopen-source.rs
      - ci/m3-original-ffvpx-dlopen-source.rs
      - ci/m3-original-dependentlibs-graph.rs
      - .github/workflows/m3-original-nss-security-dlopen-source.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-pinned-nss-vs-original-native:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORIGINAL_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ORIGINAL_ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      EVIDENCE_RUN: '41149955223'
      EVIDENCE_HEAD: f39403ce50bd550b0123a9d68e45b3be947b38d7
      BASELINE_RUN: '40997075527'
      SOURCE_CANDIDATES_RUN: '41138797948'
      SOURCE_CANDIDATES_HEAD: 7a37bebadd8ce6355c70db7c2edf0ac8b1692ef6
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout bounded current NSS verifier
        uses: actions/checkout@v4
        with:
          path: verifier
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-nss-security-dlopen-source.rs
            ci/m3-original-ffvpx-dlopen-source.rs
            ci/m3-original-dependentlibs-graph.rs
      - name: Checkout only exact historical NSS native loader sources
        uses: actions/checkout@v4
        with:
          path: original
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            security/nss/lib/pk11wrap/pk11load.c
            security/nss/lib/softoken/manifest.mn
            security/nss/lib/freebl/loader.c
            security/nss/lib/freebl/genload.c
            security/nss/lib/freebl/blname.c
            security/nss/lib/freebl/manifest.mn
            dom/media/platforms/ffmpeg/ffvpx/FFVPXRuntimeLinker.cpp
            dom/media/platforms/PDMFactory.cpp
            media/ffvpx/libavcodec/moz.build
            media/ffvpx/libavutil/moz.build
            xpcom/glue/standalone/nsXPCOMGlue.cpp
      - name: Authenticate exactly one successful original compiled browser graphical observation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C verifier rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original rev-parse HEAD)" = "$ORIGINAL_SHA"
          gh run view "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --json status,conclusion,headSha,name >"$RUNNER_TEMP/evidence-run.json"
          jq -e --arg head "$EVIDENCE_HEAD" '
            .headSha==$head and .status=="completed" and
            .conclusion=="success" and
            .name=="M3 Actual Wayland Native Loader Observation"
          ' "$RUNNER_TEMP/evidence-run.json" >/dev/null
          gh run download "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-private-weston-wayland-loader-observed \
            --dir "$RUNNER_TEMP/native"
          report="$RUNNER_TEMP/native/m3-wayland-native-loader-observed.json"
          test -s "$report"
          test "$(stat -c '%s' "$report")" -le 65536
          jq -e --arg sha "$ORIGINAL_SHA" --arg archive "$ORIGINAL_ARCHIVE_SHA256" '
            .old_normal_native_archive_source==$sha and
            .old_normal_native_archive_sha256==$archive and
            .status=="actual_native_full_normal_loader_observation" and
            .observed_workload_mode=="private_weston_wayland" and
            .real_native_wayland_surface_commit_passed==true and
            .loader_reported_dynamic_initialized_edge_count==21 and
            ([.loader_reported_dynamic_initialized_edges[] |
               select(.requester_basename=="libnspr4.so" and
                 (.requested_library_basename=="libfreeblpriv3.so" or
                  .requested_library_basename=="libsoftokn3.so"))] | length)==2 and
            ([.loader_reported_dynamic_initialized_edges[] |
               select(.requester_basename=="libnspr4.so" and
                      .requested_library_basename=="libfreeblpriv3.so")] | length)==1 and
            ([.loader_reported_dynamic_initialized_edges[] |
               select(.requester_basename=="libnspr4.so" and
                      .requested_library_basename=="libsoftokn3.so")] | length)==1 and
            ([.loader_reported_dynamic_initialized_edges[] |
               select(.requester_basename=="libnspr4.so" and
                      .requested_library_basename=="libmozavcodec.so")] | length)==1 and
            ([.loader_reported_dynamic_initialized_edges[] |
               select(.requester_basename=="libnspr4.so" and
                      .requested_library_basename=="libmozavutil.so")] | length)==1 and
            .complete_dlopen_graph_proven==false and
            .whole_m3_feature_dependency_gate_completed==false
          ' "$report" >/dev/null
          echo 'PASS: original native Weston source and both observed NSPR NSS dynamic request edges authenticated'
      - name: Verify exact historical NSS source route with Rust and negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test verifier/ci/m3-original-nss-security-dlopen-source.rs \
            -o "$RUNNER_TEMP/nss-source-tests"
          "$RUNNER_TEMP/nss-source-tests"
          rustc --edition=2021 verifier/ci/m3-original-nss-security-dlopen-source.rs \
            -o "$RUNNER_TEMP/nss-source-proof"
          "$RUNNER_TEMP/nss-source-proof" "$ORIGINAL_SHA" original \
            "$RUNNER_TEMP/m3-nss-original-dynamic-source-routes.json"
          jq -e --arg sha "$ORIGINAL_SHA" '
            .source_commit==$sha and
            .source_supported_nss_dynamic_routes==2 and
            .source_route_for_softoken_verified==true and
            .source_route_for_freebl_verified==true and
            .nss_security_removal_authorized==false and
            .original_compiled_conditional_verified==false and
            .original_compiled_callstack_verified==false and
            .complete_dynamic_graph_verified==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-nss-original-dynamic-source-routes.json" >/dev/null
          rustc --edition=2021 --test verifier/ci/m3-original-ffvpx-dlopen-source.rs \
            -o "$RUNNER_TEMP/ffvpx-source-tests"
          "$RUNNER_TEMP/ffvpx-source-tests"
          rustc --edition=2021 verifier/ci/m3-original-ffvpx-dlopen-source.rs \
            -o "$RUNNER_TEMP/ffvpx-source-proof"
          "$RUNNER_TEMP/ffvpx-source-proof" "$ORIGINAL_SHA" original \
            "$RUNNER_TEMP/m3-ffvpx-original-dynamic-source-routes.json"
          jq -e --arg sha "$ORIGINAL_SHA" '
            .source_commit==$sha and
            .source_dynamic_roots_verified==2 and
            .source_supported_bundled_ffvpx_roots==["libmozavcodec.so","libmozavutil.so"] and
            .bundled_build_sources_verified==true and
            .original_native_loader_observation_authenticated_separately==true and
            .native_callsite_relocations_proven==false and
            .all_runtime_loader_routes_proven==false and
            .source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-ffvpx-original-dynamic-source-routes.json" >/dev/null
      - name: Crosscheck authenticated original package bootstrap against all 21 real loader edges
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" \
            --json status,conclusion,headSha,name >"$RUNNER_TEMP/original-package-run.json"
          jq -e --arg sha "$ORIGINAL_SHA" '
            .headSha==$sha and .status=="completed" and .conclusion=="success" and
            .name=="M3 Prebuild Source-Matched Full Normandy Baseline"
          ' "$RUNNER_TEMP/original-package-run.json" >/dev/null
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline \
            --dir "$RUNNER_TEMP/original-package"
          archive="$RUNNER_TEMP/original-package/full-normandy-baseline.tar.xz"
          test -f "$archive"
          test "$(stat -c '%s' "$archive")" -le 100000000
          printf '%s  %s\n' "$ORIGINAL_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          jq -e --arg sha "$ORIGINAL_SHA" --arg archive "$ORIGINAL_ARCHIVE_SHA256" '
            .source_commit==$sha and .sha256==$archive and
            .variant=="full-normandy"
          ' "$RUNNER_TEMP/original-package/m3-full-normandy-baseline.json" >/dev/null
          tar -xJOf "$archive" ./vulpra/dependentlibs.list \
            >"$RUNNER_TEMP/original-dependentlibs.list"
          test -s "$RUNNER_TEMP/original-dependentlibs.list"
          test "$(stat -c '%s' "$RUNNER_TEMP/original-dependentlibs.list")" -le 1024
          rustc --edition=2021 --test verifier/ci/m3-original-dependentlibs-graph.rs \
            -o "$RUNNER_TEMP/dependentlibs-source-tests"
          "$RUNNER_TEMP/dependentlibs-source-tests"
          rustc --edition=2021 verifier/ci/m3-original-dependentlibs-graph.rs \
            -o "$RUNNER_TEMP/dependentlibs-source-proof"
          "$RUNNER_TEMP/dependentlibs-source-proof" "$ORIGINAL_SHA" original \
            "$RUNNER_TEMP/original-dependentlibs.list" \
            "$RUNNER_TEMP/m3-original-bootstrap-manifest-source.json"
          jq -e --arg sha "$ORIGINAL_SHA" '
            .gecko_source_commit==$sha and
            .source_xpcom_manifest_loader_verified==true and
            .packaged_dependency_manifest_entries==14 and
            .manifest_order_and_unique_names_verified==true and
            .runtime_edge_set_match_checked_separately==false and
            .all_runtime_dlopen_paths_proven==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-original-bootstrap-manifest-source.json" >/dev/null
          gh run view "$SOURCE_CANDIDATES_RUN" --repo "$GITHUB_REPOSITORY" \
            --json status,conclusion,headSha,name >"$RUNNER_TEMP/source-three-run.json"
          jq -e --arg sha "$SOURCE_CANDIDATES_HEAD" '
            .headSha==$sha and .status=="completed" and .conclusion=="success" and
            .name=="M3 Native Dynamic Requests To Original Source Candidates"
          ' "$RUNNER_TEMP/source-three-run.json" >/dev/null
          gh run download "$SOURCE_CANDIDATES_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-source-three-dynamic-request-candidates \
            --dir "$RUNNER_TEMP/source-three"
          jq -e --arg sha "$ORIGINAL_SHA" --arg archive "$ORIGINAL_ARCHIVE_SHA256" '
            .historical_compiled_source==$sha and
            .original_native_package_sha256==$archive and
            .source_candidates_confirmed_with_exact_original_tree==true and
            (.observed_three_dynamic_library_requests|length)==3 and
            .actual_call_stacks_captured==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/source-three/m3-source-dynamic-requests-crosswalk.json" >/dev/null
          jq -e --rawfile manifest "$RUNNER_TEMP/original-dependentlibs.list" '
            ($manifest|split("\n")|map(select(length>0))) as $bootstrap |
            ([.loader_reported_dynamic_initialized_edges[] |
                .requester_basename+"|"+.requested_library_basename]) as $observed |
            ([
              "libnspr4.so|libavcodec.so.60",
              "libnspr4.so|libfreeblpriv3.so",
              "libnspr4.so|libmozavcodec.so",
              "libnspr4.so|libmozavutil.so",
              "libnspr4.so|libsoftokn3.so",
              "libxul.so|libgbm.so.1",
              "libxul.so|libpulse.so.0"
             ] + ($bootstrap|map("vulpra|"+.))) as $expected |
             ($bootstrap|length)==14 and
             ($bootstrap|unique|length)==14 and
             ($observed|length)==21 and
             ($observed|unique|length)==21 and
             ($observed|sort)==($expected|sort) and
             .complete_dlopen_graph_proven==false and
             .whole_m3_feature_dependency_gate_completed==false
          ' "$RUNNER_TEMP/native/m3-wayland-native-loader-observed.json" >/dev/null
          jq -n --arg sha "$ORIGINAL_SHA" --arg archive "$ORIGINAL_ARCHIVE_SHA256" '{
            schema_version:1,
            historical_compiled_source:$sha,
            original_package_sha256:$archive,
            original_real_graphical_observed_dynamic_edges:21,
            original_xpcom_packaged_manifest_preloads:14,
            independently_source_supported_other_dynamic_edges:7,
            observed_edge_source_candidate_set_matches_exactly:true,
            source_candidates_are_not_proven_compiled_callsites:true,
            all_possible_dlopen_paths_proven:false,
            target_workstation_verified:false,
            source_removal_authorized:false,
            m3_sixth_gate_closed:false
          }' > "$RUNNER_TEMP/m3-original-21-observed-source-candidates.json"
          echo 'PASS: 21/21 original observed dynamic edges match 14 exact packaged XPCOM dependencies + 7 source candidates; not entire conditional loader graph'
      - name: Retain bounded original 21-edge observed source candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-21-observed-dynamic-source-candidates
          path: |
            ${{ runner.temp }}/m3-nss-original-dynamic-source-routes.json
            ${{ runner.temp }}/m3-ffvpx-original-dynamic-source-routes.json
            ${{ runner.temp }}/m3-original-bootstrap-manifest-source.json
            ${{ runner.temp }}/m3-original-21-observed-source-candidates.json
            ${{ runner.temp }}/original-package-run.json
            ${{ runner.temp }}/source-three-run.json
            ${{ runner.temp }}/evidence-run.json
          if-no-files-found: error
          retention-days: 14
