# The eight-root native Linux source-pruning experiment passed GitHub Actions 40600510147.
# Commit 8331ca6 removed the tested 280 paths. Keep a fast source-tree guard
# rather than rebuilding a full Linux browser after every docs/source change.
name: M3 Verify Committed Secondary Mobile Source Prune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-secondary-mobile-native.yml
      - mobile/android/**
      - mobile/ios/**
      - mobile/shared/**
      - widget/uikit/**
      - widget/android/**
      - widget/gtk/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-committed-mobile-leaves-prune:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only Git tree metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
          sparse-checkout-cone-mode: true

      - name: Confirm eight unsupported mobile/UI directories remain absent
        shell: bash
        run: |
          set -euo pipefail
          for root in mobile/android/fonts mobile/android/geckoview_example \
                      mobile/android/examples mobile/android/test_infra \
                      mobile/android/test_runner mobile/android/branding \
                      mobile/ios widget/uikit; do
            if git ls-tree HEAD -- "$root" | grep -q .; then
              echo "ERROR: previously removed source root returned: $root" >&2
              exit 1
            fi
          done
          for path in mobile/shared/moz.build mobile/android/moz.build \
                      mobile/android/geckoview/build.gradle \
                      widget/android/moz.build widget/gtk/moz.build \
                      browser/app.mozbuild toolkit/library/rust/shared/Cargo.toml; do
            if ! git ls-tree -r HEAD -- "$path" | grep -q .; then
              echo "ERROR: protected Linux/shared source absent: $path" >&2
              exit 1
            fi
          done
          for root in mobile/android/geckoview mobile/android/components \
                      mobile/android/modules; do
            if ! git ls-tree HEAD -- "$root" | grep -q .; then
              echo "ERROR: protected GeckoView/shared Android root absent: $root" >&2
              exit 1
            fi
          done
          echo "PASS: exactly the accepted eight non-Linux leaf roots remain absent"
          echo "PASS: shared GeckoView, GTK, Android widget and Rust build paths preserved"
          echo "Historical native/runtime CI: https://github.com/sguzman/vulpra/actions/runs/40600510147"
