# Test actual local VP9 video in archived Firefox 160; never rebuild or release.
name: Firefox 160 Archived Graphical Wayland VP9 and Canvas (No Browser Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-archived-wayland-vp9-graphics.yml
      - ci/security-160-wayland-vp9-webgl-diagnostic.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  graphical-wayland-vp9:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PINNED_RUN: '43138458940'
      PINNED_COMMIT: '0624235fdc956ab18af3c3f310b3588ca72fff61'
      PINNED_TREE: '42dd7439a27dde92f89ac5eed13f88117a4d7ab5'
      VULPRA_M3_COMPILED_SOURCE_SHA: '0624235fdc956ab18af3c3f310b3588ca72fff61'
    steps:
      - name: Verify completed original Firefox 160 native run and immutable artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const run_id=43138458940;
            const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id});
            if(r.repository?.full_name!=='sguzman/vulpra' ||
               r.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               r.head_sha!=='0624235fdc956ab18af3c3f310b3588ca72fff61' ||
               r.name!=='Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate' ||
               r.status!=='completed'||r.conclusion!=='success')
              throw Error('Expected successful exact Firefox 160 candidate run');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id,per_page:100});
            for(const name of ['firefox160-vulpra-unreleased-native-preview-not-approved',
                               'firefox160-vulpra-materialized-source-proof']){
              if(!artifacts.some(a=>a.name===name&&!a.expired&&a.size_in_bytes>0))
                throw Error('Missing/expired original run artifact: '+name);
            }
            core.info('PASS: authenticated same-run source and browser artifact identities');
      - name: Checkout real non-headless Wayland VP9 and provider-denial harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/security-160-wayland-vp9-webgl-diagnostic.sh
            ci/m3-deny-optional-native-providers.c
      - name: Download Firefox 160 unreleased browser and original checksum
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-unreleased-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-native-archive
      - name: Download matching exact source identity from same build
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-source-proof
      - name: Authenticate original Firefox 160 source tree and package SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          src="$RUNNER_TEMP/firefox160-source-proof/materialized-candidate.json"
          archive="$RUNNER_TEMP/firefox160-native-archive/vulpra-firefox160-native-ci.tar.xz"
          test -s "$src" && test -s "$archive" && test -s "$archive.sha256"
          jq -e --arg tree "$PINNED_TREE" '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree==$tree and .verified_overlays==28 and
            .exact_assembly_tree_match==true and .upstream_paths_otherwise_preserved==true
          ' "$src" >/dev/null
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$archive" "$dest/vulpra-local-m3-native-link-ci.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-m3-native-link-ci.tar.xz > vulpra-local-m3-native-link-ci.tar.xz.sha256)
          echo 'PASS: source-pinned original Firefox 160 package integrity'
      - name: Install isolated Weston, VP9 fixture dependencies and pinned geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends ffmpeg jq curl git weston wayland-utils libgl1 libegl1 libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          file="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl -fLsS --retry 3 --max-time 90 -o "$file" \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz'
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$file" | sha256sum -c -
          tar -xzf "$file" -C "$RUNNER_TEMP" geckodriver
          test -x "$RUNNER_TEMP/geckodriver"
          bash -n ci/security-160-wayland-vp9-webgl-diagnostic.sh
          bash ci/security-160-wayland-vp9-webgl-diagnostic.sh --self-test
      - name: Exercise real non-headless Firefox 160 Wayland VP9, canvas and WebGL
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            ci/m3-deny-optional-native-providers.c \
            -o "$RUNNER_TEMP/vulpra-deny-optional-native-providers.so" -ldl
          bash ci/security-160-wayland-vp9-webgl-diagnostic.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/vulpra-deny-optional-native-providers.so" \
            "$RUNNER_TEMP/geckodriver" "$RUNNER_TEMP/m3-packaged-wayland-vp9-providers.json" \
            2>&1 | tee "$RUNNER_TEMP/firefox160-wayland-vp9.log"
          archive="$RUNNER_TEMP/firefox160-native-archive/vulpra-firefox160-native-ci.tar.xz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          jq -e --arg compiled "$PINNED_COMMIT" --arg harness "$GITHUB_SHA" --arg sha "$digest" '
            .schema_version==1 and
            .status=="real_packaged_non_headless_Wayland_VP9_video_canvas_provider_denial" and
            .native_source_commit==$compiled and .test_harness_commit==$harness and
            .verified_normal_packaged_archive_sha256==$sha and
            .private_Weston_pixman_compositor_available==true and
            .baseline_playback_verified==true and
            .all_real_browser_sessions_safe==true and
            ([.modes[].mode] | sort)==["baseline","gbm","vaapi"] and
            ([.modes[].actual_webdriver_png_screenshot] | all(.==true)) and
            ([.modes[] | select(.mode=="gbm" or .mode=="vaapi") |
              .browser_interposer_attached] | all(.==true)) and
            .actual_GPU_or_DMABuf_provider_execution_proven==false and
            .hardware_video_decoder_identified==false and
            .complete_indirect_loader_graph_proven==false and
            .target_endeavouros_hyprland_verified==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false and .release_ready==false
          ' "$RUNNER_TEMP/m3-packaged-wayland-vp9-providers.json" >/dev/null
          jq --arg tree "$PINNED_TREE" --arg run "$PINNED_RUN" '
            . + {
              firefox160_verified_git_tree: $tree,
              original_native_run_id: $run,
              original_package_reused_without_browser_rebuild: true,
              security_current: false,
              release_ready: false
            }
          ' "$RUNNER_TEMP/m3-packaged-wayland-vp9-providers.json" \
            > "$RUNNER_TEMP/firefox160-wayland-vp9-proof.json"
          jq -c '.modes | map({
            mode,
            video_decoded: .vp9_decoded_frames_and_time_verified,
            canvas_video_readback,
            webgl2_initial_context_available,
            webgl2_context_available,
            webgl2_delayed_retry_attempts,
            webgl2_context_creation_error: .observed_graphics_state.webgl2_context_creation_error,
            webdriver_png: .actual_webdriver_png_screenshot,
            interposer_attached: .browser_interposer_attached,
            denied_before: .ffmpeg_denials_before_video_navigation,
            denied_after: .ffmpeg_denials_after_video_navigation
          })' "$RUNNER_TEMP/m3-packaged-wayland-vp9-providers.json"
          echo 'PASS: exact-source Firefox 160 non-headless private Wayland VP9 and canvas workload observed'
          echo 'LIMIT: Weston uses Pixman; no real GPU hardware, VAAPI or DMA-BUF fallback proven'
      - name: Archive bounded media JSON outcome
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-unreleased-wayland-vp9-graphics-proof
          path: ${{ runner.temp }}/firefox160-wayland-vp9-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Record bounded failure diagnostics
        if: failure()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/firefox160-wayland-vp9.log"; then
            tail -n 300 "$RUNNER_TEMP/firefox160-wayland-vp9.log" > "$RUNNER_TEMP/firefox160-wayland-vp9-failure-tail.log"
          fi
      - name: Upload bounded media failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-wayland-vp9-failure
          path: ${{ runner.temp }}/firefox160-wayland-vp9-failure-tail.log
          if-no-files-found: ignore
          retention-days: 14
