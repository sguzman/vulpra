name: M3 Native Loader API Callsite Census Fixtures
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-compiled-loader-api-census.rs
      - .github/workflows/m3-native-loader-api-census-fixtures.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-loader-census-fixtures:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact bounded Rust callsite census
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-compiled-loader-api-census.rs
      - name: Test native C++ ELF positive and negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-original-compiled-loader-api-census.rs \
            -o "$RUNNER_TEMP/m3-native-loader-census-fixtures"
          "$RUNNER_TEMP/m3-native-loader-census-fixtures"
          rustc --edition=2021 ci/m3-original-compiled-loader-api-census.rs \
            -o "$RUNNER_TEMP/m3-native-loader-census"
          if "$RUNNER_TEMP/m3-native-loader-census" \
               b1482404dfb8b01342990ee99ea3df0f9756b5f7 \
               /missing/original/libxul.so "$RUNNER_TEMP/invalid-report.json"; then
            echo 'FAIL: missing source-pinned binary must fail' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/invalid-report.json"
          echo 'PASS: real compiled C++ positive/negative ELF fixture; not the pinned Firefox native census'
