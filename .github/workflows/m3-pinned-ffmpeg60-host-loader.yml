# Original Gecko FFmpeg60 source to Ubuntu host RTLD_NOW and avcodec_version.
# Does not prove all libavcodec API bindings or native Vulpra caller stacks.
name: M3 Original FFmpeg60 Actual Host Loader
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-pinned-ffmpeg60-host-loader.yml
      - ci/m3-pinned-ffmpeg60-host-loader.rs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-original-ffmpeg60:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
    steps:
      - name: Checkout current bounded Rust inspector
        uses: actions/checkout@v4
        with:
          path: inspector
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-pinned-ffmpeg60-host-loader.rs
      - name: Checkout exact original Gecko FFmpeg source
        uses: actions/checkout@v4
        with:
          path: pinned
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            dom/media/platforms/ffmpeg/FFmpegRuntimeLinker.cpp
            dom/media/platforms/ffmpeg/FFmpegLibWrapper.cpp
            dom/media/platforms/ffmpeg/FFmpegLibWrapper.h
      - name: Install actual host FFmpeg60 runtime SONAME
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libavcodec60 binutils
          test -r /usr/lib/x86_64-linux-gnu/libavcodec.so.60
      - name: Build and regression-test exact loader source witness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C inspector rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C pinned rev-parse HEAD)" = "$SOURCE_SHA"
          rustc --edition=2021 --test inspector/ci/m3-pinned-ffmpeg60-host-loader.rs -o "$RUNNER_TEMP/ffmpeg-loader-tests"
          "$RUNNER_TEMP/ffmpeg-loader-tests"
          rustc --edition=2021 inspector/ci/m3-pinned-ffmpeg60-host-loader.rs -o "$RUNNER_TEMP/ffmpeg-loader-proof"
      - name: Exercise real host dlopen and pinned FFmpeg 60 version function
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ffmpeg-loader-proof" "$SOURCE_SHA" "$GITHUB_WORKSPACE/pinned" \
            /usr/lib/x86_64-linux-gnu/libavcodec.so.60 \
            "$RUNNER_TEMP/m3-original-ffmpeg60-host-loader.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .gecko_source_commit==$sha and
            .glibc_rtld_now_load_passed==true and
            .avcodec_version_symbol_resolved_and_invoked==true and
            .avcodec_runtime_major==60 and
            .required_ffmpeg60_function_count>=20 and
            .resolved_ffmpeg60_required_functions==.required_ffmpeg60_function_count and
            .complete_ffmpeg60_required_function_set_verified==true and
            .complete_ffmpeg_function_set_verified==false and
            .original_vulpra_callsite_proven==false and
            .arch_host_abi_proven==false and
            .m3_sixth_gate_closed==false' "$RUNNER_TEMP/m3-original-ffmpeg60-host-loader.json" >/dev/null
      - name: Preserve bounded real host loader summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-ffmpeg60-host-loader
          path: ${{ runner.temp }}/m3-original-ffmpeg60-host-loader.json
          if-no-files-found: warn
          retention-days: 14
