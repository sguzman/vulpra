# Authenticated native GNU loader relation overlap, not source deletion.
name: M3 Actual Headless Graphical Native Loader Request Edge Graph
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-loader-request-edge-reconciliation.yml
      - ci/m3-loader-request-edge-diff.sh
      - ci/tests/m3-loader-request-edge-diff-test.sh
      - ci/m3-graphical-loader-reachability.sh
      - ci/tests/m3-graphical-loader-reachability-test.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-authenticated-loader-request-edges:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HEADLESS_RUN: '41137841775'
      GRAPHICAL_RUN: '41137841911'
      REPORT_SOURCE_SHA: 4ae956222c9ed2df98dbeb60f372fb087827b601
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
    steps:
      - name: Checkout guarded source-identity and loader-edge comparison code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Test both synthetic name and loader-edge provenance guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-loader-request-edge-diff.sh
          bash ci/tests/m3-graphical-loader-workload-diff-test.sh
          bash ci/tests/m3-loader-request-edge-diff-test.sh
          bash ci/tests/m3-graphical-loader-reachability-test.sh
      - name: Authenticate two successful original-native real workload trace jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HEADLESS_RUN" |
            jq -e --arg sha "$REPORT_SOURCE_SHA" \
              '.status=="completed" and .conclusion=="success" and
               .head_sha==$sha and
               .name=="M3 Native Dynamic Loader Startup Observation"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GRAPHICAL_RUN" |
            jq -e --arg sha "$REPORT_SOURCE_SHA" \
              '.status=="completed" and .conclusion=="success" and
               .head_sha==$sha and
               .name=="M3 Actual Netns Wayland Native Loader Mapping"' >/dev/null
          mkdir -p "$RUNNER_TEMP/headless" "$RUNNER_TEMP/graphical"
          gh run download "$HEADLESS_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-loader-startup-sanitized --dir "$RUNNER_TEMP/headless"
          gh run download "$GRAPHICAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-netns-wayland-native-loader-observed --dir "$RUNNER_TEMP/graphical"
          test -s "$RUNNER_TEMP/headless/m3-runtime-loader-observation.json"
          test -s "$RUNNER_TEMP/graphical/m3-netns-wayland-native-loader-observed.json"
      - name: Reconcile actual initialized-target glibc request relations
        shell: bash
        run: |
          set -euo pipefail
          bash ci/m3-loader-request-edge-diff.sh \
            "$RUNNER_TEMP/headless/m3-runtime-loader-observation.json" \
            "$RUNNER_TEMP/graphical/m3-netns-wayland-native-loader-observed.json" \
            "$RUNNER_TEMP/m3-native-loader-actual-request-edge-contrast.json"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA256" \
            '.source_commit==$src and .compiled_archive_sha256==$sha and
             .file_paths_and_raw_pids_retained==false and
             .full_source_feature_graph_proven==false and
             .dynamic_symbol_abi_closure_proven==false and
             .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-native-loader-actual-request-edge-contrast.json" >/dev/null
          echo 'PASS: authenticated actual loader request edge subgraph, M3 sixth gate still OPEN'
          bash ci/m3-graphical-loader-reachability.sh \
            "$RUNNER_TEMP/m3-native-loader-actual-request-edge-contrast.json" \
            "$RUNNER_TEMP/m3-original-native-graphical-reachability.json"
          jq -e '.m3_sixth_gate_closed==false and
                 .observed_graphical_only_basename_count==58 and
                 .any_new_source_removal_authorized==false' \
            "$RUNNER_TEMP/m3-original-native-graphical-reachability.json" >/dev/null
          echo 'DIAGNOSTIC: graphical-only dynamic requester -> requested library basenames:'
          jq -r '.dynamic_graphical_only_edges[] |
            .requester_basename + " -> " + .requested_library_basename' \
            "$RUNNER_TEMP/m3-native-loader-actual-request-edge-contrast.json"
      - name: Upload only bounded sanitized real native request edge sets
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-headless-wayland-loader-request-edge-contrast
          path: |
            ${{ runner.temp }}/m3-native-loader-actual-request-edge-contrast.json
            ${{ runner.temp }}/m3-original-native-graphical-reachability.json
          if-no-files-found: error
          retention-days: 14
