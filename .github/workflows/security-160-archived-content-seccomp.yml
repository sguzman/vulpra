# Examine actual native Firefox 160 content processes in /proc on hosted Linux.
# This reads each observed worker's main process status AND live thread statuses,
# not syscall-denial semantics, filter BPF contents or transient future threads.
name: Firefox 160 Native Content-Process Seccomp Observation (No Browser Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-archived-content-seccomp.yml
      - ci/security-160-content-process-seccomp.py
      - ci/security-160-runner-userns-capability.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observe-content-seccomp:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Authenticate completed exact-source Firefox 160 browser build
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo, id=43138458940;
            const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
            if (r.repository?.full_name!=='sguzman/vulpra' ||
                r.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
                r.head_sha!=='0624235fdc956ab18af3c3f310b3588ca72fff61' ||
                r.name!=='Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate' ||
                r.status!=='completed' || r.conclusion!=='success')
              throw Error('Refusing browser artifact from unverified build');
            const list=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:id,per_page:100});
            for(const name of ['firefox160-vulpra-unreleased-native-preview-not-approved',
                               'firefox160-vulpra-materialized-source-proof']){
              if(!list.some(a=>a.name===name && !a.expired && a.size_in_bytes>0))
                throw Error('Required archive expired/unavailable: '+name);
            }
            core.info('PASS: original native successful build and source-run artifacts');
      - name: Checkout isolated seccomp observation and actual WebDriver helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/security-160-content-process-seccomp.py
            ci/security-160-runner-userns-capability.rs
            ci/smoke-webextension-package-local.py
      - name: Download checksummed unreleased Firefox 160 binary package
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-unreleased-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-archive
      - name: Download matching complete Mozilla source-tree identity proof
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-source
      - name: Test negative sandbox evidence fixtures and authenticate archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/security-160-content-process-seccomp.py
          python3 ci/security-160-content-process-seccomp.py --self-test
          src="$RUNNER_TEMP/firefox160-source/materialized-candidate.json"
          archive="$RUNNER_TEMP/firefox160-archive/vulpra-firefox160-native-ci.tar.xz"
          test -s "$src" && test -s "$archive" && test -s "$archive.sha256"
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$src" >/dev/null
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp -- "$archive" "$dest/vulpra-local-firefox160-seccomp-ci.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-firefox160-seccomp-ci.tar.xz > vulpra-local-firefox160-seccomp-ci.tar.xz.sha256)
          echo 'PASS: Firefox 160 exact-source native browser hash authenticated'
      - name: Install native Linux browser shared libraries and SHA-256-pinned geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends curl jq python3 libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          file="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl -fLsS --retry 3 --max-time 90 -o "$file" \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz'
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/geckodriver-bin"
          tar -xzf "$file" -C "$RUNNER_TEMP/geckodriver-bin" geckodriver
          test -x "$RUNNER_TEMP/geckodriver-bin/geckodriver"
          echo "$RUNNER_TEMP/geckodriver-bin" >> "$GITHUB_PATH"
      - name: Reproduce Firefox 160 user namespace capability probe in isolated Rust child
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          command -v rustc >/dev/null
          rustc --edition=2021 -D warnings -C opt-level=1 \
            ci/security-160-runner-userns-capability.rs \
            -o "$RUNNER_TEMP/firefox160-userns-child-probe"
          "$RUNNER_TEMP/firefox160-userns-child-probe" --self-test
          "$RUNNER_TEMP/firefox160-userns-child-probe" --probe \
            "$RUNNER_TEMP/firefox160-runner-userns-child-report.json"
          jq -e '
            .schema_version==1 and .status=="pass" and
            .probe_kind=="firefox160_upstream_clone_newuser_then_unshare_newpid_x86_64" and
            (.stage=="clone_newuser_denied" or
             .stage=="clone_succeeded_unshare_newpid_denied" or
             .stage=="clone_and_unshare_succeeded") and
            .child_exited_without_host_changes==true and
            .test_did_not_modify_kernel_policy_or_sandbox==true and
            .child_capability_read_only_observation==true and
            .child_effective_capabilities_entire_set_exposed==false and
            (.child_effective_cap_sys_admin_in_new_userns==true or
             .child_effective_cap_sys_admin_in_new_userns==false or
             .child_effective_cap_sys_admin_in_new_userns==null) and
            (.child_seccomp_mode_after_clone==0 or
             .child_seccomp_mode_after_clone==1 or
             .child_seccomp_mode_after_clone==2 or
             .child_seccomp_mode_after_clone==null) and
            .policy_root_cause_proven==false and
            .same_as_firefox_parent_process_context_proven==false and
            .linux_content_worker_namespace_isolation_verified==false and
            .forbidden_content_worker_syscall_denial_verified==false and
            .security_current==false and .release_ready==false
          ' "$RUNNER_TEMP/firefox160-runner-userns-child-report.json" >/dev/null
          jq -c '{stage,errno_name,
            kernel_unprivileged_userns_clone,kernel_max_user_namespaces,
            apparmor_module_enabled,apparmor_unprivileged_userns_restriction,
            diagnostic_process_apparmor_confined,
            child_effective_cap_sys_admin_in_new_userns,
            child_seccomp_mode_after_clone}' \
            "$RUNNER_TEMP/firefox160-runner-userns-child-report.json"
          echo 'LIMIT: independent runner child is not the Firefox content process; no causal LSM proof'
      - name: Launch real Firefox 160 localhost content and observe native seccomp filters
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python3 ci/security-160-content-process-seccomp.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/firefox160-content-sandbox-proof.json" \
            2>&1 | tee "$RUNNER_TEMP/firefox160-content-sandbox.log"
          archive="$RUNNER_TEMP/firefox160-archive/vulpra-firefox160-native-ci.tar.xz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          jq -e --arg digest "$digest" '
            .schema_version==1 and .status=="pass" and
            .native_package_sha256==$digest and
            .verified_real_localhost_content==true and
            .original_firefox_profile_preserved==true and
            .linux_content_sandbox_level>0 and
            .actual_content_worker_count>=1 and
            .browser_child_spawning_process_count>=1 and
            .all_worker_processes_descend_from_browser_spawners==true and
            .all_observed_content_workers_have_seccomp_filters==true and
            .all_observed_content_workers_have_no_new_privileges==true and
            .observed_content_worker_thread_count>=.actual_content_worker_count and
            .observed_content_worker_thread_groups==.actual_content_worker_count and
            .all_observed_content_worker_threads_have_seccomp_filters==true and
            .all_observed_content_worker_threads_have_no_new_privileges==true and
            .all_observed_content_worker_thread_groups_include_main_tid==true and
            .all_possible_transient_threads_exhaustively_audited==false and
            .observed_content_worker_namespace_groups==.actual_content_worker_count and
            .observed_readable_namespace_comparisons>=.actual_content_worker_count and
            .content_worker_distinct_namespace_counts_by_kind!=null and
            .content_worker_unreadable_namespace_counts_by_kind!=null and
            .namespace_observation_read_only==true and
            (.firefox_parent_cached_user_namespace_probe=="supported" or
             .firefox_parent_cached_user_namespace_probe=="unavailable" or
             .firefox_parent_cached_user_namespace_probe=="not-run-or-not-exposed") and
            .firefox_parent_content_sandbox_disabled_env==false and
            .firefox_parent_permissive_content_sandbox_env==false and
            .namespace_absence_caused_by_runner_policy_verified==false and
            .all_namespaces_are_isolated==false and
            .process_namespace_policy_strength_verified==false and
            .all_kernel_namespace_features_guaranteed_available==false and
            .unfiltered_browser_child_process_is_explicitly_reported==true and
            .seccomp_syscall_denial_actually_exercised==false and
            .content_sandbox_policy_strength_verified==false and
            .release_ready==false and .security_current==false
          ' "$RUNNER_TEMP/firefox160-content-sandbox-proof.json" >/dev/null
          echo 'PASS: actual Firefox 160 worker threads have seccomp/NoNewPrivs, namespace/root separation compared and cached Firefox user-namespace probe reconciled'
          echo 'LIMIT: conditional/unavailable namespaces not silently counted isolated; no syscall denial, future-thread, policy-semantic or release proof'
      - name: Correlate native Firefox user namespace failure with same-run child result
        shell: bash
        run: |
          set -euo pipefail
          firefox="$RUNNER_TEMP/firefox160-content-sandbox-proof.json"
          runner="$RUNNER_TEMP/firefox160-runner-userns-child-report.json"
          report="$RUNNER_TEMP/firefox160-userns-crosswalk.json"
          test -s "$firefox" && test -s "$runner" && ! -e "$report"
          jq -n --slurpfile f "$firefox" --slurpfile r "$runner" '
            ($f[0]) as $browser |
            ($r[0]) as $host |
            ($browser.firefox_parent_cached_user_namespace_probe) as $cached |
            ($host.stage) as $stage |
            (($cached=="unavailable" and
               ($stage=="clone_newuser_denied" or
                $stage=="clone_succeeded_unshare_newpid_denied")) or
             ($cached=="supported" and
              $stage=="clone_and_unshare_succeeded")) as $aligned |
            {
              schema_version:1,status:(if $aligned then "pass" else "mismatch" end),
              exact_original_native_build_run:43138458940,
              verified_firefox160_browser_probe_cache:$cached,
              independent_runner_child_stage:$stage,
              runner_child_errno:$host.errno_name,
              runner_child_cap_sys_admin_inside_new_userns:
                $host.child_effective_cap_sys_admin_in_new_userns,
              runner_child_seccomp_mode_after_clone:
                $host.child_seccomp_mode_after_clone,
              denied_unshare_with_cap_sys_admin_absent_observed:
                ($stage=="clone_succeeded_unshare_newpid_denied" and
                 $host.child_effective_cap_sys_admin_in_new_userns==false),
              kernel_unprivileged_userns_clone:$host.kernel_unprivileged_userns_clone,
              kernel_max_user_namespaces:$host.kernel_max_user_namespaces,
              apparmor_module_enabled:$host.apparmor_module_enabled,
              apparmor_unprivileged_userns_restriction:$host.apparmor_unprivileged_userns_restriction,
              runner_child_apparmor_confined:$host.diagnostic_process_apparmor_confined,
              same_runner_child_and_firefox_probe_consistent:$aligned,
              firefox_sandbox_disabled:$browser.firefox_parent_content_sandbox_disabled_env,
              firefox_sandbox_permissive:$browser.firefox_parent_permissive_content_sandbox_env,
              firefox_real_content_worker_count:$browser.actual_content_worker_count,
              firefox_observed_user_namespace_distinct_count:
                $browser.content_worker_distinct_namespace_counts_by_kind.user,
              denied_unshare_with_cap_sys_admin_present_observed:
                ($stage=="clone_succeeded_unshare_newpid_denied" and
                 $host.child_effective_cap_sys_admin_in_new_userns==true),
              exact_denial_policy_or_lsm_cause_proven:false,
              worker_namespace_isolation_verified:false,
              actual_content_worker_seccomp_denial_exercised:false,
              security_current:false,release_ready:false
            }
          ' > "$report"
          jq -e '
            .schema_version==1 and .status=="pass" and
            .same_runner_child_and_firefox_probe_consistent==true and
            .firefox_sandbox_disabled==false and
            .firefox_sandbox_permissive==false and
            .exact_denial_policy_or_lsm_cause_proven==false and
            .worker_namespace_isolation_verified==false and
            .actual_content_worker_seccomp_denial_exercised==false and
            .security_current==false and .release_ready==false
          ' "$report" >/dev/null
          jq -c '{verified_firefox160_browser_probe_cache,
                  independent_runner_child_stage,runner_child_errno,
                  runner_child_cap_sys_admin_inside_new_userns,
                  runner_child_seccomp_mode_after_clone,
                  denied_unshare_with_cap_sys_admin_absent_observed,
                  same_runner_child_and_firefox_probe_consistent,
                  exact_denial_policy_or_lsm_cause_proven}' "$report"
          echo 'PASS: Firefox parent cached capability and independent same-run child probe align'
      - name: Archive bounded Firefox 160 Linux content-process observation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-content-seccomp-observation-proof
          path: |
            ${{ runner.temp }}/firefox160-content-sandbox-proof.json
            ${{ runner.temp }}/firefox160-runner-userns-child-report.json
            ${{ runner.temp }}/firefox160-userns-crosswalk.json
          if-no-files-found: error
          retention-days: 30
      - name: Record bounded seccomp observation failure diagnostics
        if: failure()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/firefox160-content-sandbox.log"; then
            tail -n 250 "$RUNNER_TEMP/firefox160-content-sandbox.log" > "$RUNNER_TEMP/firefox160-seccomp-failure-tail.log"
          fi
      - name: Upload bounded seccomp test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-content-seccomp-failure
          path: ${{ runner.temp }}/firefox160-seccomp-failure-tail.log
          if-no-files-found: ignore
          retention-days: 14
