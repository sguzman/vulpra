name: M3 Native ASRouter Promotion Opt-out Acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-asrouter-promos-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulpra-m3-asrouter-promo-native
  cancel-in-progress: false

jobs:
  native-promo-candidate:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-promos-experiment
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
      VULPRA_M3_VERIFY_NIMBUS: "1"
      VULPRA_M3_VERIFY_NO_ASROUTER_PROMOS: "1"
    steps:
      - name: Checkout source without touching workstation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check source safety contract and external references
        shell: bash
        run: |
          set -euo pipefail
          bash ci/tests/m3-asrouter-promos-optout-test.sh "$GITHUB_WORKSPACE"
          echo '## Source references to two optional promo implementations'
          git grep -n -F -e 'SidebarChatBotPromo.sys.mjs' -e 'SmartWindowNewTabPromo.sys.mjs' -- . \
            > "$RUNNER_TEMP/m3-promo-references.txt" || rc=$?
          test "${rc:-0}" -le 1
          head -n 100 "$RUNNER_TEMP/m3-promo-references.txt"
          echo 'Static references are review evidence, not proof of dynamic reachability.'

      - name: Prepare Mozilla compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap Linux build and runtime dependencies
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends python3 python3-venv python3-dev \
            git curl make jq weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Verify isolated, protected GTK build configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'export VULPRA_EXPERIMENT_NO_ASROUTER_PROMOS=1' "$MOZCONFIG"
          ./mach configure
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("obj-vulpra-linux-m3-promos-experiment/config.statusd/substs")
          def get(key):
              f=root/key
              return json.loads(f.read_text()) if f.exists() else None
          assert str(get("VULPRA_NO_ASROUTER_PROMOS")) in ("1","True"),get("VULPRA_NO_ASROUTER_PROMOS")
          assert get("MOZ_WIDGET_TOOLKIT")=="gtk"
          assert get("MOZ_APP_BASENAME")=="Vulpra"
          assert get("MOZ_DEVTOOLS")=="all"
          for key in ("MOZ_SANDBOX","MOZ_WAYLAND","MOZ_SERVICES_SYNC","MOZ_NORMANDY"):
              assert str(get(key)) in ("1","True"), (key,get(key))
          print("PASS: only opt-in promos omitted; GTK, sandbox, Wayland, Sync, Normandy, DevTools retained")
          PY

      - name: Reserve 24 GiB active disk swap for native Rust compilation
        shell: bash
        run: |
          set -euo pipefail
          swap=/mnt/vulpra-m3-promos.swap
          bytes=$((24 * 1024 * 1024 * 1024))
          available="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( available > bytes + 8 * 1024 * 1024 * 1024 ))
          sudo fallocate -l 24G "$swap"
          sudo chmod 0600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          grep -Fq "$swap" /proc/swaps
          echo 'PASS: 24 GiB native Rust compile swap enabled, CARGO_BUILD_JOBS=1'

      - name: Compile genuine Linux browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-promo-native-build.log"
          echo 'PASS: native browser compiled with promotion modules excluded'

      - name: Package and SHA-256 verify experimental browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist=obj-vulpra-linux-m3-promos-experiment/dist
          mapfile -d '' -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print0)
          [[ "${#archives[@]}" -eq 1 ]]
          mkdir -p .git/vulpra-native-build/packages
          bash packaging/stage.sh "${archives[0]}" \
            "$GITHUB_WORKSPACE/.git/vulpra-native-build/packages/vulpra-local-asrouter-promos-ci.tar.xz"
          (cd .git/vulpra-native-build/packages && \
            sha256sum -c vulpra-local-asrouter-promos-ci.tar.xz.sha256)
          echo 'PASS: separately staged alternate Vulpra browser and checksum'

      - name: Verify exactly two promo resources absent in real packaged omni.ja
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,tarfile,zipfile
          from pathlib import Path
          archive=Path(".git/vulpra-native-build/packages/vulpra-local-asrouter-promos-ci.tar.xz")
          entries=set()
          jars=0
          with tarfile.open(archive,"r:xz") as tar:
              for item in tar:
                  if item.isfile() and item.name.endswith("/omni.ja"):
                      jars+=1
                      with zipfile.ZipFile(io.BytesIO(tar.extractfile(item).read())) as jar:
                          entries.update(jar.namelist())
          omitted=("modules/asrouter/SidebarChatBotPromo.sys.mjs",
                   "modules/asrouter/SmartWindowNewTabPromo.sys.mjs")
          required=("modules/asrouter/ASRouter.sys.mjs",
                    "modules/asrouter/ASRouterTelemetry.sys.mjs",
                    "modules/asrouter/OnboardingMessageProvider.sys.mjs")
          present=[p for p in omitted if any(n.endswith(p) for n in entries)]
          missing=[p for p in required if not any(n.endswith(p) for n in entries)]
          assert jars>=2,(jars,sorted(entries)[:20])
          assert not present and not missing,(present,missing)
          report={"schema_version":1,"source_commit":os.environ["GITHUB_SHA"],
                  "variant":"isolated-linux-asrouter-promo-optout",
                  "compressed_bytes":archive.stat().st_size,
                  "sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
                  "omni_jar_count":jars,"omitted_resources":omitted,
                  "required_resources":required,
                  "acceptance":"pending live Wayland/JS/WebExtension/Nimbus and dispatch tests",
                  "matched_baseline_delta_bytes":None}
          out=Path(os.environ["RUNNER_TEMP"])/"m3-asrouter-promo-package.json"
          out.write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          print("PASS: exactly two targeted promotion resources absent; core ASRouter present")
          PY

      - name: Real packaged Weston, JS, WebExtensions, Nimbus and guarded promo route
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          tar -xf .git/vulpra-native-build/packages/vulpra-local-asrouter-promos-ci.tar.xz -C "$work"
          mapfile -d '' -t inis < <(find "$work" -maxdepth 5 -type f -name application.ini -print0)
          [[ "${#inis[@]}" -eq 1 ]]
          VULPRA_WAYLAND_TEST_SECONDS=12 bash packaging/test-wayland.sh "$(dirname "${inis[0]}")"
          python3 ci/smoke-m3-localhost-package.py "$GITHUB_WORKSPACE"
          PATH="$RUNNER_TEMP:$PATH" python3 ci/smoke-webextension-package-local.py "$GITHUB_WORKSPACE"
          echo 'PASS: real GUI, JS, WebExtension, Nimbus, promo dispatch and Firefox profile checks'

      - name: Preserve source, native package and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-asrouter-promos-native-evidence
          path: |
            ${{ runner.temp }}/m3-promo-references.txt
            ${{ runner.temp }}/m3-asrouter-promo-package.json
            .git/vulpra-native-build/packages/vulpra-local-asrouter-promos-ci.tar.xz
            .git/vulpra-native-build/packages/vulpra-local-asrouter-promos-ci.tar.xz.sha256
            .git/vulpra-native-build/m3-localhost-acceptance.json
            .git/vulpra-native-build/webextension-smoke-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded compilation failure diagnostics
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-promo-native-build.log"; then
            tail -n 4000 "$RUNNER_TEMP/m3-promo-native-build.log" > \
              "$RUNNER_TEMP/m3-promo-build-failure-tail.log"
          fi

      - name: Upload build diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-asrouter-promo-failure-tail
          path: ${{ runner.temp }}/m3-promo-build-failure-tail.log
          if-no-files-found: warn
          retention-days: 14
