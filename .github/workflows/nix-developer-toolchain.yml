name: Vulpra Nix Developer Toolchain (No Browser Build)
on:
  push:
    branches: [main]
    paths:
      - nix/**
      - scripts/vulpra-build-160.sh
      - packaging/vulpra
      - js/src/xsum/moz.build
      - js/src/xsum/xsum.cpp
      - js/src/xsum/xsum.h
      - .github/workflows/nix-developer-toolchain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nix-toolchain-linux:
    if: github.repository == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout only small Nix tooling and existing guarded scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            nix/flake.nix
            nix/flake.lock
            nix/vulpra
            nix/test-vulpra-launcher.sh
            nix/test-main-launch-runtime.sh
            nix/mozconfig-overlay.sh
            nix/test-mozconfig-overlay.sh
            nix/test-wasm-compiler.sh
            nix/test-native-assembler.sh
            nix/test-native-linker.sh
            nix/test-fontconfig-compat.sh
            nix/test-xsum-warning-flags.sh
            js/src/xsum/moz.build
            js/src/xsum/xsum.cpp
            js/src/xsum/xsum.h
            nix/vulpra-dev.sh
            nix/verify-preserved-browser.sh
            nix/README.md
            AGENTS.md
            mach
            ci/mozconfig-linux
            scripts/vulpra-build-160.sh
            scripts/fetch-mozilla-release.sh
            scripts/vulpra-package-160.sh
            scripts/build-firefox160-local.sh
            ci/security-160-stage-overlay.sh
            ci/security-160-stage-byob-branding.sh
            ci/security-160-hotfix-assemble-tree.sh
            ci/build-local.sh
            ci/package-smoke-local.sh
            ci/smoke-native-local.sh
            ci/smoke-wayland-package-local.sh
            ci/accept-native-package-local.py
            ci/smoke-webextension-package-local.py
            packaging/stage.sh
            packaging/vulpra
      - name: Test native main launcher without Nix or compiled Firefox
        shell: bash
        run: |
          set -euo pipefail
          bash -n nix/test-main-launch-runtime.sh
          bash nix/test-main-launch-runtime.sh
      - name: Install Nix in the disposable runner only
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Generate or verify lock without changing source or browser
        shell: bash
        run: |
          set -euo pipefail
          nix --version
          flake_ref="path:$PWD/nix"
          nix flake lock "$flake_ref"
          test -s nix/flake.lock
          # Newly generated lock must be staged locally to participate in
          # Git-based flake evaluation; no Git push/commit from CI.
          git add nix/flake.lock
          if git cat-file -e HEAD:nix/flake.lock 2>/dev/null; then
            git diff --cached --exit-code -- nix/flake.lock
          else
            echo 'First run: generated lock is available as a CI artifact; must be committed before declaring pinning complete' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Actual Nix flake output evaluation and lightweight build checks
        shell: bash
        run: |
          set -euo pipefail
          flake_ref="path:$PWD/nix"
          # The Nix flake input MUST contain only nix/, not Firefox's Git root.
          flake_source="$(nix flake metadata "$flake_ref" --json --no-write-lock-file | jq -r .path)"
          test -f "$flake_source/flake.nix"
          test ! -e "$flake_source/browser"
          test ! -e "$flake_source/js"
          test ! -e "$flake_source/ci"
          test ! -e "$flake_source/.git"
          echo 'PASS: explicit path: flake imports only the small nix/ directory'
          nix flake show "$flake_ref" --no-write-lock-file
          nix flake check "$flake_ref" --no-write-lock-file --show-trace
      - name: Realize developer shell and run read-only environment and code checks
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          flake_ref="path:$PWD/nix"
          nix develop "$flake_ref" --no-write-lock-file --command vulpra-dev doctor
          nix develop "$flake_ref" --no-write-lock-file --command bash nix/test-wasm-compiler.sh
          nix develop "$flake_ref" --no-write-lock-file --command bash nix/test-native-assembler.sh
          nix develop "$flake_ref" --no-write-lock-file --command bash nix/test-native-linker.sh
          nix develop "$flake_ref" --no-write-lock-file --command bash nix/test-fontconfig-compat.sh
          nix develop "$flake_ref" --no-write-lock-file --command bash nix/test-xsum-warning-flags.sh
          nix develop "$flake_ref" --no-write-lock-file --command vulpra-dev check
          nix run "${flake_ref}#vulpra-dev" --no-write-lock-file -- help
          if nix run "${flake_ref}#vulpra-dev" --no-write-lock-file -- build; then
            echo 'Unexpected unguarded native build outside Nix devShell' >&2
            exit 1
          fi
          echo 'PASS: Nix shell and read-only developer commands; unsafe host-toolchain build fallback refused' >> "$GITHUB_STEP_SUMMARY"
          echo 'LIMIT: no complete Firefox source, mach configure/build, browser runtime, workstation or FIPS acceptance in this workflow' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated lock for explicit pinning review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-nix-toolchain-lock-review
          path: nix/flake.lock
          if-no-files-found: warn
          retention-days: 7
