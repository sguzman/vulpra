# Execute the original SHA-256-pinned full-normal Vulpra in a real private
# Weston Wayland compositor and compare actual loader init names.
# No user profile, network calls, source deletion or full graph closure.
name: M3 Actual Wayland Native Loader Observation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-wayland-loader-observation.yml
      - ci/m3-native-loader-runtime-observation.py
      - packaging/test-wayland.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  privately-committed-wayland-frame-and-loader:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout exact current test harness and source-safe loader parser
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
            packaging
      - name: Reject fake loader reports and authenticate native compilation source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n packaging/test-wayland.sh
          python3 -m py_compile ci/m3-native-loader-runtime-observation.py
          python3 ci/m3-native-loader-runtime-observation.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg source "$SOURCE_SHA" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$source' >/dev/null
      - name: Authenticate exact full-Normandy compiled Linux archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/native"
          (cd "$RUNNER_TEMP/native" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"native"
          archive=root/"full-normandy-baseline.tar.xz"
          m=json.loads((root/"m3-full-normandy-baseline.json").read_text())
          assert m["schema_version"]==1
          assert m["source_commit"]==os.environ["SOURCE_SHA"]
          assert m["sha256"]==os.environ["ARCHIVE_SHA256"]==hashlib.sha256(archive.read_bytes()).hexdigest()
          assert m["variant"]=="full-normandy" and m["normandy_runner_present"] is True
          assert m["required_newtab_modules_present"] is True
          assert archive.stat().st_size==m["compressed_bytes"]==87154544
          print("PASS: exact source and real original native package identity")
          PY
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xf "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" \
            -C "$RUNNER_TEMP/extracted"
          test -f "$RUNNER_TEMP/extracted/vulpra/application.ini"
      - name: Install private Wayland compositor and native GTK runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
      - name: Verify baseline 10-second Wayland frame without any loader instrumentation
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Acceptance remains the original uninstrumented ten-second run.
          # A failure may be followed by diagnostic runs, but never converted
          # into a pass by a shorter surviving process or altered environment.
          if env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            VULPRA_WAYLAND_TEST_SECONDS=10 \
            bash packaging/test-wayland.sh "$RUNNER_TEMP/extracted/vulpra"; then
            echo 'PASS: original normal browser Wayland baseline survives 10 seconds'
          else
            echo 'FAIL: required original ten-second Wayland baseline'
            echo 'DIAGNOSTIC ONLY: separate clean profiles at shorter intervals'
            for seconds in 2 5 8; do
              if env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
                VULPRA_WAYLAND_TEST_SECONDS="$seconds" \
                bash packaging/test-wayland.sh "$RUNNER_TEMP/extracted/vulpra"; then
                echo "DIAGNOSTIC PASS: rendered frame and process survived ${seconds}s"
              else
                echo "DIAGNOSTIC FAIL: ${seconds}s probe did not meet all conditions"
              fi
            done
            echo 'DIAGNOSTIC ONLY: crash reporter disabled, full ten-second contract'
            if env MOZ_CRASHREPORTER_DISABLE=1 \
              MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
              VULPRA_WAYLAND_TEST_SECONDS=10 \
              bash packaging/test-wayland.sh "$RUNNER_TEMP/extracted/vulpra"; then
              echo 'DIAGNOSTIC PASS: no-crash-reporter ten-second probe'
            else
              echo 'DIAGNOSTIC FAIL: no-crash-reporter ten-second probe'
            fi
            echo 'FAIL: the original native Wayland acceptance was not satisfied'
            exit 1
          fi
      - name: Render and commit an actual Wayland frame while tracing native loader
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loader"
          env VULPRA_M3_LOADER_TRACE_PREFIX="$RUNNER_TEMP/loader/m3-loader" \
            MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            VULPRA_WAYLAND_TEST_SECONDS=10 \
            bash packaging/test-wayland.sh "$RUNNER_TEMP/extracted/vulpra"
          python3 ci/m3-native-loader-runtime-observation.py \
            "$RUNNER_TEMP/loader" --workload private_weston_wayland \
            --output "$RUNNER_TEMP/m3-wayland-native-loader-observed.json"
          jq -e '
            .schema_version==1 and
            .status=="actual_native_full_normal_loader_observation" and
            .observed_workload_mode=="private_weston_wayland" and
            .real_native_wayland_surface_commit_passed==true and
            .real_native_webdriver_workload_passed==false and
            .browser_process_traces_with_libxul>=1 and
            .observed_loader_init_library_basename_count>=3 and
            .libxul_requested_in_real_browser_process==true and
            .libc_loader_init_observed==true and
            .raw_loader_traces_retained==false and
            .complete_dlopen_graph_proven==false and
            .unexecuted_feature_routes_proven==false and
            .complete_dynamic_symbol_and_ABI_resolution_proven==false and
            .current_main_browser_recompiled==false and
            .new_source_removal_authorized==false and
            .new_compressed_savings_bytes==null and
            .whole_m3_feature_dependency_gate_completed==false' \
            "$RUNNER_TEMP/m3-wayland-native-loader-observed.json" >/dev/null
          rm -rf -- "$RUNNER_TEMP/loader"
          echo 'PASS: real Wayland compositor frame + sanitized native loader'
      - name: Diagnostic only - private Weston GDB crash stack
        if: failure()
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/extracted/vulpra/vulpra"
          if [[ ! -x "$native" ]]; then
            echo 'SKIP: native compiled browser was not extracted'
            exit 0
          fi
          # The original ten-second acceptance remains failed. The debugger
          # is a separate experiment; never use its outcome as Wayland proof.
          if ! command -v gdb >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
              install -y --no-install-recommends gdb
          fi
          work="$(mktemp -d)"
          weston_pid=''
          cleanup() {
            if [[ -n "$weston_pid" ]]; then
              kill "$weston_pid" 2>/dev/null || true
              wait "$weston_pid" 2>/dev/null || true
            fi
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          mkdir -m 0700 -p "$work/runtime" "$work/home/.local/share/vulpra/default"
          export XDG_RUNTIME_DIR="$work/runtime"
          export WAYLAND_DISPLAY=wayland-vulpra-debug
          unset DISPLAY
          weston --backend=headless-backend.so --renderer=pixman \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log="$work/weston.log" >"$work/weston.stdout" 2>&1 &
          weston_pid="$!"
          socket_ready=0
          for attempt in {1..40}; do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              socket_ready=1
              break
            fi
            if ! kill -0 "$weston_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if [[ "$socket_ready" != 1 ]]; then
            echo 'GDB diagnostic unavailable: isolated Weston socket missing'
            exit 0
          fi
          # Suppress raw GDB output: it can contain temporary paths, process
          # IDs, pointer addresses and crash-state arguments. Only emit bounded
          # symbolic frame names stripped of their arguments and source paths.
          set +e
          env -u MOZ_HEADLESS \
            HOME="$work/home" XDG_DATA_HOME="$work/home/.local/share" \
            XDG_SESSION_TYPE=wayland GDK_BACKEND=wayland MOZ_ENABLE_WAYLAND=1 \
            MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 MOZ_CRASHREPORTER_DISABLE=1 \
            timeout --signal=TERM --kill-after=3s 28s \
            gdb -q -nx -batch \
              -ex 'set pagination off' \
              -ex 'set debuginfod enabled off' \
              -ex 'set auto-load safe-path /dev/null' \
              -ex 'handle SIGPIPE nostop noprint pass' \
              -ex run -ex 'bt 15' \
              --args "$native" --no-remote --new-instance \
              --profile "$work/home/.local/share/vulpra/default" \
              about:blank >"$work/gdb.log" 2>&1
          probe_status="$?"
          set -e
          echo "DIAGNOSTIC GDB process exit status: $probe_status (not browser acceptance)"
          awk '
            /Program received signal/ {
              if (/SIGSEGV/) print "DIAGNOSTIC signal: SIGSEGV";
              else print "DIAGNOSTIC signal: other";
            }
            /^#[0-9]+[[:space:]]/ {
              frame=$0
              sub(/^#[0-9]+[[:space:]]+/, "", frame)
              sub(/^0x[0-9a-fA-F]+[[:space:]]+in[[:space:]]+/, "", frame)
              sub(/^in[[:space:]]+/, "", frame)
              sub(/\\(.*/, "", frame)
              sub(/[[:space:]]+(at|from)[[:space:]].*/, "", frame)
              gsub(/[^A-Za-z0-9_:~<>., +*-]/, "?", frame)
              print "DIAGNOSTIC symbolic frame " ++n ": " substr(frame,1,120)
              if (n >= 15) exit
            }
          ' "$work/gdb.log"
          echo 'NOTE: a GDB reproduction can change timing and sandbox behavior; no gate credit'
      - name: Preserve only sanitized current workload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-private-weston-wayland-loader-observed
          path: ${{ runner.temp }}/m3-wayland-native-loader-observed.json
          if-no-files-found: warn
          retention-days: 14
