# Source-pinned ORIGINAL native browser processUpdate -> fork -> execv
# staging boundary. A deliberately non-applicable missing-MAR fixture is in
# a private nested writable directory; the full browser install is read-only.
# Rust LD_PRELOAD denies ALL execv, recording only exact original source args.
# Not an updater execution/installation/normal automatic update test.
name: M3 Original Browser Updater Execv Boundary Denied
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-browser-updater-execv-denied.yml
      - ci/m3-original-updater-execv-deny.rs
      - ci/m3-original-browser-updater-execv-denied.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-browser-to-updater-execv-denied:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
    steps:
      - name: Checkout only synthetic original updater staging boundary harness
        uses: actions/checkout@v4
        with:
          path: diagnostics
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-updater-execv-deny.rs
            ci/m3-original-browser-updater-execv-denied.sh
      - name: Checkout immutable original C++ staging and Linux update root source
        uses: actions/checkout@v4
        with:
          path: original-source
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            toolkit/xre/nsUpdateDriver.cpp
            toolkit/xre/nsUpdateDriver.h
            toolkit/xre/nsXREDirProvider.cpp
            toolkit/mozapps/update/nsIUpdateService.idl
            toolkit/mozapps/update/UpdateService.sys.mjs
      - name: Authenticate source and fail-closed staging execv intercept
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C diagnostics rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-source rev-parse HEAD)" = "$SOURCE"
          bash -n diagnostics/ci/m3-original-browser-updater-execv-denied.sh
          grep -Fq 'GetFile(dir, "update.version"_ns, result)' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'GetFile(dir, "update.status"_ns, result)' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'const char kNull[] = "null";' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'const char kPending[] = "pending";' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'ApplyUpdate(greDir, updatesDir, appDir, argc, argv, restart, false, pid);' \
            original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'pid.AssignLiteral("-1");' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'argv[1] = const_cast<char*>("3");' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'argv[5] = const_cast<char*>("first");' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq '*outpid = fork();' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'int execResult = execv(updaterPath.get(), argv);' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'return NS_NewNamedThread("UpdateProcessor"' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'rv = GetUpdateRootDir(getter_AddRefs(file));' original-source/toolkit/xre/nsXREDirProvider.cpp
          grep -Fq 'rv = appFile->GetParent(getter_AddRefs(updRoot));' original-source/toolkit/xre/nsXREDirProvider.cpp
          grep -Fq 'void processUpdate();' original-source/toolkit/mozapps/update/nsIUpdateService.idl
          grep -Fq 'createInstance(Ci.nsIUpdateProcessor)' original-source/toolkit/mozapps/update/UpdateService.sys.mjs
          rustc --edition=2021 -D warnings --test \
            diagnostics/ci/m3-original-updater-execv-deny.rs \
            -o "$RUNNER_TEMP/guard-tests"
          "$RUNNER_TEMP/guard-tests"
          rustc --edition=2021 -D warnings -C opt-level=2 --crate-type cdylib \
            diagnostics/ci/m3-original-updater-execv-deny.rs \
            -o "$RUNNER_TEMP/original-updater-execv-guard.so"
          test -s "$RUNNER_TEMP/original-updater-execv-guard.so"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg sha "$SOURCE" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package" "$RUNNER_TEMP/reports"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          for name in vulpra updater; do
            test -x "$RUNNER_TEMP/package/vulpra/$name"
            test "$(head -c 4 "$RUNNER_TEMP/package/vulpra/$name" | od -An -tx1 | tr -d ' \n')" = 7f454c46
          done
          sha256sum "$RUNNER_TEMP/package/vulpra/vulpra" "$RUNNER_TEMP/package/vulpra/updater" \
            >"$RUNNER_TEMP/original-native-file-hashes.before"
          # This EXTRA empty mountpoint is not in the original archive. The
          # actual original ELF files remain byte-for-byte the same.
          mkdir -p "$RUNNER_TEMP/package/vulpra/updates" "$RUNNER_TEMP/fixture/updates"
          test ! -e "$RUNNER_TEMP/package/vulpra/updated"
          test ! -e "$RUNNER_TEMP/fixture/updates/0"
      - name: Build isolated original browser runtime with private Weston and WebDriver
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arch-updater-boundary"
          cat >"$RUNNER_TEMP/arch-updater-boundary/Dockerfile" <<'EOF'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed \
            bash coreutils curl jq grep findutils procps-ng util-linux \
            iproute2 geckodriver gtk3 dbus-glib alsa-lib nss \
            weston wayland-utils mesa libglvnd ttf-dejavu \
            && command -v geckodriver && command -v weston \
            && command -v setpriv && command -v wayland-info \
            && rm -rf /var/cache/pacman/pkg/*
          EOF
          docker build --pull --no-cache -t m3-original-updater-deny:ci \
            "$RUNNER_TEMP/arch-updater-boundary"
      - name: Require real original browser staging execv attempt while denying all execution
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          # Only the synthetic updates/0 fixture mount is writable. Original
          # browser and updater ELFs are read-only, the staging target cannot
          # be created, and the guard returns EACCES before real updater exec.
          docker run --rm --network none --read-only --shm-size 256m \
            --cap-drop ALL --cap-add NET_ADMIN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --pids-limit 512 --memory 4g \
            --tmpfs /tmp:rw,nosuid,nodev,size=600m,mode=1777 \
            -v "$RUNNER_TEMP/package/vulpra:/original:ro" \
            -v "$RUNNER_TEMP/fixture/updates:/original/updates:rw" \
            -v "$RUNNER_TEMP/original-updater-execv-guard.so:/audit/execv-guard.so:ro" \
            -v "$GITHUB_WORKSPACE/diagnostics/ci/m3-original-browser-updater-execv-denied.sh:/audit/test.sh:ro" \
            -v "$RUNNER_TEMP/reports:/reports:rw" \
            -e CI_UID="$(id -u)" -e CI_GID="$(id -g)" \
            -e MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            -e VULPRA_OFFLINE_CONTAINER_ONLY=1 \
            -e VULPRA_M3_DISPOSABLE_UPDATER_EXECV_GUARD=1 \
            m3-original-updater-deny:ci /bin/bash -c '
              set -euo pipefail
              ip link set lo up
              exec setpriv --reuid "$CI_UID" --regid "$CI_GID" \
                --clear-groups /bin/bash /audit/test.sh \
                /original/vulpra /reports/m3-original-browser-updater-execv-denied.json
            '
          (cd "$RUNNER_TEMP" && sha256sum -c original-native-file-hashes.before)
          test ! -e "$RUNNER_TEMP/package/vulpra/updated"
          test ! -e "$RUNNER_TEMP/fixture/updates/0/update.mar"
          report="$RUNNER_TEMP/reports/m3-original-browser-updater-execv-denied.json"
          jq -e --arg src "$SOURCE" --arg sha "$ARCHIVE" '
            .schema_version==1 and
            .status=="source_pinned_original_browser_controlled_updater_staging_execv_denied" and
            .source_commit==$src and .archive_sha256==$sha and
            .original_compiled_browser_started_directly==true and
            .original_browser_update_root_exact_isolated_package==true and
            .synthetic_pending_status_created_after_browser_startup==true and
            .synthetic_version_not_older=="null" and
            .original_update_processor_invoked_from_browser==true and
            .missing_mar_fixture_confirmed==true and
            .no_staged_install_tree_available==true and
            .updater_executable_never_allowed_to_exec==true and
            .actual_browser_to_updater_execv_boundary_observed==true and
            .actual_updater_process_executed==false and
            .valid_source_shaped_guard_observation.source_commit==$src and
            .valid_source_shaped_guard_observation.archive_sha256==$sha and
            .valid_source_shaped_guard_observation.caller_exact_original_browser_executable==true and
            .valid_source_shaped_guard_observation.original_updater_target_exact_packaged_elf==true and
            .valid_source_shaped_guard_observation.source_declared_linux_stage_arguments_matched==true and
            .valid_source_shaped_guard_observation.staging_mode_pid_arg_minus_one==true and
            .valid_source_shaped_guard_observation.genuine_original_updater_execv_attempt_seen==true and
            .valid_source_shaped_guard_observation.actual_updater_executable_execution_permitted==false and
            .valid_source_shaped_guard_observation.all_execv_calls_denied_in_disposable_test==true and
            .valid_source_shaped_guard_observation.no_mar_downloaded_or_provided==true and
            .browser_installation_read_only==true and
            .synthetic_update_status_mounted_in_disposable_directory==true and
            .private_network_disabled==true and
            .no_real_user_browser_or_profile_touched==true and
            .no_download_or_install_requested==true and
            .full_updater_install_success_proven==false and
            .complete_source_build_or_loader_closure_proven==false and
            .source_pruning_authorized==false and
            .native_bytes_saved==0 and .m3_sixth_gate_closed==false
          ' "$report" >/dev/null
          verify() {
            jq -e --arg src "$SOURCE" --arg sha "$ARCHIVE" '
              .source_commit==$src and .archive_sha256==$sha and
              .valid_source_shaped_guard_observation.source_declared_linux_stage_arguments_matched==true and
              .valid_source_shaped_guard_observation.genuine_original_updater_execv_attempt_seen==true and
              .actual_browser_to_updater_execv_boundary_observed==true and
              .updater_executable_never_allowed_to_exec==true and
              .actual_updater_process_executed==false and
              .missing_mar_fixture_confirmed==true and
              .browser_installation_read_only==true and
              .source_pruning_authorized==false
            ' "$1" >/dev/null
          }
          for mutation in \
            '.valid_source_shaped_guard_observation.source_declared_linux_stage_arguments_matched=false' \
            '.valid_source_shaped_guard_observation.genuine_original_updater_execv_attempt_seen=false' \
            '.actual_browser_to_updater_execv_boundary_observed=false' \
            '.updater_executable_never_allowed_to_exec=false' \
            '.actual_updater_process_executed=true' \
            '.missing_mar_fixture_confirmed=false' \
            '.archive_sha256="fake"' \
            '.browser_installation_read_only=false' \
            '.source_pruning_authorized=true'; do
              jq "$mutation" "$report" >"$RUNNER_TEMP/reports/mutated.json"
            if verify "$RUNNER_TEMP/reports/mutated.json"; then
              echo 'FAIL: tampered original updater execv summary was accepted' >&2; exit 1
            fi
          done
          rm -f "$RUNNER_TEMP/reports/mutated.json"
          echo 'M3_ORIGINAL_UPDATER_EXECV_GUARDED=PASS original browser source-shaped staging boundary intercepted; no MAR or install; tamper checks rejected'
      - name: Save only sanitized original stage-execv pre-execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-browser-updater-execv-denied
          path: ${{ runner.temp }}/reports/m3-original-browser-updater-execv-denied.json
          if-no-files-found: warn
          retention-days: 14
