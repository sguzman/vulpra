# Source-pinned independent artifact comparison; runs on BOTH build completions.
# First successful build may have no pair yet: SKIP without a failing wait loop.
# On the second completion the counterpart's evidence is already present.
name: M3 Compare New Tab PromoCard Native Packages

on:
  workflow_run:
    workflows:
      - M3 Native New Tab PromoCard Opt-out Trial
      - M3 Native Full New Tab PromoCard Baseline
    types: [completed]
  # Reconcile an already successful pair after fixing the artifact locator.
  # This runs a bounded comparison only; no native browser compilation.
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-promocard-size-compare.yml

permissions:
  contents: read
  actions: read

jobs:
  find-source-matched-pair:
    if: >-
      github.repository == 'sguzman/vulpra' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'sguzman/vulpra' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.find.outputs.ready }}
      native_run_id: ${{ steps.find.outputs.native_run_id }}
      baseline_run_id: ${{ steps.find.outputs.baseline_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Find successful same-commit normal and opt-in package builds
        id: find
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          command -v gh >/dev/null
          search_run() {
            local workflow="$1" result
            result="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE_SHA&per_page=100")"
            jq -r --arg sha "$SOURCE_SHA" '
              [.workflow_runs[] | select(
                .head_sha==$sha and
                (.event=="push" or .event=="workflow_dispatch") and
                .conclusion=="success" and .head_branch=="main"
              )] | sort_by(.id) | last | .id // empty' <<< "$result"
          }
          # No waiting runner. Completion of the LAST of the two workflows
          # dispatches another copy of this job which sees BOTH successful.
          native_id="$(search_run m3-promocard-native.yml)"
          baseline_id="$(search_run m3-promocard-matched-baseline.yml)"
          if [[ -z "$native_id" || -z "$baseline_id" ]]; then
            echo "No complete pair yet for $SOURCE_SHA: native=${native_id:-pending}, full=${baseline_id:-pending}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: Source-matched second successful workflow completion will trigger comparison."
            exit 0
          fi
          {
            echo "ready=true"
            echo "native_run_id=$native_id"
            echo "baseline_run_id=$baseline_id"
          } >> "$GITHUB_OUTPUT"
          echo "PASS: accepted source-matched pair: candidate=$native_id baseline=$baseline_id SHA=$SOURCE_SHA"

  compare:
    needs: find-source-matched-pair
    if: needs.find-source-matched-pair.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_RUN_ID: ${{ needs.find-source-matched-pair.outputs.native_run_id }}
      BASELINE_RUN_ID: ${{ needs.find-source-matched-pair.outputs.baseline_run_id }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Fetch authenticated successful source-matched build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promocard-candidate" "$RUNNER_TEMP/promocard-baseline"
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-promocard-native-evidence \
            --dir "$RUNNER_TEMP/promocard-candidate"
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-promocard-full-baseline-evidence \
            --dir "$RUNNER_TEMP/promocard-baseline"
      - name: Checkout exact source for pinned comparison parser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Compare actual native packages and signed difference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          # upload-artifact keeps relative paths when files originate in
          # multiple directories. Never assume the JSON is at the ZIP root.
          mapfile -d '' -t full_evidence < <(find "$RUNNER_TEMP/promocard-baseline" -type f -name m3-promocard-full-baseline-evidence.json -print0)
          mapfile -d '' -t lean_evidence < <(find "$RUNNER_TEMP/promocard-candidate" -type f -name m3-promocard-evidence.json -print0)
          if (( ${#full_evidence[@]} != 1 || ${#lean_evidence[@]} != 1 )); then
            echo "FAIL: expected one exact evidence JSON per verified source-matched artifact" >&2
            find "$RUNNER_TEMP/promocard-baseline" "$RUNNER_TEMP/promocard-candidate" -maxdepth 12 -type f -printf '%p\\n' >&2
            exit 1
          fi
          python3 ci/m3-promocard-match-evidence.py \
            "${full_evidence[0]}" \
            "${lean_evidence[0]}" \
            "$RUNNER_TEMP/m3-promocard-matched-size.json" \
            --source-commit "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"m3-promocard-matched-size.json"
          report=json.loads(p.read_text())
          report["native_candidate_run_id"]=int(os.environ["NATIVE_RUN_ID"])
          report["baseline_run_id"]=int(os.environ["BASELINE_RUN_ID"])
          p.write_text(json.dumps(report,indent=2)+"\n")
          print("PASS: source-matched workflow provenance recorded")
          PY

      - name: Upload verified paired package-size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-promocard-matched-size
          path: ${{ runner.temp }}/m3-promocard-matched-size.json
          if-no-files-found: warn
          retention-days: 14

  # One-time replay from immutable native evidence when this workflow is fixed.
  # Source and run IDs come from the committed audit record, not guesses.
  reconcile-published-pair:
    if: github.repository == 'sguzman/vulpra' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout committed audit and comparator without Firefox checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ci
            docs/vulpra
      - name: Download and check source identity of both native artifacts
        shell: bash
        run: |
          set -euo pipefail
          record=docs/vulpra/M3-PROMOCARD-NATIVE-PAIR.json
          source_sha="$(jq -er '.source_commit' "$record")"
          normal_id="$(jq -er '.normal.workflow_run' "$record")"
          lean_id="$(jq -er '.optin.workflow_run' "$record")"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$normal_id" =~ ^[0-9]+$ && "$lean_id" =~ ^[0-9]+$ ]]
          for id in "$normal_id" "$lean_id"; do
            info="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$id")"
            jq -e --arg sha "$source_sha" '.head_sha == $sha and .conclusion == "success" and .head_branch == "main"' <<< "$info"
          done
          mkdir -p "$RUNNER_TEMP/promocard-baseline" "$RUNNER_TEMP/promocard-candidate"
          gh run download "$normal_id" --repo "$GITHUB_REPOSITORY" --name m3-promocard-full-baseline-evidence --dir "$RUNNER_TEMP/promocard-baseline"
          gh run download "$lean_id" --repo "$GITHUB_REPOSITORY" --name m3-promocard-native-evidence --dir "$RUNNER_TEMP/promocard-candidate"
          mapfile -d '' -t full_evidence < <(find "$RUNNER_TEMP/promocard-baseline" -type f -name m3-promocard-full-baseline-evidence.json -print0)
          mapfile -d '' -t lean_evidence < <(find "$RUNNER_TEMP/promocard-candidate" -type f -name m3-promocard-evidence.json -print0)
          if (( ${#full_evidence[@]} != 1 || ${#lean_evidence[@]} != 1 )); then
            echo "FAIL: expected exactly one evidence JSON in each downloaded artifact" >&2
            find "$RUNNER_TEMP/promocard-baseline" "$RUNNER_TEMP/promocard-candidate" -type f -printf '%p\\n' >&2
            exit 1
          fi
          python3 ci/m3-promocard-match-evidence.py "${full_evidence[0]}" "${lean_evidence[0]}" "$RUNNER_TEMP/m3-promocard-matched-size.json" --source-commit "$source_sha"
          python3 - "$RUNNER_TEMP/m3-promocard-matched-size.json" "$normal_id" "$lean_id" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          result=json.loads(path.read_text())
          result["baseline_run_id"]=int(sys.argv[2])
          result["native_candidate_run_id"]=int(sys.argv[3])
          path.write_text(json.dumps(result,indent=2)+"\\n")
          print("PASS: replayed source-matched native evidence with durable run references")
          PY
      - name: Upload verified comparison without rebuilding Firefox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-promocard-matched-size-reconciliation
          path: ${{ runner.temp }}/m3-promocard-matched-size.json
          if-no-files-found: warn
          retention-days: 14
