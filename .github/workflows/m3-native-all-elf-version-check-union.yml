
name: M3 Original Compiled GNU ELF Version-Check Full Identity Reconciliation
on:
  push:
    branches: [main]
    paths:
      - ci/m3-native-all-elf-version-check-union.py
      - .github/workflows/m3-native-all-elf-version-check-union.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile-all-original-native-elf-version-identities:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STATIC_RUN: '41157293087'
      STATIC_HEAD: 184d5b33678152c1bd28b0c35cecc450e49c93f1
      SEVEN_RUN: '41161137900'
      SEVEN_HEAD: 9548751ed32a2221cd652e9a446a8ce52f724f4c
      AUX_RUN: '41161508642'
      AUX_HEAD: 4996b4de404e3fc1889952e7d31e882f497255ce
    steps:
      - name: Checkout bounded native ABI identity reconciliation only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Reject synthetic original ELF tuple collisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-native-all-elf-version-check-union.py
          python3 ci/m3-native-all-elf-version-check-union.py --self-test
      - name: Authenticate all original compiled source evidence runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for kind in STATIC SEVEN AUX; do
            runkey="${kind}_RUN"
            headkey="${kind}_HEAD"
            runid="${!runkey}"
            source_sha="${!headkey}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$runid" |
              jq -e --arg sha "$source_sha" '
                .status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          done
          mkdir -p "$RUNNER_TEMP/static" "$RUNNER_TEMP/seven" "$RUNNER_TEMP/aux"
          gh run download "$STATIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-version-name-contract --dir "$RUNNER_TEMP/static"
          gh run download "$SEVEN_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-native-seven-feature-workload-abi-union --dir "$RUNNER_TEMP/seven"
          gh run download "$AUX_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-guarded-auxiliary-cli-elf --dir "$RUNNER_TEMP/aux"
      - name: Verify 519 exact non-overlapping GNU ABI version-check identities
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/m3-native-all-elf-version-check-union.py \
            --static "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" \
            --seven "$RUNNER_TEMP/seven/m3-native-seven-workload-abi-union.json" \
            --aux "$RUNNER_TEMP/aux/m3-auxiliary-guarded-cli-version-contracts.json" \
            --output "$RUNNER_TEMP/m3-native-all-elf-version-check-union.json"
          jq -e '
            .schema_version==1 and
            .original_native_elf_members==28 and
            .original_declared_elf_version_contracts==519 and
            .observed_original_elf_version_contracts_across_ten_separate_invocations==519 and
            .unobserved_declared_version_contracts_in_these_invocations==0 and
            .original_elf_version_check_identity_coverage_percent==100 and
            .actual_crash_or_update_workflows_covered==false and
            .full_dynamic_symbol_relocations_and_weak_imports_proven==false and
            .unversioned_and_lazy_dynamic_imports_proven==false and
            .source_build_feature_dependency_graph_completed==false and
            .arch_hyprland_native_runtime_revalidated==false and
            .source_deletion_or_binary_savings_authorized==false and
            .m3_sixth_gate_closed==false'             "$RUNNER_TEMP/m3-native-all-elf-version-check-union.json" >/dev/null
          echo 'PASS: all original ELF version identities observed without claiming feature completeness'
      - name: Upload only bounded sanitized original ELF coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-native-all-elf-version-check-identities
          path: ${{ runner.temp }}/m3-native-all-elf-version-check-union.json
          if-no-files-found: error
          retention-days: 14
