name: M3 Current Gkrust Machine Branch Evidence Contract

on:
  push:
    branches: [main]
    paths:
      - ci/m3-current-gkrust-machine-branches-evidence.jq
      - ci/tests/m3-current-gkrust-machine-branches-evidence-tests.sh
      - .github/workflows/m3-current-gkrust-machine-branches-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-forged-current-machine-call-attestations:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout bounded native evidence join and fixtures
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-current-gkrust-machine-branches-evidence.jq
            ci/tests/m3-current-gkrust-machine-branches-evidence-tests.sh
      - name: Verify 25 native evidence rejection fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/tests/m3-current-gkrust-machine-branches-evidence-tests.sh
          bash ci/tests/m3-current-gkrust-machine-branches-evidence-tests.sh
