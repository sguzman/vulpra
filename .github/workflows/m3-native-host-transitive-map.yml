# Metadata-only expansion of actual packaged Vulpra external ELF imports into
# Ubuntu host libraries' direct ELF dependencies. No native binary execution.
name: M3 Native Host ELF Transitive Map

on:
  push:
    branches: [main]
    paths:
      - ci/m3-native-host-transitive-map.py
      - .github/workflows/m3-native-host-transitive-map.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-host-metadata-graph:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout bounded read-only ELF analysis only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci

      - name: Reject malformed/transitive-host-loader evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/m3-native-host-dependency-preflight.py ci/m3-native-host-transitive-map.py
          python3 ci/m3-native-host-dependency-preflight.py --self-test
          python3 ci/m3-native-host-transitive-map.py --self-test

      - name: Install standard CI host runtime libraries and metadata inspector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends binutils libgtk-3-0t64 libdbus-glib-1-2 \
            libasound2t64 libnss3 libgbm1
          test -x /sbin/ldconfig
          command -v readelf

      - name: Retrieve previously verified historic package graph evidence only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40947019427 --repo "$GITHUB_REPOSITORY" \
            --name m3-native-host-cache-preflight --dir "$RUNNER_TEMP/host-preflight"
          jq -e \
            '.schema_version == 1 and .archive_compressed_bytes == 86930792 and
             (.elf_members | length) == 28 and .direct_needed_edges == 268 and
             (.not_packaged_needed_names | length) == 36 and
             .host_dependency_resolution_verified == false and
             .source_removal_authorized == false' \
            "$RUNNER_TEMP/host-preflight/m3-host-elf-source-graph.json" >/dev/null
          jq -e \
            '.source_archive_sha256 != null and
             .direct_unbundled_names_checked == 36 and
             .names_with_host_elf64_cache_candidates == 36 and
             .target_workstation_library_resolution_proven == false' \
            "$RUNNER_TEMP/host-preflight/m3-native-host-cache-preflight.json" >/dev/null
          echo "PASS: downloaded only the already-audited historical archive metadata"

      - name: Follow host ELF DT_NEEDED names without invoking any binary
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/m3-native-host-transitive-map.py \
            --graph "$RUNNER_TEMP/host-preflight/m3-host-elf-source-graph.json" \
            --output "$RUNNER_TEMP/m3-host-elf-transitive-map.json"
          jq -e \
            '.schema_version == 1 and .original_package_external_direct_needs == 36 and
             .host_direct_and_transitive_unique_names >= 36 and
             .original_package_ELF_executed == false and
             .host_ELF_executed == false and
             .ldd_or_dlopen_invoked == false and
             .actual_loader_resolution_or_symbol_versions_verified == false and
             .target_Arch_workstation_verified == false and
             .compiled_feature_savings_bytes == null and
             .source_removal_authorized == false' \
            "$RUNNER_TEMP/m3-host-elf-transitive-map.json" >/dev/null
          echo "PASS: bounded static CI host names, no actual loader/ABI or source removal claim"

      - name: Preserve bounded host transitive metadata only
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-host-elf-transitive-map
          path: ${{ runner.temp }}/m3-host-elf-transitive-map.json
          if-no-files-found: error
          retention-days: 14
