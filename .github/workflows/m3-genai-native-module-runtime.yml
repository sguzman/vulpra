# One immutable full-normal compiled Vulpra package, not a fresh Firefox rebuild.
# The 9 privileged modules/actors are imported ONLY, without actor instantiation,
# model inference, provider requests or changing default preferences.
name: M3 Full-Normal Native GenAI Module and Offline Fallback Runtime
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-genai-native-module-runtime.yml
      - ci/smoke-genai-native-protected-modules.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-protected-genai-imports:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPILED_SOURCE: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ORIGINAL_FULL_RUN: '40997075527'
      ORIGINAL_ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      MOZ_HEADLESS: '1'
    steps:
      - name: Checkout isolated QA harness and existing WebDriver utilities
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Reject fake module tests and verify untouched compiled GenAI source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/smoke-genai-native-protected-modules.py \
            ci/smoke-webextension-package-local.py
          python3 ci/smoke-genai-native-protected-modules.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_FULL_RUN" |
            jq -e --arg source "$COMPILED_SOURCE"               '.status=="completed" and .conclusion=="success" and .head_sha==$source' >/dev/null
          python3 - <<'PY'
          import subprocess
          blobs={
            "browser/components/genai/GenAI.sys.mjs":"d3fa80dbdf9fcdf6c1ee4bf8176012ea734415ce",
            "browser/components/genai/LinkPreview.sys.mjs":"deaead5da0781ec3fe74cfdc3d37d6db38290858",
            "browser/components/genai/PageAssist.sys.mjs":"5b58d90213748e97a82b96c036e289bce0628070",
            "browser/components/genai/GenAIParent.sys.mjs":"78ffcdac008ad9329cc8c10310e98c3535b2edb7",
            "browser/components/genai/GenAIChild.sys.mjs":"ff3ebf13c8780de43eee685f78e8aa9a8a92bad5",
            "browser/components/genai/LinkPreviewParent.sys.mjs":"88ba844c635e691ad6385e15826ec452d33e7e1b",
            "browser/components/genai/LinkPreviewChild.sys.mjs":"b81f09eec612421a783e3cb526909e1390e8a148",
            "browser/components/genai/PageAssistParent.sys.mjs":"2d921a71eb71052f64bb57d398fcaf4b5781b7e2",
            "browser/components/genai/PageAssistChild.sys.mjs":"5b4d83d383cf3d6b5b9ef0aec6c34665c71a9083",
          }
          for path,sha in blobs.items():
              actual=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              assert actual==sha,(path,"GenAI source changed since native compile")
          print("PASS: 9 source-backed GenAI module exports exactly match compiled full-normal source")
          PY
      - name: Retrieve exact successful full-Normandy Vulpra native archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normal"
          gh run download "$ORIGINAL_FULL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/normal"
          (cd "$RUNNER_TEMP/normal" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"normal"
          archive=root/"full-normandy-baseline.tar.xz"
          m=json.loads((root/"m3-full-normandy-baseline.json").read_text())
          assert m["schema_version"]==1
          assert m["source_commit"]==os.environ["COMPILED_SOURCE"]
          assert m["sha256"]==os.environ["ORIGINAL_ARCHIVE_SHA256"]==hashlib.sha256(archive.read_bytes()).hexdigest()
          assert m["compressed_bytes"]==archive.stat().st_size==87154544
          assert m["variant"]=="full-normandy" and m["normandy_runner_present"] is True
          assert m["required_newtab_modules_present"] is True
          print("PASS: full-normal physical native source/manifest/archive verified")
          PY
          mkdir -p .git/vulpra-native-build/packages
          cp "$RUNNER_TEMP/normal/full-normandy-baseline.tar.xz" \
             .git/vulpra-native-build/packages/vulpra-local-genai-native-ci.tar.xz
          (cd .git/vulpra-native-build/packages && \
             sha256sum vulpra-local-genai-native-ci.tar.xz > \
             vulpra-local-genai-native-ci.tar.xz.sha256)
      - name: Install only headless native browser runtime and pinned driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 \
            libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
      - name: Import real shipped GenAI, preview and Page Assist modules without provider requests
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP:$PATH" \
            python3 ci/smoke-genai-native-protected-modules.py "$GITHUB_WORKSPACE"
          jq -e \
            '.schema_version==1 and
             .status=="full_normal_native_protected_genai_modules_loaded" and
             .verified_archive_sha256==true and
             .private_home_and_profile_verified==true and
             .gecko_nonlocal_connections_disabled==true and
             (.protected_genai_module_imports|length)==9 and
             (.protected_genai_module_imports|all(.==true)) and
             .offline_null_page_data_returns_null==true and
             .chat_and_preview_preferences_unchanged==true and
             .ai_provider_or_model_called_by_probe==false and
             .signed_in_user_state_used==false and
             .linkpreview_or_genai_initialized_by_probe==false and
             .actual_chat_provider_or_page_assist_model_request_tested==false and
             .full_dynamic_genai_dependency_graph_proven==false and
             .source_removal_authorized==false and
             .new_whole_m3_gate_passed==false' \
            .git/vulpra-native-build/m3-full-normal-genai-modules.json >/dev/null
          echo 'PASS: 9 shipped GenAI modules and offline Page Assist null-input fallback, no AI API'
      - name: Preserve only module booleans and source identity, no user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-full-normal-native-genai-protected-modules
          path: .git/vulpra-native-build/m3-full-normal-genai-modules.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
