# Read-only pinned-source testing and locale graph. No compiler or deletion.
name: M3 Testing WebDriver and Localization Boundary Audit

on:
  push:
    branches: [main]
    paths:
      - ci/m3-testing-localization-boundaries.py
      - .github/workflows/m3-testing-localization-boundaries.yml
      - moz.build
      - browser/moz.build
      - browser/app.mozbuild
      - toolkit/moz.build
      - toolkit/toolkit.mozbuild
      - testing/moz.build
      - testing/marionette/moz.build
      - browser/locales/**
      - toolkit/locales/**
      - browser/installer/package-manifest.in
      - browser/l10n-registry.manifest
      - toolkit/l10n-registry.manifest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary-census:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sparse checkout audit script and pinned Git object tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci

      - name: Validate exact guarded sources and negative mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-testing-localization-boundaries.py
          python3 ci/m3-testing-localization-boundaries.py \
            --self-test --output "$RUNNER_TEMP/m3-testing-localization-boundaries.json"
          jq -e '
            .source_commit == env.GITHUB_SHA and
            .source_only == true and
            .removal_authorized == false and
            .native_runtime_tested == false and
            .compiled_package_savings_verified == false and
            (.boundaries | length) == 14 and
            .invalid_mutations_rejected == 17 and
            ([.boundaries[].id] | unique | length) == 14 and
            (all(.boundaries[]; (.evidence | length) >= 1))
          ' "$RUNNER_TEMP/m3-testing-localization-boundaries.json" >/dev/null

      - name: Upload bounded source-only map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-testing-localization-boundaries
          path: ${{ runner.temp }}/m3-testing-localization-boundaries.json
          if-no-files-found: warn
          retention-days: 14
