# Exercise exact original native pingsender with synthetic payload; no
# remote telemetry. Root netns creates lo only, no host/remote routes.
name: M3 Original Native pingsender No-Egress Loopback Activation
on:
  push:
    branches: [main]
    paths:
      - ci/m3-pingsender-loopback-netns.sh
      - ci/m3-pingsender-local-http-server.py
      - ci/m3-pingsender-version-reconcile.py
      - .github/workflows/m3-native-pingsender-loopback.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-pingsender-loopback:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      PACKAGE_RUN: '40997075527'
      STATIC_RUN: '41157293087'
      STATIC_HEAD: 184d5b33678152c1bd28b0c35cecc450e49c93f1
    steps:
      - name: Checkout isolated native pingsender and scope checks
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Reject synthetic bogus pingsender version and verify original run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-pingsender-loopback-netns.sh
          python3 -m py_compile ci/m3-pingsender-local-http-server.py ci/m3-pingsender-version-reconcile.py
          python3 ci/m3-pingsender-version-reconcile.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_RUN" |
            jq -e --arg sha "$STATIC_HEAD" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and
              .name=="M3 Source-Pinned Native ELF Version-Name Inventory"' >/dev/null
      - name: Install source-pinned pingsender runtime and network-namespace utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 libcurl4t64 binutils
          command -v unshare
          command -v ip
          command -v readelf
      - name: Authenticate and recover exact compiled original full-normal Vulpra archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/static" "$RUNNER_TEMP/package"
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          gh run download "$STATIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-version-name-contract --dir "$RUNNER_TEMP/static"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/vulpra/pingsender"
      - name: Real native gzip HTTP POST only inside loopback-only Linux namespace
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo unshare --net -- bash ci/m3-pingsender-loopback-netns.sh \
            "$RUNNER_TEMP/package/vulpra" \
            "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" \
            "$RUNNER_TEMP/m3-original-pingsender-local-activation.json" \
            "$GITHUB_WORKSPACE"
          jq -e --arg sha "$ARCHIVE_SHA" --arg src "$SOURCE_SHA" '
            .schema_version==1 and .original_native_source==$src and
            .original_native_archive_sha256==$sha and
            .original_pingsender_static_version_contracts==22 and
            .original_pingsender_static_version_checks_observed>0 and
            (.original_pingsender_static_version_checks_observed+
             .original_pingsender_static_version_checks_not_seen)==22 and
            .raw_loader_paths_and_pids_retained==false and
            .synthetic_payload_deleted_only_after_local_success==true and
            .real_telemetry_sent==false and
            .network_egress_allowed==false and
            .actual_symbol_bindings_proven==false and
            .safe_source_removal_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-original-pingsender-local-activation.json" >/dev/null
          echo 'PASS: source-pinned only-localhost pingsender transaction and original ABI version checks'
      - name: Upload only sanitized native pingsender no-egress test summary
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-pingsender-local-activation
          path: ${{ runner.temp }}/m3-original-pingsender-local-activation.json
          if-no-files-found: error
          retention-days: 14
