# Reuse a previously built, source-verified packaged browser, not a new Firefox build.
# This is a private pixman Weston/Wayland regression with observed loader denial.
name: M3 Graphical Wayland Provider Denial Replay (No Rebuild)

on:
  push:
    branches: [main]
    paths:
      - ci/m3-smoke-packaged-wayland-provider-denial.sh
      - .github/workflows/m3-wayland-provider-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vulpra-m3-wayland-provider-replay
  cancel-in-progress: false

jobs:
  graphical-provider-denial:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PINNED_NATIVE_RUN_ID: "42559566915"
      PINNED_NATIVE_SOURCE_SHA: "a17ac58d694bf77c4da352ed7ab9b37233fbc01e"
      PINNED_NATIVE_PACKAGE_SHA: "f92fe8c29843e7521ffe1ddd7cbbed8836ff9491228b182628973e8484ed1a41"
      PINNED_TEST_PACKAGE_ARTIFACT: "m3-test-only-native-package-not-for-release"
      VULPRA_M3_COMPILED_SOURCE_SHA: "a17ac58d694bf77c4da352ed7ab9b37233fbc01e"
    steps:
      - name: Checkout bounded Weston verifier, real graphical smoke and loader shim
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-smoke-packaged-wayland-provider-denial.sh
            ci/m3-deny-optional-native-providers.c
            packaging/test-wayland.sh

      - name: Install private Weston compositor and native browser host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends weston wayland-utils jq git curl \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          bash -n ci/m3-smoke-packaged-wayland-provider-denial.sh
          bash -n packaging/test-wayland.sh
          if bash ci/m3-smoke-packaged-wayland-provider-denial.sh >/dev/null 2>&1; then
            echo "FAIL: verifier accepted missing required inputs" >&2
            exit 1
          fi

      - name: Authenticate exact earlier native package and preserved runtime acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/wayland-replay-package"
          gh run download "$PINNED_NATIVE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$PINNED_TEST_PACKAGE_ARTIFACT" \
            --dir "$RUNNER_TEMP/wayland-replay-package"
          mapfile -t packages < <(find "$RUNNER_TEMP/wayland-replay-package" \
            -type f -name vulpra-local-m3-native-link-ci.tar.xz -print)
          mapfile -t reports < <(find "$RUNNER_TEMP/wayland-replay-package" \
            -type f -name m3-native-link-inputs.json -print)
          test "${#packages[@]}" -eq 1
          test "${#reports[@]}" -eq 1
          pkg="${packages[0]}"
          report="${reports[0]}"
          test -s "$pkg.sha256"
          (cd "$(dirname "$pkg")" && sha256sum -c "$(basename "$pkg").sha256")
          test "$(sha256sum "$pkg" | cut -d' ' -f1)" = "$PINNED_NATIVE_PACKAGE_SHA"
          jq -e --arg src "$PINNED_NATIVE_SOURCE_SHA" \
            --arg sha "$PINNED_NATIVE_PACKAGE_SHA" \
            --argjson run "$PINNED_NATIVE_RUN_ID" '
            .source_commit==$src and
            .package.package_sha256==$sha and
            .workflow_run_id==$run and
            .runtime_passed_after_link_audit==true and
            .packaging_transform_replay.deterministic_reproduction_verified==true
          ' "$report" >/dev/null
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$pkg" "$pkg.sha256" "$dest/"
          (cd "$dest" && sha256sum -c vulpra-local-m3-native-link-ci.tar.xz.sha256)
          echo "PASS: native source, checksum, package and prior runtime authenticated"

      - name: Measure actual private Weston graphical frames with GBM VAAPI FFmpeg denied
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            ci/m3-deny-optional-native-providers.c \
            -o "$RUNNER_TEMP/m3-deny-native-providers.so" -ldl
          bash ci/m3-smoke-packaged-wayland-provider-denial.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/m3-deny-native-providers.so" \
            "$RUNNER_TEMP/m3-packaged-wayland-provider-denial-runtime.json"
          jq -e --arg compiled "$PINNED_NATIVE_SOURCE_SHA" \
            --arg harness "$GITHUB_SHA" --arg archive "$PINNED_NATIVE_PACKAGE_SHA" '
            .schema_version==1 and
            .status=="actual_packaged_graphical_Weston_Wayland_optional_provider_denial_probe" and
            .native_source_commit==$compiled and
            .test_harness_commit==$harness and
            .verified_normal_packaged_archive_sha256==$archive and
            .actual_graphical_packaged_Vulpra_executed==true and
            .private_Weston_pixman_renderer_used==true and
            .non_MOZ_HEADLESS_Wayland_browser_verified==true and
            ([.scenarios[].provider_group]|sort)==["ffmpeg","gbm","vaapi"] and
            .three_graphical_frames_and_attach_witnesses_passed==true and
            .targeted_provider_calls_intercepted==([.scenarios[].targeted_optional_library_denial_events]|add) and
            .GPU_DMABuf_or_software_video_fallback_complete==false and
            .user_endeavouros_hyprland_qa_done==false and
            .host_system_libraries_modified==false and
            .user_normal_profile_or_credentials_used==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false and .release_ready==false
          ' "$RUNNER_TEMP/m3-packaged-wayland-provider-denial-runtime.json" >/dev/null
          echo "PASS: source-verified real Wayland buffer attach and commit measured in three graphical modes"
          echo "LIMIT: only logged matched library requests count as actual denial; pixman does not establish GPU/DMABuf fallback"

      - name: Preserve bounded graphical replay results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-pinned-graphical-wayland-provider-denial-evidence
          path: ${{ runner.temp }}/m3-packaged-wayland-provider-denial-runtime.json
          if-no-files-found: warn
          retention-days: 14
