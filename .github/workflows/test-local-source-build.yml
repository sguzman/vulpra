name: Test local source recovery and build safety

on:
  push:
    branches: [main]
    paths:
      - ci/vulpra-fetch-all.sh
      - ci/build-local.sh
      - ci/package-smoke-local.sh
      - ci/smoke-native-local.sh
      - ci/smoke-wayland-package-local.sh
      - ci/accept-native-package-local.py
      - ci/smoke-webextension-package-local.py
      - ci/m3-inventory-local.py
      - ci/sync-local-safe.sh
      - ci/m3-manifest-gates.sh
      - ci/m3-config-baseline-local.sh
      - ci/m3-package-footprint-local.py
      - ci/smoke-telemetry-loopback-package.py
      - ci/mozconfig-linux-normandy-experiment
      - browser/moz.configure
      - browser/components/BrowserComponents.manifest
      - toolkit/components/moz.build
      - docs/vulpra/DEBLOAT-CANDIDATES.json
      - docs/vulpra/DEBLOAT.md
      - ci/tests/**
      - packaging/**
      - .github/workflows/test-local-source-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Fetch only the tiny CI scripts, not the giant Firefox source tree.
      - name: Check out CI scripts using a sparse partial checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
            packaging
            docs/vulpra
          sparse-checkout-cone-mode: true

      - name: Check Bash syntax
        run: |
          bash -n ci/vulpra-fetch-all.sh
          bash -n ci/build-local.sh
          bash -n ci/package-smoke-local.sh
          bash -n ci/smoke-native-local.sh
          bash -n ci/smoke-wayland-package-local.sh
          bash -n ci/tests/vulpra-fetch-all-test.sh
          bash -n ci/tests/build-local-test.sh
          bash -n ci/tests/package-smoke-local-test.sh
          bash -n ci/tests/smoke-native-local-test.sh
          bash -n ci/tests/smoke-wayland-package-local-test.sh
          bash -n ci/tests/accept-native-package-local-test.sh
          bash -n ci/tests/smoke-webextension-package-local-test.sh
          bash -n ci/tests/m3-inventory-local-test.sh
          bash -n ci/sync-local-safe.sh
          bash -n ci/m3-manifest-gates.sh
          bash -n ci/m3-config-baseline-local.sh
          bash -n ci/tests/m3-config-baseline-test.sh
          bash -n ci/tests/m3-package-footprint-test.sh
          bash -n ci/tests/m3-normandy-optout-test.sh
          bash -n ci/tests/m3-asrouter-promos-optout-test.sh
          python3 -m py_compile ci/m3-package-footprint-local.py
          bash -n ci/tests/sync-local-safe-test.sh
          python3 -m py_compile ci/accept-native-package-local.py
          python3 -m py_compile ci/smoke-webextension-package-local.py
          python3 -m py_compile ci/m3-inventory-local.py

      - name: Test restart-safe source retrieval
        run: bash ci/tests/vulpra-fetch-all-test.sh "$PWD/ci/vulpra-fetch-all.sh"

      - name: Test guarded local native build runner
        run: bash ci/tests/build-local-test.sh "$PWD/ci/build-local.sh"

      - name: Test local package staging and isolated smoke runner
        run: bash ci/tests/package-smoke-local-test.sh "$PWD/ci/package-smoke-local.sh" "$PWD/packaging"

      - name: Test no-rebuild native startup probe
        run: bash ci/tests/smoke-native-local-test.sh "$PWD/ci/smoke-native-local.sh"

      - name: Test standalone packaged graphical Wayland probe
        run: bash ci/tests/smoke-wayland-package-local-test.sh "$PWD/ci/smoke-wayland-package-local.sh"

      - name: Test packaged navigation, JavaScript and baseline probe
        run: bash ci/tests/accept-native-package-local-test.sh "$PWD/ci/accept-native-package-local.py"

      - name: Test WebExtension package and WebDriver fixtures
        run: bash ci/tests/smoke-webextension-package-local-test.sh "$PWD/ci/smoke-webextension-package-local.py"

      - name: Test read-only M3 pinned source inventory
        run: bash ci/tests/m3-inventory-local-test.sh "$PWD/ci/m3-inventory-local.py"

      - name: Test guarded pinned-workstation Git synchronization
        run: bash ci/tests/sync-local-safe-test.sh "$PWD/ci/sync-local-safe.sh"

      - name: Verify actual Git HEAD build manifest gates without compiling
        run: bash ci/m3-manifest-gates.sh "$PWD"

      - name: Test read-only target configuration flag reader
        run: bash ci/tests/m3-config-baseline-test.sh "$PWD/ci/m3-config-baseline-local.sh"

      - name: Test read-only archived Vulpra resource census
        run: bash ci/tests/m3-package-footprint-test.sh "$PWD/ci/m3-package-footprint-local.py"

      - name: Test opt-in Normandy packaging and manifest conditionals
        run: bash ci/tests/m3-normandy-optout-test.sh "$PWD"

      - name: Test isolated ASRouter promotion resource opt-out
        run: bash ci/tests/m3-asrouter-promos-optout-test.sh "$PWD"

      - name: Test isolated telemetry loopback receiver and evidence rejection
        run: |
          python3 -m py_compile ci/smoke-telemetry-loopback-package.py
          python3 ci/tests/m3-telemetry-loopback-harness-test.py

      - name: Validate source-pinned AdsFeed paired evidence and variation
        run: python3 ci/tests/m3-adsfeed-evidence-ledger-test.py

      - name: Validate native PromoCard paired evidence and reject inflation
        run: python3 ci/tests/m3-promocard-native-ledger-test.py

      - name: Validate classified M3 candidate register
        run: |
          jq -e '
            .schema_version == 1 and
            (.candidates | length) >= 10 and
            ((.candidates | map(.id) | unique | length) == (.candidates | length)) and
            (all(.candidates[]; (.evidence | length > 0) and (.paths | length > 0) and (.next | length > 0))) and
            ([.candidates[] | select(.decision == "protected")] | length >= 2) and
            (all(.candidates[]; .decision != "remove_now"))
          ' docs/vulpra/DEBLOAT-CANDIDATES.json
