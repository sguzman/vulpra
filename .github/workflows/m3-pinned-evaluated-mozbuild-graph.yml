# Genuine configured Mozilla moz.build frontend emits actual graph from a single
# pinned Vulpra source with two separate candidate objdirs. No full compile.
# The std-only wrapper cannot replace Mozilla's own Python BuildReader API.
name: M3 Pinned Actual Evaluated Full Versus Combined Build Frontend
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-pinned-evaluated-mozbuild-graph.yml
      - ci/m3-pinned-evaluated-mozbuild-graph.py
      - ci/m3-compare-generated-backend.sh
      - ci/m3-compare-generated-makefiles.sh
      - ci/m3-compare-faster-install-manifests.sh
      - ci/m3-compare-compile-db.sh
      - ci/m3-compare-faster-manifest-entries.sh
      - ci/m3-compare-gkrust-resolve.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vulpra-m3-pinned-evaluated-mozbuild-frontend
  cancel-in-progress: false
jobs:
  original-native-configured-full-versus-combined-frontend:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      DEBIAN_FRONTEND: noninteractive
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Checkout exact immutable native compiled original browser source
        uses: actions/checkout@v4
        with:
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          fetch-depth: 1
          path: original
      - name: Checkout only bounded current graph observer and source-matched mozconfigs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controls
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-pinned-evaluated-mozbuild-graph.py
            ci/m3-compare-generated-backend.sh
            ci/m3-compare-generated-makefiles.sh
            ci/m3-compare-faster-install-manifests.sh
            ci/m3-compare-compile-db.sh
            ci/m3-compare-faster-manifest-entries.sh
            ci/m3-compare-gkrust-resolve.sh
            ci/mozconfig-linux-m3-baseline
            ci/mozconfig-linux-m3-combined-lean
            browser/moz.configure
      - name: Authenticate unchanged original source config and isolated build controls
        shell: bash
        working-directory: original
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C ../controls rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object browser/moz.configure)" = "$(git -C ../controls hash-object browser/moz.configure)"
          test "$(git hash-object ci/mozconfig-linux-m3-baseline)" = "$(git -C ../controls hash-object ci/mozconfig-linux-m3-baseline)"
          python3 -m py_compile ../controls/ci/m3-pinned-evaluated-mozbuild-graph.py
          bash -n ../controls/ci/m3-compare-generated-backend.sh
          bash -n ../controls/ci/m3-compare-generated-makefiles.sh
          bash -n ../controls/ci/m3-compare-faster-install-manifests.sh
          bash -n ../controls/ci/m3-compare-compile-db.sh
          bash -n ../controls/ci/m3-compare-faster-manifest-entries.sh
          bash -n ../controls/ci/m3-compare-gkrust-resolve.sh
          # No user's computer nor browser profile is in this CI workflow.
          mkdir -p "$RUNNER_TEMP/m3-generated-frontend"
      - name: Bootstrap same pinned Firefox 159 Linux native configure toolchain
        shell: bash
        working-directory: original
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends python3 python3-venv python3-dev git curl make jq
          ./mach --no-interactive bootstrap --application-choice browser
      - name: Configure original full-normal browser and collect genuine emitted frontend objects
        shell: bash
        working-directory: original
        timeout-minutes: 14
        env:
          MOZCONFIG: ${{ github.workspace }}/controls/ci/mozconfig-linux-m3-baseline
        run: |
          set -euo pipefail
          ./mach configure
          test -f obj-vulpra-linux-m3-baseline/config.status
          ./mach python ../controls/ci/m3-pinned-evaluated-mozbuild-graph.py \
            normal obj-vulpra-linux-m3-baseline/config.status \
            "$RUNNER_TEMP/m3-generated-frontend/full-normal-evaluated.json"
      - name: Configure four guarded native omissions and collect genuine emitted frontend objects
        shell: bash
        working-directory: original
        timeout-minutes: 14
        env:
          MOZCONFIG: ${{ github.workspace }}/controls/ci/mozconfig-linux-m3-combined-lean
        run: |
          set -euo pipefail
          ./mach configure
          test -f obj-vulpra-linux-m3-combined-lean/config.status
          ./mach python ../controls/ci/m3-pinned-evaluated-mozbuild-graph.py \
            combined_four obj-vulpra-linux-m3-combined-lean/config.status \
            "$RUNNER_TEMP/m3-generated-frontend/combined-four-evaluated.json"
      - name: Independently reconcile generated full and combined directory edges and emitted object types
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile f "$RUNNER_TEMP/m3-generated-frontend/full-normal-evaluated.json" \
            --slurpfile l "$RUNNER_TEMP/m3-generated-frontend/combined-four-evaluated.json" '
            ($f[0]) as $a | ($l[0]) as $b |
            (($a.directory_edges|map(join(" -> "))) -
             ($b.directory_edges|map(join(" -> ")))) as $full_only |
            (($b.directory_edges|map(join(" -> "))) -
             ($a.directory_edges|map(join(" -> ")))) as $lean_only |
            ($a.actual_evaluated_compile_source_inputs -
             $b.actual_evaluated_compile_source_inputs) as $full_only_compile_sources |
            ($b.actual_evaluated_compile_source_inputs -
             $a.actual_evaluated_compile_source_inputs) as $lean_only_compile_sources |
             ($a.actual_evaluated_linkable_nodes -
              $b.actual_evaluated_linkable_nodes) as $full_only_linkable_nodes |
             ($b.actual_evaluated_linkable_nodes -
              $a.actual_evaluated_linkable_nodes) as $lean_only_linkable_nodes |
             ($a.actual_evaluated_rust_library_targets -
              $b.actual_evaluated_rust_library_targets) as $full_only_rust_targets |
             ($b.actual_evaluated_rust_library_targets -
              $a.actual_evaluated_rust_library_targets) as $lean_only_rust_targets |
             ($a.actual_evaluated_rust_program_targets -
              $b.actual_evaluated_rust_program_targets) as $full_only_rust_programs |
             ($b.actual_evaluated_rust_program_targets -
              $a.actual_evaluated_rust_program_targets) as $lean_only_rust_programs |
             ($a.actual_evaluated_rust_program_features -
              $b.actual_evaluated_rust_program_features) as $full_only_rust_program_features |
             ($b.actual_evaluated_rust_program_features -
              $a.actual_evaluated_rust_program_features) as $lean_only_rust_program_features |
             ($a.actual_evaluated_rust_library_features -
              $b.actual_evaluated_rust_library_features) as $full_only_rust_features |
             ($b.actual_evaluated_rust_library_features -
              $a.actual_evaluated_rust_library_features) as $lean_only_rust_features |
             ($a.actual_evaluated_rust_library_dependencies -
              $b.actual_evaluated_rust_library_dependencies) as $full_only_rust_dependencies |
             ($b.actual_evaluated_rust_library_dependencies -
              $a.actual_evaluated_rust_library_dependencies) as $lean_only_rust_dependencies |
             ($a.actual_evaluated_linkable_compile_units -
              $b.actual_evaluated_linkable_compile_units) as $full_only_compile_owners |
             ($b.actual_evaluated_linkable_compile_units -
              $a.actual_evaluated_linkable_compile_units) as $lean_only_compile_owners |
             ($a.actual_evaluated_unified_source_members -
              $b.actual_evaluated_unified_source_members) as $full_only_unified_source_members |
             ($b.actual_evaluated_unified_source_members -
              $a.actual_evaluated_unified_source_members) as $lean_only_unified_source_members |
             ($a.actual_evaluated_webidl_binding_units -
              $b.actual_evaluated_webidl_binding_units) as $full_only_webidl_units |
             ($b.actual_evaluated_webidl_binding_units -
              $a.actual_evaluated_webidl_binding_units) as $lean_only_webidl_units |
             ($a.actual_evaluated_webidl_unified_members -
              $b.actual_evaluated_webidl_unified_members) as $full_only_webidl_members |
             ($b.actual_evaluated_webidl_unified_members -
              $a.actual_evaluated_webidl_unified_members) as $lean_only_webidl_members |
             ($a.actual_evaluated_library_link_edges -
              $b.actual_evaluated_library_link_edges) as $full_only_link_edges |
             ($b.actual_evaluated_library_link_edges -
              $a.actual_evaluated_library_link_edges) as $lean_only_link_edges |
             ($a.actual_evaluated_system_library_links -
              $b.actual_evaluated_system_library_links) as $full_only_system_links |
             ($b.actual_evaluated_system_library_links -
              $a.actual_evaluated_system_library_links) as $lean_only_system_links |
             ($a.actual_evaluated_static_link_into -
              $b.actual_evaluated_static_link_into) as $full_only_static_link_into |
             ($b.actual_evaluated_static_link_into -
              $a.actual_evaluated_static_link_into) as $lean_only_static_link_into |
            ($a.actual_evaluated_jar_manifest_inputs -
             $b.actual_evaluated_jar_manifest_inputs) as $full_only_jars |
            ($b.actual_evaluated_jar_manifest_inputs -
             $a.actual_evaluated_jar_manifest_inputs) as $lean_only_jars |
            ($a.actual_evaluated_install_resource_inputs -
             $b.actual_evaluated_install_resource_inputs) as $full_only_install_inputs |
            ($b.actual_evaluated_install_resource_inputs -
             $a.actual_evaluated_install_resource_inputs) as $lean_only_install_inputs |
            {
              schema_version:1,
              status:"exact_original_source_generated_full_vs_four_optin_frontend_evaluated",
              source_commit:$a.original_source_commit,
              actual_mozilla_BuildReader_and_TreeMetadataEmitter_executed:true,
              normal_evaluated_objects:$a.emitted_object_count,
              combined_evaluated_objects:$b.emitted_object_count,
              full_directory_edges:$a.evaluated_directory_edges,
              combined_directory_edges:$b.evaluated_directory_edges,
              full_only_evaluated_directory_edges:$full_only,
              combined_only_evaluated_directory_edges:$lean_only,
              full_evaluated_compile_source_count:$a.actual_evaluated_compile_source_input_count,
              combined_evaluated_compile_source_count:$b.actual_evaluated_compile_source_input_count,
              full_only_evaluated_compile_sources:$full_only_compile_sources,
              combined_only_evaluated_compile_sources:$lean_only_compile_sources,
              full_evaluated_rust_program_target_count:$a.actual_evaluated_rust_program_target_count,
              combined_evaluated_rust_program_target_count:$b.actual_evaluated_rust_program_target_count,
              full_evaluated_rust_program_feature_count:$a.actual_evaluated_rust_program_feature_count,
              combined_evaluated_rust_program_feature_count:$b.actual_evaluated_rust_program_feature_count,
              full_only_evaluated_rust_program_targets:$full_only_rust_programs,
              combined_only_evaluated_rust_program_targets:$lean_only_rust_programs,
              full_only_evaluated_rust_program_features:$full_only_rust_program_features,
              combined_only_evaluated_rust_program_features:$lean_only_rust_program_features,
              full_evaluated_rust_library_target_count:$a.actual_evaluated_rust_library_target_count,
              combined_evaluated_rust_library_target_count:$b.actual_evaluated_rust_library_target_count,
              full_evaluated_rust_library_feature_count:$a.actual_evaluated_rust_library_feature_count,
              combined_evaluated_rust_library_feature_count:$b.actual_evaluated_rust_library_feature_count,
              full_evaluated_rust_library_dependency_count:$a.actual_evaluated_rust_library_dependency_count,
              combined_evaluated_rust_library_dependency_count:$b.actual_evaluated_rust_library_dependency_count,
              full_only_evaluated_rust_library_targets:$full_only_rust_targets,
              combined_only_evaluated_rust_library_targets:$lean_only_rust_targets,
              full_only_evaluated_rust_library_features:$full_only_rust_features,
              combined_only_evaluated_rust_library_features:$lean_only_rust_features,
              full_only_evaluated_rust_library_dependencies:$full_only_rust_dependencies,
              combined_only_evaluated_rust_library_dependencies:$lean_only_rust_dependencies,
              cargo_resolved_dependency_graph_proven:false,
              rustc_invocation_or_rust_linker_executed:false,
              full_evaluated_linkable_node_count:$a.actual_evaluated_linkable_node_count,
              combined_evaluated_linkable_node_count:$b.actual_evaluated_linkable_node_count,
              full_only_evaluated_linkable_nodes:$full_only_linkable_nodes,
              combined_only_evaluated_linkable_nodes:$lean_only_linkable_nodes,
              full_evaluated_webidl_binding_unit_count:$a.actual_evaluated_webidl_binding_unit_count,
              combined_evaluated_webidl_binding_unit_count:$b.actual_evaluated_webidl_binding_unit_count,
              full_only_evaluated_webidl_units:$full_only_webidl_units,
              combined_only_evaluated_webidl_units:$lean_only_webidl_units,
              full_evaluated_webidl_unified_member_count:$a.actual_evaluated_webidl_unified_member_count,
              combined_evaluated_webidl_unified_member_count:$b.actual_evaluated_webidl_unified_member_count,
              full_only_evaluated_webidl_unified_members:$full_only_webidl_members,
              combined_only_evaluated_webidl_unified_members:$lean_only_webidl_members,
              full_unresolved_nonunified_linkable_unit_count:$a.unresolved_nonunified_linkable_unit_count,
              combined_unresolved_nonunified_linkable_unit_count:$b.unresolved_nonunified_linkable_unit_count,
              full_unmatched_webidl_linkable_units:$a.unmatched_webidl_linkable_units,
              combined_unmatched_webidl_linkable_units:$b.unmatched_webidl_linkable_units,
              webidl_codegen_executed:false,
              full_evaluated_unified_source_member_count:$a.actual_evaluated_unified_source_member_count,
              combined_evaluated_unified_source_member_count:$b.actual_evaluated_unified_source_member_count,
              full_evaluated_unified_generated_unit_count:$a.actual_evaluated_unified_generated_unit_count,
              combined_evaluated_unified_generated_unit_count:$b.actual_evaluated_unified_generated_unit_count,
              full_only_evaluated_unified_source_members:$full_only_unified_source_members,
              combined_only_evaluated_unified_source_members:$lean_only_unified_source_members,
              full_unresolved_unified_linkable_unit_count:$a.unresolved_unified_linkable_unit_count,
              combined_unresolved_unified_linkable_unit_count:$b.unresolved_unified_linkable_unit_count,
              full_unmatched_unified_linkable_units:$a.unmatched_unified_linkable_units,
              combined_unmatched_unified_linkable_units:$b.unmatched_unified_linkable_units,
              full_evaluated_linkable_compile_unit_count:$a.actual_evaluated_linkable_compile_unit_count,
              combined_evaluated_linkable_compile_unit_count:$b.actual_evaluated_linkable_compile_unit_count,
              full_only_evaluated_linkable_compile_units:$full_only_compile_owners,
              combined_only_evaluated_linkable_compile_units:$lean_only_compile_owners,
              full_unresolved_relative_compile_units:$a.unresolved_relative_linkable_compile_unit_count,
              combined_unresolved_relative_compile_units:$b.unresolved_relative_linkable_compile_unit_count,
              declared_compile_owner_is_linker_object_proof:false,
              full_evaluated_library_link_edge_count:$a.actual_evaluated_library_link_edge_count,
              combined_evaluated_library_link_edge_count:$b.actual_evaluated_library_link_edge_count,
              full_only_evaluated_library_link_edges:$full_only_link_edges,
              combined_only_evaluated_library_link_edges:$lean_only_link_edges,
              full_evaluated_system_library_link_count:$a.actual_evaluated_system_library_link_count,
              combined_evaluated_system_library_link_count:$b.actual_evaluated_system_library_link_count,
              full_only_evaluated_system_library_links:$full_only_system_links,
              combined_only_evaluated_system_library_links:$lean_only_system_links,
              full_evaluated_static_link_into_count:$a.actual_evaluated_static_link_into_count,
              combined_evaluated_static_link_into_count:$b.actual_evaluated_static_link_into_count,
              full_only_evaluated_static_link_into:$full_only_static_link_into,
              combined_only_evaluated_static_link_into:$lean_only_static_link_into,
              actual_linker_commands_executed:false,
              actual_linker_flag_and_object_equivalence_proven:false,
              compiled_linker_input_closure_proven:false,
              full_evaluated_jar_manifest_count:$a.actual_evaluated_jar_manifest_count,
              combined_evaluated_jar_manifest_count:$b.actual_evaluated_jar_manifest_count,
              full_only_evaluated_jar_manifests:$full_only_jars,
              combined_only_evaluated_jar_manifests:$lean_only_jars,
              full_evaluated_install_resource_input_count:$a.actual_evaluated_install_resource_input_count,
              combined_evaluated_install_resource_input_count:$b.actual_evaluated_install_resource_input_count,
              full_only_evaluated_install_resource_inputs:$full_only_install_inputs,
              combined_only_evaluated_install_resource_inputs:$lean_only_install_inputs,
              full_noncanonical_install_resource_members:$a.noncanonical_install_resource_members,
              combined_noncanonical_install_resource_members:$b.noncanonical_install_resource_members,
              full_unexpanded_install_glob_inputs:$a.unexpanded_glob_install_input_count,
              combined_unexpanded_install_glob_inputs:$b.unexpanded_glob_install_input_count,
              objdir_nested_source_reconciliation:true,
              jar_manifest_entries_parsed:false,
              compiled_resource_installation_proven:false,
              normal_generated_flag_values:$a.generated_configure_flag_values,
              combined_generated_flag_values:$b.generated_configure_flag_values,
              full_object_type_counts:$a.all_emitted_object_type_counts,
              combined_object_type_counts:$b.all_emitted_object_type_counts,
              full_scoped_type_counts:$a.scoped_emitted_type_counts,
              combined_scoped_type_counts:$b.scoped_emitted_type_counts,
              full_native_linker_executed:false,
              combined_native_linker_executed:false,
              complete_build_link_ffi_dlopen_graph:false,
              source_pruning_authorized:false,
              m3_sixth_gate_closed:false
            }' > "$RUNNER_TEMP/m3-generated-frontend/frontend-delta-summary.json"
          jq -e --arg sha "$SOURCE_SHA" '
             .status=="exact_original_source_generated_full_vs_four_optin_frontend_evaluated" and
             .source_commit==$sha and
             .actual_mozilla_BuildReader_and_TreeMetadataEmitter_executed==true and
             .normal_evaluated_objects>500 and .combined_evaluated_objects>500 and
             .full_directory_edges>200 and .combined_directory_edges>200 and
             .full_evaluated_compile_source_count>500 and
             .combined_evaluated_compile_source_count>500 and
             .full_evaluated_rust_library_target_count>0 and
             .combined_evaluated_rust_library_target_count>0 and
             .cargo_resolved_dependency_graph_proven==false and
             .rustc_invocation_or_rust_linker_executed==false and
             .full_evaluated_linkable_node_count>500 and
             .combined_evaluated_linkable_node_count>500 and
             .full_evaluated_webidl_binding_unit_count>0 and
             .combined_evaluated_webidl_binding_unit_count>0 and
             .webidl_codegen_executed==false and
             .full_evaluated_unified_source_member_count>100 and
             .combined_evaluated_unified_source_member_count>100 and
             .full_evaluated_unified_generated_unit_count>0 and
             .combined_evaluated_unified_generated_unit_count>0 and
             .full_evaluated_linkable_compile_unit_count>500 and
             .combined_evaluated_linkable_compile_unit_count>500 and
             .declared_compile_owner_is_linker_object_proof==false and
             .full_evaluated_library_link_edge_count>0 and
             .combined_evaluated_library_link_edge_count>0 and
             .actual_linker_commands_executed==false and
             .actual_linker_flag_and_object_equivalence_proven==false and
             .compiled_linker_input_closure_proven==false and
             .full_evaluated_jar_manifest_count>0 and
             .combined_evaluated_jar_manifest_count>0 and
             .full_evaluated_install_resource_input_count>0 and
             .combined_evaluated_install_resource_input_count>0 and
             .full_unexpanded_install_glob_inputs>=0 and
             .combined_unexpanded_install_glob_inputs>=0 and
             .objdir_nested_source_reconciliation==true and
             .jar_manifest_entries_parsed==false and
             .compiled_resource_installation_proven==false and
             .normal_generated_flag_values.MOZ_NORMANDY.value=="1" and
             .combined_generated_flag_values.VULPRA_NO_ASROUTER_PROMOS.value=="1" and
             .combined_generated_flag_values.VULPRA_NO_NEWTAB_ADSFEED.value=="1" and
             .combined_generated_flag_values.VULPRA_NO_NEWTAB_PROMOCARD.value=="1" and
             .complete_build_link_ffi_dlopen_graph==false and
             .source_pruning_authorized==false and .m3_sixth_gate_closed==false' \
             "$RUNNER_TEMP/m3-generated-frontend/frontend-delta-summary.json" >/dev/null
          jq -c '{
            emitted_compile_sources:[.full_evaluated_compile_source_count,.combined_evaluated_compile_source_count],
            declared_link_nodes:[.full_evaluated_linkable_node_count,.combined_evaluated_linkable_node_count],
            rust_program_targets:[.full_evaluated_rust_program_target_count,.combined_evaluated_rust_program_target_count],
            differing_rust_programs:[(.full_only_evaluated_rust_program_targets|length),(.combined_only_evaluated_rust_program_targets|length)],
            differing_rust_program_features:[(.full_only_evaluated_rust_program_features|length),(.combined_only_evaluated_rust_program_features|length)],
            rust_library_targets:[.full_evaluated_rust_library_target_count,.combined_evaluated_rust_library_target_count],
            rust_direct_cargo_deps:[.full_evaluated_rust_library_dependency_count,.combined_evaluated_rust_library_dependency_count],
            differing_rust_targets:[(.full_only_evaluated_rust_library_targets|length),(.combined_only_evaluated_rust_library_targets|length)],
            differing_rust_features:[(.full_only_evaluated_rust_library_features|length),(.combined_only_evaluated_rust_library_features|length)],
            differing_rust_deps:[(.full_only_evaluated_rust_library_dependencies|length),(.combined_only_evaluated_rust_library_dependencies|length)],
            webidl_binding_units:[.full_evaluated_webidl_binding_unit_count,.combined_evaluated_webidl_binding_unit_count],
            webidl_unified_members:[.full_evaluated_webidl_unified_member_count,.combined_evaluated_webidl_unified_member_count],
            unmatched_webidl_units:[(.full_unmatched_webidl_linkable_units|length),(.combined_unmatched_webidl_linkable_units|length)],
            differing_webidl_units:[(.full_only_evaluated_webidl_units|length),(.combined_only_evaluated_webidl_units|length)],
            unified_source_members:[.full_evaluated_unified_source_member_count,.combined_evaluated_unified_source_member_count],
            unified_generated_units:[.full_evaluated_unified_generated_unit_count,.combined_evaluated_unified_generated_unit_count],
            unmatched_unified_units:[(.full_unmatched_unified_linkable_units|length),(.combined_unmatched_unified_linkable_units|length)],
            differing_unified_source_members:[(.full_only_evaluated_unified_source_members|length),(.combined_only_evaluated_unified_source_members|length)],
            linkable_compile_units:[.full_evaluated_linkable_compile_unit_count,.combined_evaluated_linkable_compile_unit_count],
            differing_compile_owners:[(.full_only_evaluated_linkable_compile_units|length),(.combined_only_evaluated_linkable_compile_units|length)],
            unresolved_relative_compile_units:[.full_unresolved_relative_compile_units,.combined_unresolved_relative_compile_units],
            declared_link_edges:[.full_evaluated_library_link_edge_count,.combined_evaluated_library_link_edge_count],
            differing_link_edges:[(.full_only_evaluated_library_link_edges|length),(.combined_only_evaluated_library_link_edges|length)],
            differing_compile_sources:[(.full_only_evaluated_compile_sources|length),(.combined_only_evaluated_compile_sources|length)],
            jar_manifests:[.full_evaluated_jar_manifest_count,.combined_evaluated_jar_manifest_count],
            installer_inputs:[.full_evaluated_install_resource_input_count,.combined_evaluated_install_resource_input_count],
            differing_jar_inputs:[(.full_only_evaluated_jar_manifests|length),(.combined_only_evaluated_jar_manifests|length)],
            differing_installer_inputs:[(.full_only_evaluated_install_resource_inputs|length),(.combined_only_evaluated_install_resource_inputs|length)],
            unexpanded_globs:[.full_unexpanded_install_glob_inputs,.combined_unexpanded_install_glob_inputs],
            package_proven:.compiled_resource_installation_proven
          }' "$RUNNER_TEMP/m3-generated-frontend/frontend-delta-summary.json"
          echo 'PASS: both pinned configured original Mozilla frontend object/DirectoryTraversal and resource-input graphs emitted'
      - name: Compare actual original-source generated RecursiveMake backend.mk files
        shell: bash
        working-directory: original
        timeout-minutes: 12
        run: |
          set -euo pipefail
          bash ../controls/ci/m3-compare-generated-backend.sh \
            obj-vulpra-linux-m3-baseline \
            obj-vulpra-linux-m3-combined-lean \
            "$RUNNER_TEMP/m3-generated-frontend/generated-backend-mk-delta.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .status=="actual_mozilla_generated_recursive_make_backend_mk_compared" and
            .original_source_commit==$sha and
            .normal_generated_backend_mk_files>500 and
            .combined_generated_backend_mk_files>500 and
            .shared_generated_backend_mk_files>500 and
            (.identical_normalized_backend_mk_files +
             .differing_normalized_backend_mk_files) ==
               .shared_generated_backend_mk_files and
            .actual_recursive_make_backend_files_read==true and
            .exactly_two_expected_backend_define_deltas_exhaust_all_differences==true and
            .generated_makefile_or_link_command_fully_compared==false and
            .native_compile_or_link_executed==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-generated-frontend/generated-backend-mk-delta.json" >/dev/null
      - name: Compare actual original-source generated RecursiveMake Makefile contents
        shell: bash
        working-directory: original
        timeout-minutes: 12
        run: |
          set -euo pipefail
          bash ../controls/ci/m3-compare-generated-makefiles.sh \
            obj-vulpra-linux-m3-baseline \
            obj-vulpra-linux-m3-combined-lean \
            "$RUNNER_TEMP/m3-generated-frontend/generated-makefile-delta.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .status=="original_source_actual_generated_makefile_comparison" and
            .original_source_commit==$sha and
            .normal_generated_makefile_count>500 and
            .combined_generated_makefile_count>500 and
            .shared_generated_makefile_count>500 and
            (.identical_normalized_makefile_count +
              .differing_normalized_makefile_count ==
              .shared_generated_makefile_count) and
            .actual_generated_makefile_contents_hashed==true and
            .only_faster_makefile_differs==true and
            .only_faster_makefile_differs==true and
            .exactly_four_expected_faster_makefile_token_deltas==true and
            .full_generated_faster_makefile_reconciles_after_expected_only==true and
            (.differing_makefile_variable_names|type)=="array" and
            (.full_only_acdefines|type)=="array" and
            (.combined_only_acdefines|type)=="array" and
            .make_recipe_execution_or_expansion_proven==false and
            .native_compiler_or_linker_executed==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-generated-frontend/generated-makefile-delta.json" >/dev/null
      - name: Compare actual FasterMake generated install manifests with no packaging claims
        shell: bash
        working-directory: original
        timeout-minutes: 7
        run: |
          set -euo pipefail
          bash ../controls/ci/m3-compare-faster-install-manifests.sh \
            obj-vulpra-linux-m3-baseline \
            obj-vulpra-linux-m3-combined-lean \
            "$RUNNER_TEMP/m3-generated-frontend/generated-faster-install-manifests.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .status=="actual_source_matched_faster_generated_install_manifests" and
            .source_commit==$sha and
            .full_generated_install_manifest_count>0 and
            .combined_generated_install_manifest_count>0 and
            .manifest_files_are_actual_generated_files==true and
            .manifest_entry_semantics_parsed==false and
            .installed_package_contents_proven==false and
            .actual_compiler_or_linker_executed==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-generated-frontend/generated-faster-install-manifests.json" >/dev/null
      - name: Reconcile actual source-pinned changed FasterMake manifest records
        shell: bash
        working-directory: original
        timeout-minutes: 8
        run: |
          set -euo pipefail
          bash ../controls/ci/m3-compare-faster-manifest-entries.sh \
            obj-vulpra-linux-m3-baseline \
            obj-vulpra-linux-m3-combined-lean \
            "$RUNNER_TEMP/m3-generated-frontend/generated-faster-install-manifests.json" \
            "$RUNNER_TEMP/m3-generated-frontend/faster-manifest-entry-delta.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .status=="pinned_mozilla_faster_manifest_serialized_entry_delta" and
            .original_source_commit==$sha and
            .exact_three_changed_manifest_files_compared==true and
            (.shared_changed_manifest_entry_summaries|length)==3 and
            .actual_serialized_manifest_v5_records_read==true and
            .manifest_pattern_entries_expanded==false and
            .installed_browser_package_files_compared==false and
            .native_compiler_or_linker_executed==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-generated-frontend/faster-manifest-entry-delta.json" >/dev/null
      - name: Generate and compare Mozilla declared C/C++ compiler commands without compiling
        shell: bash
        working-directory: original
        timeout-minutes: 22
        run: |
          set -euo pipefail
          MOZCONFIG="$GITHUB_WORKSPACE/controls/ci/mozconfig-linux-m3-baseline" \
            ./mach build-backend -b CompileDB
          test -s obj-vulpra-linux-m3-baseline/compile_commands.json
          MOZCONFIG="$GITHUB_WORKSPACE/controls/ci/mozconfig-linux-m3-combined-lean" \
            ./mach build-backend -b CompileDB
          test -s obj-vulpra-linux-m3-combined-lean/compile_commands.json
          bash ../controls/ci/m3-compare-compile-db.sh \
            obj-vulpra-linux-m3-baseline \
            obj-vulpra-linux-m3-combined-lean \
            "$RUNNER_TEMP/m3-generated-frontend/compile-command-declarations.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .status=="pinned_configured_mozilla_compiledb_command_declarations_compared" and
            .source_commit==$sha and
            .normal_compiler_command_entries>500 and
            .combined_compiler_command_entries>500 and
            .compiler_commands_generated_but_not_executed==true and
            .complete_raw_compile_commands_archived==false and
            .actual_compiler_or_linker_executed==false and
            .rustc_and_linker_command_closure_proven==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-generated-frontend/compile-command-declarations.json" >/dev/null
      - name: Resolve actual emitted gkrust Cargo features offline against pinned vendored lockfile
        shell: bash
        working-directory: original
        timeout-minutes: 22
        run: |
          set -euo pipefail
          bash ../controls/ci/m3-compare-gkrust-resolve.sh \
            "$RUNNER_TEMP/m3-generated-frontend/full-normal-evaluated.json" \
            "$RUNNER_TEMP/m3-generated-frontend/combined-four-evaluated.json" \
            "$RUNNER_TEMP/m3-generated-frontend/gkrust-cargo-resolved.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .status=="pinned_offline_gkrust_cargo_metadata_resolved" and
            .original_source_commit==$sha and
            .cargo_invocation_locked==true and
            .cargo_invocation_offline==true and
            .normal_resolve_node_records>100 and
            .lean_resolve_node_records>100 and
            .commands_resolved_not_executed==true and
            .resolved_other_rust_roots_with_specific_features==false and
            .native_linker_invoked==false and
            .ffi_or_runtime_dlopen_closure_proven==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-generated-frontend/gkrust-cargo-resolved.json" >/dev/null
      - name: Archive bounded generated relative build graphs and exact comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-fully-evaluated-normal-vs-combined-mozbuild-frontend
          path: |
            ${{ runner.temp }}/m3-generated-frontend/full-normal-evaluated.json
            ${{ runner.temp }}/m3-generated-frontend/combined-four-evaluated.json
            ${{ runner.temp }}/m3-generated-frontend/frontend-delta-summary.json
            ${{ runner.temp }}/m3-generated-frontend/generated-backend-mk-delta.json
            ${{ runner.temp }}/m3-generated-frontend/generated-makefile-delta.json
            ${{ runner.temp }}/m3-generated-frontend/compile-command-declarations.json
            ${{ runner.temp }}/m3-generated-frontend/faster-manifest-entry-delta.json
            ${{ runner.temp }}/m3-generated-frontend/gkrust-cargo-resolved.json
            ${{ runner.temp }}/m3-generated-frontend/generated-faster-install-manifests.json
          if-no-files-found: error
          retention-days: 14
