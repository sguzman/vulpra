# No code change; isolate runner environment vs runuser vs empty network ns.
# Diagnostic success only means all probes ran, not that the protected gate passed.
name: M3 Wayland Launch Context Controlled Matrix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-wayland-launch-context-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  single-archive-context-matrix:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ORIGINAL_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Fetch protected harness only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packaging
      - name: Authenticate immutable compiled original archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n packaging/test-wayland.sh
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/extracted"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ORIGINAL_SHA256"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/extracted"
          test -x "$RUNNER_TEMP/extracted/vulpra/vulpra"
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 util-linux weston wayland-utils \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
      - name: Four equal ten-second profile-isolated graphical probes
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/extracted/vulpra"
          harness="$GITHUB_WORKSPACE/packaging/test-wayland.sh"
          runner_user="$(id -un)"
          # Never print raw browser logs, raw process IDs or profile paths.
          probe() {
            local label="$1"
            shift
            local status=0
            if "$@" >"$RUNNER_TEMP/$label-private.log" 2>&1; then
              echo "DIAGNOSTIC $label: Weston 10-second contract PASS"
            else
              status="$?"
              echo "DIAGNOSTIC $label: Weston 10-second contract FAIL (harness status $status)"
              if grep -Fq 'native exit status: 11' "$RUNNER_TEMP/$label-private.log"; then
                echo "DIAGNOSTIC $label: crash reporter exit 11"
              elif grep -Fq 'native exit status: 139' "$RUNNER_TEMP/$label-private.log"; then
                echo "DIAGNOSTIC $label: native SIGSEGV-style exit 139"
              fi
              if grep -Fq 'unshare failed' "$RUNNER_TEMP/$label-private.log"; then
                echo "DIAGNOSTIC $label: namespace unavailable — do not infer behavior"
              fi
            fi
          }
          # Same original restricted-network environment as failing benchmark.
          probe runner env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            VULPRA_WAYLAND_TEST_SECONDS=10 bash "$harness" "$app"
          # Change inherited runner variables, not UID or network namespace.
          probe scrubbed env -i PATH="/usr/local/bin:/usr/bin:/bin" \
            HOME="$HOME" USER="$runner_user" LOGNAME="$runner_user" LANG=C.UTF-8 \
            MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 VULPRA_WAYLAND_TEST_SECONDS=10 \
            bash "$harness" "$app"
          # Change launch through runuser, but retain host network restrictions.
          probe runuser sudo runuser -u "$runner_user" -- \
            env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 VULPRA_WAYLAND_TEST_SECONDS=10 \
            bash "$harness" "$app"
          # Change only external network route availability from above.
          probe runuser_netns sudo unshare --net -- bash -c '
            set -euo pipefail
            if ip -4 route show default | grep -q . ||
               ip -6 route show default | grep -q .; then
              echo "FAIL: isolated network has an unexpected default route" >&2
              exit 4
            fi
            exec runuser -u "$1" -- \
              env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 VULPRA_WAYLAND_TEST_SECONDS=10 \
              bash "$2" "$3"
          ' _ "$runner_user" "$harness" "$app"
          echo 'DIAGNOSTIC MATRIX COMPLETE: results above are not M3 feature-map acceptance'
