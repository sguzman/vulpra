# Cheap native C++/Rust ELF fixtures only: no Firefox browser build.
name: M3 Current Crashhelper Direct Rust FFI Branch Fixtures

on:
  push:
    branches: [main]
    paths:
      - ci/m3-current-crashhelper-direct-branch.rs
      - ci/m3-current-crashhelper-archive-ffi.rs
      - ci/m3-locate-crashhelper-archive.sh
      - .github/workflows/m3-current-crashhelper-direct-branch-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-current-crashhelper-machine-branch-fixtures:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout bounded linked crashhelper verifier only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-current-crashhelper-direct-branch.rs
            ci/m3-current-crashhelper-archive-ffi.rs
            ci/m3-locate-crashhelper-archive.sh
      - name: Compile real Rust staticlib and CXX executable; reject fake direct branches
        shell: bash
        run: |
          set -euo pipefail
          command -v rustc
          command -v c++
          command -v nm
          command -v objdump
          rustc --edition=2021 -D warnings --test \
            ci/m3-current-crashhelper-direct-branch.rs \
            -o "$RUNNER_TEMP/crashhelper-branch-tests"
          "$RUNNER_TEMP/crashhelper-branch-tests" --nocapture
          rustc --edition=2021 -D warnings -O \
            ci/m3-current-crashhelper-direct-branch.rs \
            -o "$RUNNER_TEMP/crashhelper-branch-verifier"
          if "$RUNNER_TEMP/crashhelper-branch-verifier" \
            "$GITHUB_SHA" /nonexistent/unstripped/crashhelper \
            "$RUNNER_TEMP/forged-crashhelper-report.json"; then
            echo 'FAIL: missing real crashhelper cannot be accepted' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/forged-crashhelper-report.json"
          echo 'PASS: linked Rust staticlib and real C++ crashhelper call fixtures; negatives rejected'
          echo 'LIMIT: fixture compiler evidence only, not source-matched current Vulpra crashhelper'
      - name: Verify actual Rust archive export owner and linked crashhelper ELF definitions
        shell: bash
        run: |
          set -euo pipefail
          command -v ar
          command -v sha256sum
          rustc --edition=2021 -D warnings --test \
            ci/m3-current-crashhelper-archive-ffi.rs \
            -o "$RUNNER_TEMP/crashhelper-archive-tests"
          "$RUNNER_TEMP/crashhelper-archive-tests" --nocapture
          rustc --edition=2021 -D warnings -O \
            ci/m3-current-crashhelper-archive-ffi.rs \
            -o "$RUNNER_TEMP/crashhelper-archive-verifier"
          if "$RUNNER_TEMP/crashhelper-archive-verifier" \
            "$GITHUB_SHA" /nonexistent/libcrash_helper_server.a \
            /nonexistent/crashhelper "$RUNNER_TEMP/forged-crashhelper-archive.json"; then
            echo 'FAIL: missing real Rust staticlib and executable accepted' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/forged-crashhelper-archive.json"
          echo 'PASS: compiled Rust archive member and linked C++ strong definition fixtures'
          echo 'LIMIT: archive member selection graph, current Firefox native link and release not proven'
      - name: Fail closed on absent, ambiguous and symlinked crash helper Rust archive
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf -- "$root"' EXIT
          obj="$root/objdir"
          helper="$obj/dist/bin/crashhelper"
          direct="$obj/toolkit/crashreporter/crash_helper_server/libcrash_helper_server.a"
          locator="ci/m3-locate-crashhelper-archive.sh"
          mkdir -p "$(dirname "$helper")" "$(dirname "$direct")"
          printf 'fixture executable\n' > "$helper"
          if bash "$locator" "$obj"; then
            echo 'FAIL: missing archive was accepted' >&2
            exit 1
          fi
          printf 'fixture staticlib\n' > "$direct"
          result="$(bash "$locator" "$obj")"
          test "$result" = "$(realpath "$direct")"
          rm -f -- "$direct"
          fallback="$obj/toolkit/crashreporter/fallback/libcrash_helper_server.a"
          mkdir -p "$(dirname "$fallback")"
          printf 'fallback staticlib\n' > "$fallback"
          result="$(bash "$locator" "$obj")"
          test "$result" = "$(realpath "$fallback")"
          second="$obj/toolkit/crashreporter/another/libcrash_helper_server.a"
          mkdir -p "$(dirname "$second")"
          printf 'second staticlib\n' > "$second"
          if bash "$locator" "$obj"; then
            echo 'FAIL: ambiguous archives were accepted' >&2
            exit 1
          fi
          rm -f -- "$second"
          ln -s "$fallback" "$direct"
          if bash "$locator" "$obj"; then
            echo 'FAIL: symlinked expected archive was accepted' >&2
            exit 1
          fi
          rm -f -- "$direct"
          rm -f -- "$helper"
          if bash "$locator" "$obj"; then
            echo 'FAIL: missing linked crashhelper was accepted' >&2
            exit 1
          fi
          printf 'fixture executable\n' > "$helper"
          rm -f -- "$fallback"
          if bash "$locator" "$obj"; then
            echo 'FAIL: no candidate archive was accepted' >&2
            exit 1
          fi
          echo 'PASS: six native crashhelper archive path presence/ambiguity/symlink checks'
          echo 'LIMIT: synthetic paths only; actual Mozilla-built Rust archive not yet examined'
