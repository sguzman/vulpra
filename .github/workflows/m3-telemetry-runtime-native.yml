# A single exact-source native Vulpra browser build for private localhost telemetry behavior.
# Trigger only for this workflow, never for documentation/test edits; no pair build.
name: M3 Native Telemetry Localhost Runtime Acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-telemetry-runtime-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-telemetry-in-normal-native-browser:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-baseline
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout exact source used by the simultaneous lean native candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact source and original PromoCard contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ci/tests/m3-promocard-bundle-contract.py
          python3 -m py_compile ci/smoke-telemetry-loopback-package.py
          python3 ci/tests/m3-telemetry-loopback-harness-test.py
          python3 ci/m3-telemetry-deletion-boundaries.py --self-test
          echo "PASS: normal native features, guarded telemetry boundaries and isolated test fixtures"

      - name: Prepare Mozilla compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export Actions compiler-cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap supported full browser compiler
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 python3-venv python3-dev git curl make jq
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
          major="$("$HOME/.mozbuild/clang/bin/clang" --version | head -1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 19 ))

      - name: Configure normal Linux browser, PromoCard omission disabled
        shell: bash
        run: |
          set -euo pipefail
          ./mach configure
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("obj-vulpra-linux-m3-baseline/config.statusd")
          def get(k):
              p=root/"substs"/k
              return json.loads(p.read_text()) if p.exists() else None
          assert get("VULPRA_NO_NEWTAB_PROMOCARD") in (False,None,0,"")
          assert get("MOZ_WIDGET_TOOLKIT")=="gtk"
          assert get("MOZ_APP_BASENAME")=="Vulpra"
          assert get("MOZ_DEVTOOLS")=="all"
          for key in ("MOZ_SANDBOX","MOZ_WAYLAND","MOZ_SERVICES_SYNC","MOZ_NORMANDY"):
              assert str(get(key)) in ("True","1"),(key,get(key))
          for key in ("VULPRA_NO_NEWTAB_ADSFEED","VULPRA_NO_ASROUTER_PROMOS"):
              assert get(key) in (False,None,0,"")
              assert not (root/"defines"/key).exists(),key
          print("PASS: original normal Linux browser features and JSX preserved")
          PY

      - name: Reserve 24 GiB native compilation swap
        shell: bash
        run: |
          set -euo pipefail
          bytes=$((24*1024*1024*1024))
          available="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( available > bytes + 8*1024*1024*1024 ))
          sudo fallocate -l 24G /mnt/vulpra-m3-telemetry.swap
          sudo chmod 0600 /mnt/vulpra-m3-telemetry.swap
          sudo mkswap /mnt/vulpra-m3-telemetry.swap
          sudo swapon /mnt/vulpra-m3-telemetry.swap
          grep -Fq '/mnt/vulpra-m3-telemetry.swap' /proc/swaps

      - name: Compile full baseline Linux browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-telemetry-native-build.log"

      - name: Stage a single verified normal Vulpra native package
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist=obj-vulpra-linux-m3-baseline/dist
          mapfile -d '' -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print0)
          [[ "${#archives[@]}" -eq 1 ]]
          mkdir -p .git/vulpra-native-build/packages
          bash packaging/stage.sh "${archives[0]}" \
            "$GITHUB_WORKSPACE/.git/vulpra-native-build/packages/vulpra-local-telemetry-ci.tar.xz"
          (cd .git/vulpra-native-build/packages && \
            sha256sum -c vulpra-local-telemetry-ci.tar.xz.sha256)

      - name: Exercise packaged telemetry upload opt-out and policy using localhost only
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
          PATH="$RUNNER_TEMP:$PATH" python3 ci/smoke-telemetry-loopback-package.py "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(".git/vulpra-native-build/m3-telemetry-loopback.json")
          report=json.loads(p.read_text())
          assert report["status"]=="native_privileged_telemetry_runtime_observed"
          assert report["verified_package_sha256"] and report["isolated_profile"]
          report["source_commit"]=os.environ["GITHUB_SHA"]
          report["workflow_run_id"]=int(os.environ["GITHUB_RUN_ID"])
          p.write_text(json.dumps(report,indent=2)+"\n")
          print("PASS: exact-source packaged Vulpra telemetry loopback runtime")
          PY

      - name: Preserve bounded real native telemetry evidence, not request bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-telemetry-native-localhost-evidence
          path: |
            .git/vulpra-native-build/m3-telemetry-loopback.json
            .git/vulpra-native-build/packages/vulpra-local-telemetry-ci.tar.xz.sha256
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Capture bounded native build failure tail
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-telemetry-native-build.log"; then
            tail -n 2500 "$RUNNER_TEMP/m3-telemetry-native-build.log" \
              > "$RUNNER_TEMP/m3-telemetry-native-failure-tail.log"
          fi

      - name: Upload build diagnostics on failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-telemetry-native-failure-tail
          path: ${{ runner.temp }}/m3-telemetry-native-failure-tail.log
          if-no-files-found: warn
          retention-days: 14
