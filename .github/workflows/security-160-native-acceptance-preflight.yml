name: Firefox 160 Native Acceptance Preflight (No Browser Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-native-acceptance-preflight.yml
      - .github/workflows/security-160-safe-overlay-stage.yml
      - .github/workflows/security-160-artifact-webdriver-replay.yml
      - ci/smoke-webextension-package-local.py
      - ci/tests/smoke-webextension-package-local-test.sh
      - packaging/test-stage.sh
      - packaging/test-launcher.sh
      - packaging/vulpra
      - packaging/stage.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-qa-contract-and-fixtures:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout updated future native runtime workflow and its offline fixtures
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/security-160-safe-overlay-stage.yml
            .github/workflows/security-160-artifact-webdriver-replay.yml
            .github/workflows/security-160-native-acceptance-preflight.yml
            ci/smoke-webextension-package-local.py
            ci/tests/smoke-webextension-package-local-test.sh
            packaging/measure-build.sh
            packaging/stage.sh
            packaging/test-stage.sh
            packaging/test-launcher.sh
            packaging/vulpra
      - name: Static syntax and source contract preflight of future Firefox 160 build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/smoke-webextension-package-local.py
          for script in packaging/stage.sh packaging/test-stage.sh packaging/test-launcher.sh packaging/vulpra ci/tests/smoke-webextension-package-local-test.sh; do
            bash -n "$script"
          done
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          workflow = pathlib.Path(".github/workflows/security-160-safe-overlay-stage.yml").read_text()
          required = {
              'source tree and native compile': 'Compile exact materialized Firefox 160 Vulpra candidate',
              'source identity': 'Materialize ONLY verified source patches',
              'native Vulpra launcher in headless smoke': 'timeout 120 "$appdir/vulpra-launch" --headless --screenshot',
              'actual native executable ELF': '7f454c46',
              'screenshot-only proof': 'headless_screenshot_rendered:true',
              'checksum-pinned geckodriver': 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e',
              'WebDriver runtime script checkout': 'ci/smoke-webextension-package-local.py',
              'real runtime invocation': 'python3 "$script" "$PWD"',
              'real JS navigation result': '.javascript_navigation.verified==true',
              'strict HTTPS refusal': '.security.local_untrusted_tls_denial.verified==true',
              'Nimbus runtime': '.nimbus.api_ready==true',
              'unreleased package replay artifact': 'firefox160-vulpra-unreleased-native-preview-not-approved',
              'WebDriver failure log': 'firefox160-vulpra-webdriver-failure-tail.log',
              'real browser proof artifact': 'firefox160-vulpra-real-webdriver-runtime-proof',
              'real-runtime source provenance': 'firefox160_verified_git_tree',
              'real-runtime archive provenance': 'firefox160_staged_archive_sha256',
              'runtime proof no release approval': 'release_ready: false',
              'runtime proof no security-current claim': 'security_current: false',
          }
          for name, fragment in required.items():
              assert fragment in workflow, f"Firefox 160 acceptance workflow missing {name}"
          assert 'headless_js_smoke_passed:true' not in workflow, \
              'A PNG screenshot cannot be counted as executed JavaScript'
          step_names = re.findall(r'^      - name: (.+)$', workflow, flags=re.M)
          assert len(step_names) >= 25, 'Native pipeline unexpectedly truncated'
          assert len(set(step_names)) == len(step_names), 'Duplicated workflow step names'
          # Extract each YAML shell run block and check Bash syntax without
          # executing build, network or dependency-bootstrap instructions.
          lines = workflow.splitlines()
          scripts = []
          for index, line in enumerate(lines):
              m = re.match(r'^(\s+)run: \|\s*$', line)
              if m is None:
                  continue
              base = len(m.group(1))
              script_lines = []
              for candidate in lines[index + 1:]:
                  if not candidate.strip():
                      script_lines.append('')
                      continue
                  indent = len(candidate) - len(candidate.lstrip())
                  if indent <= base:
                      break
                  script_lines.append(candidate[base + 2:])
              assert script_lines, f"Empty run script at line {index + 1}"
              scripts.append('\n'.join(script_lines) + '\n')
          assert len(scripts) >= 8, f"Only {len(scripts)} shell run blocks found"
          for index, script in enumerate(scripts):
              result = subprocess.run(
                  ['bash', '-n'], input=script, text=True, capture_output=True
              )
              assert result.returncode == 0, \
                  f"Shell block #{index + 1} invalid: {result.stderr}"
          print(f"PASS: future Firefox 160 acceptance workflow: {len(required)} source contracts and {len(scripts)} shell blocks syntax-checked")
          print("LIMIT: static workflow contract; not actual Firefox 160 compile or browser runtime")
          PY
      - name: Verify exact Firefox 160 WebDriver dependency binary without browser build
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl --fail --location --show-error --silent --retry 3 --max-time 90 \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/geckodriver-verified"
          tar -xzf "$archive" -C "$RUNNER_TEMP/geckodriver-verified" geckodriver
          driver="$RUNNER_TEMP/geckodriver-verified/geckodriver"
          test -x "$driver"
          "$driver" --version | grep -Fq 'geckodriver 0.37.1'
          "$driver" --help > "$RUNNER_TEMP/geckodriver-help.txt"
          grep -Fq -- '--allow-system-access' "$RUNNER_TEMP/geckodriver-help.txt"
          grep -Fq -- '--host' "$RUNNER_TEMP/geckodriver-help.txt"
          grep -Fq -- '--port' "$RUNNER_TEMP/geckodriver-help.txt"
          echo 'PASS: Mozilla-published SHA-256-pinned geckodriver runs on Ubuntu and supports the necessary opt-in chrome-context flag'
          echo 'LIMIT: no actual browser, browser runtime, or profile used'
      - name: Verify artifact-only Firefox 160 WebDriver replay syntax and provenance controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess
          source = pathlib.Path('.github/workflows/security-160-artifact-webdriver-replay.yml').read_text()
          required = {
              'original exact source commit': '0624235fdc956ab18af3c3f310b3588ca72fff61',
              'original native run ID': '43138458940',
              'Mozilla release commit': '2887d9de1f69c0e9776413da80e7ba0d1225dd9b',
              'exact candidate Git tree': '42dd7439a27dde92f89ac5eed13f88117a4d7ab5',
              'same-run package artifact': 'firefox160-vulpra-unreleased-native-preview-not-approved',
              'same-run source proof artifact': 'firefox160-vulpra-materialized-source-proof',
              'package checksum verification': 'sha256sum -c',
              'artifact-ready guard': "steps.inspect.outputs.ready == 'true'",
              'real WebDriver': 'ci/smoke-webextension-package-local.py',
              'local TLS rejection': '.security.local_untrusted_tls_denial.verified == true',
              'Nimbus readiness': '.nimbus.store_ready == true and .nimbus.api_ready == true',
              'unreleased only': 'release_ready: false',
              'security-current not asserted': 'security_current: false',
          }
          for name, fragment in required.items():
              assert fragment in source, f"Artifact replay missing {name}"
          assert './mach build' not in source, 'Replay unexpectedly compiles browser'
          lines = source.splitlines()
          def block(index, indent):
              result = []
              for line in lines[index+1:]:
                  if not line.strip():
                      result.append('')
                      continue
                  n = len(line) - len(line.lstrip())
                  if n <= indent:
                      break
                  result.append(line[indent+2:])
              return '\n'.join(result) + '\n'
          shell_blocks, js_blocks = [], []
          for index, line in enumerate(lines):
              m = re.match(r'^(\s+)(run|script): \|\s*$', line)
              if m:
                  (shell_blocks if m.group(2) == 'run' else js_blocks).append(block(index, len(m.group(1))))
          assert len(shell_blocks) >= 4 and len(js_blocks) == 1
          for script in shell_blocks:
              p = subprocess.run(['bash','-n'],input=script,text=True,capture_output=True)
              assert p.returncode == 0, 'Bash syntax error: ' + p.stderr
          for script in js_blocks:
              p = subprocess.run(['node','--check'],input=script,text=True,capture_output=True)
              assert p.returncode == 0, 'GitHub JS syntax error: ' + p.stderr
          print(f"PASS: artifact-only replay has {len(required)} provenance contracts, {len(shell_blocks)} shell blocks and {len(js_blocks)} JavaScript block syntax-checked")
          print("LIMIT: no artifact or actual Firefox 160 browser runtime replayed in this test")
          PY
      - name: Existing package staging and launcher isolation fixture regressions
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/test-stage.sh
          bash packaging/test-launcher.sh
          echo 'PASS: native Vulpra executable and separate guarded launcher fixture contracts'
      - name: Existing WebDriver probe and security-denial parser fixture regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/smoke-webextension-package-local.py --self-test-cert-parser
          bash ci/tests/smoke-webextension-package-local-test.sh \
            "$GITHUB_WORKSPACE/ci/smoke-webextension-package-local.py"
          echo 'PASS: WebDriver JS/HTTP/DOM, extension fixture, Nimbus and TLS negative parser controls'
          echo 'LIMIT: no browser process, full native build, or release acceptance tested here'
