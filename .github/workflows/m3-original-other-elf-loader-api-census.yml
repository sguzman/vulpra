# Authenticate the immutable source-pinned package and audit selected direct
# loader APIs in all 27 regular ELF binaries other than libxul.so.
# Does not run browser executable entrypoints or assert complete dlopen closure.
name: M3 Original Non-libxul Loader Callsite Census
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-other-elf-loader-api-census.rs
      - .github/workflows/m3-original-other-elf-loader-api-census.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-non-libxul-native-loader-imports-and-branches:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout only bounded non-libxul Rust auditor
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-other-elf-loader-api-census.rs
      - name: Compile Rust auditor and test real C ELF positive and negative fixtures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-original-other-elf-loader-api-census.rs \
            -o "$RUNNER_TEMP/m3-original-other-elf-tests"
          "$RUNNER_TEMP/m3-original-other-elf-tests"
          rustc --edition=2021 -O ci/m3-original-other-elf-loader-api-census.rs \
            -o "$RUNNER_TEMP/m3-original-other-elf-auditor"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          if "$RUNNER_TEMP/m3-original-other-elf-auditor" "$SOURCE_SHA" "$ARCHIVE_SHA" \
               /missing/vulpra "$RUNNER_TEMP/invalid-report.json"; then
            echo 'FAIL: missing original package must reject audit' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/invalid-report.json"
      - name: Authenticate and extract original successful full-normal Vulpra native package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/package"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/vulpra/libxul.so"
          test -x "$RUNNER_TEMP/package/vulpra/vulpra-bin"
      - name: Inspect all original non-libxul ELF dynamic imports and direct loader API branches
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/m3-original-other-elf-auditor" "$SOURCE_SHA" "$ARCHIVE_SHA" \
            "$RUNNER_TEMP/package/vulpra" "$RUNNER_TEMP/m3-original-non-libxul-loader-census.json"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_27_non_libxul_loader_api_import_and_direct_branch_census" and
            .original_source_commit==$src and .original_native_archive_sha256==$sha and
            .original_packaged_elf_members==28 and
            .excluded_previously_audited_libxul_members==1 and
            .non_libxul_elf_members_inspected==27 and
            (.per_elf|length)==27 and
            ([.per_elf[].elf_basename]|unique|length)==27 and
            ([.per_elf[].elf_basename]|index("libxul.so"))==null and
            .non_libxul_elves_with_loader_api_imports>=0 and
            .non_libxul_distinct_elf_loader_api_import_records>=0 and
            .non_libxul_elves_with_direct_loader_branches>=0 and
            .non_libxul_direct_named_loader_api_branches>=0 and
            .non_libxul_direct_loader_api_branch_records>=0 and
            .non_libxul_loader_api_dynamic_relocation_slots>=0 and
            .non_libxul_elves_with_relocation_matched_got_indirect_insns>=0 and
            .non_libxul_relocation_matched_got_indirect_insns>=0 and
            ([.per_elf[].loader_api_relocation_slots]|add)==.non_libxul_loader_api_dynamic_relocation_slots and
            ([.per_elf[].relocation_matched_got_indirect_instructions]|add)==.non_libxul_relocation_matched_got_indirect_insns and
            ([.per_elf[]|select(.relocation_matched_got_indirect_instructions>0)]|length)==.non_libxul_elves_with_relocation_matched_got_indirect_insns and
            .no_executable_entrypoints_run==true and
            .only_selected_imports_and_named_direct_branches==true and
            .stripped_function_caller_attribution_proven==false and
            .indirect_loader_calls_enumerated==false and
            .only_rip_relative_relocation_matched_indirects_audited==true and
            .runtime_library_argument_values_verified==false and
            .all_possible_dynamic_library_routes_proven==false and
            .target_endeavouros_hyprland_verified==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-original-non-libxul-loader-census.json" >/dev/null
          echo 'PASS: 27 source-pinned original ELF binary import/branch records; no full dependency closure'
      - name: Upload only sanitized original ELF loader API census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-non-libxul-loader-api-census
          path: ${{ runner.temp }}/m3-original-non-libxul-loader-census.json
          if-no-files-found: warn
          retention-days: 14
