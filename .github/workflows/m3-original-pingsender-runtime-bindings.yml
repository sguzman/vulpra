# Exercise exact original native pingsender with synthetic payload; no
# remote telemetry. Root netns creates lo only, no host/remote routes.
name: M3 Original pingsender Actual Symbol Bindings
on:
  push:
    branches: [main]
    paths:
      - ci/m3-pingsender-loopback-netns.sh
      - ci/m3-pingsender-local-http-server.py
      - ci/m3-pingsender-version-reconcile.py
      - ci/m3-native-original-feature-module-bindings.rs
      - .github/workflows/m3-original-pingsender-runtime-bindings.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-pingsender-synthetic-binding-observation:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      PACKAGE_RUN: '40997075527'
    steps:
      - name: Checkout isolated native pingsender and scope checks
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Reject synthetic bogus pingsender version and verify original run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-pingsender-loopback-netns.sh
          rustc --edition=2021 --test ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/m3-binding-tests"
          "$RUNNER_TEMP/m3-binding-tests"
          rustc --edition=2021 -O ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/m3-original-binding-parser"
          python3 -m py_compile ci/m3-pingsender-local-http-server.py ci/m3-pingsender-version-reconcile.py
          python3 ci/m3-pingsender-version-reconcile.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
      - name: Install source-pinned pingsender runtime and network-namespace utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 libcurl4t64 binutils
          command -v unshare
          command -v ip
          command -v readelf
      - name: Authenticate and recover exact compiled original full-normal Vulpra archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/package"
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/vulpra/pingsender"
      - name: Observe original pingsender symbol bindings on synthetic loopback only
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo unshare --net -- env \
            M3_NATIVE_BINDINGS_PARSER="$RUNNER_TEMP/m3-original-binding-parser" \
            M3_NATIVE_BINDINGS_REPORT="$RUNNER_TEMP/original-pingsender-actual-bindings.json" \
            bash ci/m3-pingsender-loopback-netns.sh \
              "$RUNNER_TEMP/package/vulpra" \
              "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz.sha256" \
              "$RUNNER_TEMP/unused-pingsender-version-report.json" \
              "$GITHUB_WORKSPACE"
          jq -e --arg sha "$ARCHIVE_SHA" --arg src "$SOURCE_SHA" '
            .schema_version==1 and
            .status=="original_native_feature_module_actual_symbol_bindings" and
            .original_source_commit==$src and
            .original_archive_sha256==$sha and
            .original_requester_basename=="pingsender" and
            .pid_traces_with_original_requester_bindings>=1 and
            .normal_symbol_binding_events>=1 and
            .distinct_symbol_provider_pairs>=1 and
            .observed_provider_basename_count==(.observed_provider_basenames|length) and
            .synthetic_loopback_telemetry_only==true and
            .original_c_api_diagnostic_only==false and
            .no_network_egress==true and
            .actual_normal_symbol_bindings_observed==true and
            .raw_loader_logs_exported==false and
            .symbol_names_exported==false and
            .all_lazy_or_transitive_bindings_proven==false and
            .new_source_pruning_authorized==false' \
            "$RUNNER_TEMP/original-pingsender-actual-bindings.json" >/dev/null
          echo 'PASS: synthetic-only pingsender loopback real normal-symbol bindings'
      - name: Upload only sanitized native pingsender no-egress test summary
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-pingsender-actual-bindings
          path: ${{ runner.temp }}/original-pingsender-actual-bindings.json
          if-no-files-found: error
          retention-days: 14
