name: Test Wayland startup harness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-wayland-harness.yml
      - packaging/test-wayland.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-compositor-harness:
    if: github.repository == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            packaging
      - name: Install compositor and registry tools
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # Run 40402080044 hit the 20-minute job limit while still
          # downloading Ubuntu's multimedia/transitive compositor packages.
          # Avoid recommends and use bounded retry on flaky mirror downloads.
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            install -y --no-install-recommends weston wayland-utils
          command -v weston
          command -v wayland-info
      - name: Check script syntax and exercise independent harness
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/test-wayland.sh
          temp="$(mktemp -d)"
          trap 'rm -rf -- "$temp"' EXIT
          mkdir -p "$temp/package"
          cp packaging/vulpra "$temp/package/vulpra"
          chmod +x "$temp/package/vulpra"
          cat > "$temp/package/firefox" <<'MOCK'
          #!/usr/bin/env bash
          set -euo pipefail
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          test "${WAYLAND_DEBUG:-}" = client
          # The browser itself, not the compositor or harness, is put offline.
          # The fatal non-local-connection restriction remains active.
          test "${MOZ_DISABLE_NONLOCAL_CONNECTIONS:-}" = 1
          test "${XRE_START_OFFLINE:-}" = 1
          profile="${XDG_DATA_HOME}/vulpra/default"
          test -d "$profile"
          test ! -e "$profile/user.js"
          # Fake only Gecko's profile-initialization marker in this mock test.
          # The real native CI must create this file itself.
          printf '[Compatibility]\\nLastVersion=synthetic\\n' > "$profile/compatibility.ini"
          # Synthetic protocol trace validates parser only, not live painting.
          printf '%s\n' '-> wl_surface#13.attach(wl_buffer#45, 0, 0)' >&2
          printf '%s\n' '-> wl_surface#13.commit()' >&2
          sleep 30
          MOCK
          chmod +x "$temp/package/firefox"
          MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 VULPRA_WAYLAND_TEST_SECONDS=2 bash packaging/test-wayland.sh "$temp/package"
      - name: Reject a live process that never draws a Wayland frame
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf -- "$temp"' EXIT
          mkdir -p "$temp/package"
          cp packaging/vulpra "$temp/package/vulpra"
          chmod +x "$temp/package/vulpra"
          cat > "$temp/package/firefox" <<'MOCK'
          #!/usr/bin/env bash
          set -euo pipefail
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          sleep 30
          MOCK
          chmod +x "$temp/package/firefox"
          if VULPRA_WAYLAND_TEST_SECONDS=1 bash packaging/test-wayland.sh "$temp/package"; then
            echo 'Wayland harness incorrectly accepted a live-but-not-drawing process' >&2
            exit 1
          fi
          echo 'PASS: synthetic live process without attached/committed Wayland frame rejected'
      - name: Reject attachments and commits belonging to different surfaces
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf -- "$temp"' EXIT
          mkdir -p "$temp/package"
          cp packaging/vulpra "$temp/package/vulpra"
          chmod +x "$temp/package/vulpra"
          cat > "$temp/package/firefox" <<'MOCK'
          #!/usr/bin/env bash
          set -euo pipefail
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          printf '%s\n' '-> wl_surface#13.attach(wl_buffer#45, 0, 0)' >&2
          printf '%s\n' '-> wl_surface#99.commit()' >&2
          sleep 30
          MOCK
          chmod +x "$temp/package/firefox"
          if VULPRA_WAYLAND_TEST_SECONDS=1 bash packaging/test-wayland.sh "$temp/package"; then
            echo 'Wayland harness accepted attach/commit on different surfaces' >&2
            exit 1
          fi
          echo 'PASS: unrelated Wayland surface commits are rejected'

      - name: Reject a buffer detached before its Wayland surface commits
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf -- "$temp"' EXIT
          mkdir -p "$temp/package"
          cp packaging/vulpra "$temp/package/vulpra"
          chmod +x "$temp/package/vulpra"
          cat > "$temp/package/firefox" <<'MOCK'
          #!/usr/bin/env bash
          set -euo pipefail
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          printf '%s\n' '-> wl_surface#13.attach(wl_buffer#45, 0, 0)' >&2
          printf '%s\n' '-> wl_surface#13.attach(nil, 0, 0)' >&2
          printf '%s\n' '-> wl_surface#13.commit()' >&2
          sleep 30
          MOCK
          chmod +x "$temp/package/firefox"
          if VULPRA_WAYLAND_TEST_SECONDS=1 bash packaging/test-wayland.sh "$temp/package"; then
            echo 'Wayland harness accepted detached/null buffer as a graphical frame' >&2
            exit 1
          fi
          echo 'PASS: null buffer detachment invalidates earlier surface attachment'

      - name: Reject a browser which crashes on startup
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf -- "$temp"' EXIT
          mkdir -p "$temp/package"
          cp packaging/vulpra "$temp/package/vulpra"
          chmod +x "$temp/package/vulpra"
          printf '#!/bin/bash\nexit 19\n' > "$temp/package/firefox"
          chmod +x "$temp/package/firefox"
          if VULPRA_WAYLAND_TEST_SECONDS=1 bash packaging/test-wayland.sh "$temp/package"; then
            echo 'Harness incorrectly accepted a crashing binary' >&2
            exit 1
          fi
          echo 'PASS: failed startup was rejected'
