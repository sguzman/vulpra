# Bounded, disposable native Firefox 160 sandbox denial experiment.
# No browser compilation, privilege changes, sandbox overrides, releases or merges.
name: Firefox 160 Actual Content HOME Write Denial (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-real-content-home-write.yml
      - ci/security-160-real-content-prctl.py
      - ci/VulpraSeccompProbeChild.sys.mjs
      - ci/VulpraSeccompProbeParent.sys.mjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-content-home-write-denial:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 25
    steps:
      - name: Authenticate original browser build and byte-identical preserved archive
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const {data:producer}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:43138458940});
            if(producer.repository?.full_name!=='sguzman/vulpra' ||
               producer.head_sha!=='0624235fdc956ab18af3c3f310b3588ca72fff61' ||
               producer.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               producer.name!=='Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate' ||
               producer.conclusion!=='success' || producer.status!=='completed')
              throw Error('Original native Firefox build is unauthenticated');
            const {data:preserved}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:43724886827});
            if(preserved.repository?.full_name!=='sguzman/vulpra' ||
               preserved.head_sha!=='54728803f058c3edf54d2e8d3f6e0a7d2af0aec6' ||
               preserved.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               preserved.name!=='Firefox 160 Verified Native Archive Preservation (No Build)' ||
               preserved.conclusion!=='success' || preserved.status!=='completed')
              throw Error('Preserved original archive is unauthenticated');
            const all=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:43724886827,per_page:100});
            for(const name of ['firefox160-vulpra-preserved-native-preview-not-approved',
                               'firefox160-vulpra-preserved-materialized-source-proof']){
              if(all.filter(a=>a.name===name&&!a.expired&&a.size_in_bytes>0).length!==1)
                throw Error('Required source/package archive absent or expired: '+name);
            }
            core.info('PASS: pinned native source/browser identity retained');
      - name: Checkout isolated actor, runtime harness, and existing WebDriver/procfs helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/security-160-real-content-prctl.py
            ci/VulpraSeccompProbeChild.sys.mjs
            ci/VulpraSeccompProbeParent.sys.mjs
            ci/security-160-content-process-seccomp.py
            ci/smoke-webextension-package-local.py
      - name: Retrieve original verified Firefox 160 package and checksum
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native
      - name: Retrieve original complete-source identity
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source
      - name: Authenticate source/bytes and reject forged syscall-denial fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/security-160-real-content-prctl.py
          python3 ci/security-160-real-content-prctl.py --self-test
          test -s "$RUNNER_TEMP/source/materialized-candidate.json"
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$RUNNER_TEMP/source/materialized-candidate.json" >/dev/null
          archive="$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz"
          test -s "$archive" && test -s "$archive.sha256"
          (cd "$RUNNER_TEMP/native" && sha256sum -c "$(basename "$archive").sha256")
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp -- "$archive" "$dest/vulpra-local-firefox160-prctl-ci.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-firefox160-prctl-ci.tar.xz > vulpra-local-firefox160-prctl-ci.tar.xz.sha256)
          echo 'PASS: original native Firefox 160 source/tree/package and adversarial evidence parser'
      - name: Install native browser libraries and checksum-pinned geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          case "$RUNNER_OS:$ImageOS" in
            Linux:ubuntu22) gtk=libgtk-3-0; alsa=libasound2 ;;
            Linux:ubuntu24) gtk=libgtk-3-0t64; alsa=libasound2t64 ;;
            *) echo 'Unsupported CI runner image; refuse host package guess' >&2; exit 1 ;;
          esac
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends curl jq python3 "$gtk" libdbus-glib-1-2 "$alsa" libnss3 libgbm1
          driver="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl -fLsS --retry 3 --max-time 90 -o "$driver" \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz'
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$driver" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/geckodriver-bin"
          tar -xzf "$driver" -C "$RUNNER_TEMP/geckodriver-bin" geckodriver
          test -x "$RUNNER_TEMP/geckodriver-bin/geckodriver"
          echo "$RUNNER_TEMP/geckodriver-bin" >> "$GITHUB_PATH"
      - name: Exercise original Firefox 160 content-worker policy without altering binary
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          python3 ci/security-160-real-content-prctl.py --home-write \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/firefox160-real-content-home-write-proof.json"
          digest="$(sha256sum "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz" | cut -d' ' -f1)"
          jq -e --arg digest "$digest" '
            .schema_version==1 and .status=="pass" and
            .native_package_sha256==$digest and
            .same_browser_parent_home_write_control_succeeded==true and
            .same_browser_parent_home_write_canary_removed==true and
            .native_open_create_home_content_worker_denied==true and
            .filesystem_denial_not_exclusively_attributed_to_seccomp==true and
            .actual_chromeutils_tab_role_authenticated==true and
            .same_tab_pid_has_seccomp_mode_2==true and
            .same_tab_seccomp_mode_2_at_syscall==true and
            .same_tab_pid_has_no_new_privileges==true and
            .tested_syscall=="open(O_CREAT|O_EXCL|O_WRONLY,HOME canary)" and
            (.actual_errno==1 or .actual_errno==2 or .actual_errno==13 or .actual_errno==30) and
            .raw_pids_or_user_data_archived==false and
            .no_sandbox_prefs_or_host_kernel_policy_relaxed==true and
            .security_current==false and .release_ready==false
          ' "$RUNNER_TEMP/firefox160-real-content-home-write-proof.json" >/dev/null
          echo 'PASS: real Gecko tab PID could not create the isolated HOME canary that the parent created' >> "$GITHUB_STEP_SUMMARY"
          echo 'LIMIT: filesystem denial could be broker/namespace/seccomp; no attribution or release acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive bounded denial proof, if demonstrated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-real-content-home-write-${{ matrix.os }}-not-release-approval
          path: ${{ runner.temp }}/firefox160-real-content-home-write-proof.json
          if-no-files-found: ignore
          retention-days: 30
