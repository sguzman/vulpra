# The full native Android application pruning trial already passed.
# This read-only HEAD invariant verifies no removed app roots reappear.
# Full before/after evidence: GitHub Actions 40585240593 and commit 54675537.
name: M3 Verify Committed Android App Source Prune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-mobile-source-prune-experiment.yml
      - mobile/android/**
      - mobile/shared/**
      - widget/android/**
      - taskcluster/kinds/toolchain/android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android-app-prune:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only current Git tree metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
          sparse-checkout-cone-mode: true

      - name: Verify Android app-only deletions and protected shared source
        shell: bash
        run: |
          set -euo pipefail
          # Git tree lookup, not a 14,134-file history diff or full checkout.
          # Immutable commit 546755376021d230bb12ab2f904129a7d6f80973
          # already passed exact deletion and native runtime acceptance.
          for root in mobile/android/fenix mobile/android/focus-android \
                      mobile/android/android-components; do
            if git ls-tree HEAD -- "$root" | grep -q .; then
              echo "ERROR: deleted Android app root returned: $root" >&2
              exit 1
            fi
          done
          for path in mobile/shared/moz.build mobile/android/moz.build \
                      widget/android/moz.build browser/app.mozbuild \
                      toolkit/library/rust/shared/Cargo.toml; do
            if ! git ls-tree -r HEAD -- "$path" | grep -q .; then
              echo "ERROR: protected source absent: $path" >&2
              exit 1
            fi
          done
          for root in mobile/android/geckoview mobile/android/components \
                      mobile/android/modules; do
            if ! git ls-tree HEAD -- "$root" | grep -q .; then
              echo "ERROR: preserved shared Android root absent: $root" >&2
              exit 1
            fi
          done
          # The Linux compiler downloader also loads Taskcluster toolchain YAML.
          # Removed Android Gradle-plugin files must never reappear as resources.
          for basename in ApplicationServices.kt DependenciesPlugin.kt; do
            if grep -Fq "mobile/android/android-components/plugins/dependencies/src/main/java/$basename" \\
                taskcluster/kinds/toolchain/android.yml; then
              echo "ERROR: Taskcluster hashes deleted Android Components file: $basename" >&2
              exit 1
            fi
          done
          echo "PASS: Taskcluster toolchain graph no longer hashes deleted Android Gradle sources"
          echo "PASS: three Android app roots remain absent on current main"
          echo "PASS: shared GeckoView, Android widget and core build paths remain"
          echo "Historical native acceptance: https://github.com/sguzman/vulpra/actions/runs/40585240593"
