# Reuse a source-pinned test-only browser package; never compile Firefox or release.
name: M3 Wayland VP9 Provider Media Replay (No Rebuild)

on:
  push:
    branches: [main]
    paths:
      - ci/m3-packaged-wayland-vp9-providers.sh
      - .github/workflows/m3-wayland-vp9-provider-video-replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vulpra-m3-wayland-vp9-provider-media-replay
  cancel-in-progress: false

jobs:
  replay-source-pinned-graphical-video:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PINNED_NATIVE_RUN_ID: "42559566915"
      PINNED_NATIVE_SOURCE_SHA: "a17ac58d694bf77c4da352ed7ab9b37233fbc01e"
      PINNED_NATIVE_PACKAGE_SHA: "f92fe8c29843e7521ffe1ddd7cbbed8836ff9491228b182628973e8484ed1a41"
      PINNED_TEST_PACKAGE_ARTIFACT: "m3-test-only-native-package-not-for-release"
      VULPRA_M3_COMPILED_SOURCE_SHA: "a17ac58d694bf77c4da352ed7ab9b37233fbc01e"
    steps:
      - name: Checkout only graphical video harness and denial interposer
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-packaged-wayland-vp9-providers.sh
            ci/m3-deny-optional-native-providers.c

      - name: Install private Weston and VP9 playback dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends ffmpeg jq curl git weston wayland-utils \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
          bash -n ci/m3-packaged-wayland-vp9-providers.sh
          bash ci/m3-packaged-wayland-vp9-providers.sh --self-test
          if bash ci/m3-packaged-wayland-vp9-providers.sh >/dev/null 2>&1; then
            echo "FAIL: missing verified runtime inputs were accepted" >&2
            exit 1
          fi

      - name: Download and authenticate previous test-only native package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/vp9-replay-package"
          gh run download "$PINNED_NATIVE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$PINNED_TEST_PACKAGE_ARTIFACT" \
            --dir "$RUNNER_TEMP/vp9-replay-package"
          mapfile -t packages < <(find "$RUNNER_TEMP/vp9-replay-package" \
            -type f -name vulpra-local-m3-native-link-ci.tar.xz -print)
          mapfile -t reports < <(find "$RUNNER_TEMP/vp9-replay-package" \
            -type f -name m3-native-link-inputs.json -print)
          test "${#packages[@]}" -eq 1
          test "${#reports[@]}" -eq 1
          package="${packages[0]}"
          report="${reports[0]}"
          sidecar="$package.sha256"
          test -s "$sidecar"
          (cd "$(dirname "$package")" && sha256sum -c "$(basename "$sidecar")")
          test "$(sha256sum "$package" | cut -d' ' -f1)" = "$PINNED_NATIVE_PACKAGE_SHA"
          jq -e --arg src "$PINNED_NATIVE_SOURCE_SHA" \
            --arg sha "$PINNED_NATIVE_PACKAGE_SHA" \
            --argjson run "$PINNED_NATIVE_RUN_ID" '
            .source_commit==$src and
            .package.package_sha256==$sha and
            .workflow_run_id==$run and
            .runtime_passed_after_link_audit==true and
            .packaging_transform_replay.deterministic_reproduction_verified==true
          ' "$report" >/dev/null
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$package" "$sidecar" "$dest/"
          (cd "$dest" && sha256sum -c vulpra-local-m3-native-link-ci.tar.xz.sha256)
          echo "PASS: source-pinned real native browser authenticated; no rebuild"

      - name: Exercise real graphical Wayland VP9, 2D canvas, and WebGL2 under selective denial
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            ci/m3-deny-optional-native-providers.c \
            -o "$RUNNER_TEMP/m3-deny-native-providers.so" -ldl
          bash ci/m3-packaged-wayland-vp9-providers.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/m3-deny-native-providers.so" \
            "$RUNNER_TEMP/geckodriver" \
            "$RUNNER_TEMP/m3-packaged-wayland-vp9-providers.json"
          jq -e --arg compiled "$PINNED_NATIVE_SOURCE_SHA" \
            --arg harness "$GITHUB_SHA" --arg archive "$PINNED_NATIVE_PACKAGE_SHA" '
            .schema_version==1 and
            .status=="real_packaged_non_headless_Wayland_VP9_video_canvas_provider_denial" and
            .native_source_commit==$compiled and
            .test_harness_commit==$harness and
            .verified_normal_packaged_archive_sha256==$archive and
            .private_Weston_pixman_compositor_available==true and
            .baseline_playback_verified==true and
            .all_real_browser_sessions_safe==true and
            ([.modes[].mode]|sort)==["baseline","gbm","vaapi"] and
            ([.modes[]|select(.mode=="gbm" or .mode=="vaapi")|
              .browser_interposer_attached]|all(.==true)) and
            .hardware_video_decoder_identified==false and
            .actual_GPU_or_DMABuf_provider_execution_proven==false and
            .complete_indirect_loader_graph_proven==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false and .release_ready==false
          ' "$RUNNER_TEMP/m3-packaged-wayland-vp9-providers.json" >/dev/null
          jq -c '.modes|map({mode,frames:.observed_video_state.frames,
            time:.observed_video_state.time,
            video:.vp9_decoded_frames_and_time_verified,
            denied_before:.ffmpeg_denials_before_video_navigation,
            denied_after:.ffmpeg_denials_after_video_navigation,
            canvas:.canvas_video_readback,
            webgl2:.webgl2_context_available,
            screenshot:.actual_webdriver_png_screenshot})' \
            "$RUNNER_TEMP/m3-packaged-wayland-vp9-providers.json"
          echo "PASS: non-headless Wayland video and canvas workload measured in isolated real browser"
          echo "LIMIT: actual VA-API, GBM and GPU fallback needs observed provider denial and hardware evidence"

      - name: Preserve non-headless Wayland VP9/provider runtime report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-source-pinned-wayland-vp9-provider-media-evidence
          path: |
            ${{ runner.temp }}/m3-packaged-wayland-vp9-providers.json
          if-no-files-found: warn
          retention-days: 14
