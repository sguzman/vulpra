name: M3 Current Native TLS Evidence Cross-Report Fixtures

on:
  push:
    branches: [main]
    paths:
      - ci/m3-current-local-tls-native-evidence.jq
      - ci/tests/m3-current-local-tls-native-evidence-tests.sh
      - .github/workflows/m3-current-local-tls-native-evidence-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-evidence-fixtures:
    if: github.repository == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout read-only source-linked TLS evidence verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ci/m3-current-local-tls-native-evidence.jq
            ci/tests/m3-current-local-tls-native-evidence-tests.sh
      - name: Validate metadata-only TLS rejection evidence and adversarial fixtures
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          bash -n ci/tests/m3-current-local-tls-native-evidence-tests.sh
          bash ci/tests/m3-current-local-tls-native-evidence-tests.sh
