# Real original compiled Vulpra GUI surfaces on private Arch Linux Weston.
# No network, no user display, no permanent profile, no Hyprland claim.
name: M3 Original Arch Wayland Native Loader Initializations
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-arch-wayland-native-loader.yml
      - packaging/test-wayland.sh
      - ci/m3-original-arch-wayland-loader-events.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-private-arch-weston-observed-native-library-initializers:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout only existing strict private Wayland graphical verification harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            packaging/test-wayland.sh
            ci/m3-original-arch-wayland-loader-events.rs
      - name: Authenticate original compiled Vulpra archive and isolated test harness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n packaging/test-wayland.sh
          rustc --edition=2021 --test ci/m3-original-arch-wayland-loader-events.rs -o "$RUNNER_TEMP/arch-native-event-tests"
          "$RUNNER_TEMP/arch-native-event-tests"
          rustc --edition=2021 -O ci/m3-original-arch-wayland-loader-events.rs -o "$RUNNER_TEMP/arch-native-event-parser"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package" "$RUNNER_TEMP/arch-wayland"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/vulpra/vulpra"
          test "$(head -c 4 "$RUNNER_TEMP/package/vulpra/vulpra" | od -An -tx1 | tr -d ' \n')" = 7f454c46
          grep -Fxq 'Name=Vulpra' "$RUNNER_TEMP/package/vulpra/application.ini"
      - name: Build disposable Arch userspace with private Weston and Wayland protocols
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arch-weston-context"
          cat >"$RUNNER_TEMP/arch-weston-context/Dockerfile" <<'EOF'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed \
            coreutils grep sed findutils bash python gtk3 dbus-glib alsa-lib nss \
            mesa libglvnd ttf-dejavu weston wayland-utils \
            && command -v wayland-info \
            && command -v weston \
            && rm -rf /var/cache/pacman/pkg/*
          EOF
          docker build --pull --no-cache -t m3-original-arch-weston:ci \
            "$RUNNER_TEMP/arch-weston-context"
      - name: Validate committed Wayland frame and private initialized Vulpra profile
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Create the compatibility shim on the ephemeral CI runner, check
          # executable permissions, and bind-mount it read-only. It never
          # replaces the original packaged native binary or any user launcher.
          mkdir -p "$RUNNER_TEMP/arch-wayland/shim"
          # Intentionally defer the private XDG_DATA_HOME and "$@" expansions
          # to the isolated container launcher, not the CI host.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'umask 077' \
            'mkdir -p -m 0700 "$XDG_DATA_HOME/vulpra/default"' \
            'exec /original/vulpra --no-remote --new-instance --profile "$XDG_DATA_HOME/vulpra/default" "$@"' \
            >"$RUNNER_TEMP/arch-wayland/shim/vulpra-launch"
          chmod 0755 "$RUNNER_TEMP/arch-wayland/shim/vulpra-launch"
          test -x "$RUNNER_TEMP/arch-wayland/shim/vulpra-launch"
          bash -n "$RUNNER_TEMP/arch-wayland/shim/vulpra-launch"
          docker run --rm --network none --read-only --shm-size 256m \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount type=bind,src="$RUNNER_TEMP/package/vulpra",dst=/original,readonly \
            --mount type=bind,src="$RUNNER_TEMP/arch-wayland/shim",dst=/shim,readonly \
            --mount type=bind,src="$RUNNER_TEMP/arch-native-event-parser",dst=/audit/arch-native-event-parser,readonly \
            --mount type=bind,src="$RUNNER_TEMP/arch-wayland",dst=/reports \
            --mount type=bind,src="$GITHUB_WORKSPACE/packaging/test-wayland.sh",dst=/audit/test-wayland.sh,readonly \
            --env HOME=/tmp/isolated-private-home \
            --env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            --env VULPRA_WAYLAND_TEST_OFFLINE=1 \
            --env VULPRA_WAYLAND_TEST_SECONDS=10 \
            m3-original-arch-weston:ci /bin/bash -c '
              set -euo pipefail
              mkdir -m 0700 /tmp/isolated-private-home
              test -x /shim/vulpra-launch
              mkdir -m 0700 /tmp/original-browser-traces
              export VULPRA_M3_LOADER_TRACE_KIND=libs,files
              export VULPRA_M3_LOADER_TRACE_PREFIX=/tmp/original-browser-traces/m3-browser-loader
              bash /audit/test-wayland.sh /shim
              /audit/arch-native-event-parser /tmp/original-browser-traces /reports/original-arch-loader-witness.json
              test ! -e /tmp/isolated-private-home/.mozilla
              echo "PASS: original Vulpra Arch Weston committed graphical frame and actual glibc library initializers"
            '
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_arch_wayland_browser_actual_loader_initializers" and
            .original_source_commit==$src and .original_archive_sha256==$sha and
            .native_browser_loader_pid_traces_with_initializers>=1 and
            .initialized_native_provider_basename_count>=3 and
            (.initialized_native_provider_basenames|length)==.initialized_native_provider_basename_count and
            .libmozgtk_actual_init_observed==true and
            .libmozwayland_actual_init_observed==true and
            .libxul_actual_init_observed==true and
            .init_order_or_full_dynamic_closure_proven==false and
            .raw_loader_logs_symbol_names_paths_or_pids_exported==false and
            .full_future_dlopen_or_feature_coverage_proven==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/arch-wayland/original-arch-loader-witness.json" >/dev/null
          image_id="$(docker image inspect m3-original-arch-weston:ci --format '{{.Id}}')"
          printf '%s' "$image_id" | grep -Eq '^sha256:[a-f0-9]{64}$'
          glibc_version="$(docker run --rm --network none --read-only --cap-drop ALL \
            m3-original-arch-weston:ci pacman -Q glibc | awk '{print $2}')"
          printf '%s' "$glibc_version" | grep -Eq '^[0-9][0-9A-Za-z.+_:-]*$'
          jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
            --arg image "$image_id" --arg glibc "$glibc_version" '{
             schema_version:1,
             status:"original_archlinux_userspace_private_weston_wayland_frame_verified",
             original_source_commit:$src,
             original_archive_sha256:$sha,
             original_native_elf:"vulpra",
             arch_container_image_id:$image,
             arch_userspace_glibc_version:$glibc,
             real_private_weston_compositor:true,
             wayland_registry_and_xdg_wm_base_present:true,
             native_browser_graphical_10_seconds_alive:true,
             native_browser_nonnull_wayland_surface_buffer_attached_then_committed:true,
             isolated_native_vulpra_profile_compatibility_initialized:true,
             only_disposable_private_profile:true,
             offline_network_namespace:true,
             source_browser_sandbox_preferences_not_disabled:true,
             any_real_user_or_installed_browser_profile_accessed:false,
             actual_hyprland_or_gpu_acceleration_tested:false,
             full_browser_rare_feature_paths_tested:false,
             source_build_graph_closure_proven:false,
             source_pruning_authorized:false,
             m3_sixth_gate_closed:false
           }' > "$RUNNER_TEMP/arch-wayland/original-arch-wayland-frame.json"
          jq -e '
            .status=="original_archlinux_userspace_private_weston_wayland_frame_verified" and
            .real_private_weston_compositor==true and
            .native_browser_graphical_10_seconds_alive==true and
            .native_browser_nonnull_wayland_surface_buffer_attached_then_committed==true and
            .isolated_native_vulpra_profile_compatibility_initialized==true and
            .offline_network_namespace==true and
            .actual_hyprland_or_gpu_acceleration_tested==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/arch-wayland/original-arch-wayland-frame.json" >/dev/null
      - name: Upload only sanitized original Arch userspace Wayland evidence flags
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-archlinux-weston-real-native-loader-initializers
          path: |
            ${{ runner.temp }}/arch-wayland/original-arch-wayland-frame.json
            ${{ runner.temp }}/arch-wayland/original-arch-loader-witness.json
          if-no-files-found: error
          retention-days: 14
