# Lightweight fail-closed source/package/Wayland frame classifier fixture; no browser build.
name: M3 Wayland Provider Replay Evidence Fixtures

on:
  push:
    branches: [main]
    paths:
      - ci/m3-wayland-provider-replay-audit.jq
      - ci/tests/m3-wayland-provider-replay-audit-tests.sh
      - ci/m3-wayland-vp9-provider-outcome-audit.jq
      - ci/tests/m3-wayland-vp9-provider-outcome-audit-tests.sh
      - .github/workflows/m3-wayland-provider-replay-audit-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-graphical-evidence-fixtures:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact graphical audit classifier and test inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-wayland-provider-replay-audit.jq
            ci/tests/m3-wayland-provider-replay-audit-tests.sh
            ci/m3-wayland-vp9-provider-outcome-audit.jq
            ci/tests/m3-wayland-vp9-provider-outcome-audit-tests.sh
      - name: Validate real-frame no-hit distinction and 22 forged safety states
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          bash -n ci/tests/m3-wayland-provider-replay-audit-tests.sh
          bash ci/tests/m3-wayland-provider-replay-audit-tests.sh
          echo "LIMIT: fixture classifier only, never a compiled-browser Wayland or GPU acceptance"
          bash -n ci/tests/m3-wayland-vp9-provider-outcome-audit-tests.sh
          bash ci/tests/m3-wayland-vp9-provider-outcome-audit-tests.sh

      - name: Independently download and audit real source-pinned graphical replay
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vulpra-wayland-evidence"
          gh run download 42662005847 \
            --repo "$GITHUB_REPOSITORY" \
            --name m3-pinned-graphical-wayland-provider-denial-evidence \
            --dir "$RUNNER_TEMP/vulpra-wayland-evidence"
          test "$(find "$RUNNER_TEMP/vulpra-wayland-evidence" \
            -type f -name m3-packaged-wayland-provider-denial-runtime.json | wc -l)" -eq 1
          report="$(find "$RUNNER_TEMP/vulpra-wayland-evidence" \
            -type f -name m3-packaged-wayland-provider-denial-runtime.json -print -quit)"
          test -s "$report" && test ! -L "$report"
          jq -e \
            --arg expected_source_sha a17ac58d694bf77c4da352ed7ab9b37233fbc01e \
            --arg expected_harness_sha 321bb9e80ec49558c06b7fca819456e97508e726 \
            --arg expected_archive_sha f92fe8c29843e7521ffe1ddd7cbbed8836ff9491228b182628973e8484ed1a41 \
            -f ci/m3-wayland-provider-replay-audit.jq "$report" \
            > "$RUNNER_TEMP/m3-wayland-provider-replay-classified.json"
          jq -e '
            .schema_version==1 and
            .status=="source_bound_graphical_Wayland_provider_denial_evidence_classified" and
            .gbm_denied_library_requests==1 and
            .vaapi_denied_library_requests==0 and
            .ffmpeg_denied_library_requests==14 and
            .same_session_Wayland_frame_and_gbm_denial_observed==true and
            .provider_denial_temporally_precedes_frame_proven==false and
            .vaapi_missing_provider_path_tested==false and
            .actual_GPU_or_DMA_BUF_graphics_fallback_proven==false and
            .hardware_VAAPI_video_decode_or_fallback_proven==false and
            .m3_sixth_gate_closed==false and .release_ready==false
          ' "$RUNNER_TEMP/m3-wayland-provider-replay-classified.json" >/dev/null
          echo "PASS: authenticated native source/package, real Wayland frame and 1/0/14 loader observations"
          echo "LIMIT: no VA-API branch, GPU DMA-BUF proof or workstation release approval"

      - name: Authenticate and reconcile real graphical VP9 WebDriver report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=42665579538
          run_data="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jq -e --arg sha f8d16a0cb63686e750d97267d79043fd2b194a5d '
            .head_sha==$sha and .status=="completed" and .conclusion=="success"
          ' <<< "$run_data" >/dev/null
          dir="$RUNNER_TEMP/vulpra-real-wayland-vp9-evidence"
          mkdir -p "$dir"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name m3-source-pinned-wayland-vp9-provider-media-evidence \
            --dir "$dir"
          test "$(find "$dir" -type f -name m3-packaged-wayland-vp9-providers.json | wc -l)" -eq 1
          report="$(find "$dir" -type f -name m3-packaged-wayland-vp9-providers.json -print -quit)"
          test -s "$report" && test ! -L "$report"
          jq -e \
            --arg expected_compiled_source a17ac58d694bf77c4da352ed7ab9b37233fbc01e \
            --arg expected_harness_source f8d16a0cb63686e750d97267d79043fd2b194a5d \
            --arg expected_package_sha256 f92fe8c29843e7521ffe1ddd7cbbed8836ff9491228b182628973e8484ed1a41 \
            -f ci/m3-wayland-vp9-provider-outcome-audit.jq "$report" \
            > "$RUNNER_TEMP/m3-independent-wayland-vp9-video.json"
          jq -e '
            .normal_wayland_vp9_video_verified==true and
            .normal_canvas_video_readback_measured==true and
            .normal_webgl2_context_available_measured==true and
            .gbm_denial_requests_before_media_navigation==1 and
            .gbm_denial_requests_after_media_navigation==1 and
            .gbm_denial_requests_added_after_navigation==0 and
            .gbm_provider_denial_observed==true and
            .gbm_wayland_video_decoded_with_provider_denial==true and
            .vaapi_denial_requests_before_media_navigation==0 and
            .vaapi_denial_requests_after_media_navigation==0 and
            .vaapi_provider_denial_observed==false and
            .vaapi_wayland_video_decoded_with_provider_denial==true and
            .actual_GPU_hardware_fallback_proven==false and
            .VA_API_hardware_decoding_fallback_proven==false and
            .m3_sixth_gate_closed==false and
            .release_ready==false
          ' "$RUNNER_TEMP/m3-independent-wayland-vp9-video.json" >/dev/null
          echo "PASS: authenticated real non-headless Wayland VP9 + canvas + WebGL2; GBM 1, VA-API 0"
          echo "LIMIT: no hardware GPU/VA-API/DMABuf fallback, source pruning, or M3 sixth gate"

      - name: Preserve source-bound VP9 graphical report classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-independent-wayland-vp9-video-classification
          path: ${{ runner.temp }}/m3-independent-wayland-vp9-video.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve independent graphical evidence classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-independent-graphical-provider-replay-classification
          path: ${{ runner.temp }}/m3-wayland-provider-replay-classified.json
          if-no-files-found: warn
          retention-days: 14
