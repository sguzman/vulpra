# Lightweight fail-closed source/package/Wayland frame classifier fixture; no browser build.
name: M3 Wayland Provider Replay Evidence Fixtures

on:
  push:
    branches: [main]
    paths:
      - ci/m3-wayland-provider-replay-audit.jq
      - ci/tests/m3-wayland-provider-replay-audit-tests.sh
      - .github/workflows/m3-wayland-provider-replay-audit-fixtures.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-graphical-evidence-fixtures:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact graphical audit classifier and test inputs
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-wayland-provider-replay-audit.jq
            ci/tests/m3-wayland-provider-replay-audit-tests.sh
      - name: Validate real-frame no-hit distinction and 22 forged safety states
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          bash -n ci/tests/m3-wayland-provider-replay-audit-tests.sh
          bash ci/tests/m3-wayland-provider-replay-audit-tests.sh
          echo "LIMIT: fixture classifier only, never a compiled-browser Wayland or GPU acceptance"

      - name: Independently download and audit real source-pinned graphical replay
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vulpra-wayland-evidence"
          gh run download 42662005847 \
            --repo "$GITHUB_REPOSITORY" \
            --name m3-pinned-graphical-wayland-provider-denial-evidence \
            --dir "$RUNNER_TEMP/vulpra-wayland-evidence"
          test "$(find "$RUNNER_TEMP/vulpra-wayland-evidence" \
            -type f -name m3-packaged-wayland-provider-denial-runtime.json | wc -l)" -eq 1
          report="$(find "$RUNNER_TEMP/vulpra-wayland-evidence" \
            -type f -name m3-packaged-wayland-provider-denial-runtime.json -print -quit)"
          test -s "$report" && test ! -L "$report"
          jq -e \
            --arg expected_source_sha a17ac58d694bf77c4da352ed7ab9b37233fbc01e \
            --arg expected_harness_sha 321bb9e80ec49558c06b7fca819456e97508e726 \
            --arg expected_archive_sha f92fe8c29843e7521ffe1ddd7cbbed8836ff9491228b182628973e8484ed1a41 \
            -f ci/m3-wayland-provider-replay-audit.jq "$report" \
            > "$RUNNER_TEMP/m3-wayland-provider-replay-classified.json"
          jq -e '
            .schema_version==1 and
            .status=="source_bound_graphical_Wayland_provider_denial_evidence_classified" and
            .gbm_denied_library_requests==1 and
            .vaapi_denied_library_requests==0 and
            .ffmpeg_denied_library_requests==14 and
            .same_session_Wayland_frame_and_gbm_denial_observed==true and
            .provider_denial_temporally_precedes_frame_proven==false and
            .vaapi_missing_provider_path_tested==false and
            .actual_GPU_or_DMA_BUF_graphics_fallback_proven==false and
            .hardware_VAAPI_video_decode_or_fallback_proven==false and
            .m3_sixth_gate_closed==false and .release_ready==false
          ' "$RUNNER_TEMP/m3-wayland-provider-replay-classified.json" >/dev/null
          echo "PASS: authenticated native source/package, real Wayland frame and 1/0/14 loader observations"
          echo "LIMIT: no VA-API branch, GPU DMA-BUF proof or workstation release approval"

      - name: Preserve independent graphical evidence classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-independent-graphical-provider-replay-classification
          path: ${{ runner.temp }}/m3-wayland-provider-replay-classified.json
          if-no-files-found: warn
          retention-days: 14
