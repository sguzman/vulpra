# Exercise one of the nine original build-owned ELF helper activation routes.
# Original full-normal binary, SHA authenticated; no real browser profile.
name: M3 Original Native gfxtest Real Wayland EGL Activation
on:
  push:
    branches: [main]
    paths:
      - ci/m3-gfxtest-private-wayland.sh
      - ci/m3-gfxtest-version-reconcile.py
      - .github/workflows/m3-native-gfxtest-wayland.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-gfxtest-wayland-egl:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      PACKAGE_RUN: '40997075527'
      STATIC_RUN: '41157293087'
      STATIC_HEAD: 184d5b33678152c1bd28b0c35cecc450e49c93f1
    steps:
      - name: Checkout bounded helper launch and version-check verifier
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Guard fake native gfx loader output and audit archive provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-gfxtest-private-wayland.sh
          python3 ci/m3-gfxtest-version-reconcile.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_RUN" |
            jq -e --arg sha "$STATIC_HEAD" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and
              .name=="M3 Source-Pinned Native ELF Version-Name Inventory"' >/dev/null
      - name: Install private Weston/pixman and original native graphics libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1 libegl1
      - name: Recover only original full compiled package and static version report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/static" "$RUNNER_TEMP/package"
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/native"
          gh run download "$STATIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-version-name-contract --dir "$RUNNER_TEMP/static"
          (cd "$RUNNER_TEMP/native" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/vulpra/gfxtest"
          jq -e --arg sha "$ARCHIVE_SHA" --arg src "$SOURCE_SHA" '
            .schema_version==1 and .source_commit==$src and
            .original_archive_sha256==$sha and
            .native_elf_declared_version_requirements==519' \
            "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" >/dev/null
      - name: Execute source-pinned gfxtest in separate private real Wayland compositor
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          bash ci/m3-gfxtest-private-wayland.sh \
            "$RUNNER_TEMP/package/vulpra" "$RUNNER_TEMP/gfxtest-ld-debug"
          python3 ci/m3-gfxtest-version-reconcile.py \
            --traces "$RUNNER_TEMP/gfxtest-ld-debug" \
            --static "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" \
            --output "$RUNNER_TEMP/m3-native-gfxtest-wayland-activation.json"
          jq -e --arg sha "$ARCHIVE_SHA" --arg src "$SOURCE_SHA" '
            .schema_version==1 and .original_compiled_source==$src and
            .original_native_archive_sha256==$sha and
            .real_wayland_gfxtest_connected_and_completed==true and
            .original_gfxtest_static_version_contracts==8 and
            .original_gfxtest_version_contracts_observed>0 and
            (.original_gfxtest_version_contracts_observed+
             .original_gfxtest_version_contracts_not_observed)==8 and
            .raw_loader_paths_or_pids_retained==false and
            .successful_gpu_acceleration_proven==false and
            .actual_symbol_bindings_proven==false and
            .new_source_removal_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-native-gfxtest-wayland-activation.json" >/dev/null
          echo 'PASS: real original Wayland helper activation plus exact ELF version checks'
      - name: Upload bounded compiled gfx-helper ABI evidence only
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-gfxtest-wayland-activation
          path: ${{ runner.temp }}/m3-native-gfxtest-wayland-activation.json
          if-no-files-found: error
          retention-days: 14
