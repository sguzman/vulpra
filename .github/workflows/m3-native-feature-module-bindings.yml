# Only original compiled ML/ClearKey C API diagnostic paths, with no egress.
name: M3 Original Native Inference and ClearKey Actual Bindings
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-feature-module-bindings.yml
      - ci/m3-native-original-feature-module-bindings.rs
      - ci/m3-mozinference-no-egress.sh
      - ci/m3-clearkey-no-egress.sh
      - ci/m3-mozinference-capi-probe.rs
      - ci/m3-clearkey-negative-capi-probe.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  two-original-no-egress-capi-module-bindings:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout bounded C API tests and parser
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Unit-test bounded Rust parser and build native probes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-mozinference-no-egress.sh
          bash -n ci/m3-clearkey-no-egress.sh
          rustc --edition=2021 --test ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/module-binding-tests"
          "$RUNNER_TEMP/module-binding-tests"
          rustc --edition=2021 -O ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/module-binding-parser"
          rustc --edition=2021 -C opt-level=1 ci/m3-mozinference-capi-probe.rs -o "$RUNNER_TEMP/moz-original-probe"
          rustc --edition=2021 -C opt-level=1 ci/m3-clearkey-negative-capi-probe.rs -o "$RUNNER_TEMP/clearkey-original-probe"
      - name: Install no-egress and ELF loader prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 libstdc++6 libgomp1 libnss3 libnspr4 binutils
      - name: Authenticate original source, archive and two compiled exports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/vulpra/libmozinference.so"
          test -f "$RUNNER_TEMP/package/vulpra/gmp-clearkey/0.1/libclearkey.so"
          readelf -Ws "$RUNNER_TEMP/package/vulpra/libmozinference.so" |
            grep -E ' llama_log_set(@|$)' >/dev/null
          readelf -Ws "$RUNNER_TEMP/package/vulpra/gmp-clearkey/0.1/libclearkey.so" |
            grep -E ' CreateCdmInstance(@|$)' >/dev/null
      - name: Run only diagnostic original C API bindings under isolated network
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo unshare --net -- env \
            M3_NATIVE_BINDINGS_PARSER="$RUNNER_TEMP/module-binding-parser" \
            M3_NATIVE_BINDINGS_REPORT="$RUNNER_TEMP/mozinference-actual-bindings.json" \
            bash ci/m3-mozinference-no-egress.sh \
              "$RUNNER_TEMP/package/vulpra" "$RUNNER_TEMP/moz-original-probe" \
              "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz.sha256" \
              "$RUNNER_TEMP/unused-mozinference-abi-report.json"
          sudo unshare --net -- env \
            M3_NATIVE_BINDINGS_PARSER="$RUNNER_TEMP/module-binding-parser" \
            M3_NATIVE_BINDINGS_REPORT="$RUNNER_TEMP/clearkey-actual-bindings.json" \
            bash ci/m3-clearkey-no-egress.sh \
              "$RUNNER_TEMP/package/vulpra" "$RUNNER_TEMP/clearkey-original-probe" \
              "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz.sha256" \
              "$RUNNER_TEMP/unused-clearkey-abi-report.json"
          jq -e --arg sha "$ARCHIVE_SHA" --arg source "$SOURCE_SHA" '
            .schema_version==1 and
            .status=="original_native_feature_module_actual_symbol_bindings" and
            .original_source_commit==$source and .original_archive_sha256==$sha and
            .original_requester_basename=="libmozinference.so" and
            .normal_symbol_binding_events>0 and .distinct_symbol_provider_pairs>0 and
            .actual_normal_symbol_bindings_observed==true and
            .no_network_egress==true and .raw_loader_logs_exported==false and
            .symbol_names_exported==false and .model_inference_or_drm_decryption_proven==false and
            .all_lazy_or_transitive_bindings_proven==false and
            .new_source_pruning_authorized==false' "$RUNNER_TEMP/mozinference-actual-bindings.json" >/dev/null
          jq -e --arg sha "$ARCHIVE_SHA" --arg source "$SOURCE_SHA" '
            .schema_version==1 and
            .status=="original_native_feature_module_actual_symbol_bindings" and
            .original_source_commit==$source and .original_archive_sha256==$sha and
            .original_requester_basename=="libclearkey.so" and
            .normal_symbol_binding_events>0 and .distinct_symbol_provider_pairs>0 and
            .actual_normal_symbol_bindings_observed==true and
            .no_network_egress==true and .raw_loader_logs_exported==false and
            .symbol_names_exported==false and .model_inference_or_drm_decryption_proven==false and
            .all_lazy_or_transitive_bindings_proven==false and
            .new_source_pruning_authorized==false' "$RUNNER_TEMP/clearkey-actual-bindings.json" >/dev/null
          echo 'PASS: original compiled inference/ClearKey actual bindings; diagnostic routes only'
      - name: Upload sanitized provider names and counts only
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-feature-module-actual-bindings
          path: |
            ${{ runner.temp }}/mozinference-actual-bindings.json
            ${{ runner.temp }}/clearkey-actual-bindings.json
          if-no-files-found: error
          retention-days: 14
