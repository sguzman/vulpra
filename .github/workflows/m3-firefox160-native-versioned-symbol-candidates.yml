# Read-only exact Firefox160 .dynsym/VERNEED indexed name@version candidate audit.
# No ELF execution, linker relocation, optional dlopen, source deletion or release.
name: M3 Firefox 160 Native Versioned Symbol Candidate Coverage (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/m3-firefox160-native-versioned-symbol-candidates.yml
      - ci/m3-native-elf-symbol-provider-candidates.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-versioned-symbol-names:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Authenticate exact Firefox160 native producer, preservation and 521 GNU version-name candidate witnesses
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            for(const [id,sha,name] of [
              [43138458940,'0624235fdc956ab18af3c3f310b3588ca72fff61',
                'Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate'],
              [43724886827,'54728803f058c3edf54d2e8d3f6e0a7d2af0aec6',
                'Firefox 160 Verified Native Archive Preservation (No Build)'],
              [43730900702,'fd4dee8a9999c303ff35e45fbcd619abe230d30e',
                'M3 Firefox 160 Exact-Source Native ELF Package Graph (No Build)'],
              [43733171548,'2e1ca98e8ef500cad2666d7b25d4dc54674d6d02',
                'M3 Firefox 160 Native GNU Version-Name Contract (No Build)']]){
              const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
              if(run.repository?.full_name!=='sguzman/vulpra' ||
                 run.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
                 run.head_sha!==sha || run.name!==name ||
                 run.status!=='completed' || run.conclusion!=='success')
                throw Error('Wrong authenticated Firefox160 native/ABI input '+id);
            }
            for(const [id,name] of [
              [43724886827,'firefox160-vulpra-preserved-native-preview-not-approved'],
              [43724886827,'firefox160-vulpra-preserved-materialized-source-proof'],
              [43730900702,'firefox160-source-matched-native-elf-package-graph-not-m3-closure'],
              [43733171548,'firefox160-native-elf-gnu-version-contract-${{ matrix.os }}-not-m3-closure']]){
              const a=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {owner,repo,run_id:id,per_page:100});
              if(a.filter(x=>x.name===name&&!x.expired&&x.size_in_bytes>0 &&
                new Date(x.expires_at)>new Date()).length!==1)
                throw Error('Pinned source/ABI version artifact absent '+name);
            }
      - name: Checkout existing bounded native ELF version and symbol inspectors only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-native-elf-version-contract.py
            ci/m3-native-elf-symbol-provider-candidates.py
      - name: Reject malformed ABI index, source override and GNU symbol fixture records
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object ci/m3-native-elf-version-contract.py)" = "4239b4851966fdb796e02f38fcd0f9db161293e2"
          python3 -m py_compile ci/m3-native-elf-version-contract.py ci/m3-native-elf-symbol-provider-candidates.py
          python3 ci/m3-native-elf-version-contract.py --self-test
          python3 ci/m3-native-elf-symbol-provider-candidates.py --self-test
          if python3 ci/m3-native-elf-symbol-provider-candidates.py --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b --self-test >/dev/null 2>&1; then
            echo 'Unpaired source/version input accepted' >&2; exit 1
          fi
          if python3 ci/m3-native-elf-symbol-provider-candidates.py --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b --archive-sha256 wrong --self-test >/dev/null 2>&1; then
            echo 'Malformed archive SHA accepted' >&2; exit 1
          fi
      - name: Download original unmodified Firefox160 native browser and checksum
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native
      - name: Download exact full Firefox160 28-overlay source proof
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source
      - name: Download independently checked original 28-ELF direct census
        uses: actions/download-artifact@v4
        with:
          name: firefox160-source-matched-native-elf-package-graph-not-m3-closure
          repository: sguzman/vulpra
          run-id: 43730900702
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/graph
      - name: Download independently checked 521 source-pinned GNU version-name candidate report
        uses: actions/download-artifact@v4
        with:
          name: firefox160-native-elf-gnu-version-contract-${{ matrix.os }}-not-m3-closure
          repository: sguzman/vulpra
          run-id: 43733171548
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/versions
      - name: Install bounded readelf and normal native Ubuntu version provider libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          case "$RUNNER_OS:$ImageOS" in
            Linux:ubuntu22) gtk=libgtk-3-0; alsa=libasound2 ;;
            Linux:ubuntu24) gtk=libgtk-3-0t64; alsa=libasound2t64 ;;
            *) echo 'Unsupported Ubuntu CI' >&2; exit 1 ;;
          esac
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends binutils jq "$gtk" libdbus-glib-1-2 "$alsa" libnss3 libgbm1
          test -x /sbin/ldconfig
          command -v readelf
      - name: Authenticate original native SHA256/source and separate 521-version candidate identities
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$RUNNER_TEMP/source/materialized-candidate.json" >/dev/null
          (cd "$RUNNER_TEMP/native" && sha256sum -c vulpra-firefox160-native-ci.tar.xz.sha256)
          digest="$(sha256sum "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz" | cut -d ' ' -f1)"
          jq -e --arg digest "$digest" '
            .schema_version==1 and .archive_sha256==$digest and
            .firefox160_upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .firefox160_candidate_git_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            (.elf_members|length)==28 and .direct_needed_edges==268 and
            .all_native_binary_execution_avoided==true and
            .complete_native_ffi_dependency_map_proven==false and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/graph/firefox160-source-matched-native-elf-graph.json" >/dev/null
          jq -e --arg digest "$digest" --arg os "${{ matrix.os }}" '
            .schema_version==1 and
            .source_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .original_archive_sha256==$digest and
            .scanned_userspace_id=="ubuntu" and
            .scanned_userspace_version==($os|ltrimstr("ubuntu-")) and
            .scanned_native_elf_files==28 and
            .native_elf_declared_version_requirements==521 and
            .candidate_version_name_present_count==521 and
            .candidate_version_name_absent_count==0 and
            .candidate_version_name_unavailable_count==0 and
            .target_host_kernel_verified==false and
            .actual_symbol_resolution_proven==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/versions/firefox160-elf-version-contract-${{ matrix.os }}.json" >/dev/null
      - name: Inspect exact version-indexed undefined symbols against packaged and host candidates
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz"
          digest="$(sha256sum "$archive" | cut -d ' ' -f1)"
          python3 ci/m3-native-elf-symbol-provider-candidates.py \
            --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b \
            --archive-sha256 "$digest" --archive "$archive" \
            --output "$RUNNER_TEMP/firefox160-versioned-symbol-candidates-${{ matrix.os }}.json"
          jq -e --arg digest "$digest" --arg os "${{ matrix.os }}" '
            .schema_version==1 and
            .original_native_source_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .original_archive_sha256==$digest and
            .scanned_userspace_id=="ubuntu" and
            .scanned_userspace_version==($os|ltrimstr("ubuntu-")) and
            .target_host_kernel_verified==false and
            .original_native_elf_members==28 and
            .versioned_undefined_dynamic_symbol_imports>=4000 and
            .versioned_undefined_dynamic_symbol_imports<=7000 and
            .versioned_undefined_dynamic_symbol_imports==(.versioned_import_candidate_details|length) and
            .versioned_undefined_dynamic_symbol_imports==
              (.declared_provider_candidate_export_name_matches+
               .modern_glibc_libc_consolidation_name_candidates+
               .provider_candidate_unavailable+
               .versioned_symbol_candidate_name_not_found) and
            .provider_candidate_unavailable==0 and
            .versioned_symbol_candidate_name_not_found==0 and
            .unversioned_imports_examined==false and
            .actual_elf_symbol_bindings_resolved==false and
            .host_ldconfig_candidate_is_runtime_selected_proven==false and
            .target_arch_hyprland_symbol_abi_proven==false and
            .browser_or_host_elf_executed==false and
            .new_source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/firefox160-versioned-symbol-candidates-${{ matrix.os }}.json" >/dev/null
          jq -r '"PASS: exact Firefox160 GNU-indexed name@version imports matched " +
            (.versioned_undefined_dynamic_symbol_imports|tostring) +
            " of " + (.versioned_undefined_dynamic_symbol_imports|tostring) +
            " packaged/host candidate export names (NOT real binding)"' \
            "$RUNNER_TEMP/firefox160-versioned-symbol-candidates-${{ matrix.os }}.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'LIMIT: individual static versioned name@version candidate only, not all unversioned imports, actual relocations, dynamic dlopen, target host or pruning approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive bounded Firefox160 versioned symbol names and conservative scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-versioned-symbol-candidates-${{ matrix.os }}-not-abi-release
          path: ${{ runner.temp }}/firefox160-versioned-symbol-candidates-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 30
