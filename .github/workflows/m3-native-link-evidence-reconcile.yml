# Cross-check every native-build JSON against one exact source and compiled binary.
# Does not rebuild Firefox or trust a lone successful workflow label.
name: M3 Source Matched Native Evidence Reconciliation

on:
  push:
    branches: [main]
    paths:
      - ci/m3-native-link-evidence-ledger.py
      - ci/m3-current-local-tls-native-evidence.jq
      - ci/m3-current-ffi-native-evidence.jq
      - ci/m3-current-gkrust-machine-branches-evidence.jq
      - ci/m3-current-crashhelper-machine-branch-evidence.jq
      - ci/tests/m3-current-crashhelper-machine-branch-evidence-tests.sh
      - ci/tests/m3-current-gkrust-machine-branches-evidence-tests.sh
      - ci/tests/m3-current-ffi-native-evidence-tests.sh
      - ci/tests/m3-current-local-tls-native-evidence-tests.sh
      - .github/workflows/m3-native-link-evidence-reconcile.yml
  workflow_run:
    workflows:
      - M3 Source Matched Native Link Inputs and Runtime
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  reject-unsuccessful-original-native-run:
    if: >-
      github.repository == 'sguzman/vulpra' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == 'sguzman/vulpra' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name == 'M3 Source Matched Native Link Inputs and Runtime' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Explicitly reject failed, timed-out, cancelled or skipped native builds
        shell: bash
        env:
          ORIGINAL_NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
          ORIGINAL_NATIVE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::error::Native browser run ${ORIGINAL_NATIVE_RUN_ID} concluded '${ORIGINAL_NATIVE_CONCLUSION}'; no full package/runtime acceptance is possible."
          exit 1

  validate-negative-fixtures:
    if: github.repository == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout bounded evidence validator
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Reject fabricated native config/hash/runtime attestations
        run: |
          set -euo pipefail
          python3 -m py_compile ci/m3-native-link-evidence-ledger.py
          python3 ci/m3-native-link-evidence-ledger.py --self-test
          bash ci/tests/m3-current-local-tls-native-evidence-tests.sh
          bash ci/tests/m3-current-ffi-native-evidence-tests.sh
          bash ci/tests/m3-current-gkrust-machine-branches-evidence-tests.sh
          bash ci/tests/m3-current-crashhelper-machine-branch-evidence-tests.sh

  reconcile-real-native-run:
    if: >-
      github.repository == 'sguzman/vulpra' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == 'sguzman/vulpra' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    needs: validate-negative-fixtures
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
      NATIVE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout only bounded verifier, not native build source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Independently confirm successful original native run and exact head SHA
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" \
            > "$RUNNER_TEMP/native-run-metadata.json"
          jq -e \
            --arg sha "$NATIVE_SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" \
            '.id == $run and .head_sha == $sha and
             .status == "completed" and .conclusion == "success" and
             .name == "M3 Source Matched Native Link Inputs and Runtime"' \
            "$RUNNER_TEMP/native-run-metadata.json" >/dev/null
          echo "PASS: original full native workflow actually succeeded at expected SHA"
      - name: Retrieve one bounded original run evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-source-matched-native-link-evidence \
            --dir "$RUNNER_TEMP/native-evidence"
      - name: Reconcile all source, binary, SHA and real runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,sys
          root=Path(os.environ["RUNNER_TEMP"])/"native-evidence"
          names={
            "config":"m3-native-link-config.json",
            "link":"m3-native-link-inputs.json",
            "elf":"m3-native-link-elf-package-graph.json",
            "localhost":"m3-localhost-acceptance.json",
            "webextension":"webextension-smoke-*.json",
            "sidecar":"vulpra-local-m3-native-link-ci.tar.xz.sha256",
          }
          args=[]
          for k,pattern in names.items():
              matches=list(root.rglob(pattern))
              if len(matches)!=1:
                  raise SystemExit("FAIL: expected one "+k+" record; found "+str(len(matches)))
              args += ["--"+k,str(matches[0])]
          args += ["--source-sha",os.environ["NATIVE_SOURCE_SHA"],
                   "--run-id",os.environ["NATIVE_RUN_ID"],
                   "--output",str(Path(os.environ["RUNNER_TEMP"])/"m3-native-link-reconciled.json")]
          subprocess.run([sys.executable,"ci/m3-native-link-evidence-ledger.py",*args],check=True)
          PY
          jq -e \
            --arg sha "$NATIVE_SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" \
            '.source_commit==$sha and .workflow_run_id==$run and
             .status=="passed_full_native_evidence_reconciliation" and
             .GTK_before_Wayland == true and
             .Wayland_JS_WebExtension_Nimbus_passed == true and
             .complete_resolved_linker_symbol_map == false and
             .lean_full_source_matched_pair_done == false and
             .compiled_package_savings_bytes == null and
             .additional_source_removal_authorized == false' \
            "$RUNNER_TEMP/m3-native-link-reconciled.json" >/dev/null
      - name: Independently reconcile current packaged browser TLS certificate rejection
        shell: bash
        run: |
          set -euo pipefail
          # This runs ONLY after separately checking the completed successful
          # native Actions workflow and its exact head SHA. Do not reuse a
          # synthetic fixture or downgrade missing TLS output to a skip.
          evidence="$RUNNER_TEMP/native-evidence"
          mapfile -t links < <(find "$evidence" -type f -name m3-native-link-inputs.json -print)
          mapfile -t local < <(find "$evidence" -type f -name m3-localhost-acceptance.json -print)
          mapfile -t webext < <(find "$evidence" -type f -name 'webextension-smoke-*.json' -print)
          test "${#links[@]}" -eq 1
          test "${#local[@]}" -eq 1
          test "${#webext[@]}" -eq 1
          jq -n \
            --slurpfile link "${links[0]}" \
            --slurpfile local "${local[0]}" \
            --slurpfile webextension "${webext[0]}" \
            --arg source_sha "$NATIVE_SOURCE_SHA" \
            --argjson run_id "$NATIVE_RUN_ID" \
            -f ci/m3-current-local-tls-native-evidence.jq \
            > "$RUNNER_TEMP/m3-current-local-tls-reconciled.json"
          jq -e \
            --arg sha "$NATIVE_SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" \
            '
              .schema_version == 1 and
              .status == "bounded_current_native_local_certificate_rejection_crosscheck" and
              .authenticated_source_sha == $sha and
              .authenticated_workflow_run_id == $run and
              .verified_current_native_loopback_self_signed_tls_denial == true and
              .webdriver_insecure_cert_overrides_enabled == false and
              .certificate_store_modified == false and
              .safe_browsing_proven == false and
              .sandbox_process_denial_proven == false and
              .no_background_network_egress_proven == false and
              .all_conditional_ffi_dlopen_proven == false and
              .target_endeavouros_hyprland_tested == false and
              .m3_sixth_gate_closed == false and
              .additional_source_pruning_authorized == false and
              .marginal_native_savings_bytes == null
            ' "$RUNNER_TEMP/m3-current-local-tls-reconciled.json" >/dev/null
          echo "PASS: independent source-linked current native package and W3C certificate rejection crosscheck"

      - name: Independently reconcile current compiled Rust archive and linked ELF FFI symbols
        shell: bash
        run: |
          set -euo pipefail
          # Only reached after the exact source-pinned full native workflow's
          # completed-success identity and native package evidence are checked.
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-current-native-rust-ffi-archive-evidence \
            --dir "$RUNNER_TEMP/ffi-evidence"
          mapfile -t native < <(find "$RUNNER_TEMP/native-evidence" \
            -type f -name m3-native-link-inputs.json -print)
          mapfile -t ffi < <(find "$RUNNER_TEMP/ffi-evidence" \
            -type f -name m3-current-ffi-archive-members.json -print)
          test "${#native[@]}" -eq 1
          test "${#ffi[@]}" -eq 1
          jq -n \
            --slurpfile link "${native[0]}" \
            --slurpfile ffi "${ffi[0]}" \
            --arg source "$NATIVE_SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" \
            -f ci/m3-current-ffi-native-evidence.jq \
            > "$RUNNER_TEMP/m3-current-ffi-native-reconciled.json"
          jq -e --arg sha "$NATIVE_SOURCE_SHA" --argjson run "$NATIVE_RUN_ID" '
            .schema_version == 1 and
            .status == "source_linked_compiled_gkrust_archive_ffi_definitions_reconciled" and
            .source_commit == $sha and
            .native_run_id == $run and
            .actual_native_runtime_evidence_joined == true and
            .two_named_rust_archive_and_elf_definitions_verified == true and
            .named_source_owned_archive_ffi_pairs == 2 and
            .complete_archive_member_to_linker_selection_graph_proven == false and
            .complete_cpp_rust_ffi_graph_proven == false and
            .indirect_runtime_ffi_and_dlopen_closure_proven == false and
            .target_endeavouros_hyprland_workstation_verified == false and
            .new_source_pruning_authorized == false and
            .m3_sixth_gate_closed == false
          ' "$RUNNER_TEMP/m3-current-ffi-native-reconciled.json" >/dev/null
          echo "PASS: independent current linked Rust member and ELF SHA evidence; not full FFI or M3 acceptance"

      - name: Independently reconcile real current C++ XPCOM direct branches to Rust FFI exports
        shell: bash
        run: |
          set -euo pipefail
          # The native CI run already passed the source/package/runtime and
          # compiled Rust archive audit; this separate action rechecks the
          # precise unstripped libxul identity across all three reports.
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-current-native-gkrust-direct-branch-evidence \
            --dir "$RUNNER_TEMP/direct-evidence"
          mapfile -t linked < <(find "$RUNNER_TEMP/native-evidence" \
            -type f -name m3-native-link-inputs.json -print)
          mapfile -t rustffi < <(find "$RUNNER_TEMP/ffi-evidence" \
            -type f -name m3-current-ffi-archive-members.json -print)
          mapfile -t branches < <(find "$RUNNER_TEMP/direct-evidence" \
            -type f -name m3-current-gkrust-direct-branches.json -print)
          test "${#linked[@]}" -eq 1
          test "${#rustffi[@]}" -eq 1
          test "${#branches[@]}" -eq 1
          jq -n \
            --slurpfile link "${linked[0]}" \
            --slurpfile ffi "${rustffi[0]}" \
            --slurpfile direct "${branches[0]}" \
            --arg source "$NATIVE_SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" \
            -f ci/m3-current-gkrust-machine-branches-evidence.jq \
            > "$RUNNER_TEMP/m3-current-gkrust-machine-branches-reconciled.json"
          jq -e --arg sha "$NATIVE_SOURCE_SHA" --argjson run "$NATIVE_RUN_ID" '
            .schema_version == 1 and
            .status == "actual_current_compiled_three_cpp_gkrust_machine_branches_joined_to_source_owned_archive_exports" and
            .native_source_commit == $sha and .native_run_id == $run and
            .actual_native_build_and_runtime_joined == true and
            .verified_rust_ffi_archive_symbols == 2 and
            .verified_actual_current_cpp_direct_branch_callers == 3 and
            .complete_compiled_linker_selection_map_proven == false and
            .all_cpp_rust_ffi_edges_enumerated == false and
            .indirect_ffi_and_dlopen_closure_proven == false and
            .target_endeavouros_hyprland_verified == false and
            .new_source_pruning_authorized == false and .m3_sixth_gate_closed == false
          ' "$RUNNER_TEMP/m3-current-gkrust-machine-branches-reconciled.json" >/dev/null
          echo "PASS: independent three current C++ direct machine branches join the compiled Rust staticlib and exact libxul ELF"
          echo "LIMIT: not complete Rust/C++ FFI or indirect loader closure"

      - name: Independently reconcile current linked crashhelper main to named Rust ABI call
        shell: bash
        run: |
          set -euo pipefail
          # The preceding native run is already checked against original
          # GitHub Actions success metadata, source SHA and runtime records.
          # Older native runs did not produce this new separate artifact;
          # don't rewrite their historical acceptance as a crashhelper pass.
          introduced=20f9caa74c099eba87d1808a907b1d7242c8cd9d
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$introduced...$NATIVE_SOURCE_SHA" --jq '.status')"
          if test "$status" = behind; then
            echo "Historical compiled native run predates current crashhelper machine branch audit"
            exit 0
          fi
          if test "$status" != identical && test "$status" != ahead; then
            echo "::error::Cannot establish current native source descent for crashhelper FFI verifier: $status"
            exit 1
          fi
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-current-native-crashhelper-direct-branch-evidence \
            --dir "$RUNNER_TEMP/crashhelper-evidence"
          mapfile -t native < <(find "$RUNNER_TEMP/native-evidence" \
            -type f -name m3-native-link-inputs.json -print)
          mapfile -t crash < <(find "$RUNNER_TEMP/crashhelper-evidence" \
            -type f -name m3-current-crashhelper-direct-branch.json -print)
          mapfile -t package < <(find "$RUNNER_TEMP/native-evidence" \
            -type f -name m3-native-link-elf-package-graph.json -print)
          test "${#native[@]}" -eq 1
          test "${#crash[@]}" -eq 1
          test "${#package[@]}" -eq 1
          jq -n \
            --slurpfile link "${native[0]}" \
            --slurpfile crash "${crash[0]}" \
            --slurpfile package "${package[0]}" \
            --arg source "$NATIVE_SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" \
            -f ci/m3-current-crashhelper-machine-branch-evidence.jq \
            > "$RUNNER_TEMP/m3-current-crashhelper-machine-branch-reconciled.json"
          jq -e --arg sha "$NATIVE_SOURCE_SHA" --argjson run "$NATIVE_RUN_ID" '
            .schema_version == 1 and
            .status == "source_matched_current_linked_crashhelper_direct_ffi_machine_branch_reconciled" and
            .native_source_commit == $sha and .native_run_id == $run and
            .authenticated_native_build_and_runtime_joined == true and
            .verified_exact_crashhelper_main_direct_branch_count == 1 and
            .exact_packaged_crashhelper_present == true and
            (.packaged_crashhelper_sha256 | test("^[0-9a-f]{64}$")) and
            (.packaged_crashhelper_bytes > 64) and
            .byte_equal_unstripped_to_packaged_crashhelper_verified == false and
            .independent_unstripped_crashhelper_elf_hash_witnessed_elsewhere == false and
            .rust_archive_member_source_proven == false and
            .complete_cpp_rust_ffi_graph_proven == false and
            .conditional_or_indirect_ffi_closure_proven == false and
            .target_endeavouros_hyprland_verified == false and
            .source_pruning_authorized == false and .m3_sixth_gate_closed == false
          ' "$RUNNER_TEMP/m3-current-crashhelper-machine-branch-reconciled.json" >/dev/null
          echo "PASS: current linked crashhelper direct ABI branch joined to authenticated native runtime and packaged ELF inventory"
          echo "LIMIT: no independently archived crashhelper binary or Rust archive provenance"

      - name: Preserve only bounded reconciled source and runtime attestations
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-link-reconciled-evidence
          path: |
            ${{ runner.temp }}/m3-native-link-reconciled.json
            ${{ runner.temp }}/m3-current-local-tls-reconciled.json
            ${{ runner.temp }}/m3-current-ffi-native-reconciled.json
            ${{ runner.temp }}/m3-current-gkrust-machine-branches-reconciled.json
            ${{ runner.temp }}/m3-current-crashhelper-machine-branch-reconciled.json
          if-no-files-found: error
          retention-days: 14
