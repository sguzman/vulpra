# Independently validate the concrete outcome of one already-successful
# source-matched *packaged browser* optional-provider denial probe.
# No second full Firefox build and no new source removal.
name: M3 Current Packaged Provider Denial Reconciliation
on:
  push:
    branches: [main]
    paths:
      - ci/m3-packaged-optional-provider-reconcile.jq
      - ci/tests/m3-packaged-optional-provider-reconcile-tests.sh
      - .github/workflows/m3-current-packaged-provider-denial-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independently-reconcile-real-denied-ffmpeg-and-nohit-graphics:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${ github.token }}
      SOURCE_SHA: d7bf1cb73b384df047871d6b8c608312eb6cb5b4
      NATIVE_RUN_ID: "42546880350"
      NATIVE_RECONCILIATION_RUN_ID: "42551783346"
    steps:
      - name: Checkout only read-only bounded evidence validator
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-packaged-optional-provider-reconcile.jq
            ci/tests/m3-packaged-optional-provider-reconcile-tests.sh

      - name: Authenticate actual successful normal native and independent reconciler run identities
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" \
            > "$RUNNER_TEMP/native-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" '
            .id == $run and .head_sha == $sha and
            .head_repository.full_name == $repo and
            .head_branch == "main" and .event == "push" and
            .name == "M3 Source Matched Native Link Inputs and Runtime" and
            .path == ".github/workflows/m3-source-matched-native-link.yml" and
            .run_attempt == 1 and .status == "completed" and
            .conclusion == "success"
          ' "$RUNNER_TEMP/native-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RECONCILIATION_RUN_ID" \
            > "$RUNNER_TEMP/reconciliation-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" \
            --argjson run "$NATIVE_RECONCILIATION_RUN_ID" '
            .id == $run and .head_repository.full_name == $repo and
            .name == "M3 Source Matched Native Evidence Reconciliation" and
            .path == ".github/workflows/m3-native-link-evidence-reconcile.yml" and
            .event == "workflow_run" and .status == "completed" and
            .conclusion == "success"
          ' "$RUNNER_TEMP/reconciliation-run.json" >/dev/null
          echo "PASS: successful exact-source real packaged native run and separate native reconciler authenticated"

      - name: Download exact original native package denial and reconciliation evidence
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-source-matched-native-link-evidence --dir "$RUNNER_TEMP/native"
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-current-packaged-optional-provider-denial-evidence \
            --dir "$RUNNER_TEMP/denial"
          gh run download "$NATIVE_RECONCILIATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-link-reconciled-evidence \
            --dir "$RUNNER_TEMP/reconciled"
          mapfile -t native < <(find "$RUNNER_TEMP/native" \
            -type f -name m3-native-link-inputs.json -print)
          mapfile -t denial < <(find "$RUNNER_TEMP/denial" \
            -type f -name m3-packaged-provider-denial-runtime.json -print)
          mapfile -t reconciled < <(find "$RUNNER_TEMP/reconciled" \
            -type f -name m3-native-link-reconciled.json -print)
          test "${#native[@]}" -eq 1
          test "${#denial[@]}" -eq 1
          test "${#reconciled[@]}" -eq 1
          printf '%s\n' "${native[0]}" "${denial[0]}" "${reconciled[0]}" \
            > "$RUNNER_TEMP/exact-evidence-paths"
          echo "PASS: exactly one original native, bounded denial, and independent reconciliation JSON"

      - name: Reject 26 forged real source packaged and provider-denial evidence states
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < "$RUNNER_TEMP/exact-evidence-paths"
          test "${#paths[@]}" -eq 3
          bash ci/tests/m3-packaged-optional-provider-reconcile-tests.sh \
            "${paths[0]}" "${paths[1]}" "${paths[2]}" \
            "$SOURCE_SHA" "$NATIVE_RUN_ID" "$NATIVE_RECONCILIATION_RUN_ID"

      - name: Produce precisely scoped current packaged Firefox FFmpeg fallback witness
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < "$RUNNER_TEMP/exact-evidence-paths"
          jq -n \
            --slurpfile native "${paths[0]}" \
            --slurpfile denial "${paths[1]}" \
            --slurpfile reconciled "${paths[2]}" \
            --arg source "$SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" \
            --argjson recon_run "$NATIVE_RECONCILIATION_RUN_ID" \
            -f ci/m3-packaged-optional-provider-reconcile.jq \
            > "$RUNNER_TEMP/m3-current-real-packaged-provider-denial-reconciled.json"
          jq -e '
            .schema_version==1 and
            .status=="independent_current_real_packaged_ffmpeg_denials_and_nohit_graphics_probes_reconciled" and
            .normal_native_runtime_and_package_authentic==true and
            .separate_source_matched_native_reconciliation_passed==true and
            .ffmpeg_actual_dynamic_loads_intentionally_denied==14 and
            .ffmpeg_browser_screenshot_after_denials==true and
            .gbm_load_denials_observed==0 and
            .vaapi_load_denials_observed==0 and
            .gbm_and_vaapi_missing_library_paths_exercised==false and
            .actual_video_playback_or_software_decoder_fallback_proven==false and
            .actual_Wayland_gpu_DMABuf_failure_fallback_proven==false and
            .user_endeavouros_hyprland_qa_performed==false and
            .m3_sixth_gate_closed==false and
            .source_pruning_authorized==false and
            .security_hotfix_release_ready==false
          ' "$RUNNER_TEMP/m3-current-real-packaged-provider-denial-reconciled.json" >/dev/null
          echo "PASS: actual source-matched packaged Vulpra survived 14 denied FFmpeg calls"
          echo "LIMIT: GBM/VA-API had zero denial hits; no video decoding, software codec fallback, GPU/DMABuf or complete loader graph established"

      - name: Preserve only conservative real packaged provider-denial reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-real-packaged-provider-denial-reconciled
          path: ${ runner.temp }}/m3-current-real-packaged-provider-denial-reconciled.json
          if-no-files-found: error
          retention-days: 14
