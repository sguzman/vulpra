# Isolated full native Linux PromoCard opt-in package and runtime proof.
# Real JS bundle presence/absence is checked in packaged omni.ja.
# A separate normal source-matched native package is required for byte comparison.
name: M3 Native New Tab PromoCard Opt-out Trial

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-promocard-native.yml
      - browser/extensions/newtab/webpack.system-addon.config.js
      - browser/extensions/newtab/build-newtab-bundles.py
      - browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx
      - browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/PromoCard/**
      - ci/m3-promocard-package-evidence.py
      - ci/mozconfig-linux-m3-promocard-experiment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulpra-m3-promocard-native
  cancel-in-progress: false

jobs:
  verify-promocard-omission:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-promocard-experiment
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
      VULPRA_M3_VERIFY_NIMBUS: "1"
    steps:
      - name: Check out entire pinned browser
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact source contract before expensive native compilation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ci/tests/m3-promocard-bundle-contract.py
          test -f ci/m3-promocard-package-evidence.py
          grep -Fxq 'export VULPRA_EXPERIMENT_NO_NEWTAB_PROMOCARD=1' "$MOZCONFIG"
          echo "PASS: Linux opt-in PromoCard source and protected feed contract"

      - name: Prepare Mozilla compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap supported native compiler and graphical tests
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends python3 python3-venv python3-dev \
            git curl make jq weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || \
             ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
          major="$("$HOME/.mozbuild/clang/bin/clang" --version | head -1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 19 ))
          echo "PASS: supported Clang $major ready for native build"

      - name: Configure isolated PromoCard flag and protect normal browser features
        shell: bash
        run: |
          set -euo pipefail
          ./mach configure
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("obj-vulpra-linux-m3-promocard-experiment/config.statusd")
          def get(k):
              p=root/"substs"/k
              return json.loads(p.read_text()) if p.exists() else None
          assert get("VULPRA_NO_NEWTAB_PROMOCARD") in (True,1),get("VULPRA_NO_NEWTAB_PROMOCARD")
          assert get("MOZ_WIDGET_TOOLKIT")=="gtk"
          assert get("MOZ_APP_BASENAME")=="Vulpra"
          assert get("MOZ_DEVTOOLS")=="all"
          for key in ("MOZ_SANDBOX","MOZ_WAYLAND","MOZ_SERVICES_SYNC","MOZ_NORMANDY"):
              assert str(get(key)) in ("True","1"),(key,get(key))
          for key in ("VULPRA_NO_NEWTAB_ADSFEED","VULPRA_NO_ASROUTER_PROMOS"):
              assert get(key) in (None,False,0,""),(key,get(key))
              assert not (root/"defines"/key).exists(),key
          print("PASS: explicit PromoCard Linux opt-out with all other protected features")
          PY

      - name: Reserve 24 GiB native Rust compilation swap
        shell: bash
        run: |
          set -euo pipefail
          swap=/mnt/vulpra-m3-promocard.swap
          available="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( available > 24*1024*1024*1024 + 8*1024*1024*1024 ))
          sudo fallocate -l 24G "$swap"
          sudo chmod 0600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          grep -Fq "$swap" /proc/swaps

      - name: Compile complete native Linux browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-promocard-build.log"

      - name: Package and independently checksum experimental browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist=obj-vulpra-linux-m3-promocard-experiment/dist
          mapfile -d '' -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print0)
          [[ "${#archives[@]}" -eq 1 ]]
          mkdir -p .git/vulpra-native-build/packages
          bash packaging/stage.sh "${archives[0]}" \
            "$GITHUB_WORKSPACE/.git/vulpra-native-build/packages/vulpra-local-m3-promocard-ci.tar.xz"
          (cd .git/vulpra-native-build/packages && \
            sha256sum -c vulpra-local-m3-promocard-ci.tar.xz.sha256)

      - name: Verify original promo omitted from actual packaged New Tab JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/m3-promocard-package-evidence.py \
            --archive .git/vulpra-native-build/packages/vulpra-local-m3-promocard-ci.tar.xz \
            --source-commit "$GITHUB_SHA" --variant optin \
            --output "$RUNNER_TEMP/m3-promocard-evidence.json"

      - name: Exercise real Wayland, JS, New Tab, WebExtensions and Nimbus
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          tar -xf .git/vulpra-native-build/packages/vulpra-local-m3-promocard-ci.tar.xz -C "$work"
          mapfile -d '' -t inis < <(find "$work" -maxdepth 5 -type f -name application.ini -print0)
          [[ "${#inis[@]}" -eq 1 ]]
          VULPRA_WAYLAND_TEST_SECONDS=12 bash packaging/test-wayland.sh "$(dirname "${inis[0]}")"
          python3 ci/smoke-m3-localhost-package.py "$GITHUB_WORKSPACE"
          PATH="$RUNNER_TEMP:$PATH" python3 ci/smoke-webextension-package-local.py "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"m3-promocard-evidence.json"
          report=json.loads(path.read_text())
          report["status"]="native runtime accepted; matched comparison pending"
          report["tested"]={"wayland":True,"js":True,"newtab":True,
                            "webextensions":True,"nimbus":True,
                            "firefox_profile_isolation":True}
          path.write_text(json.dumps(report,indent=2)+"\n")
          PY

      - name: Preserve exact bounded build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-promocard-native-evidence
          path: |
            ${{ runner.temp }}/m3-promocard-evidence.json
            .git/vulpra-native-build/packages/vulpra-local-m3-promocard-ci.tar.xz.sha256
            .git/vulpra-native-build/m3-localhost-acceptance.json
            .git/vulpra-native-build/webextension-smoke-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Capture bounded compilation diagnostics
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-promocard-build.log"; then
            tail -n 3500 "$RUNNER_TEMP/m3-promocard-build.log" > \
              "$RUNNER_TEMP/m3-promocard-failure-tail.log"
          fi

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-promocard-failure-tail
          path: ${{ runner.temp }}/m3-promocard-failure-tail.log
          if-no-files-found: warn
          retention-days: 14
