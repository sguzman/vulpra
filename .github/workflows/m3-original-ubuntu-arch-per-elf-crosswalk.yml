# Reconcile independent real Ubuntu and Arch read-only glibc loader metadata
# per original compiled ELF. No native application entrypoints or rebuild.
name: M3 Original Per-ELF Ubuntu Arch Loader Crosswalk
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-ubuntu-arch-per-elf-crosswalk.yml
      - ci/m3-original-ubuntu-arch-per-elf-dependency-crosswalk.jq
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-pinned-28-original-elf-crosswalk:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      MATRIX_RUN: '41513030899'
      MATRIX_HEAD: a5dd56b53427d8e70545fd5a684348d8a8386c17
      ARCH_RUN: '41515240015'
      ARCH_HEAD: 050fea70cf5fe1232ca94f9e775f9c819eab43d9
    steps:
      - name: Checkout original crosswalk logic only
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-ubuntu-arch-per-elf-dependency-crosswalk.jq
      - name: Authenticate both independently successful original metadata runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq --version
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MATRIX_RUN" |
            jq -e --arg sha "$MATRIX_HEAD" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and
              .path==".github/workflows/m3-original-28-elf-feature-loader-binding-matrix.yml"
            ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARCH_RUN" |
            jq -e --arg sha "$ARCH_HEAD" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and
              .path==".github/workflows/m3-original-native-arch-loader-list.yml"
            ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MATRIX_RUN/artifacts?per_page=40" |
            jq -e '
              [.artifacts[]|select(.name=="m3-original-28-elf-feature-loader-binding-matrix" and
               .expired==false and .size_in_bytes>0)]|length==1
            ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARCH_RUN/artifacts?per_page=40" |
            jq -e '
              [.artifacts[]|select(.name=="m3-original-archlinux-all-28-elf-loader-list" and
               .expired==false and .size_in_bytes>0)]|length==1
            ' >/dev/null
      - name: Download two bounded source-pinned JSON evidence artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix" "$RUNNER_TEMP/arch"
          gh run download "$MATRIX_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-28-elf-feature-loader-binding-matrix \
            --dir "$RUNNER_TEMP/matrix"
          gh run download "$ARCH_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-archlinux-all-28-elf-loader-list \
            --dir "$RUNNER_TEMP/arch"
          test -s "$RUNNER_TEMP/matrix/m3-original-28-elf-feature-loader-binding-matrix.json"
          test -s "$RUNNER_TEMP/arch/original-arch-platform-audit.json"
      - name: Join all 28 original per-file source and native loader provider sets
        shell: bash
        run: |
          set -euo pipefail
          audit() {
            jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
              --argjson arch_run "$ARCH_RUN" \
              --slurpfile matrix "$1" --slurpfile arch "$2" \
              -f ci/m3-original-ubuntu-arch-per-elf-dependency-crosswalk.jq
          }
          old="$RUNNER_TEMP/matrix/m3-original-28-elf-feature-loader-binding-matrix.json"
          arch="$RUNNER_TEMP/arch/original-arch-platform-audit.json"
          out="$RUNNER_TEMP/original-28-per-elf-ubuntu-arch-crosswalk.json"
          audit "$old" "$arch" >"$out"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_28_elf_ubuntu_arch_per_elf_loader_and_source_crosswalk_verified" and
            .original_source_commit==$src and .original_archive_sha256==$sha and
            .source_manifest_owners==28 and .resolved_ubuntu_direct_needed==268 and
            .resolved_arch_direct_needed==268 and
            .ubuntu_loader_provider_occurrences==586 and
            .arch_loader_provider_occurrences==584 and
            .ubuntu_distinct_provider_names==91 and .arch_distinct_provider_names==90 and
            (.common_global_provider_basenames|length)==81 and
            (.ubuntu_only_global_provider_basenames|length)==10 and
            (.arch_only_global_provider_basenames|length)==9 and
            .original_runtime_requester_observed_count==28 and
            (.rows|length)==28 and
            (all(.rows[]; .direct_needed_cross_distro_count_matches==true and
              .source_manifest_anchor_line>0 and
              (.arch_loader_provider_basenames|length)==.arch_loader_provider_count and
              (.common_provider_basenames|length)+(.ubuntu_only_provider_basenames|length)==.ubuntu_loader_provider_count and
              (.common_provider_basenames|length)+(.arch_only_provider_basenames|length)==.arch_loader_provider_count)) and
            .every_original_elf_has_arch_loader_provider_list==true and
            .every_elf_direct_needed_count_matches_across_distros==true and
            .per_elf_provider_names_are_metadata_only==true and
            .every_original_feature_route_proven==false and
            .complete_future_dlopen_closure_proven==false and
            .exact_target_endeavouros_hyprland_verified==false and
            .source_pruning_authorized==false and .native_bytes_saved==0 and
            .m3_sixth_gate_closed==false
          ' "$out" >/dev/null
          # Fail closed on a source/loader mismatch and a forged Arch provider.
          jq '.rows[0].ubuntu_direct_needed_count+=1' "$old" \
            >"$RUNNER_TEMP/modified-matrix.json"
          if audit "$RUNNER_TEMP/modified-matrix.json" "$arch" >/dev/null 2>&1; then
            echo 'FAIL: tampered original direct-needed count accepted' >&2; exit 1
          fi
          jq '.per_original_elf["libxul.so"].loader_listed_provider_basenames |= .[1:]' "$arch" \
            >"$RUNNER_TEMP/modified-arch.json"
          if audit "$old" "$RUNNER_TEMP/modified-arch.json" >/dev/null 2>&1; then
            echo 'FAIL: tampered Arch provider list accepted' >&2; exit 1
          fi
          echo 'PASS: all 28 exact-source original ELF Ubuntu and Arch per-binary loader maps independently crosschecked; no runtime or pruning claim'
      - name: Upload 28-row per-ELF source and two-platform loader crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-per-elf-ubuntu-arch-source-loader-crosswalk
          path: ${{ runner.temp }}/original-28-per-elf-ubuntu-arch-crosswalk.json
          if-no-files-found: error
          retention-days: 14
