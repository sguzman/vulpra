name: Build Linux baseline

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '!docs/vulpra/**'
      - '!ci/**'
      - '!packaging/**'
      - '!README.md'
      - '!AGENTS.md'
      - '!scripts/import-firefox.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulpra-linux-build
  cancel-in-progress: false

jobs:
  build-linux:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
    steps:
      - name: Check out imported Firefox source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preflight source, build config and runner resources
        shell: bash
        run: |
          set -euo pipefail
          test -f mach
          test -f toolkit/content/license.html.mako
          test -f ci/mozconfig-linux
          test -f browser/branding/unofficial/configure.sh
          uname -a
          df -h .
          free -h

      - name: Bootstrap Firefox desktop native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev git curl make
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Build full Linux browser (no prebuilt engine artifact mode)
        shell: bash
        run: |
          set -euo pipefail
          # Bound compilation before runner termination so failure artifacts can upload.
          timeout --signal=INT --kill-after=120s 55m ./mach build 2>&1 | tee "$RUNNER_TEMP/vulpra-native-build.log"

      - name: Preserve bounded native-build failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/vulpra-native-build.log" ]]; then
            tail -n 5000 "$RUNNER_TEMP/vulpra-native-build.log" > "$RUNNER_TEMP/vulpra-build-failure-tail.log"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-build-failure-tail
          path: ${{ runner.temp }}/vulpra-build-failure-tail.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package baseline build
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          du -sh obj-vulpra-linux/dist
          find obj-vulpra-linux/dist -maxdepth 2 -type f -size +20M -print
          test -s obj-vulpra-linux/dist/bin/application.ini
          grep -E '^(Name|Vendor|Version)=' obj-vulpra-linux/dist/bin/application.ini
          if grep -Fxq 'ac_add_options --with-app-basename=Vulpra' ci/mozconfig-linux; then
            grep -Fxq 'Name=Vulpra' obj-vulpra-linux/dist/bin/application.ini
            grep -Fxq 'Vendor=Vulpra' obj-vulpra-linux/dist/bin/application.ini
            echo 'PASS: compiled package reports independent Vulpra application basename'
          fi
          find obj-vulpra-linux/dist -maxdepth 1 -type f -name '*.tar.*' -print | sort
          mapfile -t native_archives < <(find obj-vulpra-linux/dist -maxdepth 1 -type f -name '*.tar.*' ! -name 'vulpra-*.tar.*' | sort)
          if [[ "${#native_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one Linux package archive, found ${#native_archives[@]}" >&2
            exit 1
          fi
          bash packaging/stage.sh "${native_archives[0]}" obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz
          (cd obj-vulpra-linux/dist && sha256sum --check vulpra-1590b5-linux-ci-preview.tar.xz.sha256)
          tar -tf obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz | grep -E '/vulpra$'

      - name: Smoke-test isolated packaged Vulpra in headless mode
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          mkdir -p "$tmp/package" "$tmp/home"
          tar -xf obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz -C "$tmp/package"
          mapfile -d '' -t inis < <(find "$tmp/package" -maxdepth 4 -type f -name application.ini -print0)
          [[ "${#inis[@]}" -eq 1 ]] || { echo "Missing/ambiguous packaged application.ini" >&2; exit 1; }
          appdir="$(dirname "${inis[0]}")"
          test -x "$appdir/vulpra"
          test -x "$appdir/firefox"
          grep -Fxq 'Name=Vulpra' "$appdir/application.ini"
          cat > "$tmp/smoke.html" <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8">
          <title>Vulpra native CI browser smoke test</title>
          <main><h1>Vulpra rendered a local page</h1></main>
          <script>document.querySelector('h1').textContent += ' with JavaScript';</script>
          </html>
          HTML
          HOME="$tmp/home" XDG_DATA_HOME="$tmp/home/.local/share" MOZ_HEADLESS=1 \
            timeout 120 "$appdir/vulpra" --headless --screenshot "$tmp/screenshot.png" "file://$tmp/smoke.html"
          test -s "$tmp/screenshot.png"
          file --mime-type "$tmp/screenshot.png" | grep -Fq 'image/png'
          test -d "$tmp/home/.local/share/vulpra/default"
          test ! -e "$tmp/home/.mozilla"
          echo "PASS: packaged Vulpra started headlessly, rendered a screenshot, and used its isolated profile"

      - name: Upload preliminary CI-only package
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-1590b5-linux-ci-preview
          path: |
            obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz
            obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Report resources
        if: always()
        shell: bash
        run: |
          df -h .
          free -h
