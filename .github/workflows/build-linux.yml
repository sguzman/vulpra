name: Build Linux baseline

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '!docs/vulpra/**'
      - '!ci/**'
      - '!packaging/**'
      - '!README.md'
      - '!AGENTS.md'
      - '!scripts/import-firefox.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulpra-linux-build
  cancel-in-progress: false

jobs:
  build-linux:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
    steps:
      - name: Check out imported Firefox source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preflight source, build config and runner resources
        shell: bash
        run: |
          set -euo pipefail
          test -f mach
          test -f toolkit/content/license.html.mako
          test -f ci/mozconfig-linux
          test -f browser/branding/unofficial/configure.sh
          uname -a
          df -h .
          free -h

      - name: Bootstrap Firefox desktop native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev git curl make
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Build full Linux browser (no prebuilt engine artifact mode)
        shell: bash
        run: |
          set -euo pipefail
          ./mach build

      - name: Package baseline build
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          du -sh obj-vulpra-linux/dist
          find obj-vulpra-linux/dist -maxdepth 2 -type f -size +20M -print
          test -s obj-vulpra-linux/dist/bin/application.ini
          grep -E '^(Name|Vendor|Version)=' obj-vulpra-linux/dist/bin/application.ini
          if grep -Fxq 'ac_add_options --with-app-basename=Vulpra' ci/mozconfig-linux; then
            grep -Fxq 'Name=Vulpra' obj-vulpra-linux/dist/bin/application.ini
            echo 'PASS: compiled package reports independent Vulpra application basename'
          fi
          find obj-vulpra-linux/dist -maxdepth 1 -type f -name '*.tar.*' -print | sort
          mapfile -t native_archives < <(find obj-vulpra-linux/dist -maxdepth 1 -type f -name '*.tar.*' ! -name 'vulpra-*.tar.*' | sort)
          if [[ "${#native_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one Linux package archive, found ${#native_archives[@]}" >&2
            exit 1
          fi
          bash packaging/stage.sh "${native_archives[0]}" obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz
          (cd obj-vulpra-linux/dist && sha256sum --check vulpra-1590b5-linux-ci-preview.tar.xz.sha256)
          tar -tf obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz | grep -E '/vulpra$'

      - name: Upload preliminary CI-only package
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-1590b5-linux-ci-preview
          path: |
            obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz
            obj-vulpra-linux/dist/vulpra-1590b5-linux-ci-preview.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Report resources
        if: always()
        shell: bash
        run: |
          df -h .
          free -h


      - name: Upload preliminary CI-only package
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-1590b5-linux-baseline
          path: |
            obj-vulpra-linux/dist/*.tar.*
          if-no-files-found: error
          retention-days: 7

      - name: Report resources
        if: always()
        shell: bash
        run: |
          df -h .
          free -h
