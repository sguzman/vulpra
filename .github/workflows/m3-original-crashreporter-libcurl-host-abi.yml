# Real libcurl RTLD_NOW/dlsym resolution in no-egress Ubuntu and isolated
# Arch Linux userspaces. Does not run original crashreporter or send reports.
name: M3 Original Crashreporter Isolated Libcurl Host ABI
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-crashreporter-libcurl-host-abi.rs
      - .github/workflows/m3-original-crashreporter-libcurl-host-abi.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-pinned-ubuntu-arch-libcurl-abi:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      NATIVE_RUN: '41353633757'
      NATIVE_HEAD: d4284baf8ced8830c2964408bad575aec3ce91ae
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
    steps:
      - name: Checkout only current Rust host ABI audit
        uses: actions/checkout@v4
        with:
          path: diagnostics
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-crashreporter-libcurl-host-abi.rs
      - name: Checkout immutable original crashreporter libcurl source
        uses: actions/checkout@v4
        with:
          path: source
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            toolkit/crashreporter/client/app/src/net/libcurl.rs
            toolkit/crashreporter/client/app/src/net/http.rs
      - name: Authenticate exact original compiled six-name native proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C diagnostics rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN" |
            jq -e --arg head "$NATIVE_HEAD" '.status=="completed" and .conclusion=="success" and .head_sha==$head' >/dev/null
          mkdir -p "$RUNNER_TEMP/pinned"
          gh run download "$NATIVE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-crashreporter-libcurl-native-candidates --dir "$RUNNER_TEMP/pinned"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .status=="source_and_compiled_crashreporter_libcurl_loader_candidate_table_verified" and
            .original_source_commit==$src and .original_archive_sha256==$sha and
            .original_linux_candidate_count==6 and
            .compiled_relative_relocation_backed_candidate_table_verified==true and
            .all_compiled_candidate_name_bytes_match_pinned_rust_source==true and
            .compiled_table_reference_and_dlopen_got_instruction_verified==true and
            .runtime_executed_route_verified==false and
            .runtime_selected_soname_verified==false
          ' "$RUNNER_TEMP/pinned/m3-original-crashreporter-libcurl-native.json" >/dev/null
          grep -Fq 'self.send_with_curl(url)' source/toolkit/crashreporter/client/app/src/net/http.rs
          grep -Fq 'self.send_with_curl_executable(url)' source/toolkit/crashreporter/client/app/src/net/http.rs
          grep -Fq 'self.send_with_libcurl(url)' source/toolkit/crashreporter/client/app/src/net/http.rs
          grep -Fq 'super::libcurl::load()?' source/toolkit/crashreporter/client/app/src/net/http.rs
      - name: Compile probe and test native FFI with network namespace isolated
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libcurl4t64
          rustc --edition=2021 --test diagnostics/ci/m3-original-crashreporter-libcurl-host-abi.rs \
            -o "$RUNNER_TEMP/m3-libcurl-host-tests"
          sudo unshare --net -- "$RUNNER_TEMP/m3-libcurl-host-tests"
          rustc --edition=2021 -O diagnostics/ci/m3-original-crashreporter-libcurl-host-abi.rs \
            -o "$RUNNER_TEMP/m3-libcurl-host-abi"
      - name: Probe only Ubuntu runtime candidate loading and actual required symbols without network
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- "$RUNNER_TEMP/m3-libcurl-host-abi" "$SOURCE_SHA" \
            source/toolkit/crashreporter/client/app/src/net/libcurl.rs \
            ubuntu-24.04 "$RUNNER_TEMP/m3-original-libcurl-ubuntu.json"
      - name: Build an isolated Arch Linux curl-capable userspace
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arch-libcurl"
          cat >"$RUNNER_TEMP/arch-libcurl/Dockerfile" <<'EOF'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed curl && rm -rf /var/cache/pacman/pkg/*
          EOF
          docker build --pull --no-cache -t vulpra-m3-arch-libcurl-abi:ci "$RUNNER_TEMP/arch-libcurl"
      - name: Probe Arch Linux host libcurl fallback ABI in no-egress, read-only container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            -v "$RUNNER_TEMP/m3-libcurl-host-abi:/audit/probe:ro" \
            -v "$GITHUB_WORKSPACE/source/toolkit/crashreporter/client/app/src/net/libcurl.rs:/audit/source.rs:ro" \
            -v "$RUNNER_TEMP:/reports:rw" \
            vulpra-m3-arch-libcurl-abi:ci \
            /audit/probe "$SOURCE_SHA" /audit/source.rs archlinux-container \
            /reports/m3-original-libcurl-arch.json
      - name: Crosscheck exact original candidates and complete ABI function names on both hosts
        shell: bash
        run: |
          set -euo pipefail
          for pair in ubuntu:ubuntu-24.04 arch:archlinux-container; do
            suffix="${pair%%:*}"; profile="${pair#*:}"
            jq -e --arg profile "$profile" --arg src "$SOURCE_SHA" '
              .schema_version==1 and
              .status=="source_pinned_original_crashreporter_libcurl_isolated_host_abi" and
              .original_source_commit==$src and .host_profile==$profile and
              .original_linux_candidates==[
                "libcurl.so","libcurl.so.4","libcurl-gnutls.so",
                "libcurl-gnutls.so.4","libcurl.so.3","libcurl-gnutls.so.3"
              ] and
              .original_libcurl_binding_count==15 and
              (.original_libcurl_bindings|unique|length)==15 and
              .isolated_host_dlsym_resolved_bindings==15 and
              .isolated_host_rtld_now_load_success==true and
              .only_isolated_host_abi_proven==true and
              .original_crashreporter_executed==false and
              .original_crashreporter_curl_fallback_branch_executed==false and
              .network_egress_permitted_during_probe==false and
              .actual_original_runtime_selected_soname_proven==false and
              .target_user_workstation_verified==false and
              .all_conditional_dynamic_loader_routes_proven==false and
              .source_pruning_authorized==false and .m3_sixth_gate_closed==false
            ' "$RUNNER_TEMP/m3-original-libcurl-${suffix}.json" >/dev/null
          done
          diff -u \
            <(jq -c '.original_linux_candidates,.original_libcurl_bindings' "$RUNNER_TEMP/m3-original-libcurl-ubuntu.json") \
            <(jq -c '.original_linux_candidates,.original_libcurl_bindings' "$RUNNER_TEMP/m3-original-libcurl-arch.json")
          jq -e --slurpfile pin "$RUNNER_TEMP/pinned/m3-original-crashreporter-libcurl-native.json" '
            .original_linux_candidates==$pin[0].original_linux_candidate_names
          ' "$RUNNER_TEMP/m3-original-libcurl-ubuntu.json" >/dev/null
          echo 'PASS: two isolated Linux host libcurl RTLD_NOW + 15 source-declared dlsym functions; original crashreporter runtime not executed'
      - name: Upload only bounded sanitized host ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-crashreporter-libcurl-two-host-abi
          path: |
            ${{ runner.temp }}/m3-original-libcurl-ubuntu.json
            ${{ runner.temp }}/m3-original-libcurl-arch.json
          if-no-files-found: warn
          retention-days: 14
