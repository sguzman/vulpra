# Exercise one of the nine original build-owned ELF helper activation routes.
# Original full-normal binary, SHA authenticated; no real browser profile.
name: M3 Original gfxtest Actual Symbol Bindings
on:
  push:
    branches: [main]
    paths:
      - ci/m3-gfxtest-private-wayland.sh
      - ci/m3-gfxtest-version-reconcile.py
      - ci/m3-native-original-feature-module-bindings.rs
      - .github/workflows/m3-original-gfxtest-runtime-bindings.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-gfxtest-private-weston-symbol-bindings:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      PACKAGE_RUN: '40997075527'
    steps:
      - name: Checkout bounded helper launch and version-check verifier
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Guard fake native gfx loader output and audit archive provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-gfxtest-private-wayland.sh
          rustc --edition=2021 --test ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/gfxtest-binding-tests"
          "$RUNNER_TEMP/gfxtest-binding-tests"
          rustc --edition=2021 -O ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/gfxtest-binding-parser"
          python3 ci/m3-gfxtest-version-reconcile.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha' >/dev/null
      - name: Install private Weston/pixman and original native graphics libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1 libegl1
      - name: Recover only SHA-authenticated original full compiled package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/package"
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/native"
          (cd "$RUNNER_TEMP/native" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/vulpra/gfxtest"
      - name: Exercise original gfxtest private Weston and observe glibc binding providers
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          M3_NATIVE_BINDINGS_PARSER="$RUNNER_TEMP/gfxtest-binding-parser" \
          M3_GFX_BINDINGS_REPORT="$RUNNER_TEMP/original-gfxtest-actual-bindings.json" \
          bash ci/m3-gfxtest-private-wayland.sh \
            "$RUNNER_TEMP/package/vulpra" "$RUNNER_TEMP/gfxtest-ld-debug"
          jq -e --arg sha "$ARCHIVE_SHA" --arg src "$SOURCE_SHA" '
            .schema_version==1 and
            .status=="original_native_feature_module_actual_symbol_bindings" and
            .original_source_commit==$src and .original_archive_sha256==$sha and
            .original_requester_basename=="gfxtest" and
            .pid_traces_with_original_requester_bindings>=1 and
            .normal_symbol_binding_events>=1 and .distinct_symbol_provider_pairs>=1 and
            .observed_provider_basename_count==(.observed_provider_basenames|length) and
            .private_weston_wayland_gfx_probe_only==true and
            .original_c_api_diagnostic_only==false and
            .synthetic_loopback_telemetry_only==false and
            .no_network_egress==false and
            .actual_normal_symbol_bindings_observed==true and
            .raw_loader_logs_exported==false and .symbol_names_exported==false and
            .model_inference_or_drm_decryption_proven==false and
            .all_lazy_or_transitive_bindings_proven==false and
            .new_source_pruning_authorized==false' \
            "$RUNNER_TEMP/original-gfxtest-actual-bindings.json" >/dev/null
          rm -rf -- "$RUNNER_TEMP/gfxtest-ld-debug"
          echo 'PASS: original private Wayland gfxtest actual normal-symbol bindings; not GPU acceleration'
      - name: Upload bounded compiled gfx-helper ABI evidence only
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-gfxtest-actual-bindings
          path: ${{ runner.temp }}/original-gfxtest-actual-bindings.json
          if-no-files-found: error
          retention-days: 14
