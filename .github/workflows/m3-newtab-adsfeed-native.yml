# Full native validation of the Linux-only New Tab sponsored AdsFeed opt-out.
# This tests the real built-in omnija, graphical/browser behavior and profile
# safety. Acceptance and package reduction need an additional matched baseline.
name: M3 Native New Tab AdsFeed Opt-out Trial

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-newtab-adsfeed-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulpra-m3-newtab-adsfeed-native
  cancel-in-progress: false

jobs:
  verify-adsfeed-omission:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-newtab-adsfeed-experiment
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
      VULPRA_M3_VERIFY_NIMBUS: "1"
      VULPRA_M3_VERIFY_NO_NEWTAB_ADSFEED: "1"
    steps:
      - name: Check out entire pinned browser
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact retained resources and default preservation
        shell: bash
        run: |
          set -euo pipefail
          bash ci/tests/m3-newtab-adsfeed-optout-test.sh "$GITHUB_WORKSPACE"
          git grep -n -F -e 'AdsFeed.sys.mjs' -- \
            ':!docs/**' ':!ci/**' ':!.github/**' \
            > "$RUNNER_TEMP/newtab-adsfeed-references.txt" || rc=$?
          test "${rc:-0}" -le 1
          echo "Actual outside source references: $(wc -l < "$RUNNER_TEMP/newtab-adsfeed-references.txt")"

      - name: Prepare Mozilla compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap supported native compiler and graphical tests
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends python3 python3-venv python3-dev \
            git curl make jq weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || \
             ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
          major="$("$HOME/.mozbuild/clang/bin/clang" --version | head -1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 19 ))
          echo "PASS: supported Clang $major ready for native build"

      - name: Configure guarded Linux variant and protected features
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'export VULPRA_EXPERIMENT_NO_NEWTAB_ADSFEED=1' "$MOZCONFIG"
          ./mach configure
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("obj-vulpra-linux-m3-newtab-adsfeed-experiment/config.statusd/substs")
          def get(k):
              p=root/k
              return json.loads(p.read_text()) if p.exists() else None
          assert str(get("VULPRA_NO_NEWTAB_ADSFEED")) in ("1","True")
          assert get("MOZ_WIDGET_TOOLKIT")=="gtk"
          assert get("MOZ_APP_BASENAME")=="Vulpra"
          assert get("MOZ_DEVTOOLS")=="all"
          for key in ("MOZ_SANDBOX","MOZ_WAYLAND","MOZ_SERVICES_SYNC","MOZ_NORMANDY"):
              assert str(get(key)) in ("1","True"),(key,get(key))
          assert str(get("VULPRA_NO_ASROUTER_PROMOS")) in ("False","None","0","")
          definitions=Path("obj-vulpra-linux-m3-newtab-adsfeed-experiment/config.statusd/defines")
          assert (definitions/"VULPRA_NO_NEWTAB_ADSFEED").is_file(), "experimental macro absent"
          assert not (definitions/"VULPRA_NO_ASROUTER_PROMOS").exists(), "normal ASRouter macro erroneously defined"
          print("PASS: isolated sponsored-feed omission and protected Linux features")
          PY

      - name: Reserve 24 GiB native Rust compilation swap
        shell: bash
        run: |
          set -euo pipefail
          swap=/mnt/vulpra-m3-newtab-adsfeed.swap
          available="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( available > 24*1024*1024*1024 + 8*1024*1024*1024 ))
          sudo fallocate -l 24G "$swap"
          sudo chmod 0600 "$swap"
          sudo mkswap "$swap"
          sudo swapon "$swap"
          grep -Fq "$swap" /proc/swaps

      - name: Compile complete native Linux browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-newtab-adsfeed-build.log"

      - name: Package and independently checksum experimental browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist=obj-vulpra-linux-m3-newtab-adsfeed-experiment/dist
          mapfile -d '' -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print0)
          [[ "${#archives[@]}" -eq 1 ]]
          mkdir -p .git/vulpra-native-build/packages
          bash packaging/stage.sh "${archives[0]}" \
            "$GITHUB_WORKSPACE/.git/vulpra-native-build/packages/vulpra-local-m3-newtab-adsfeed-ci.tar.xz"
          (cd .git/vulpra-native-build/packages && \
            sha256sum -c vulpra-local-m3-newtab-adsfeed-ci.tar.xz.sha256)

      - name: Verify exactly the sponsored feed absent in actual browser package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, tarfile, zipfile
          from pathlib import Path
          package=Path(".git/vulpra-native-build/packages/vulpra-local-m3-newtab-adsfeed-ci.tar.xz")
          names=set()
          jars=0
          with tarfile.open(package,"r:xz") as tf:
              for item in tf:
                  if item.isfile() and item.name.endswith("/omni.ja"):
                      jars+=1
                      with zipfile.ZipFile(io.BytesIO(tf.extractfile(item).read())) as jar:
                          names.update(jar.namelist())
          target="builtin-addons/newtab/lib/AdsFeed.sys.mjs"
          assert not any(n.endswith(target) for n in names),target
          protected=[
             "builtin-addons/newtab/lib/ActivityStream.sys.mjs",
             "builtin-addons/newtab/lib/DiscoveryStreamFeed.sys.mjs",
             "builtin-addons/newtab/lib/AdsClient.sys.mjs",
             "builtin-addons/newtab/lib/Store.sys.mjs",
             "builtin-addons/newtab/lib/TopStoriesFeed.sys.mjs",
          ]
          missing=[path for path in protected if not any(n.endswith(path) for n in names)]
          assert jars >= 2 and not missing,(jars,missing)
          evidence={
              "schema_version":1,"source_commit":os.environ["GITHUB_SHA"],
              "variant":"linux-newtab-adsfeed-experimental-omission",
              "omitted_resource":target,"protected_resources":protected,
              "omni_jar_count":jars,
              "compressed_package_bytes":package.stat().st_size,
              "sha256":hashlib.sha256(package.read_bytes()).hexdigest(),
              "matched_baseline_delta_bytes":None,
              "status":"native package passed resource check; runtime pending",
          }
          path=Path(os.environ["RUNNER_TEMP"])/"m3-newtab-adsfeed-evidence.json"
          path.write_text(json.dumps(evidence,indent=2)+"\n")
          print(json.dumps(evidence,indent=2))
          print("PASS: actual package physically omitted only sponsored feed")
          PY

      - name: Exercise real Wayland, JS, New Tab, WebExtensions and Nimbus
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          tar -xf .git/vulpra-native-build/packages/vulpra-local-m3-newtab-adsfeed-ci.tar.xz -C "$work"
          mapfile -d '' -t inis < <(find "$work" -maxdepth 5 -type f -name application.ini -print0)
          [[ "${#inis[@]}" -eq 1 ]]
          VULPRA_WAYLAND_TEST_SECONDS=12 bash packaging/test-wayland.sh "$(dirname "${inis[0]}")"
          python3 ci/smoke-m3-localhost-package.py "$GITHUB_WORKSPACE"
          PATH="$RUNNER_TEMP:$PATH" python3 ci/smoke-webextension-package-local.py "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"m3-newtab-adsfeed-evidence.json"
          report=json.loads(path.read_text())
          report["status"]="native and runtime accepted; matched baseline comparison pending"
          report["tested"]={"wayland":True,"js":True,"newtab":True,
                            "webextensions":True,"nimbus":True,
                            "firefox_profile_isolation":True}
          path.write_text(json.dumps(report,indent=2)+"\n")
          PY

      - name: Preserve exact bounded build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-native-evidence
          path: |
            ${{ runner.temp }}/newtab-adsfeed-references.txt
            ${{ runner.temp }}/m3-newtab-adsfeed-evidence.json
            .git/vulpra-native-build/packages/vulpra-local-m3-newtab-adsfeed-ci.tar.xz.sha256
            .git/vulpra-native-build/m3-localhost-acceptance.json
            .git/vulpra-native-build/webextension-smoke-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Capture bounded compilation diagnostics
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-newtab-adsfeed-build.log"; then
            tail -n 3500 "$RUNNER_TEMP/m3-newtab-adsfeed-build.log" > \
              "$RUNNER_TEMP/m3-newtab-adsfeed-failure-tail.log"
          fi

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-failure-tail
          path: ${{ runner.temp }}/m3-newtab-adsfeed-failure-tail.log
          if-no-files-found: warn
          retention-days: 14
