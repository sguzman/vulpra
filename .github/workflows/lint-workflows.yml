name: Lint Vulpra GitHub Actions workflows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
      - name: Lint every Vulpra workflow, including newly added workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # With no file args actionlint discovers all .github/workflows/*.yml.
          # Never maintain a brittle explicit list that silently misses new CI.
          args: -color
