# Original compiled ONNX v22 external-EP capability check, NOT GPU QA.
# Only a zero-factory inert fixture, never a real execution provider.
name: M3 Original ONNX External EP Capability
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-onnx-external-ep-capability.yml
      - ci/m3-original-onnx-external-ep-capability.rs
      - ci/m3-original-onnx-inert-ep.c
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-external-ep-capability:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
      CPU_RUN: '41551291000'
      CPU_SHA: 0e703b4c91fe0871d5059382eb69240db99a428c
    steps:
      - name: Checkout exact bounded Rust probe, inert C plugin and observer
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-onnx-external-ep-capability.rs
            ci/m3-original-onnx-inert-ep.c
            ci/m3-original-onnx-inner-dlopen-observe.c
      - name: Compile probe and no-op provider with upstream header-checked v22 ABI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-original-onnx-external-ep-capability.rs \
            -o "$RUNNER_TEMP/original-ep-probe-tests"
          "$RUNNER_TEMP/original-ep-probe-tests"
          rustc --edition=2021 -C opt-level=1 \
            ci/m3-original-onnx-external-ep-capability.rs \
            -o "$RUNNER_TEMP/original-ep-probe"
          gh api repos/microsoft/onnxruntime/git/blobs/b01b7e48dc87bbeeb026c61fb06c591053853ad1 \
            --jq .content | base64 -d >"$RUNNER_TEMP/onnxruntime_c_api.h"
          test "$(git hash-object "$RUNNER_TEMP/onnxruntime_c_api.h")" = \
            b01b7e48dc87bbeeb026c61fb06c591053853ad1
          cat >"$RUNNER_TEMP/original-ep-abi.c" <<'C'
          #include <stddef.h>
          #include <stdio.h>
          #include "onnxruntime_c_api.h"
          _Static_assert(ORT_API_VERSION==22, "unexpected upstream ORT API");
          _Static_assert(ORT_NOT_IMPLEMENTED==9, "unexpected OrtErrorCode value");
          _Static_assert(offsetof(OrtApi,UnregisterExecutionProviderLibrary) ==
                         offsetof(OrtApi,RegisterExecutionProviderLibrary)+sizeof(void*),
                         "nonadjacent external EP registration ABI");
          int main(void) {
            printf("%zu %zu\n",
                   offsetof(OrtApi,RegisterExecutionProviderLibrary)/sizeof(void*),
                   offsetof(OrtApi,UnregisterExecutionProviderLibrary)/sizeof(void*));
            return 0;
          }
          C
          cc -std=c11 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP" \
            "$RUNNER_TEMP/original-ep-abi.c" -o "$RUNNER_TEMP/original-ep-abi"
          read -r reg_slot unreg_slot < <("$RUNNER_TEMP/original-ep-abi")
          test "$reg_slot" -ge 250 && test "$reg_slot" -le 400
          test "$unreg_slot" -eq "$((reg_slot+1))"
          echo "REGISTER_EP_SLOT=$reg_slot" >>"$GITHUB_ENV"
          echo "UNREGISTER_EP_SLOT=$unreg_slot" >>"$GITHUB_ENV"
          echo "PASS: v22 header-authenticated EP registration function table index $reg_slot"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -shared -I"$RUNNER_TEMP" \
            ci/m3-original-onnx-inert-ep.c \
            -o "$RUNNER_TEMP/libvulpra-onnx-inert-ep.so"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fno-omit-frame-pointer -shared \
            ci/m3-original-onnx-inner-dlopen-observe.c -ldl \
            -o "$RUNNER_TEMP/original-onnx-origin-observer.so"
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-inert-ep.so" |
            grep -Eq ' CreateEpFactories$'
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-inert-ep.so" |
            grep -Eq ' ReleaseEpFactory$'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CPU_RUN" |
            jq -e --arg sha "$CPU_SHA" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and
              .path==".github/workflows/m3-original-onnx-explicit-cpu-ep.yml"
            ' >/dev/null
          echo 'PASS: compiled v22 C API native offsets supplied to Rust at runtime, benign EP fixture and observer built'
      - name: Authenticate historical exact-original full-normal compiled ONNX ELF
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/package"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -s "$RUNNER_TEMP/package/vulpra/libonnxruntime.so"
          nm -D --defined-only "$RUNNER_TEMP/package/vulpra/libonnxruntime.so" |
            grep -Eq ' OrtGetApiBase(@|$)'
      - name: Classify real original v22 registration and internal library loading in no-egress namespaces
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package/vulpra"
          probe="$RUNNER_TEMP/original-ep-probe"
          fixture="$RUNNER_TEMP/libvulpra-onnx-inert-ep.so"
          observer="$RUNNER_TEMP/original-onnx-origin-observer.so"
          report="$RUNNER_TEMP/original-ep-origin.json"
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$package" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 40s \
            "$probe" "$package/libonnxruntime.so" "$fixture" "$REGISTER_EP_SLOT" "$UNREGISTER_EP_SLOT" |
            tee "$RUNNER_TEMP/original-ep-control.stdout" >/dev/null
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$package" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 40s \
            env LD_PRELOAD="$observer" M3_ONNX_INNER_DLOPEN_REPORT="$report" \
            "$probe" "$package/libonnxruntime.so" "$fixture" "$REGISTER_EP_SLOT" "$UNREGISTER_EP_SLOT" |
            tee "$RUNNER_TEMP/original-ep-observed.stdout" >/dev/null
          result="$(sed -n 's/^M3_EXTERNAL_EP_RESULT=//p' "$RUNNER_TEMP/original-ep-control.stdout")"
          observed="$(sed -n 's/^M3_EXTERNAL_EP_RESULT=//p' "$RUNNER_TEMP/original-ep-observed.stdout")"
          test -n "$result" && test "$result" = "$observed"
          case "$result" in
            api_v22_not_available|v22_api_present_registration_not_implemented|v22_registration_failed_other_status|v22_inert_ep_registration_and_factory_callback_success) ;;
            *) echo 'FAIL: unexpected source-pinned ONNX external provider result' >&2; exit 1 ;;
          esac
          test -s "$report"
          sudo chmod 0644 "$report"
          jq -e '
            .schema_version==1 and
            .diagnostic_interposition_used==true and
            .target_origin_basename=="libonnxruntime.so" and
            .all_interposed_dlopen_calls>=1 and
            .all_interposed_dlopen_calls==
              (.onnx_origin_dlopen_calls+.other_origin_dlopen_calls) and
            .onnx_origin_dlopen_calls==
              (.onnx_origin_successful_dlopen_calls+.onnx_origin_failed_dlopen_calls) and
            .other_origin_dlopen_calls>=1 and
            .raw_caller_addresses_or_library_names_retained==false and
            .complete_native_loader_graph_proven==false
          ' "$report" >/dev/null
          if test "$result" = v22_inert_ep_registration_and_factory_callback_success; then
            jq -e '.onnx_origin_successful_dlopen_calls>=1' "$report" >/dev/null
          fi
          if test "$result" = api_v22_not_available ||
             test "$result" = v22_api_present_registration_not_implemented; then
            jq -e '.onnx_origin_dlopen_calls==0' "$report" >/dev/null
          fi
          jq -n --arg source "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
            --arg result "$result" --slurpfile obs "$report" '
            ($obs[0]) as $o |
            {
              schema_version:1,
              status:"original_onnx_external_ep_registration_capability_safely_classified",
              original_source_commit:$source,
              original_full_normal_package_sha256:$sha,
              upstream_c_header_blob:"b01b7e48dc87bbeeb026c61fb06c591053853ad1",
              upstream_v22_api_version_checked_before_index_284:true,
              registration_result:$result,
              v22_api_exposed:($result!="api_v22_not_available"),
              registration_not_implemented:($result=="v22_api_present_registration_not_implemented"),
              inert_ep_registration_succeeded:($result=="v22_inert_ep_registration_and_factory_callback_success"),
              inert_ep_factory_callback_invoked_if_success:($result=="v22_inert_ep_registration_and_factory_callback_success"),
              inert_ep_registered_factory_count_if_success:(if $result=="v22_inert_ep_registration_and_factory_callback_success" then 0 else null end),
              original_onnx_module_origin_dlopen_calls:$o.onnx_origin_dlopen_calls,
              original_onnx_module_origin_successful_loads:$o.onnx_origin_successful_dlopen_calls,
              original_onnx_module_origin_failed_loads:$o.onnx_origin_failed_dlopen_calls,
              harness_or_other_origin_dlopen_calls:$o.other_origin_dlopen_calls,
              control_and_interposed_result_classes_match:true,
              no_real_execution_provider_factory_registered:true,
              no_GPU_provider_or_device_exercised:true,
              no_external_model_or_browser_frontend_exercised:true,
              no_network_egress_or_installed_browser_profile:true,
              diagnostic_interposition_used_in_second_control_only:true,
              full_external_provider_compatibility_or_optional_dependency_graph_proven:false,
              source_pruning_authorized:false,
              native_bytes_saved:0,
              m3_sixth_gate_closed:false
            }' >"$RUNNER_TEMP/m3-original-onnx-external-ep-capability.json"
          jq -e --arg source "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_onnx_external_ep_registration_capability_safely_classified" and
            .original_source_commit==$source and .original_full_normal_package_sha256==$sha and
            .upstream_v22_api_version_checked_before_index_284==true and
            .registration_result!=null and
            .control_and_interposed_result_classes_match==true and
            .no_real_execution_provider_factory_registered==true and
            .full_external_provider_compatibility_or_optional_dependency_graph_proven==false and
            .source_pruning_authorized==false and .native_bytes_saved==0 and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-original-onnx-external-ep-capability.json" >/dev/null
          echo 'PASS: original ONNX API version and inert external EP registration capability classified without guessing GPU support'
      - name: Archive only bounded original EP capability classification
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-onnx-external-ep-capability
          path: ${{ runner.temp }}/m3-original-onnx-external-ep-capability.json
          if-no-files-found: error
          retention-days: 14
