# Original compiled ONNX Runtime v22 external EP function-table surface ONLY.
# Never calls RegisterExecutionProviderLibrary or supplies an EP plugin:
# a previous zero-factory fixture crashed during registration in isolated CI.
name: M3 Original ONNX External EP API Surface
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-onnx-external-ep-capability.rs
      - .github/workflows/m3-original-onnx-external-ep-capability.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-onnx-external-ep-api-surface:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
      HEADER_BLOB: b01b7e48dc87bbeeb026c61fb06c591053853ad1
    steps:
      - name: Checkout read-only original external EP v22 API surface probe
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-onnx-external-ep-capability.rs
      - name: Authenticate compiled upstream C API surface without guessing offsets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-original-onnx-external-ep-capability.rs \
            -o "$RUNNER_TEMP/ep-surface-tests"
          "$RUNNER_TEMP/ep-surface-tests"
          rustc --edition=2021 -C opt-level=1 \
            ci/m3-original-onnx-external-ep-capability.rs -o "$RUNNER_TEMP/ep-surface"
          gh api "repos/microsoft/onnxruntime/git/blobs/$HEADER_BLOB" \
            --jq .content | base64 -d >"$RUNNER_TEMP/onnxruntime_c_api.h"
          test "$(git hash-object "$RUNNER_TEMP/onnxruntime_c_api.h")" = "$HEADER_BLOB"
          cat >"$RUNNER_TEMP/ep-surface-offsets.c" <<'C'
          #include <stddef.h>
          #include <stdio.h>
          #include "onnxruntime_c_api.h"
          _Static_assert(ORT_API_VERSION==22,"upstream header is not v22");
          _Static_assert(offsetof(OrtApi,UnregisterExecutionProviderLibrary)==
                         offsetof(OrtApi,RegisterExecutionProviderLibrary)+sizeof(void*),
                         "external EP ABI slots are nonadjacent");
          int main(void) {
            printf("%zu %zu\n",
                   offsetof(OrtApi,RegisterExecutionProviderLibrary)/sizeof(void*),
                   offsetof(OrtApi,UnregisterExecutionProviderLibrary)/sizeof(void*));
            return 0;
          }
          C
          cc -std=c11 -Wall -Wextra -Werror -O2 -I"$RUNNER_TEMP" \
            "$RUNNER_TEMP/ep-surface-offsets.c" -o "$RUNNER_TEMP/ep-surface-offsets"
          read -r reg_slot unreg_slot < <("$RUNNER_TEMP/ep-surface-offsets")
          test "$reg_slot" -ge 250 && test "$reg_slot" -le 400
          test "$unreg_slot" -eq "$((reg_slot+1))"
          echo "REG_SLOT=$reg_slot" >>"$GITHUB_ENV"
          echo "UNREG_SLOT=$unreg_slot" >>"$GITHUB_ENV"
          echo 'PASS: original ONNX API v22 read-only probe and header offsets compiled'
      - name: Authenticate and extract existing source-pinned original ONNX ELF
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg src "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$src
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/package"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline \
            --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -s "$RUNNER_TEMP/package/vulpra/libonnxruntime.so"
          nm -D --defined-only "$RUNNER_TEMP/package/vulpra/libonnxruntime.so" |
            grep -Eq ' OrtGetApiBase(@|$)'
      - name: Read only actual external EP ABI availability in isolated no-egress process
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package/vulpra"
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$package" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 25s \
            "$RUNNER_TEMP/ep-surface" "$package/libonnxruntime.so" "$REG_SLOT" "$UNREG_SLOT" |
            tee "$RUNNER_TEMP/ep-surface-stdout.txt" >/dev/null
          result="$(sed -n 's/^M3_EXTERNAL_EP_SURFACE=//p' "$RUNNER_TEMP/ep-surface-stdout.txt")"
          case "$result" in
            v22_api_not_exposed|v22_external_ep_api_entries_present_not_executed|v22_api_exposed_but_ep_entries_missing) ;;
            *) echo 'FAIL: original ONNX surface classification invalid' >&2; exit 1 ;;
          esac
          jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
            --arg res "$result" --argjson reg "$REG_SLOT" --argjson unreg "$UNREG_SLOT" '
            {
              schema_version:1,
              status:"exact_original_onnx_v22_external_ep_api_surface_only",
              original_compiled_source_commit:$src,
              original_native_archive_sha256:$sha,
              upstream_v22_c_api_header_blob:"b01b7e48dc87bbeeb026c61fb06c591053853ad1",
              registration_slot:$reg,
              unregistration_slot:$unreg,
              original_external_ep_api_surface:$res,
              original_v22_api_exposed:($res!="v22_api_not_exposed"),
              original_registration_function_pointer_present:($res=="v22_external_ep_api_entries_present_not_executed"),
              original_external_provider_registration_called:false,
              original_execution_provider_factory_instantiated:false,
              previous_inert_zero_factory_registration_trials_failed_with_segfault:true,
              failed_runtime_trial_run_ids:[41554347776,41554575881,41555361620],
              no_plugin_or_GPU_exercised:true,
              no_external_model_or_browser_ml_frontend_exercised:true,
              no_network_egress_or_installed_browser_profile:true,
              native_execution_provider_registration_success_proven:false,
              all_optional_provider_or_ffi_loader_dependencies_proven:false,
              source_pruning_authorized:false,
              native_bytes_saved:0,
              m3_sixth_gate_closed:false
            }' >"$RUNNER_TEMP/m3-original-onnx-external-ep-api-surface.json"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="exact_original_onnx_v22_external_ep_api_surface_only" and
            .original_compiled_source_commit==$src and .original_native_archive_sha256==$sha and
            .registration_slot>=250 and .unregistration_slot==.registration_slot+1 and
            .original_external_provider_registration_called==false and
            .previous_inert_zero_factory_registration_trials_failed_with_segfault==true and
            .no_plugin_or_GPU_exercised==true and
            .native_execution_provider_registration_success_proven==false and
            .all_optional_provider_or_ffi_loader_dependencies_proven==false and
            .source_pruning_authorized==false and
            .native_bytes_saved==0 and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-original-onnx-external-ep-api-surface.json" >/dev/null
          echo 'PASS: exact original ONNX v22 external EP API read-only availability classified; registration NOT asserted'
      - name: Publish bounded original API surface classification only
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-onnx-v22-external-ep-api-surface
          path: ${{ runner.temp }}/m3-original-onnx-external-ep-api-surface.json
          if-no-files-found: error
          retention-days: 14
