name: Firefox 160 Vulpra Overlay Staging (No Browser Rebuild)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - ci/security-160-stage-overlay.sh
      - ci/security-160-assemble-git-tree.sh
      - browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/PromoCard/PromoCardOptOut.jsx
      - toolkit/components/nimbus/NimbusBootstrap.sys.mjs
      - toolkit/components/moz.build
      - toolkit/components/normandy/jar.mn
      - browser/extensions/newtab/webext-glue/moz.build
      - browser/extensions/newtab/lib/ActivityStream.sys.mjs
      - browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs
      - browser/extensions/newtab/lib/TopSitesFeed.sys.mjs
      - taskcluster/kinds/toolchain/android.yml
      - python/mozbuild/mozbuild/frontend/emitter.py
      - browser/components/asrouter/modules/ASRouter.sys.mjs
      - .github/workflows/security-160-safe-overlay-stage.yml
      - browser/branding/unofficial/configure.sh
      - browser/branding/unofficial/locales/en-US/brand.ftl
      - browser/branding/unofficial/pref/firefox-branding.js
      - browser/moz.configure
      - browser/components/asrouter/moz.build
      - browser/extensions/newtab/addon-jar.mn
      - browser/extensions/newtab/build-newtab-bundles.py
      - browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx
      - browser/extensions/newtab/webpack.system-addon.config.js
      - dom/webgpu/tests/cts/checkout/node.tsconfig.json
      - python/mozbuild/mozbuild/testing.py
      - toolkit/components/nimbus/moz.build
      - toolkit/components/normandy/moz.build
      - toolkit/modules/AppConstants.sys.mjs
      - browser/components/BrowserComponents.manifest
      - browser/components/DesktopActorRegistry.sys.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-twenty-eight-exact-source-overlays:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Vulpra source and isolated staging script
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            browser/branding/unofficial/configure.sh
            browser/branding/unofficial/locales/en-US/brand.ftl
            browser/branding/unofficial/pref/firefox-branding.js
            browser/moz.configure
            toolkit/components/normandy/jar.mn
            toolkit/components/normandy/lib/NormandyApi.sys.mjs
            toolkit/components/normandy/lib/NormandyUtils.sys.mjs
            toolkit/components/normandy/schemas/LegacyHeartbeat.schema.json
            browser/extensions/newtab/webext-glue/moz.build
            browser/extensions/newtab/lib/ActivityStream.sys.mjs
            browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs
            browser/extensions/newtab/lib/TopSitesFeed.sys.mjs
            taskcluster/kinds/toolchain/android.yml
            python/mozbuild/mozbuild/frontend/emitter.py
            browser/components/asrouter/modules/ASRouter.sys.mjs
            toolkit/components/moz.build
            browser/components/BrowserComponents.manifest
            browser/components/DesktopActorRegistry.sys.mjs
            browser/components/asrouter/moz.build
            browser/extensions/newtab/addon-jar.mn
            browser/extensions/newtab/build-newtab-bundles.py
            browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx
            browser/extensions/newtab/webpack.system-addon.config.js
            dom/webgpu/tests/cts/checkout/node.tsconfig.json
            python/mozbuild/mozbuild/testing.py
            toolkit/components/nimbus/moz.build
            toolkit/components/normandy/moz.build
            toolkit/modules/AppConstants.sys.mjs
            browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/PromoCard/PromoCardOptOut.jsx
            toolkit/components/nimbus/NimbusBootstrap.sys.mjs
            ci/security-160-stage-overlay.sh
            ci/security-160-assemble-git-tree.sh
      - name: Checkout exact official Firefox 160 source files (separate tree)
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: 2887d9de1f69c0e9776413da80e7ba0d1225dd9b
          path: firefox160
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            browser/branding/unofficial/configure.sh
            browser/branding/unofficial/locales/en-US/brand.ftl
            browser/branding/unofficial/pref/firefox-branding.js
            browser/moz.configure
            toolkit/components/normandy/jar.mn
            toolkit/components/normandy/lib/NormandyApi.sys.mjs
            toolkit/components/normandy/lib/NormandyUtils.sys.mjs
            toolkit/components/normandy/schemas/LegacyHeartbeat.schema.json
            browser/extensions/newtab/webext-glue/moz.build
            browser/extensions/newtab/lib/ActivityStream.sys.mjs
            browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs
            browser/extensions/newtab/lib/TopSitesFeed.sys.mjs
            taskcluster/kinds/toolchain/android.yml
            python/mozbuild/mozbuild/frontend/emitter.py
            browser/components/asrouter/modules/ASRouter.sys.mjs
            toolkit/components/moz.build
            browser/components/BrowserComponents.manifest
            browser/components/DesktopActorRegistry.sys.mjs
            browser/components/asrouter/moz.build
            browser/extensions/newtab/addon-jar.mn
            browser/extensions/newtab/build-newtab-bundles.py
            browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx
            browser/extensions/newtab/webpack.system-addon.config.js
            dom/webgpu/tests/cts/checkout/node.tsconfig.json
            python/mozbuild/mozbuild/testing.py
            toolkit/components/nimbus/moz.build
            toolkit/components/normandy/moz.build
            toolkit/modules/AppConstants.sys.mjs
            browser/app/profile/firefox.js
      - name: Stage twenty-eight exact-overlaid files into private runner temp ONLY
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/security-160-stage-overlay.sh
          out="$RUNNER_TEMP/vulpra160-overlays"
          bash ci/security-160-stage-overlay.sh --stage "$GITHUB_WORKSPACE/firefox160" "$out"
          test "$(find "$out" -type f | wc -l)" -eq 28
          test -z "$(find "$out" -name __pycache__ -print -quit)"
          grep -Fqx 'MOZ_APP_DISPLAYNAME=Vulpra' "$out/browser/branding/unofficial/configure.sh"
          grep -Fqx -- '-brand-short-name = Vulpra' "$out/browser/branding/unofficial/locales/en-US/brand.ftl"
          grep -Fqx 'pref("general.useragent.compatMode.firefox", true);' "$out/browser/app/profile/firefox.js"
          python3 -c 'import ast, pathlib, sys; p = pathlib.Path(sys.argv[1]); ast.parse(p.read_text(encoding="utf-8"), filename=str(p))' "$out/python/mozbuild/mozbuild/frontend/emitter.py"
          node --check "$out/toolkit/components/nimbus/NimbusBootstrap.sys.mjs"
          node --check --input-type=module < "$out/browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/PromoCard/PromoCardOptOut.jsx"
          node --check "$out/browser/extensions/newtab/lib/ActivityStream.sys.mjs"
          node --check "$out/browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs"
          node --check "$out/browser/extensions/newtab/lib/TopSitesFeed.sys.mjs"
          if grep -Fq 'general.useragent.override' "$out/browser/app/profile/firefox.js"; then
            echo 'FAIL: dangerous blanket user-agent override staged' >&2
            exit 1
          fi
          # Replaying into nonempty output or Vulpra's source tree must fail.
          if bash ci/security-160-stage-overlay.sh --stage "$GITHUB_WORKSPACE/firefox160" "$out" >/dev/null 2>&1; then
            echo 'FAIL: accepted nonempty staging target' >&2
            exit 1
          fi
          if bash ci/security-160-stage-overlay.sh --stage "$GITHUB_WORKSPACE/firefox160" "$GITHUB_WORKSPACE" >/dev/null 2>&1; then
            echo 'FAIL: accepted live Vulpra source as output' >&2
            exit 1
          fi
          # A *nonexistent* nested source target must be rejected BEFORE
          # mkdir, not merely rejected after leaving an untracked directory.
          forbidden="$GITHUB_WORKSPACE/should-never-be-created-by-overlay"
          test ! -e "$forbidden"
          if bash ci/security-160-stage-overlay.sh --stage "$GITHUB_WORKSPACE/firefox160" "$forbidden" >/dev/null 2>&1; then
            echo 'FAIL: accepted new output path nested inside Vulpra source' >&2
            exit 1
          fi
          test ! -e "$forbidden"
          git -C "$GITHUB_WORKSPACE/firefox160" diff --exit-code
          git diff --exit-code
          echo 'PASS: 28 exact-source overlays, no source mutation, no dirty checkout, rejected 3 unsafe output locations'
          echo 'LIMIT: isolated overlay staging, not a complete Firefox 160 engine port or security-current browser'
      - name: Assemble complete official Firefox 160 tree with bounded source deltas
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/security-160-assemble-git-tree.sh
          out="$RUNNER_TEMP/vulpra160-complete-tree"
          bash ci/security-160-assemble-git-tree.sh --assemble \
            "$GITHUB_WORKSPACE/firefox160" "$RUNNER_TEMP/vulpra160-overlays" "$out"
          jq -e '.source_files_modified==26 and .vulpra_source_files_added==2 and
            .upstream_files_deleted==0 and .browser_configured==false and
            .native_binary_compiled==false and .security_current==false' \
            "$out/candidate-tree-report.json" >/dev/null
          test "$(wc -l < "$out/changed-paths.txt")" -eq 28
          echo 'PASS: full-source Git-tree candidate assembled without materializing or changing the 160 checkout'
      - name: Archive verified 28-file overlay for a separate materialization job
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-verified-source-overlay
          path: ${{ runner.temp }}/vulpra160-overlays/
          if-no-files-found: error
          retention-days: 7
      - name: Archive reproducible 160 source-tree assembly ledger
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-complete-git-tree-candidate
          path: |
            ${{ runner.temp }}/vulpra160-complete-tree/candidate-tree-report.json
            ${{ runner.temp }}/vulpra160-complete-tree/overlay-paths.txt
            ${{ runner.temp }}/vulpra160-complete-tree/changes-against-exact-firefox160.tsv
          if-no-files-found: error
          retention-days: 30

  materialize-verified-firefox160-candidate:
    needs: stage-twenty-eight-exact-source-overlays
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-firefox160-native-v1"
      CARGO_BUILD_JOBS: "1"
    permissions:
      contents: read
    steps:
      - name: Check out COMPLETE official Firefox 160 source in isolated CI directory
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: 2887d9de1f69c0e9776413da80e7ba0d1225dd9b
          fetch-depth: 1
          path: firefox160
      - name: Retrieve independently verified overlay and complete-tree ledger
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-verified-source-overlay
          path: ${{ runner.temp }}/vulpra160-overlays
      - name: Retrieve authenticated full-tree identity from assembly job
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-complete-git-tree-candidate
          path: ${{ runner.temp }}/vulpra160-ledger
      - name: Materialize ONLY verified source patches, prove exact complete Git tree
        shell: bash
        run: |
          set -euo pipefail
          release=2887d9de1f69c0e9776413da80e7ba0d1225dd9b
          source="$GITHUB_WORKSPACE/firefox160"
          stage="$RUNNER_TEMP/vulpra160-overlays"
          ledger="$RUNNER_TEMP/vulpra160-ledger"
          test "$(git -C "$source" rev-parse HEAD)" = "$release"
          test -z "$(git -C "$source" status --porcelain)"
          jq -e --arg release "$release" '
            .firefox160_commit==$release and
            (.assembled_git_tree|test("^[0-9a-f]{40}$")) and
            .source_files_modified==26 and .vulpra_source_files_added==2 and
            .upstream_files_deleted==0 and .all_other_upstream_files_preserved==true and
            .browser_configured==false and .native_binary_compiled==false
          ' "$ledger/candidate-tree-report.json" >/dev/null
          list="$ledger/overlay-paths.txt"
          test "$(wc -l < "$list")" -eq 28
          test "$(find "$stage" -type f | wc -l)" -eq 28
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-overlays.txt"
          cmp -s "$list" "$RUNNER_TEMP/actual-overlays.txt"
          test -z "$(find "$stage" -type l -print -quit)"
          while IFS= read -r path; do
            test -n "$path"
            case "$path" in
              /*|../*|*/../*|*/..|./*|*/./*|*/.) echo "Unsafe path: $path" >&2; exit 1 ;;
            esac
            src="$stage/$path"
            dst="$source/$path"
            test -f "$src" && test ! -L "$src"
            test ! -L "$dst"
            if test -e "$dst"; then
              test -f "$dst"
            else
              test -d "$(dirname "$dst")"
            fi
            cp -- "$src" "$dst"
            test "$(git hash-object -- "$src")" = "$(git hash-object -- "$dst")"
          done < "$list"
          # The real default index stays untouched; only a private temporary index
          # reflects this candidate. Compare its complete tree, not merely 28 hashes.
          export GIT_INDEX_FILE="$RUNNER_TEMP/firefox160-materialized.index"
          git -C "$source" read-tree HEAD
          git -C "$source" add -f --pathspec-from-file="$list"
          actual="$(git -C "$source" write-tree)"
          expected="$(jq -r .assembled_git_tree "$ledger/candidate-tree-report.json")"
          test "$actual" = "$expected" || {
            echo "FAIL: materialized full tree $actual differs from proven tree $expected" >&2
            exit 1
          }
          git -C "$source" diff --exit-code
          git -C "$source" diff-tree --no-commit-id -r --name-only HEAD "$actual" |
            LC_ALL=C sort > "$RUNNER_TEMP/materialized-changed-paths.txt"
          cmp -s "$list" "$RUNNER_TEMP/materialized-changed-paths.txt"
          jq -n --arg release "$release" --arg tree "$actual" '{
            schema_version:1,
            kind:"materialized_firefox160_vulpra_candidate",
            upstream_release_commit:$release,
            complete_materialized_source_tree:$tree,
            exact_assembly_tree_match:true,
            verified_overlays:28,
            upstream_paths_otherwise_preserved:true,
            only_isolated_ci_checkout_modified:true,
            browser_configured:false,
            native_binary_compiled:false,
            packaged_browser_tested:false,
            security_current:false
          }' > "$RUNNER_TEMP/materialized-candidate.json"
          echo "PASS: complete on-disk Firefox 160 checkout matches independently assembled candidate tree $actual"
          echo 'LIMIT: source-materialization proof only; configure/native/runtime/security acceptance remain open'
      - name: Archive on-disk full-source identity, without uploading Firefox source
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-materialized-source-proof
          path: ${{ runner.temp }}/materialized-candidate.json
          if-no-files-found: error
          retention-days: 30

      # Use the exact already-verified source candidate, not a new source copy.
      - name: Checkout pinned Vulpra Linux configuration (separate CI checkout)
        uses: actions/checkout@v4
        with:
          path: vulpra-build-config
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/mozconfig-linux
            packaging/stage.sh
            packaging/vulpra
            packaging/test-wayland.sh
      - name: Set up Mozilla compiler cache for configure
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Supply GitHub cache credentials to native compiler cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Bootstrap Firefox 160 native Linux build dependencies
        shell: bash
        working-directory: firefox160
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/vulpra-build-config/ci/mozconfig-linux"
          test -s "$RUNNER_TEMP/materialized-candidate.json"
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev git curl make jq weston wayland-utils libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1 binutils
          ./mach --no-interactive bootstrap --application-choice browser
      - name: Configure exact-tree Firefox 160 Vulpra Linux candidate
        shell: bash
        working-directory: firefox160
        env:
          MOZCONFIG: ${{ github.workspace }}/vulpra-build-config/ci/mozconfig-linux
        run: |
          set -euo pipefail
          release=2887d9de1f69c0e9776413da80e7ba0d1225dd9b
          test "$(git rev-parse HEAD)" = "$release"
          jq -e --arg sha "$release" '
            .upstream_release_commit==$sha and
            .exact_assembly_tree_match==true and
            .verified_overlays==28 and
            .upstream_paths_otherwise_preserved==true and
            .browser_configured==false and
            .native_binary_compiled==false
          ' "$RUNNER_TEMP/materialized-candidate.json" >/dev/null
          test -s "$MOZCONFIG"
          grep -Fxq 'ac_add_options --with-app-basename=Vulpra' "$MOZCONFIG"
          grep -Fxq 'ac_add_options --with-branding=browser/branding/unofficial' "$MOZCONFIG"
          grep -Fxq 'ac_add_options --disable-tests' "$MOZCONFIG"
          grep -Fxq 'ac_add_options --with-ccache=sccache' "$MOZCONFIG"
          command -v sccache
          ./mach configure 2>&1 | tee "$RUNNER_TEMP/firefox160-vulpra-configure.log"
          test -s obj-vulpra-linux/config.status
          grep -q 'Vulpra' obj-vulpra-linux/config.status
          tree="$(jq -r .complete_materialized_source_tree "$RUNNER_TEMP/materialized-candidate.json")"
          jq -n --arg release "$release" --arg tree "$tree" '{
            schema_version:1,
            kind:"native_configured_firefox160_vulpra_candidate",
            upstream_release_commit:$release,
            verified_source_tree:$tree,
            verified_overlays:28,
            native_linux_configure_passed:true,
            native_binary_compiled:false,
            packaged_browser_tested:false,
            security_current:false
          }' > "$RUNNER_TEMP/firefox160-vulpra-configure-proof.json"
          echo "PASS: Firefox 160 native configure for exact Vulpra source candidate $tree"
          echo 'LIMIT: configure only, no native compilation, package, runtime or security acceptance'
      - name: Archive Firefox 160 native configuration proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-native-configure-proof
          path: ${{ runner.temp }}/firefox160-vulpra-configure-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Archive bounded configure failure diagnostics
        if: failure()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/firefox160-vulpra-configure.log"; then
            tail -n 2000 "$RUNNER_TEMP/firefox160-vulpra-configure.log" > "$RUNNER_TEMP/firefox160-vulpra-configure-failure-tail.log"
          fi
      - name: Upload configure failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-native-configure-failure
          path: ${{ runner.temp }}/firefox160-vulpra-configure-failure-tail.log
          if-no-files-found: ignore
          retention-days: 14

      # Full native-build verification, gated on exact source materialization
      # and a successful native Firefox 160 configure above.
      - name: Prepare disposable hosted-runner capacity for full browser build
        shell: bash
        run: |
          set -euo pipefail
          df -h /mnt
          free -h
          # Exact optional preinstalled SDK roots on disposable CI runners only;
          # never touch the source, objdir, build toolchains or user profiles.
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if test -d "$path" && test ! -L "$path"; then
              sudo rm -rf -- "$path"
            fi
          done
          sudo apt-get clean
          gib=$((1024*1024*1024))
          free_bytes="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          [[ "$free_bytes" =~ ^[0-9]+$ ]]
          if (( free_bytes < 24*gib )); then
            echo "::error::Insufficient runner disk for safe browser build with swap"
            exit 1
          fi
          swap_gib=$(((free_bytes-16*gib)/gib))
          if (( swap_gib > 24 )); then swap_gib=24; fi
          (( swap_gib >= 8 ))
          sudo fallocate -l "$swap_gib"G /mnt/vulpra-firefox160-native.swap
          sudo chmod 0600 /mnt/vulpra-firefox160-native.swap
          sudo mkswap /mnt/vulpra-firefox160-native.swap
          sudo swapon /mnt/vulpra-firefox160-native.swap
          grep -Fq /mnt/vulpra-firefox160-native.swap /proc/swaps
          df -h /mnt
          echo "PASS: isolated CI runner memory/disk precautions ready"
      - name: Compile exact materialized Firefox 160 Vulpra candidate
        shell: bash
        working-directory: firefox160
        env:
          MOZCONFIG: ${{ github.workspace }}/vulpra-build-config/ci/mozconfig-linux
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/firefox160-vulpra-configure-proof.json"
          ./mach build 2>&1 | tee "$RUNNER_TEMP/firefox160-vulpra-native-build.log"
          test -s obj-vulpra-linux/dist/bin/application.ini
          echo "PASS: full native Firefox 160 Vulpra compile"
      - name: Package and verify exact-source Firefox 160 native browser
        shell: bash
        working-directory: firefox160
        env:
          MOZCONFIG: ${{ github.workspace }}/vulpra-build-config/ci/mozconfig-linux
        run: |
          set -euo pipefail
          ./mach package 2>&1 | tee "$RUNNER_TEMP/firefox160-vulpra-package.log"
          dist="obj-vulpra-linux/dist"
          test -s "$dist/bin/application.ini"
          grep -Fxq 'Name=Vulpra' "$dist/bin/application.ini"
          grep -Fxq 'Vendor=Vulpra' "$dist/bin/application.ini"
          mapfile -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' | sort)
          test "${#archives[@]}" -eq 1
          stage="$RUNNER_TEMP/vulpra-firefox160-native-ci.tar.xz"
          bash "$GITHUB_WORKSPACE/vulpra-build-config/packaging/stage.sh" "${archives[0]}" "$stage"
          (cd "$RUNNER_TEMP" && sha256sum -c vulpra-firefox160-native-ci.tar.xz.sha256)
          test -s "$stage"
          echo "PASS: Vulpra 160 native package staged and checksummed"
      - name: Smoke-test isolated packaged Firefox 160 Vulpra on Linux and Wayland
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/vulpra-firefox160-native-ci.tar.xz"
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work/package" "$work/home"
          tar -xf "$stage" -C "$work/package"
          mapfile -d '' -t inis < <(find "$work/package" -maxdepth 5 -type f -name application.ini -print0)
          test "${#inis[@]}" -eq 1
          appdir="$(dirname "${inis[0]}")"
          test -x "$appdir/vulpra"
          grep -Fxq 'Name=Vulpra' "$appdir/application.ini"
          mkdir -p "$work/home/.mozilla/firefox"
          printf '[Profile0]\nName=existing-firefox\nPath=existing-profile\n' > "$work/home/.mozilla/firefox/profiles.ini"
          before="$(sha256sum "$work/home/.mozilla/firefox/profiles.ini")"
          printf '%s\n' '<!doctype html><title>Vulpra 160 CI</title><h1>Vulpra native smoke</h1><script>document.querySelector("h1").textContent+=" JS"</script>' > "$work/smoke.html"
          HOME="$work/home" XDG_DATA_HOME="$work/home/.local/share" MOZ_HEADLESS=1             timeout 120 "$appdir/vulpra" --headless --screenshot "$work/screenshot.png" "file://$work/smoke.html"
          test -s "$work/screenshot.png"
          test "$(sha256sum "$work/home/.mozilla/firefox/profiles.ini")" = "$before"
          VULPRA_WAYLAND_TEST_OFFLINE=1 MOZ_DISABLE_NONLOCAL_CONNECTIONS=1             VULPRA_WAYLAND_TEST_SECONDS=10             bash "$GITHUB_WORKSPACE/vulpra-build-config/packaging/test-wayland.sh" "$appdir"
          archive_sha="$(sha256sum "$stage" | awk '{print $1}')"
          tree="$(jq -r .complete_materialized_source_tree "$RUNNER_TEMP/materialized-candidate.json")"
          jq -n --arg tree "$tree" --arg pkg "$archive_sha" '{
            schema_version:1,
            kind:"firefox160_vulpra_native_ci_preview",
            complete_source_tree:$tree,
            package_sha256:$pkg,
            native_configure_passed:true,
            native_build_passed:true,
            native_package_passed:true,
            headless_js_smoke_passed:true,
            private_wayland_smoke_passed:true,
            original_firefox_profile_preserved:true,
            security_current:false,
            release_ready:false
          }' > "$RUNNER_TEMP/firefox160-vulpra-native-build-proof.json"
          echo 'PASS: packaged native headless JS and private Wayland smoke, Firefox profile unchanged'
          echo 'LIMIT: not full WebExtensions/Nimbus/security regression coverage or release acceptance'
      - name: Archive bounded Firefox 160 native build/runtime proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-native-build-runtime-proof
          path: ${{ runner.temp }}/firefox160-vulpra-native-build-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Archive bounded Firefox 160 native failure logs
        if: failure()
        shell: bash
        run: |
          for name in firefox160-vulpra-native-build firefox160-vulpra-package; do
            if test -s "$RUNNER_TEMP/$name.log"; then
              tail -n 2000 "$RUNNER_TEMP/$name.log" > "$RUNNER_TEMP/$name-failure-tail.log"
            fi
          done
      - name: Upload bounded Firefox 160 native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-vulpra-native-build-failure
          path: |
            ${{ runner.temp }}/firefox160-vulpra-native-build-failure-tail.log
            ${{ runner.temp }}/firefox160-vulpra-package-failure-tail.log
          if-no-files-found: ignore
          retention-days: 14
