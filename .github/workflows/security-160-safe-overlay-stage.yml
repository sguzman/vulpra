name: Firefox 160 Vulpra Overlay Staging (No Browser Rebuild)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - ci/security-160-stage-overlay.sh
      - .github/workflows/security-160-safe-overlay-stage.yml
      - browser/branding/unofficial/configure.sh
      - browser/branding/unofficial/locales/en-US/brand.ftl
      - browser/branding/unofficial/pref/firefox-branding.js
      - browser/moz.configure
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-five-exact-source-overlays:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Vulpra source and isolated staging script
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            browser/branding/unofficial/configure.sh
            browser/branding/unofficial/locales/en-US/brand.ftl
            browser/branding/unofficial/pref/firefox-branding.js
            browser/moz.configure
            ci/security-160-stage-overlay.sh
      - name: Checkout exact official Firefox 160 source files (separate tree)
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: 2887d9de1f69c0e9776413da80e7ba0d1225dd9b
          path: firefox160
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            browser/branding/unofficial/configure.sh
            browser/branding/unofficial/locales/en-US/brand.ftl
            browser/branding/unofficial/pref/firefox-branding.js
            browser/moz.configure
            browser/app/profile/firefox.js
      - name: Stage five exact-overlaid files into private runner temp ONLY
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/security-160-stage-overlay.sh
          out="$RUNNER_TEMP/vulpra160-overlays"
          bash ci/security-160-stage-overlay.sh --stage "$GITHUB_WORKSPACE/firefox160" "$out"
          test "$(find "$out" -type f | wc -l)" -eq 5
          grep -Fqx 'MOZ_APP_DISPLAYNAME=Vulpra' "$out/browser/branding/unofficial/configure.sh"
          grep -Fqx -- '-brand-short-name = Vulpra' "$out/browser/branding/unofficial/locales/en-US/brand.ftl"
          grep -Fqx 'pref("general.useragent.compatMode.firefox", true);' "$out/browser/app/profile/firefox.js"
          if grep -Fq 'general.useragent.override' "$out/browser/app/profile/firefox.js"; then
            echo 'FAIL: dangerous blanket user-agent override staged' >&2
            exit 1
          fi
          # Replaying into nonempty output or Vulpra's source tree must fail.
          if bash ci/security-160-stage-overlay.sh --stage "$GITHUB_WORKSPACE/firefox160" "$out" >/dev/null 2>&1; then
            echo 'FAIL: accepted nonempty staging target' >&2
            exit 1
          fi
          if bash ci/security-160-stage-overlay.sh --stage "$GITHUB_WORKSPACE/firefox160" "$GITHUB_WORKSPACE" >/dev/null 2>&1; then
            echo 'FAIL: accepted live Vulpra source as output' >&2
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE/firefox160" diff --exit-code
          git diff --exit-code
          echo 'PASS: 5 exact-source overlays, no source mutation, no dirty checkout, rejected 2 unsafe output locations'
          echo 'LIMIT: isolated overlay staging, not a complete Firefox 160 engine port or security-current browser'
