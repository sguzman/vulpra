# Read-only, exact-source native Firefox160 ELF VERNEED/VERDEF candidate check.
# New named-version audit, NOT ELF symbol relocation or target ABI approval.
name: M3 Firefox 160 Native GNU Version-Name Contract (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/m3-firefox160-native-verneed-contract.yml
      - ci/m3-native-elf-version-contract.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-version-name-candidates:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Authenticate original Firefox160 build and preserved complete source
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            for(const [id,sha,name] of [
              [43138458940,'0624235fdc956ab18af3c3f310b3588ca72fff61',
                'Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate'],
              [43724886827,'54728803f058c3edf54d2e8d3f6e0a7d2af0aec6',
                'Firefox 160 Verified Native Archive Preservation (No Build)'],
              [43730900702,'fd4dee8a9999c303ff35e45fbcd619abe230d30e',
                'M3 Firefox 160 Exact-Source Native ELF Package Graph (No Build)']]){
              const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
              if(run.repository?.full_name!=='sguzman/vulpra' ||
                 run.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
                 run.head_sha!==sha || run.name!==name ||
                 run.status!=='completed' || run.conclusion!=='success')
                throw Error('Unverified source/native ELF input: '+id);
            }
            for(const [id,name] of [
              [43724886827,'firefox160-vulpra-preserved-native-preview-not-approved'],
              [43724886827,'firefox160-vulpra-preserved-materialized-source-proof'],
              [43730900702,'firefox160-source-matched-native-elf-package-graph-not-m3-closure']]){
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {owner,repo,run_id:id,per_page:100});
              if(artifacts.filter(a=>a.name===name&&!a.expired&&a.size_in_bytes>0&&
                new Date(a.expires_at)>new Date()).length!==1)
                throw Error('Required exact original archive/evidence missing: '+name);
            }
      - name: Checkout only existing bounded version-name scanner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-native-elf-version-contract.py
      - name: Reject malformed GNU ELF version metadata and invalid SHA options
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-native-elf-version-contract.py
          python3 ci/m3-native-elf-version-contract.py --self-test
          if python3 ci/m3-native-elf-version-contract.py --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b --self-test >/dev/null 2>&1; then
            echo 'A source override without a package identity passed' >&2; exit 1
          fi
          if python3 ci/m3-native-elf-version-contract.py --archive-sha256 0123 --self-test >/dev/null 2>&1; then
            echo 'A malformed unpaired package SHA passed' >&2; exit 1
          fi
          if python3 ci/m3-native-elf-version-contract.py --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b --archive-sha256 bad --self-test >/dev/null 2>&1; then
            echo 'A wrong-length package SHA passed' >&2; exit 1
          fi
      - name: Retrieve authenticated unmodified native Firefox160 package
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native
      - name: Retrieve exact full Firefox160 candidate source provenance
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source
      - name: Retrieve previously verified same-package 28-ELF graph
        uses: actions/download-artifact@v4
        with:
          name: firefox160-source-matched-native-elf-package-graph-not-m3-closure
          repository: sguzman/vulpra
          run-id: 43730900702
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/graph
      - name: Install readelf and source-bounded host provider name candidates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          case "$RUNNER_OS:$ImageOS" in
            Linux:ubuntu22) gtk=libgtk-3-0; alsa=libasound2 ;;
            Linux:ubuntu24) gtk=libgtk-3-0t64; alsa=libasound2t64 ;;
            *) echo 'Unsupported CI userspace' >&2; exit 1 ;;
          esac
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends binutils jq "$gtk" libdbus-glib-1-2 "$alsa" libnss3 libgbm1
          test -x /sbin/ldconfig
          command -v readelf
      - name: Authenticate exact source tree/native checksum and independent ELF requester set
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and
            .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$RUNNER_TEMP/source/materialized-candidate.json" >/dev/null
          (cd "$RUNNER_TEMP/native" && sha256sum -c vulpra-firefox160-native-ci.tar.xz.sha256)
          digest="$(sha256sum "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz" | cut -d' ' -f1)"
          jq -e --arg digest "$digest" '
            .schema_version==1 and .archive_sha256==$digest and
            .firefox160_candidate_git_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .firefox160_upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            (.elf_members|length)==28 and .direct_needed_edges==268 and
            .all_native_binary_execution_avoided==true and
            .complete_native_ffi_dependency_map_proven==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/graph/firefox160-source-matched-native-elf-graph.json" >/dev/null
      - name: Scan original Firefox160 28 ELF VERNEED and candidate VERDEF metadata only
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          python3 ci/m3-native-elf-version-contract.py \
            --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b \
            --archive-sha256 "$digest" --archive "$archive" \
            --output "$RUNNER_TEMP/firefox160-elf-version-contract-${{ matrix.os }}.json"
          jq -e --arg digest "$digest" '
            .schema_version==1 and
            .source_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .original_archive_sha256==$digest and
            .scanned_native_elf_files==28 and
            .native_elf_declared_version_requirements>=300 and
            .native_elf_declared_version_requirements<=900 and
            .native_elf_declared_version_requirements==(.requirements|length) and
            .candidate_version_name_present_count +
              .candidate_version_name_absent_count +
              .candidate_version_name_unavailable_count ==
                .native_elf_declared_version_requirements and
            .candidate_version_name_absent_count==0 and
            .candidate_version_name_unavailable_count==0 and
            .native_binaries_executed==false and
            .ldd_or_dynamic_loader_executed==false and
            .actual_symbol_resolution_proven==false and
            .host_provider_is_runtime_selected_proven==false and
            .target_arch_hyprland_abi_proven==false and
            .safe_source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/firefox160-elf-version-contract-${{ matrix.os }}.json" >/dev/null
          jq -r '"PASS: Firefox160 candidate ELF required GNU version names " +
            (.candidate_version_name_present_count|tostring) + "/" +
            (.native_elf_declared_version_requirements|tostring) +
            " found in packaged or userspace host candidates (NOT runtime bindings)"' \
            "$RUNNER_TEMP/firefox160-elf-version-contract-${{ matrix.os }}.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'LIMIT: ldconfig host candidate VERDEF names, not actual loader-selected provider/symbol relocation, Arch host, future dlopen or release proof.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive bounded GNU version-name metadata without user paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-native-elf-gnu-version-contract-${{ matrix.os }}-not-m3-closure
          path: ${{ runner.temp }}/firefox160-elf-version-contract-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 30
