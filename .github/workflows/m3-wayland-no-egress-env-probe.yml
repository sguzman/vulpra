# DIAGNOSTIC ONLY. Compare MOZ_DISABLE_NONLOCAL_CONNECTIONS presence while
# physically blocking nonlocal network access in an isolated Linux netns.
# Never use this result to waive the original normal 10-second Wayland gate.
name: M3 Network-Isolated Wayland Environment Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-wayland-no-egress-env-probe.yml
      - ci/m3-wayland-netns-launch.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  identical-native-netns-probes:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ORIGINAL_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout current Wayland acceptance without modifying it
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packaging
            ci
      - name: Validate original compiled package provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n packaging/test-wayland.sh
          bash -n ci/m3-wayland-netns-launch.sh
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/extracted"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ORIGINAL_SHA256"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" \
            -C "$RUNNER_TEMP/extracted"
          test -x "$RUNNER_TEMP/extracted/vulpra/vulpra"
      - name: Install private compositor and network-namespace tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 util-linux weston wayland-utils \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
      - name: Compare under same empty network namespace without outside egress
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/extracted/vulpra"
          harness="$GITHUB_WORKSPACE/packaging/test-wayland.sh"
          runner_user="$(id -un)"
          # Preserve all runtime constraints and run unprivileged. Root is
          # used ONLY to create the empty network namespace; no host firewall
          # changes, no host private profiles, no network calls.
          netns_unshare() {
            # The non-root caller owns the redirected private diagnostic log;
            # sudo only creates an isolated network namespace.
            sudo unshare "$@"
          }
          run_probe() {
            local label="$1"
            local env_mode="$2"
            local status=0
            if netns_unshare --net -- bash ci/m3-wayland-netns-launch.sh \
              "$runner_user" "$harness" "$app" "$env_mode" \
              >"$RUNNER_TEMP/$label-private.log" 2>&1; then
              echo "DIAGNOSTIC $label: native 10-second private Weston PASS in no-egress namespace"
            else
              status="$?"
              echo "DIAGNOSTIC $label: native 10-second private Weston FAIL (exit $status)"
              if grep -Fq 'native exit status: 11' "$RUNNER_TEMP/$label-private.log"; then
                echo "DIAGNOSTIC $label: original browser process exited 11"
              elif grep -Fq 'native exit status: 139' "$RUNNER_TEMP/$label-private.log"; then
                echo "DIAGNOSTIC $label: original browser process exited 139"
              fi
              if grep -Fq 'unshare failed' "$RUNNER_TEMP/$label-private.log"; then
                echo "DIAGNOSTIC $label: network namespace unavailable; no inference possible"
              fi
            fi
          }
          run_probe enabled enabled
          run_probe unset unset
          echo 'DIAGNOSTIC ONLY: no network egress, no user profile, no accepted M3 gate'
