# Source-pinned, expensive manual-only native lifecycle regression.
# Zero-device PASS: 41559011764; CPU device enumeration PASS: 41560348027;
# CPU fallback model/session PASS: 41562244114;
# actual external EP Mul inference PASS: 41563943117.
# The opt-in fallback probe declines nodes; a separate opt-in CPU-only Mul probe executes inside the EP.
# The fixture is not an accelerator or production execution provider.
name: M3 Original ONNX External EP Factory Lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-external-ep-registration:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
      HEADER_BLOB: a254e990237d5575186cf3871392db8c70835a56
      EP_HEADER_BLOB: 0424a95c2d2c1102f328b4e3aeb77ec72601a120
      ERROR_HEADER_BLOB: 732fcd7a82eaa0208c7c97aa5f2fb2b0c694456f
    steps:
      - name: Checkout only the isolated C ABI fixture and runtime probe
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-onnx-ep-factory-fixture.c
            ci/m3-original-onnx-ep-compute.c
            ci/m3-original-onnx-ep-registration.c
            ci/m3-original-onnx-ep-session.c
      - name: Pin upstream v30 headers and verify test fixture ABI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/microsoft/onnxruntime/git/blobs/$HEADER_BLOB" --jq .content |
            base64 -d >"$RUNNER_TEMP/onnxruntime_c_api.h"
          test "$(git hash-object "$RUNNER_TEMP/onnxruntime_c_api.h")" = "$HEADER_BLOB"
          gh api "repos/microsoft/onnxruntime/git/blobs/$EP_HEADER_BLOB" --jq .content |
            base64 -d >"$RUNNER_TEMP/onnxruntime_ep_c_api.h"
          test "$(git hash-object "$RUNNER_TEMP/onnxruntime_ep_c_api.h")" = "$EP_HEADER_BLOB"
          gh api "repos/microsoft/onnxruntime/git/blobs/$ERROR_HEADER_BLOB" --jq .content |
            base64 -d >"$RUNNER_TEMP/onnxruntime_error_code.h"
          test "$(git hash-object "$RUNNER_TEMP/onnxruntime_error_code.h")" = "$ERROR_HEADER_BLOB"
          cc -std=c11 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP" \
            -DM3_EP_FIXTURE_SELFTEST ci/m3-original-onnx-ep-factory-fixture.c \
            ci/m3-original-onnx-ep-compute.c \
            -o "$RUNNER_TEMP/factory-selftest"
          "$RUNNER_TEMP/factory-selftest"
          cc -std=c11 -g -O0 -Wall -Wextra -Werror -fPIC -fno-omit-frame-pointer \
            -fvisibility=hidden -shared -I"$RUNNER_TEMP" \
            ci/m3-original-onnx-ep-factory-fixture.c \
            ci/m3-original-onnx-ep-compute.c \
            -o "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so"
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" |
            grep -Eq ' CreateEpFactories$'
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" |
            grep -Eq ' ReleaseEpFactory$'
          cc -std=c11 -g -O0 -Wall -Wextra -Werror -I"$RUNNER_TEMP" \
            ci/m3-original-onnx-ep-registration.c \
            ci/m3-original-onnx-ep-session.c \
            -o "$RUNNER_TEMP/original-ep-registration" -ldl
      - name: Authenticate source-pinned original full-native package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg src "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$src
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/package"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline \
            --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -s "$RUNNER_TEMP/package/vulpra/libonnxruntime.so"
      - name: Exercise genuine original v30 registration and teardown in no-egress sandbox
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          ulimit -c 0
          pkg="$RUNNER_TEMP/package/vulpra"
          if ! sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$pkg" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 35s \
            "$RUNNER_TEMP/original-ep-registration" "$pkg/libonnxruntime.so" \
            "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" 2>&1 |
            tee "$RUNNER_TEMP/m3-ep-lifecycle.log"; then
            echo 'M3_EP_DIAGNOSTIC=registration_failed'
            if command -v gdb >/dev/null 2>&1; then
              sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
                LD_LIBRARY_PATH="$pkg" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
                timeout --signal=TERM --kill-after=3s 35s \
                gdb --batch --quiet --nx \
                  -ex 'set pagination off' -ex 'set print frame-arguments none' \
                  -ex 'run' -ex 'bt 15' --args \
                  "$RUNNER_TEMP/original-ep-registration" "$pkg/libonnxruntime.so" \
                  "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" 2>&1 |
                  tail -n 90 || true
            else
              echo 'M3_EP_DIAGNOSTIC=gdb_unavailable'
            fi
            exit 1
          fi
          grep -Fxq 'M3_EP_CALLBACK=factory_created' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'M3_EP_CALLBACK=factory_released' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'M3_EP_STAGE=registration_succeeded' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'M3_EP_STAGE=unregistration_succeeded' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'PASS: original ONNX registered and unregistered CI-only factory' \
            "$RUNNER_TEMP/m3-ep-lifecycle.log"
          # Separate opt-in enumeration: this fixture still cannot execute models.
          if ! sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            VULPRA_CI_ONNX_EP_DEVICE_PROBE=1 LD_LIBRARY_PATH="$pkg" \
            MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 35s \
            "$RUNNER_TEMP/original-ep-registration" "$pkg/libonnxruntime.so" \
            "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" 2>&1 | \
            tee "$RUNNER_TEMP/m3-ep-device-enumeration.log"; then
            echo 'M3_EP_DIAGNOSTIC=cpu_device_enumeration_failed'
            exit 1
          fi
          grep -Fxq 'M3_EP_CALLBACK=cpu_ep_device_created' \
            "$RUNNER_TEMP/m3-ep-device-enumeration.log"
          grep -Fxq 'M3_EP_STAGE=cpu_ep_device_enumerated' \
            "$RUNNER_TEMP/m3-ep-device-enumeration.log"
          grep -Fxq 'M3_EP_STAGE=unregistration_succeeded' \
            "$RUNNER_TEMP/m3-ep-device-enumeration.log"
          # The fixture selects a real CPU device but claims zero graph nodes.
          # ORT's genuine CPU provider must run and yield an exact 1.25f tensor.
          if ! sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            VULPRA_CI_ONNX_EP_CPU_FALLBACK=1 LD_LIBRARY_PATH="$pkg" \
            MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 35s \
            "$RUNNER_TEMP/original-ep-registration" "$pkg/libonnxruntime.so" \
            "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" 2>&1 | \
            tee "$RUNNER_TEMP/m3-ep-cpu-fallback.log"; then
            echo 'M3_EP_DIAGNOSTIC=cpu_fallback_session_failed'
            exit 1
          fi
          grep -Fxq 'M3_EP_CALLBACK=session_ep_created' "$RUNNER_TEMP/m3-ep-cpu-fallback.log"
          grep -Fxq 'M3_EP_CALLBACK=get_capability_no_nodes' "$RUNNER_TEMP/m3-ep-cpu-fallback.log"
          grep -Fxq 'M3_EP_STAGE=cpu_fallback_numerical_result_1_25' "$RUNNER_TEMP/m3-ep-cpu-fallback.log"
          grep -Fxq 'M3_EP_CALLBACK=release_ep' "$RUNNER_TEMP/m3-ep-cpu-fallback.log"
          grep -Fxq 'M3_EP_STAGE=unregistration_succeeded' "$RUNNER_TEMP/m3-ep-cpu-fallback.log"
          # Opt-in actual external-provider computation, not CPU fallback.
          if ! sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            VULPRA_CI_ONNX_EP_NATIVE_COMPUTE=1 LD_LIBRARY_PATH="$pkg" \
            MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 35s \
            "$RUNNER_TEMP/original-ep-registration" "$pkg/libonnxruntime.so" \
            "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" 2>&1 | \
            tee "$RUNNER_TEMP/m3-ep-native-compute.log"; then
            echo 'M3_EP_DIAGNOSTIC=native_compute_failed'
            exit 1
          fi
          grep -Fxq 'M3_EP_CALLBACK=plugin_claimed_mul' "$RUNNER_TEMP/m3-ep-native-compute.log"
          grep -Fxq 'M3_EP_CALLBACK=plugin_compile_mul' "$RUNNER_TEMP/m3-ep-native-compute.log"
          grep -Fxq 'M3_EP_CALLBACK=plugin_compute_mul' "$RUNNER_TEMP/m3-ep-native-compute.log"
          grep -Fxq 'M3_EP_STAGE=external_ep_numerical_result_1_5625' "$RUNNER_TEMP/m3-ep-native-compute.log"
          grep -Fxq 'M3_EP_CALLBACK=plugin_release_compute_infos' "$RUNNER_TEMP/m3-ep-native-compute.log"
          grep -Fxq 'M3_EP_STAGE=unregistration_succeeded' "$RUNNER_TEMP/m3-ep-native-compute.log"
          jq -n --arg source "$SOURCE_SHA" --arg archive "$ARCHIVE_SHA" \
            '{schema_version:1, status:"source_pinned_original_external_ep_factory_lifecycle_pass",
              original_source_commit:$source, original_archive_sha256:$archive,
              exact_header_blob:"a254e990237d5575186cf3871392db8c70835a56",
              exact_ep_header_blob:"0424a95c2d2c1102f328b4e3aeb77ec72601a120",
              exact_error_header_blob:"732fcd7a82eaa0208c7c97aa5f2fb2b0c694456f",
              test_ep_factories:1, test_ep_devices:0,
              second_probe_cpu_ep_devices:1, cpu_device_enumeration_verified:true,
              external_ep_session_created:true,
              capability_query_declined_all_nodes:true,
              model_executed_on_builtin_cpu_fallback:true,
              expected_numeric_float:1.25,
              fallback_external_ep_claimed_nodes:0,
              external_ep_claimed_mul_node:true,
              external_ep_compile_invoked:true,
              external_ep_compute_invoked:true,
              external_ep_expected_numeric_float:1.5625,
              external_ep_inference_executed:true,
              external_ep_test_scope:"single_float32_1_element_cpu_mul",
              actual_model_executed:true,
              original_library_registration_succeeded:true,
              original_library_unregistration_succeeded:true,
              fixture_factory_released:true,
              gpu_or_hardware_execution_tested:false, dependency_closure_proven:false,
              source_pruning_authorized:false, native_bytes_saved:0,
              m3_sixth_gate_closed:false}' > "$RUNNER_TEMP/m3-ep-lifecycle.json"
      - name: Upload bounded evidence only after success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-onnx-external-ep-factory-lifecycle
          path: ${{ runner.temp }}/m3-ep-lifecycle.json
          if-no-files-found: error
          retention-days: 14
