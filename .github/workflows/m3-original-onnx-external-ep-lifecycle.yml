# Transient push test for one source-pinned native lifecycle experiment.
# After its evidence is inspected, restore this expensive workflow to manual-only.
name: M3 Original ONNX External EP Factory Lifecycle
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-onnx-ep-factory-fixture.c
      - ci/m3-original-onnx-ep-registration.c
      - .github/workflows/m3-original-onnx-external-ep-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-external-ep-registration:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
      HEADER_BLOB: b01b7e48dc87bbeeb026c61fb06c591053853ad1
    steps:
      - name: Checkout only the isolated C ABI fixture and runtime probe
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-onnx-ep-factory-fixture.c
            ci/m3-original-onnx-ep-registration.c
      - name: Pin upstream v22 header and verify test fixture ABI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/microsoft/onnxruntime/git/blobs/$HEADER_BLOB" --jq .content |
            base64 -d >"$RUNNER_TEMP/onnxruntime_c_api.h"
          test "$(git hash-object "$RUNNER_TEMP/onnxruntime_c_api.h")" = "$HEADER_BLOB"
          cc -std=c11 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP" \
            -DM3_EP_FIXTURE_SELFTEST ci/m3-original-onnx-ep-factory-fixture.c \
            -o "$RUNNER_TEMP/factory-selftest"
          "$RUNNER_TEMP/factory-selftest"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fno-omit-frame-pointer \
            -fvisibility=hidden -shared -I"$RUNNER_TEMP" \
            ci/m3-original-onnx-ep-factory-fixture.c \
            -o "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so"
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" |
            grep -Eq ' CreateEpFactories$'
          nm -D --defined-only "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" |
            grep -Eq ' ReleaseEpFactory$'
          cc -std=c11 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP" \
            ci/m3-original-onnx-ep-registration.c \
            -o "$RUNNER_TEMP/original-ep-registration" -ldl
      - name: Authenticate source-pinned original full-native package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg src "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$src
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/package"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline \
            --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -s "$RUNNER_TEMP/package/vulpra/libonnxruntime.so"
      - name: Exercise genuine original v22 registration and teardown in no-egress sandbox
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          ulimit -c 0
          pkg="$RUNNER_TEMP/package/vulpra"
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$pkg" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 35s \
            "$RUNNER_TEMP/original-ep-registration" "$pkg/libonnxruntime.so" \
            "$RUNNER_TEMP/libvulpra-onnx-ci-ep.so" 2>&1 |
            tee "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'M3_EP_CALLBACK=factory_created' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'M3_EP_CALLBACK=factory_released' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'M3_EP_STAGE=registration_succeeded' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'M3_EP_STAGE=unregistration_succeeded' "$RUNNER_TEMP/m3-ep-lifecycle.log"
          grep -Fxq 'PASS: original ONNX registered and unregistered CI-only factory' \
            "$RUNNER_TEMP/m3-ep-lifecycle.log"
          jq -n --arg source "$SOURCE_SHA" --arg archive "$ARCHIVE_SHA" \
            '{schema_version:1, status:"source_pinned_original_external_ep_factory_lifecycle_pass",
              original_source_commit:$source, original_archive_sha256:$archive,
              exact_header_blob:"b01b7e48dc87bbeeb026c61fb06c591053853ad1",
              test_ep_factories:1, test_ep_devices:0, actual_model_executed:false,
              original_library_registration_succeeded:true,
              original_library_unregistration_succeeded:true,
              fixture_factory_released:true,
              gpu_or_hardware_execution_tested:false, dependency_closure_proven:false,
              source_pruning_authorized:false, native_bytes_saved:0,
              m3_sixth_gate_closed:false}' > "$RUNNER_TEMP/m3-ep-lifecycle.json"
      - name: Upload bounded evidence only after success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-onnx-external-ep-factory-lifecycle
          path: ${{ runner.temp }}/m3-ep-lifecycle.json
          if-no-files-found: error
          retention-days: 14
