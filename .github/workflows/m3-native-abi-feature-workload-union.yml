# Cross-check five *independently successful native runs* and exact original
# 519-VERNEED baseline; source archive never changed, no new feature deletion.
name: M3 Original Native Five-Workload ELF ABI Coverage Union
on:
  push:
    branches: [main]
    paths:
      - ci/m3-native-abi-feature-workload-union.py
      - .github/workflows/m3-native-abi-feature-workload-union.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile-real-feature-triggered-ELF-version-checks:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      STATIC_RUN: '41157293087'
      STATIC_HEAD: 184d5b33678152c1bd28b0c35cecc450e49c93f1
      BROWSER_RUN: '41157865349'
      BROWSER_HEAD: f6d57770dc15ba074bca059bf4fb0d69b25051bc
      GFX_RUN: '41158839352'
      GFX_HEAD: 957925d459cdf66b0c0f99471883b60ebee8347d
      PING_RUN: '41159158976'
      PING_HEAD: 18164d18c20e2d51c1b9b6d1996a0d5a2714bf90
      ONNX_RUN: '41159617600'
      ONNX_HEAD: 2b0c8d8bdd386d6c14f15ffc6ac6f6dc4e54897b
      ALT_RUN: '41160038198'
      ALT_HEAD: 6ba72f8ef779bf734760b00f9045d2ec915aa4d4
    steps:
      - name: Checkout source-pinned bounded ABI coverage reconciliation only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Reject forged ELF data without executing package binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-native-abi-feature-workload-union.py
          python3 ci/m3-native-abi-feature-workload-union.py --self-test
      - name: Authenticate all six original compiled-source evidence runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for kind in STATIC BROWSER GFX PING ONNX ALT; do
            runkey="${kind}_RUN"
            headkey="${kind}_HEAD"
            runid="${!runkey}"
            source_sha="${!headkey}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$runid" |
              jq -e --arg sha "$source_sha" '
                .status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          done
          mkdir -p "$RUNNER_TEMP/static" "$RUNNER_TEMP/browser" "$RUNNER_TEMP/gfx" "$RUNNER_TEMP/ping" "$RUNNER_TEMP/onnx" "$RUNNER_TEMP/alternate"
          gh run download "$STATIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-version-name-contract --dir "$RUNNER_TEMP/static"
          gh run download "$BROWSER_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-graphical-loader-version-checks --dir "$RUNNER_TEMP/browser"
          gh run download "$GFX_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-gfxtest-wayland-activation --dir "$RUNNER_TEMP/gfx"
          gh run download "$PING_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-pingsender-local-activation --dir "$RUNNER_TEMP/ping"
          gh run download "$ONNX_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-onnxruntime-capi-no-egress --dir "$RUNNER_TEMP/onnx"
          gh run download "$ALT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-original-alternate-vulpra-bin-wayland --dir "$RUNNER_TEMP/alternate"
      - name: Verify original source-version contract union across five real native workloads
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/m3-native-abi-feature-workload-union.py \
            --static "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" \
            --browser "$RUNNER_TEMP/browser/m3-native-loader-version-checks.json" \
            --gfx "$RUNNER_TEMP/gfx/m3-native-gfxtest-wayland-activation.json" \
            --ping "$RUNNER_TEMP/ping/m3-original-pingsender-local-activation.json" \
            --onnx "$RUNNER_TEMP/onnx/m3-onnxruntime-native-capi-verification.json" \
            --alternate "$RUNNER_TEMP/alternate/m3-vulpra-bin-native-wayland.json" \
            --output "$RUNNER_TEMP/m3-native-feature-workload-abi-union.json"
          jq -e '
            .schema_version==1 and
            .original_static_compiled_ELF_version_contracts==519 and
            .original_abi_version_contracts_observed_across_five_feature_workloads==407 and
            .original_abi_version_contracts_unexercised_across_five_workloads==112 and
            (.remaining_not_exercised_native_package_ELF_basenames|length)==5 and
            .runtime_version_checks_are_not_symbol_bindings==true and
            .browser_source_deletions_authorized==false and
            .new_binary_savings_bytes==null and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-native-feature-workload-abi-union.json" >/dev/null
          echo 'PASS: five independent compiled native feature routes cover 407 of 519 original GNU version checks'
      - name: Preserve sanitized original binary ABI coverage boundary only
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-five-feature-abi-workload-union
          path: ${{ runner.temp }}/m3-native-feature-workload-abi-union.json
          if-no-files-found: error
          retention-days: 14
