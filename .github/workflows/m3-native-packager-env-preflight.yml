# Fast configure-only preflight for Gecko's exact-source ELF packager import path.
# This does NOT recompile or execute a native browser; it cannot prove strip/elfhack output.
name: M3 Native Packager Environment Preflight

on:
  push:
    branches: [main]
    paths:
      - ci/m3-native-replay-packager.py
      - .github/workflows/m3-native-packager-env-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-configured-packager:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-baseline
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify bounded replay parser and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-native-replay-packager.py
          python3 ci/m3-native-replay-packager.py --self-test
      - name: Bootstrap supported Linux configure prerequisites
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends python3 python3-venv python3-dev git curl make jq \
              libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1 binutils
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || \
             ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
      - name: Configure exact source only, without invoking a native build
        shell: bash
        run: |
          set -euo pipefail
          ./mach configure
          objdir="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline"
          test -f "$objdir/config.status"
          echo "PASS: native source configure succeeded; full compiled browser not built"
      - name: Verify Gecko packager imports and generated buildconfig
        shell: bash
        run: |
          set -euo pipefail
          ./mach python ci/m3-native-replay-packager.py \
            --probe-environment \
            --objdir "$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline" \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/m3-native-packager-environment.json"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            '.source_commit == $sha and
             .buildconfig_origin == "real_mach_python_buildconfig_verified_against_generated_substs" and
             .configured_MOZ_WIDGET_TOOLKIT == "gtk" and
             .configured_PKG_STRIP == true and
             .configured_USE_ELF_HACK == false and
             .native_libxul_built == false and
             .native_packager_replay_executed == false and
             .runtime_package_accepted == false' \
            "$RUNNER_TEMP/m3-native-packager-environment.json" >/dev/null
          echo "PASS: exact-source buildconfig and mozpack import wiring (not ELF transformation)"
      - name: Save bounded configure-only environment attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-packager-environment-preflight
          path: ${{ runner.temp }}/m3-native-packager-environment.json
          if-no-files-found: warn
          retention-days: 14
