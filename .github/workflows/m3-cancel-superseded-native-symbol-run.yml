# One-time cleanup: cancel ONLY the superseded native build run,
# preserving the corrected queued audit and all other repository runs.
name: M3 Cancel Superseded Native Symbol Diagnosis
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-cancel-superseded-native-symbol-run.yml
permissions:
  contents: read
  actions: write
jobs:
  cancel-exact-obsolete-run:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel one superseded old-bound FFI native job only
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 41266082230;
            const expected_sha = '5bf7f38b7090a72ad893552175f61c962b86b840';
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id
            });
            if (data.head_sha !== expected_sha ||
                data.name !== 'M3 Native Source-Pinned Wayland Symbol Diagnosis') {
              throw new Error('Fail closed: unexpected workflow run identity');
            }
            if (!['queued', 'in_progress', 'pending', 'waiting'].includes(data.status)) {
              core.info('Superseded exact run already terminal; no cancellation needed.');
              return;
            }
            await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id });
            core.info('Cancelled only exact superseded native run; corrected new run retained.');
