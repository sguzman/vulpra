# Pinned original GTK DMA-BUF dynamic GBM/DRM ABI against real Ubuntu host ELF.
name: M3 Original DMA-BUF GBM DRM Host ABI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-pinned-dmabuf-host-abi.yml
      - ci/m3-pinned-dmabuf-host-abi.rs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-dmabuf-ffi:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
    steps:
      - name: Checkout bounded current Rust verifier
        uses: actions/checkout@v4
        with:
          path: inspector
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-pinned-dmabuf-host-abi.rs
      - name: Checkout exact original DMA-BUF native source
        uses: actions/checkout@v4
        with:
          path: pinned
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            widget/gtk/DMABufDevice.cpp
      - name: Install actual host GBM and DRM runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libgbm1 libdrm2 binutils
          test -r /usr/lib/x86_64-linux-gnu/libgbm.so.1
          test -r /usr/lib/x86_64-linux-gnu/libdrm.so.2
      - name: Compile and regression-test native symbol audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C inspector rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C pinned rev-parse HEAD)" = "$SOURCE_SHA"
          rustc --edition=2021 --test inspector/ci/m3-pinned-dmabuf-host-abi.rs -o "$RUNNER_TEMP/dmabuf-abi-tests"
          "$RUNNER_TEMP/dmabuf-abi-tests"
          rustc --edition=2021 inspector/ci/m3-pinned-dmabuf-host-abi.rs -o "$RUNNER_TEMP/dmabuf-abi-proof"
      - name: Verify original DMA-BUF runtime function requirements in actual host ELFs
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/dmabuf-abi-proof" "$SOURCE_SHA" \
            "$GITHUB_WORKSPACE/pinned/widget/gtk/DMABufDevice.cpp" \
            /usr/lib/x86_64-linux-gnu/libgbm.so.1 \
            /usr/lib/x86_64-linux-gnu/libdrm.so.2 \
            "$RUNNER_TEMP/m3-original-dmabuf-host-abi.json"
          jq -e --arg sha "$SOURCE_SHA" '
            .gecko_source_commit==$sha and
            .requested_gbm_functions==18 and
            .matched_gbm_exports==18 and
            .requested_drm_functions==1 and
            .matched_drm_exports==1 and
            .missing_requested_functions==0 and
            .direct_source_to_host_abi_proven==true and
            .arch_host_abi_proven==false and
            .all_dynamic_loading_paths_proven==false and
            .m3_sixth_gate_closed==false' "$RUNNER_TEMP/m3-original-dmabuf-host-abi.json" >/dev/null
      - name: Save bounded source to host ABI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-dmabuf-host-abi
          path: ${{ runner.temp }}/m3-original-dmabuf-host-abi.json
          if-no-files-found: warn
          retention-days: 14
