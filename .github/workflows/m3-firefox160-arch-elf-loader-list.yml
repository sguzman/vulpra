# Read-only 28-ELF glibc --list on a disposable Arch Linux Docker userland.
# It uses the GitHub Ubuntu host KERNEL; never claim target Hyprland parity.
# No browser launch, native Firefox build, network access from container,
# workstation change, source pruning or M3 gate closure.
name: M3 Firefox 160 Arch Userland All-ELF Loader Resolution (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/m3-firefox160-arch-elf-loader-list.yml
      - ci/security-160-native-elf-loader-list.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  arch-userland-elf-loader-map:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Authenticate original Firefox160 native producer, preserved source and independent ELF census
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            for(const [id,sha,workflow] of [
              [43138458940,'0624235fdc956ab18af3c3f310b3588ca72fff61',
                'Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate'],
              [43724886827,'54728803f058c3edf54d2e8d3f6e0a7d2af0aec6',
                'Firefox 160 Verified Native Archive Preservation (No Build)'],
              [43730900702,'fd4dee8a9999c303ff35e45fbcd619abe230d30e',
                'M3 Firefox 160 Exact-Source Native ELF Package Graph (No Build)']]){
              const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
              if(run.repository?.full_name!=='sguzman/vulpra' ||
                 run.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
                 run.head_sha!==sha || run.name!==workflow ||
                 run.status!=='completed' || run.conclusion!=='success')
                throw Error('Pinned original source/package provenance mismatch: '+id);
            }
            for(const [id,name] of [
              [43724886827,'firefox160-vulpra-preserved-native-preview-not-approved'],
              [43724886827,'firefox160-vulpra-preserved-materialized-source-proof'],
              [43730900702,'firefox160-source-matched-native-elf-package-graph-not-m3-closure']]){
              const a=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {owner,repo,run_id:id,per_page:100});
              if(a.filter(x=>x.name===name&&!x.expired&&x.size_in_bytes>0&&
                new Date(x.expires_at)>new Date()).length!==1)
                throw Error('Original dependency evidence missing: '+name);
            }
      - name: Checkout small Rust read-only ELF observer
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/security-160-native-elf-loader-list.rs
      - name: Compile and test small observer only, never native Firefox
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/observer"
          rustc --edition=2021 --test ci/security-160-native-elf-loader-list.rs \
            -o "$RUNNER_TEMP/observer/tests"
          "$RUNNER_TEMP/observer/tests"
          rustc --edition=2021 -O ci/security-160-native-elf-loader-list.rs \
            -o "$RUNNER_TEMP/observer/native-elf-loader"
      - name: Download original Firefox160 package archive and source proof
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native
      - name: Download original source-tree identity proof
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source
      - name: Download independent source-matched native ELF direct dependency report
        uses: actions/download-artifact@v4
        with:
          name: firefox160-source-matched-native-elf-package-graph-not-m3-closure
          repository: sguzman/vulpra
          run-id: 43730900702
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/graph
      - name: Verify exact Mozilla160 tree, native archive bytes and independent ELF report
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and
            .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$RUNNER_TEMP/source/materialized-candidate.json" >/dev/null
          (cd "$RUNNER_TEMP/native" && sha256sum -c vulpra-firefox160-native-ci.tar.xz.sha256)
          archive="$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          jq -e --arg sha "$digest" '
            .schema_version==1 and .archive_sha256==$sha and
            .native_browser_producer_run==43138458940 and
            .exact_source_archive_mirror_run==43724886827 and
            .firefox160_upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .firefox160_candidate_git_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            (.elf_members|length)==28 and .direct_needed_edges==268 and
            .all_native_binary_execution_avoided==true and
            .complete_native_ffi_dependency_map_proven==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/graph/firefox160-source-matched-native-elf-graph.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/extracted" "$RUNNER_TEMP/results"
          tar -xf "$archive" -C "$RUNNER_TEMP/extracted"
          test -s "$RUNNER_TEMP/extracted/vulpra/libxul.so"
          test -x "$RUNNER_TEMP/extracted/vulpra/vulpra-bin"
      - name: Build disposable Arch userspace library providers only
        shell: bash
        run: |
          set -euo pipefail
          docker pull archlinux:base
          docker image inspect --format '{{index .RepoDigests 0}}' archlinux:base \
            > "$RUNNER_TEMP/results/arch-base-image-digest.txt"
          cat > "$RUNNER_TEMP/Dockerfile.vulpra160-elf" <<'DOCKER'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed \
              bash coreutils binutils gtk3 dbus-glib alsa-lib nss mesa libglvnd \
              libx11 libxcomposite libxdamage libxfixes libxrandr libxt libxcb \
              fontconfig ttf-dejavu ca-certificates
          DOCKER
          docker build -f "$RUNNER_TEMP/Dockerfile.vulpra160-elf" \
            -t vulpra-firefox160-arch-elf:ci "$RUNNER_TEMP"
      - name: Check 28 real native Firefox160 ELFs with Arch glibc metadata only
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          digest="$(sha256sum "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz" | cut -d ' ' -f 1)"
          # shellcheck disable=SC2086
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 2g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777,size=32m \
            -v "$RUNNER_TEMP/extracted/vulpra:/package:ro" \
            -v "$RUNNER_TEMP/observer:/observer:ro" \
            -v "$RUNNER_TEMP/results:/results:rw" \
            --entrypoint /bin/bash vulpra-firefox160-arch-elf:ci -c '
              set -euo pipefail
              grep -Fxq "ID=arch" /etc/os-release
              test -x /lib64/ld-linux-x86-64.so.2
              export HOME=/tmp
              /observer/native-elf-loader /package "'$digest'" \
                /results/firefox160-arch-28elf-glibc-list.json
              test ! -e /tmp/.mozilla
            '
          jq -e --arg digest "$digest" --slurpfile sources "$RUNNER_TEMP/graph/firefox160-source-matched-native-elf-graph.json" '
            . as $r | $sources[0] as $g |
            .schema_version==1 and
            .status=="source_pinned_firefox160_all_28_elf_loader_list_resolution" and
            .firefox160_source_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .firefox160_archive_sha256==$digest and
            .firefox160_elf_members_listed==28 and
            (.firefox160_elf_basenames|length)==28 and
            .declared_direct_needed_edges==268 and
            .direct_needed_sonames_present_in_loader_lists==268 and
            .loader_listed_provider_name_occurrences>=268 and
            (.per_firefox160_elf|keys)==($g.elf_members|map(.name)|sort) and
            all($g.elf_members[];
              . as $m |
              ($r.per_firefox160_elf[$m.name].declared_direct_needed_names|sort)==($m.needed|sort) and
              $r.per_firefox160_elf[$m.name].declared_direct_needed_count==($m.needed|length)
            ) and
            .glibc_linker_list_metadata_only==true and
            .application_main_executed==false and .no_network_egress==true and
            .actual_genuine_feature_workflows_proven==false and
            .complete_lazy_or_future_dlopen_map_proven==false and
            .arch_hyprland_runtime_tested==false and
            .raw_loader_paths_or_pids_exported==false and
            .source_pruning_authorized==false and
            .security_current==false and .release_ready==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/results/firefox160-arch-28elf-glibc-list.json" >/dev/null
          echo 'PASS: Arch userland glibc resolves all 268 direct DT_NEEDED names for 28 native Firefox160 ELF files.' >> "$GITHUB_STEP_SUMMARY"
          echo 'LIMIT: GitHub Ubuntu kernel + Arch userspace container; no actual workstation, native Firefox launch or complete dynamic loader map.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive bounded Arch provider names, direct edges and pinned image digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-arch-28-elf-glibc-loader-list-not-target-approval
          path: |
            ${{ runner.temp }}/results/firefox160-arch-28elf-glibc-list.json
            ${{ runner.temp }}/results/arch-base-image-digest.txt
          if-no-files-found: warn
          retention-days: 30
