# Source-pinned original packaged Vulpra live WebAudio -> PulseAudio null sink.
# No physical audio device, microphone, host Pulse/PipeWire or network.
# CI 41483634953 proved actual audio stream; 41487961096 independently
# proved runtime-selected "pulse-rust" via privileged native windowUtils.
# Privileged WebDriver access is restricted to the disposable no-egress CI.
# Native source-pinned CI 41492260472 passed; sanitized artifact 13163799244:
# two successful instrumented libxul-origin libpulse.so.0 dlopen records.
# LD_PRELOAD modifies symbol resolution; no uninstrumented full FFI stack.
# Source-pinned before/during browser proc-map crosswalk PASS: 41668827940;
# no new mapped library basenames across phases, Pulse backing ELF already resident.
# Four negative mutations rejected; retain manual-only expensive native workflow.
name: M3 Original Browser Pulse Null Sink
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-pulse-null-sink:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout small audio diagnostic only
        uses: actions/checkout@v4
        with:
          path: diagnostics
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-browser-pulse-local-origin.rs
            ci/m3-original-browser-pulse-webdriver.sh
            ci/m3-original-libpulse-dlopen-callsite.c
            ci/m3-original-browser-on-demand-maps.rs
            ci/m3-original-browser-pulse-map-crosswalk.jq
      - name: Checkout original cubeb backend source contracts
        uses: actions/checkout@v4
        with:
          path: original-source
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            media/libcubeb/src/cubeb.c
            media/libcubeb/src/moz.build
            toolkit/library/rust/shared/Cargo.toml
            toolkit/library/rust/gkrust-features.mozbuild
            toolkit/modules/Troubleshoot.sys.mjs
            toolkit/content/aboutSupport.js
            dom/media/CubebUtils.cpp
      - name: Authenticate source backend boundary and immutable browser package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C diagnostics rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-source rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq 'pulse_rust_init(cubeb **' original-source/media/libcubeb/src/cubeb.c
          grep -Fq '      pulse_rust_init,' original-source/media/libcubeb/src/cubeb.c
          grep -Fq "DEFINES['USE_PULSE_RUST'] = True" original-source/media/libcubeb/src/moz.build
          grep -Fq 'pulse-dlopen' original-source/toolkit/library/rust/shared/Cargo.toml
          grep -Fq 'gkrust_features += ["cubeb_pulse_rust"]' original-source/toolkit/library/rust/gkrust-features.mozbuild
          grep -Fq 'data.currentAudioBackend = winUtils.currentAudioBackend' original-source/toolkit/modules/Troubleshoot.sys.mjs
          grep -Fq 'insertBasicInfo("audio-backend", data.currentAudioBackend)' original-source/toolkit/content/aboutSupport.js
          grep -Fq 'const char* backend = cubeb_get_backend_id(handle->Context());' original-source/dom/media/CubebUtils.cpp
          grep -Fq 'new AudioContext(' diagnostics/ci/m3-original-browser-pulse-local-origin.rs
          bash -n diagnostics/ci/m3-original-browser-pulse-webdriver.sh
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            diagnostics/ci/m3-original-libpulse-dlopen-callsite.c -ldl \
            -o "$RUNNER_TEMP/m3-libpulse-trace.so"
          test -s "$RUNNER_TEMP/m3-libpulse-trace.so"
          rustc --edition=2021 -D warnings -O diagnostics/ci/m3-original-browser-pulse-local-origin.rs \
            -o "$RUNNER_TEMP/m3-original-pulse-local-origin"
          rustc --edition=2021 -D warnings --test diagnostics/ci/m3-original-browser-on-demand-maps.rs \
            -o "$RUNNER_TEMP/m3-on-demand-maps-test"
          "$RUNNER_TEMP/m3-on-demand-maps-test"
          rustc --edition=2021 -D warnings -O diagnostics/ci/m3-original-browser-on-demand-maps.rs \
            -o "$RUNNER_TEMP/m3-on-demand-maps"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package" "$RUNNER_TEMP/reports"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/vulpra/vulpra"
          grep -Fxq 'Name=Vulpra' "$RUNNER_TEMP/package/vulpra/application.ini"
      - name: Build disposable Arch PulseAudio and Weston runtime
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio-container"
          cat >"$RUNNER_TEMP/audio-container/Dockerfile" <<'EOF'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed \
            bash coreutils curl jq grep findutils procps-ng util-linux iproute2 \
            geckodriver gtk3 dbus-glib alsa-lib nss weston wayland-utils \
            mesa libglvnd ttf-dejavu pulseaudio libpulse \
            && command -v pactl && command -v pulseaudio && command -v setpriv \
            && rm -rf /var/cache/pacman/pkg/*
          EOF
          docker build --pull --no-cache -t vulpra-m3-pulse:ci "$RUNNER_TEMP/audio-container"
      - name: Execute original browser audio into only private null sink
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --shm-size 256m \
            --cap-drop ALL --cap-add NET_ADMIN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --pids-limit 512 --memory 4g \
            --tmpfs /tmp:rw,nosuid,nodev,size=600m,mode=1777 \
            -v "$RUNNER_TEMP/package/vulpra:/original:ro" \
            -v "$RUNNER_TEMP/m3-original-pulse-local-origin:/audit/local-origin:ro" \
            -v "$RUNNER_TEMP/m3-libpulse-trace.so:/audit/libpulse-trace.so:ro" \
            -v "$RUNNER_TEMP/m3-on-demand-maps:/audit/on-demand-maps:ro" \
            -v "$GITHUB_WORKSPACE/diagnostics/ci/m3-original-browser-pulse-webdriver.sh:/audit/webdriver.sh:ro" \
            -v "$RUNNER_TEMP/reports:/reports:rw" \
            -e CI_UID="$(id -u)" -e CI_GID="$(id -g)" \
            -e MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            -e VULPRA_OFFLINE_CONTAINER_ONLY=1 \
            -e VULPRA_M3_NO_AUDIO_DEVICE=1 \
            -e LD_PRELOAD=/audit/libpulse-trace.so \
            -e VULPRA_M3_LIBPULSE_DLOPEN_TRACE=/tmp/vulpra-m3-libpulse-dlopen.trace \
            vulpra-m3-pulse:ci /bin/bash -c '
              set -euo pipefail
              test ! -e /dev/snd
              ip link set lo up
              exec setpriv --reuid "$CI_UID" --regid "$CI_GID" --clear-groups \
                /bin/bash /audit/webdriver.sh /original/vulpra /audit/local-origin \
                /reports/m3-original-browser-pulse-null-sink.json
            '
      - name: Reconcile live original browser library mappings before and during real WebAudio
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/reports/m3-original-pulse-before-maps.json"
          during="$RUNNER_TEMP/reports/m3-original-pulse-during-maps.json"
          audio="$RUNNER_TEMP/reports/m3-original-browser-pulse-null-sink.json"
          out="$RUNNER_TEMP/reports/m3-original-pulse-on-demand-map-crosswalk.json"
          test -s "$before" && test -s "$during" && test -s "$audio"
          crosswalk() {
            jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
              --slurpfile before "$1" --slurpfile during "$2" \
              --slurpfile audio "$3" \
              -f diagnostics/ci/m3-original-browser-pulse-map-crosswalk.jq
          }
          crosswalk "$before" "$during" "$audio" >"$out"
          jq -e '
            .schema_version==1 and
            .status=="original_webaudio_before_during_actual_browser_library_residency_crosswalk" and
            .original_browser_before_process_count>=1 and
            .original_browser_during_process_count>=1 and
            .before_original_package_library_count>=2 and
            .during_original_package_library_count>=2 and
            .pulse_mapped_during_real_audio==true and
            .native_backend_pulse_rust_verified==true and
            .real_private_null_sink_audio_confirmed==true and
            .ld_preload_instrumentation_affects_resolution==true and
            .complete_future_browser_ffi_dlopen_closure==false and
            .source_pruning_authorized==false and
            .native_bytes_saved==0 and
            .m3_sixth_gate_closed==false' "$out" >/dev/null
          # /proc/maps exposes a versioned backing filename (e.g. libpulse.so.0.24.3),
          # not necessarily the libpulse.so.0 SONAME. Remove every such mapped
          # basename from the mutant, or the negative assertion is a false pass.
          jq '.host_mapped_shared_library_basenames |=
                map(select(startswith("libpulse.so.0") | not))' \
            "$during" >"$RUNNER_TEMP/reports/m3-mutant-maps.json"
          if crosswalk "$before" "$RUNNER_TEMP/reports/m3-mutant-maps.json" "$audio" \
             >/dev/null 2>&1; then
            echo 'FAIL: missing live PulseAudio mapping was accepted' >&2
            exit 1
          fi
          jq '.original_archive_sha256="invalid-source-drift"' "$before" \
            >"$RUNNER_TEMP/reports/m3-mutant-maps.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-mutant-maps.json" "$during" "$audio" \
             >/dev/null 2>&1; then
            echo 'FAIL: original package provenance mutation was accepted' >&2
            exit 1
          fi
          jq '.package_mapped_shared_library_basenames |= . + [.[0]]' "$during" \
            >"$RUNNER_TEMP/reports/m3-mutant-maps.json"
          if crosswalk "$before" "$RUNNER_TEMP/reports/m3-mutant-maps.json" "$audio" \
             >/dev/null 2>&1; then
            echo 'FAIL: duplicated original package mapping was accepted' >&2
            exit 1
          fi
          jq '.libpulse_mapped_in_original_browser |= not' "$before" \
            >"$RUNNER_TEMP/reports/m3-mutant-maps.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-mutant-maps.json" "$during" "$audio" \
             >/dev/null 2>&1; then
            echo 'FAIL: inconsistent before-click PulseAudio witness accepted' >&2
            exit 1
          fi
          echo 'PASS: original WebAudio feature before/during live mapped ELF and four negative mutations'
      - name: Accept only bounded audio stream evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_browser_webaudio_pulse_null_sink_stream_verified" and
            .source_commit==$src and .archive_sha256==$sha and
            .original_native_browser_executed==true and
            .real_user_click_audio_context_running==true and
            .pulse_null_sink_created==true and
            .pulse_sink_had_no_inputs_before_browser_audio==true and
            .pulse_sink_input_observed_during_browser_audio==true and
            (.libpulse_mapped_before_click|type=="boolean") and
            .libpulse_mapped_during_audio==true and
            (.reported_cubeb_backend=="pulse-rust") and
            (.reported_cubeb_backend_is_pulse_rust==true) and
            (.instrumented_original_libxul_origin_libpulse_dlopen_successes|type=="number" and .>=1 and .<=1000) and
            .original_browser_libpulse_loader_caller_pc_observed_with_ld_preload==true and
            .instrumentation_changes_original_symbol_resolution==true and
            .uninterposed_original_browser_loader_callstack_proven==false and
            .compiled_rust_pulse_callsite_proven==false and
            .physical_audio_or_microphone_used==false and
            .network_egress_allowed==false and
            .target_endeavouros_verified==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/reports/m3-original-browser-pulse-null-sink.json" >/dev/null
          echo 'PASS: original browser live audio reached isolated Pulse null sink; no real device or full loader closure'
      - name: Upload only privacy-safe PulseAudio summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-browser-pulse-null-sink
          path: |
            ${{ runner.temp }}/reports/m3-original-browser-pulse-null-sink.json
            ${{ runner.temp }}/reports/m3-original-pulse-before-maps.json
            ${{ runner.temp }}/reports/m3-original-pulse-during-maps.json
            ${{ runner.temp }}/reports/m3-original-pulse-on-demand-map-crosswalk.json
          if-no-files-found: error
          retention-days: 14
