# Original compiled ONNX's internal dlopen boundary under no-egress and a
# deliberately minimal public C API entrypoint. This MUST NOT be confused with
# the separate external Rust probe's dlopen of ONNX itself.
name: M3 Original ONNX Inner Dlopen Diagnostic
# Exact-original runtime test already passed in 41524996253.
# Avoid repeated original archive extraction on documentation-only updates.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-original-onnx-inner-dlopen:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
    steps:
      - name: Checkout bounded original ONNX C API and diagnostic
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-onnxruntime-capi-probe.rs
            ci/m3-original-onnx-inner-dlopen-observe.c
      - name: Compile diagnostic and verify actual positive and negative native ELF fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fPIC -fno-omit-frame-pointer \
            -shared ci/m3-original-onnx-inner-dlopen-observe.c \
            -o "$RUNNER_TEMP/onnx-inner-observe.so" -ldl
          test "$(nm -D --defined-only "$RUNNER_TEMP/onnx-inner-observe.so" |
            awk '$3=="dlopen"{n++} END{print n+0}')" -eq 1
          rustc --edition=2021 -O ci/m3-onnxruntime-capi-probe.rs \
            -o "$RUNNER_TEMP/original-onnx-capi-probe"
          mkdir -p "$RUNNER_TEMP/onnx-fixtures"
          cat >"$RUNNER_TEMP/onnx-fixtures/lib.c" <<'C'
          #include <dlfcn.h>
          int trigger_test_only_library_open(void) {
            void *h = dlopen("libm.so.6", RTLD_NOW | RTLD_LOCAL);
            if (!h) return 1;
            return dlclose(h) != 0;
          }
          C
          cat >"$RUNNER_TEMP/onnx-fixtures/launcher.c" <<'C'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc,char **argv) {
            if (argc!=2) return 2;
            void *h=dlopen(argv[1], RTLD_NOW|RTLD_LOCAL);
            if (!h) return 3;
            int (*call)(void)=(int (*)(void))dlsym(h,"trigger_test_only_library_open");
            if (!call || call()) return 4;
            return dlclose(h)!=0;
          }
          C
          cc -O2 -fPIC -shared "$RUNNER_TEMP/onnx-fixtures/lib.c" \
            -o "$RUNNER_TEMP/onnx-fixtures/libonnxruntime.so" -ldl
          cc -O2 -fPIC -shared "$RUNNER_TEMP/onnx-fixtures/lib.c" \
            -o "$RUNNER_TEMP/onnx-fixtures/libnotonnx.so" -ldl
          cc -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/onnx-fixtures/launcher.c" \
            -o "$RUNNER_TEMP/onnx-fixtures/launcher" -ldl
          env LD_PRELOAD="$RUNNER_TEMP/onnx-inner-observe.so" \
            M3_ONNX_INNER_DLOPEN_REPORT="$RUNNER_TEMP/onnx-fixtures/positive.json" \
            "$RUNNER_TEMP/onnx-fixtures/launcher" "$RUNNER_TEMP/onnx-fixtures/libonnxruntime.so"
          jq -e '
            .schema_version==1 and .diagnostic_interposition_used==true and
            .target_origin_basename=="libonnxruntime.so" and
            .onnx_origin_dlopen_calls==1 and
            .onnx_origin_successful_dlopen_calls==1 and
            .onnx_origin_failed_dlopen_calls==0 and
            .other_origin_dlopen_calls>=1 and
            .all_interposed_dlopen_calls==(.onnx_origin_dlopen_calls+.other_origin_dlopen_calls) and
            .raw_caller_addresses_or_library_names_retained==false
          ' "$RUNNER_TEMP/onnx-fixtures/positive.json" >/dev/null
          env LD_PRELOAD="$RUNNER_TEMP/onnx-inner-observe.so" \
            M3_ONNX_INNER_DLOPEN_REPORT="$RUNNER_TEMP/onnx-fixtures/negative.json" \
            "$RUNNER_TEMP/onnx-fixtures/launcher" "$RUNNER_TEMP/onnx-fixtures/libnotonnx.so"
          jq -e '
            .schema_version==1 and .onnx_origin_dlopen_calls==0 and
            .other_origin_dlopen_calls>=2 and
            .all_interposed_dlopen_calls==.other_origin_dlopen_calls
          ' "$RUNNER_TEMP/onnx-fixtures/negative.json" >/dev/null
          echo 'PASS: real compiled C shared library triggers ONNX-origin inner dlopen, same code under other SONAME does not'
      - name: Obtain independently source-pinned original ONNX compiled library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/packaged"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline \
            --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/packaged"
          test -f "$RUNNER_TEMP/packaged/vulpra/libonnxruntime.so"
          readelf -h "$RUNNER_TEMP/packaged/vulpra/libonnxruntime.so" |
            grep -Fq 'ELF64'
          nm -D --defined-only "$RUNNER_TEMP/packaged/vulpra/libonnxruntime.so" |
            grep -Eq ' OrtGetApiBase(@|$)'
          echo 'PASS: original source-matched packaged ONNX Runtime retained'
      - name: Activate actual original ONNX public C API with and without observer in no-egress netns
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/packaged/vulpra"
          probe="$RUNNER_TEMP/original-onnx-capi-probe"
          shim="$RUNNER_TEMP/onnx-inner-observe.so"
          report="$RUNNER_TEMP/real-original-onnx-inner-dlopen.json"
          # Two identical API calls; one ordinary control, one diagnostic
          # LD_PRELOAD treatment. No model, device, browser, or network.
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$package" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 25s \
            "$probe" "$package/libonnxruntime.so" |
            tee "$RUNNER_TEMP/control.stdout" >/dev/null
          grep -Fxq 'PASS: original packaged ONNX Runtime C API base and nonempty version string invoked' \
            "$RUNNER_TEMP/control.stdout"
          # Only the probe receives LD_PRELOAD. Preloading the timeout
          # supervisor would create the exclusive report before the probe.
          sudo unshare --net -- env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            LD_LIBRARY_PATH="$package" MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            timeout --signal=TERM --kill-after=3s 25s \
            env LD_PRELOAD="$shim" M3_ONNX_INNER_DLOPEN_REPORT="$report" \
            "$probe" "$package/libonnxruntime.so" |
            tee "$RUNNER_TEMP/observed.stdout" >/dev/null
          grep -Fxq 'PASS: original packaged ONNX Runtime C API base and nonempty version string invoked' \
            "$RUNNER_TEMP/observed.stdout"
          test -s "$report"
          sudo chmod 0644 "$report"
          jq -e '
            .schema_version==1 and
            .diagnostic_interposition_used==true and
            .target_origin_basename=="libonnxruntime.so" and
            .all_interposed_dlopen_calls>=1 and
            .onnx_origin_dlopen_calls>=0 and
            .onnx_origin_successful_dlopen_calls>=0 and
            .onnx_origin_failed_dlopen_calls>=0 and
            .all_interposed_dlopen_calls==(.onnx_origin_dlopen_calls+.other_origin_dlopen_calls) and
            .onnx_origin_dlopen_calls==(.onnx_origin_successful_dlopen_calls+.onnx_origin_failed_dlopen_calls) and
            .raw_caller_addresses_or_library_names_retained==false and
            .complete_native_loader_graph_proven==false
          ' "$report" >/dev/null
          jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
            --slurpfile observed "$report" '
            ($observed[0]) as $o |
            {
              schema_version:1,
              status:"exact_original_onnx_api_base_inner_dlopen_origin_observed",
              original_compiled_source_commit:$src,
              original_full_normal_native_package_sha256:$sha,
              original_package_onnx_c_api_base_called_without_interposition:true,
              original_package_onnx_c_api_base_called_with_interposition:true,
              exact_original_module_origin_dlopen_calls:$o.onnx_origin_dlopen_calls,
              exact_original_module_origin_successes:$o.onnx_origin_successful_dlopen_calls,
              exact_original_module_origin_failures:$o.onnx_origin_failed_dlopen_calls,
              other_origin_dlopen_calls:$o.other_origin_dlopen_calls,
              original_internal_loader_branch_runtime_execution_observed:($o.onnx_origin_dlopen_calls>0),
              target_loaded_by_probe_not_confused_with_internal_call:true,
              interposer_changes_native_symbol_binding:true,
              exact_inner_callsite_machine_instruction_attributed:false,
              incomplete_or_unexercised_optional_feature_routes_proven:false,
              model_loaded_or_inference_executed:false,
              physical_gpu_or_device_exercised:false,
              actual_original_browser_ml_feature_exercised:false,
              network_egress_available:false,
              original_user_profile_accessed:false,
              source_pruning_authorized:false,
              m3_sixth_gate_closed:false
            }' >"$RUNNER_TEMP/m3-onnx-inner-dlopen-bounded.json"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .status=="exact_original_onnx_api_base_inner_dlopen_origin_observed" and
            .original_compiled_source_commit==$src and
            .original_full_normal_native_package_sha256==$sha and
            .original_package_onnx_c_api_base_called_without_interposition==true and
            .original_package_onnx_c_api_base_called_with_interposition==true and
            (.exact_original_module_origin_dlopen_calls|type=="number") and
            .target_loaded_by_probe_not_confused_with_internal_call==true and
            .interposer_changes_native_symbol_binding==true and
            .exact_inner_callsite_machine_instruction_attributed==false and
            .actual_original_browser_ml_feature_exercised==false and
            .incomplete_or_unexercised_optional_feature_routes_proven==false and
            .network_egress_available==false and
            .source_pruning_authorized==false and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-onnx-inner-dlopen-bounded.json" >/dev/null
          echo 'PASS: original ONNX C API runs in both isolated modes and runtime inner dlopen origin is independently classified; not all paths'
      - name: Publish only bounded ONNX inner-loader result, never raw traces
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-onnx-capi-inner-dlopen-origin
          path: ${{ runner.temp }}/m3-onnx-inner-dlopen-bounded.json
          if-no-files-found: error
          retention-days: 14
