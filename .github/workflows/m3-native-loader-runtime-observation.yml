# Actual GNU/Linux dynamic-loader observation from original pinned native Vulpra.
# Executes protected headless about:newtab / ASRouter smoke under disposable
# profile, records sanitized basenames only. No raw paths, PID, network or users.
name: M3 Native Dynamic Loader Startup Observation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-loader-runtime-observation.yml
      - ci/m3-native-loader-runtime-observation.py
      - ci/smoke-newtab-asrouter-native-bridge.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-compiled-browser-loader-under-headless-qa:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout read-only native smoke and bounded parser
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Reject forged loader traces and authenticate original source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-native-loader-runtime-observation.py \
            ci/smoke-newtab-asrouter-native-bridge.py ci/smoke-webextension-package-local.py
          python3 ci/m3-native-loader-runtime-observation.py --self-test
          python3 ci/smoke-newtab-asrouter-native-bridge.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
      - name: Download original compiled full-Normandy archive with checksum provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path(os.environ["RUNNER_TEMP"])/"original"
          archive=root/"full-normandy-baseline.tar.xz"
          m=json.loads((root/"m3-full-normandy-baseline.json").read_text())
          assert m["schema_version"]==1
          assert m["source_commit"]==os.environ["SOURCE_SHA"]
          assert m["variant"]=="full-normandy"
          assert m["required_newtab_modules_present"] is True
          assert m["normandy_runner_present"] is True
          assert m["sha256"]==os.environ["ARCHIVE_SHA256"]==hashlib.sha256(archive.read_bytes()).hexdigest()
          assert m["compressed_bytes"]==archive.stat().st_size==87154544
          print("PASS: original compiled Vulpra source and archive authenticated")
          PY
          mkdir -p .git/vulpra-native-build/packages
          cp "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" \
            .git/vulpra-native-build/packages/vulpra-local-loader-observation.tar.xz
          (cd .git/vulpra-native-build/packages && \
           sha256sum vulpra-local-loader-observation.tar.xz > \
               vulpra-local-loader-observation.tar.xz.sha256)
      - name: Install runtime libraries and pinned GeckoDriver only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 \
            libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
      - name: Observe actual loader and dynamic imports during native New Tab QA
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loader"
          # Every WebDriver process uses a disposable profile. LD_DEBUG is
          # inherited by browser children, and its raw log is never uploaded.
          env PATH="$RUNNER_TEMP:$PATH" MOZ_HEADLESS=1 LD_DEBUG=libs,files \
            LD_DEBUG_OUTPUT="$RUNNER_TEMP/loader/m3-loader" \
            python3 ci/smoke-newtab-asrouter-native-bridge.py "$GITHUB_WORKSPACE"
          python3 ci/m3-native-loader-runtime-observation.py \
            "$RUNNER_TEMP/loader" --output "$RUNNER_TEMP/m3-runtime-loader-observation.json"
          jq -e '
            .schema_version==1 and
            .status=="actual_native_full_normal_loader_observation" and
            .browser_process_traces_with_libxul>=1 and
            .observed_loader_init_library_basename_count>=3 and
            (.observed_loader_init_library_basenames|index("libc.so.6")!=null) and
            .libxul_requested_in_real_browser_process==true and
            .libc_loader_init_observed==true and
            .real_native_webdriver_workload_passed==true and
            .raw_loader_traces_retained==false and
            .complete_dlopen_graph_proven==false and
            .unexecuted_feature_routes_proven==false and
            .complete_dynamic_symbol_and_ABI_resolution_proven==false and
            .current_main_browser_recompiled==false and
            .new_source_removal_authorized==false and
            .new_compressed_savings_bytes==null and
            .whole_m3_feature_dependency_gate_completed==false' \
            "$RUNNER_TEMP/m3-runtime-loader-observation.json" >/dev/null
          rm -rf -- "$RUNNER_TEMP/loader"
      - name: Preserve only sanitized basename evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-loader-startup-sanitized
          path: ${{ runner.temp }}/m3-runtime-loader-observation.json
          if-no-files-found: warn
          retention-days: 14
