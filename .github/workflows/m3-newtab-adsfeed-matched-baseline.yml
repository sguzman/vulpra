# Independent full native reference package for the optional AdsFeed omission.
# Runs alongside the matching lean workflow when the lean workflow is edited.
# The separate event-driven comparator checks both artifacts only when both
# native workflows have completed; no polling or repeat Firefox compilation.
name: M3 Native Full New Tab AdsFeed Baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-newtab-adsfeed-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full-in-parallel:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-baseline
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout exact source used by the simultaneous lean native candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source, normal flag and protected default manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash ci/tests/m3-newtab-adsfeed-optout-test.sh "$GITHUB_WORKSPACE"
          bash ci/tests/m3-asrouter-promos-optout-test.sh "$GITHUB_WORKSPACE"
          test "${VULPRA_EXPERIMENT_NO_NEWTAB_ADSFEED:-}" = ""
          test "${VULPRA_EXPERIMENT_NO_ASROUTER_PROMOS:-}" = ""
          echo "PASS: full and lean comparison use the same commit and options"

      - name: Prepare Mozilla compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export Actions compiler-cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap supported full browser compiler
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 python3-venv python3-dev git curl make jq
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
          major="$("$HOME/.mozbuild/clang/bin/clang" --version | head -1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 19 ))

      - name: Configure true full baseline and require absent experimental macros
        shell: bash
        run: |
          set -euo pipefail
          ./mach configure
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("obj-vulpra-linux-m3-baseline/config.statusd")
          def get(k):
              p=root/"substs"/k
              return json.loads(p.read_text()) if p.exists() else None
          assert get("MOZ_WIDGET_TOOLKIT")=="gtk"
          assert get("MOZ_APP_BASENAME")=="Vulpra"
          assert get("MOZ_DEVTOOLS")=="all"
          for key in ("MOZ_SANDBOX","MOZ_WAYLAND","MOZ_SERVICES_SYNC","MOZ_NORMANDY"):
              assert str(get(key)) in ("1","True"),(key,get(key))
          for feature in ("VULPRA_NO_NEWTAB_ADSFEED","VULPRA_NO_ASROUTER_PROMOS"):
              assert get(feature) in (False,None,0,""),(feature,get(feature))
              assert not (root/"defines"/feature).exists(),("FALSE #ifdef MACRO",feature)
          print("PASS: BOTH opt-out macros absent; normal sponsored feed and normal ASRouter required")
          PY

      - name: Reserve matching 24 GiB compilation swap
        shell: bash
        run: |
          set -euo pipefail
          bytes=$((24*1024*1024*1024))
          available="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( available > bytes + 8*1024*1024*1024 ))
          sudo fallocate -l 24G /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo chmod 0600 /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo mkswap /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo swapon /mnt/vulpra-m3-adsfeed-baseline.swap
          grep -Fq '/mnt/vulpra-m3-adsfeed-baseline.swap' /proc/swaps

      - name: Compile full baseline Linux browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-adsfeed-baseline-build.log"

      - name: Package full baseline and verify original sponsored resource
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist=obj-vulpra-linux-m3-baseline/dist
          mapfile -d '' -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print0)
          [[ "${#archives[@]}" -eq 1 ]]
          bash packaging/stage.sh "${archives[0]}" "$RUNNER_TEMP/vulpra-m3-adsfeed-full-baseline.tar.xz"
          (cd "$RUNNER_TEMP" && sha256sum -c vulpra-m3-adsfeed-full-baseline.tar.xz.sha256)
          python3 - <<'PY'
          import hashlib,io,json,os,tarfile,zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          archive=root/"vulpra-m3-adsfeed-full-baseline.tar.xz"
          entries=set()
          jars=0
          with tarfile.open(archive,"r:xz") as tf:
              for item in tf:
                  if item.isfile() and item.name.endswith("/omni.ja"):
                      jars+=1
                      with zipfile.ZipFile(io.BytesIO(tf.extractfile(item).read())) as jar:
                          entries.update(jar.namelist())
          required=[
              "builtin-addons/newtab/lib/AdsFeed.sys.mjs",
              "builtin-addons/newtab/lib/ActivityStream.sys.mjs",
              "builtin-addons/newtab/lib/DiscoveryStreamFeed.sys.mjs",
              "builtin-addons/newtab/lib/AdsClient.sys.mjs",
              "builtin-addons/newtab/lib/Store.sys.mjs",
              "builtin-addons/newtab/lib/TopStoriesFeed.sys.mjs",
          ]
          absent=[x for x in required if not any(n.endswith(x) for n in entries)]
          assert jars >= 2 and not absent,(jars,absent)
          report={
              "schema_version":1,
              "source_commit":os.environ["GITHUB_SHA"],
              "variant":"full-newtab-adsfeed-normal-linux",
              "baseline_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "normal_adsfeed_resource_present":True,
              "protected_resources_present":True,
              "omni_jar_count":jars,
              "compressed_package_bytes":archive.stat().st_size,
              "sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "status":"full baseline native compilation and exact resource check accepted",
          }
          (root/"m3-newtab-adsfeed-full-baseline-evidence.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          print("PASS: real full baseline contains AdsFeed and all protected New Tab modules")
          PY

      - name: Upload bounded independent baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-full-baseline-evidence
          path: |
            ${{ runner.temp }}/m3-newtab-adsfeed-full-baseline-evidence.json
            ${{ runner.temp }}/vulpra-m3-adsfeed-full-baseline.tar.xz.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Capture baseline failure tail
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-adsfeed-baseline-build.log"; then
            tail -n 3000 "$RUNNER_TEMP/m3-adsfeed-baseline-build.log" > "$RUNNER_TEMP/m3-adsfeed-baseline-failure-tail.log"
          fi

      - name: Upload baseline failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-baseline-failure-tail
          path: ${{ runner.temp }}/m3-adsfeed-baseline-failure-tail.log
          if-no-files-found: warn
          retention-days: 14

