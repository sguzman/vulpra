# Source-pinned full baseline only after the real lean native candidate passed.
# No baseline compiler minutes are spent on a failing experimental candidate.
name: M3 Compare New Tab AdsFeed Native Package Bytes

on:
  workflow_run:
    workflows: ["M3 Native New Tab AdsFeed Opt-out Trial"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: vulpra-m3-adsfeed-matched-baseline
  cancel-in-progress: false

jobs:
  build-source-matched-full:
    if: >-
      github.repository == 'sguzman/vulpra' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-baseline
      MOZ_HEADLESS: "1"
      DEBIAN_FRONTEND: noninteractive
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout EXACT native candidate source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Check pinned source, matching options and unchanged default resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          bash ci/tests/m3-newtab-adsfeed-optout-test.sh "$GITHUB_WORKSPACE"
          test "${VULPRA_EXPERIMENT_NO_NEWTAB_ADSFEED:-}" = ""
          echo "PASS: baseline uses exact successful lean commit and normal New Tab wildcard"

      - name: Download native candidate's independently checked evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adsfeed-candidate"
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-newtab-adsfeed-native-evidence \
            --dir "$RUNNER_TEMP/adsfeed-candidate"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"adsfeed-candidate"
          files=list(root.rglob("m3-newtab-adsfeed-evidence.json"))
          assert len(files)==1,files
          data=json.loads(files[0].read_text())
          assert data["source_commit"] == os.environ["CANDIDATE_SHA"],data
          assert data["status"]=="native and runtime accepted; matched baseline comparison pending",data
          assert data["variant"]=="linux-newtab-adsfeed-experimental-omission",data
          assert data["omitted_resource"].endswith("/AdsFeed.sys.mjs"),data
          assert data["tested"]["newtab"] and data["tested"]["wayland"],data
          assert data["tested"]["webextensions"] and data["tested"]["nimbus"],data
          assert data["matched_baseline_delta_bytes"] is None
          assert re.fullmatch(r"[0-9a-f]{64}",data["sha256"])
          assert isinstance(data["compressed_package_bytes"],int) and data["compressed_package_bytes"]>0
          (root/"candidate-byte-count.txt").write_text(str(data["compressed_package_bytes"])+"\n")
          print("PASS: source-pinned candidate passed packaged real New Tab + browser runtime")
          PY

      - name: Prepare identical Mozilla compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export identical Actions compiler cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap supported full-build compiler
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends python3 python3-venv python3-dev \
            git curl make jq
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || \
             ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
          major="$("$HOME/.mozbuild/clang/bin/clang" --version | head -1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 19 ))
          echo "PASS: supported Clang $major ready"

      - name: Verify identical protected GTK configure with AdsFeed INCLUDED
        shell: bash
        run: |
          set -euo pipefail
          ./mach configure
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("obj-vulpra-linux-m3-baseline/config.statusd/substs")
          def get(k):
              p=root/k
              return json.loads(p.read_text()) if p.exists() else None
          assert get("VULPRA_NO_NEWTAB_ADSFEED") in (False,None,0,"")
          assert get("VULPRA_NO_ASROUTER_PROMOS") in (False,None,0,"")
          assert get("MOZ_WIDGET_TOOLKIT")=="gtk"
          assert get("MOZ_APP_BASENAME")=="Vulpra"
          assert get("MOZ_DEVTOOLS")=="all"
          for key in ("MOZ_SANDBOX","MOZ_WAYLAND","MOZ_SERVICES_SYNC","MOZ_NORMANDY"):
              assert str(get(key)) in ("1","True"),(key,get(key))
          print("PASS: same feature set, original AdsFeed included by default")
          PY

      - name: Reserve 24 GiB compilation swap
        shell: bash
        run: |
          set -euo pipefail
          bytes=$((24*1024*1024*1024))
          available="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( available > bytes + 8*1024*1024*1024 ))
          sudo fallocate -l 24G /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo chmod 0600 /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo mkswap /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo swapon /mnt/vulpra-m3-adsfeed-baseline.swap
          grep -Fq '/mnt/vulpra-m3-adsfeed-baseline.swap' /proc/swaps

      - name: Compile source-matched baseline Linux browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-adsfeed-baseline-build.log"

      - name: Package full baseline, verify original resource, compare exact bytes
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist=obj-vulpra-linux-m3-baseline/dist
          mapfile -d '' -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print0)
          [[ "${#archives[@]}" -eq 1 ]]
          bash packaging/stage.sh "${archives[0]}" "$RUNNER_TEMP/vulpra-m3-adsfeed-full-baseline.tar.xz"
          (cd "$RUNNER_TEMP" && sha256sum -c vulpra-m3-adsfeed-full-baseline.tar.xz.sha256)
          python3 - <<'PY'
          import hashlib,io,json,os,tarfile,zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          archive=root/"vulpra-m3-adsfeed-full-baseline.tar.xz"
          entries=set()
          with tarfile.open(archive,"r:xz") as tf:
              for item in tf:
                  if item.isfile() and item.name.endswith("/omni.ja"):
                      with zipfile.ZipFile(io.BytesIO(tf.extractfile(item).read())) as jar:
                          entries.update(jar.namelist())
          target="builtin-addons/newtab/lib/AdsFeed.sys.mjs"
          assert any(n.endswith(target) for n in entries),("baseline lacks AdsFeed",target)
          candidate=int((root/"adsfeed-candidate"/"candidate-byte-count.txt").read_text())
          full=archive.stat().st_size
          report={
              "schema_version":1,
              "source_commit":os.environ["CANDIDATE_SHA"],
              "native_candidate_run_id":int(os.environ["NATIVE_RUN_ID"]),
              "baseline_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "normal_adsfeed_resource_present":True,
              "full_compressed_package_bytes":full,
              "lean_compressed_package_bytes":candidate,
              "saved_compressed_package_bytes":full-candidate,
              "reduction_percent":round((full-candidate)/full*100,6),
              "baseline_package_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "same_source_commit":True,
              "native_candidate_runtime_accepted":True,
          }
          (root/"m3-newtab-adsfeed-matched-size.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          assert full>candidate,("No demonstrated positive compressed-package saving",report)
          print("PASS: same-source matched native Linux package saving independently measured")
          PY

      - name: Preserve bounded paired size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-matched-size
          path: |
            ${{ runner.temp }}/m3-newtab-adsfeed-matched-size.json
            ${{ runner.temp }}/vulpra-m3-adsfeed-full-baseline.tar.xz.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded baseline compilation diagnostics
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-adsfeed-baseline-build.log"; then
            tail -n 3000 "$RUNNER_TEMP/m3-adsfeed-baseline-build.log" > \
              "$RUNNER_TEMP/m3-adsfeed-baseline-failure-tail.log"
          fi

      - name: Upload baseline failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-baseline-failure-tail
          path: ${{ runner.temp }}/m3-adsfeed-baseline-failure-tail.log
          if-no-files-found: warn
          retention-days: 14
