# Two independent source-matched builds run in parallel, not serially.
# On a push to this workflow, build the FULL New Tab baseline; the separate
# opt-in native workflow compiles and tests the lean variant in parallel.
# Only after a successful lean native workflow_run do we compare authenticated
# source-pinned, size+SHA-256 reports. Neither job rewrites the normal profile.
name: M3 Compare New Tab AdsFeed Native Package Bytes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-newtab-adsfeed-matched-baseline.yml
  workflow_run:
    workflows: ["M3 Native New Tab AdsFeed Opt-out Trial"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  build-full-in-parallel:
    if: github.repository == 'sguzman/vulpra' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-baseline
      DEBIAN_FRONTEND: noninteractive
      MOZ_HEADLESS: "1"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout exact source used by the simultaneous lean native candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source, normal flag and protected default manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash ci/tests/m3-newtab-adsfeed-optout-test.sh "$GITHUB_WORKSPACE"
          bash ci/tests/m3-asrouter-promos-optout-test.sh "$GITHUB_WORKSPACE"
          test "${VULPRA_EXPERIMENT_NO_NEWTAB_ADSFEED:-}" = ""
          test "${VULPRA_EXPERIMENT_NO_ASROUTER_PROMOS:-}" = ""
          echo "PASS: full and lean comparison use the same commit and options"

      - name: Prepare Mozilla compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export Actions compiler-cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap supported full browser compiler
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 python3-venv python3-dev git curl make jq
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
          major="$("$HOME/.mozbuild/clang/bin/clang" --version | head -1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 19 ))

      - name: Configure true full baseline and require absent experimental macros
        shell: bash
        run: |
          set -euo pipefail
          ./mach configure
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("obj-vulpra-linux-m3-baseline/config.statusd")
          def get(k):
              p=root/"substs"/k
              return json.loads(p.read_text()) if p.exists() else None
          assert get("MOZ_WIDGET_TOOLKIT")=="gtk"
          assert get("MOZ_APP_BASENAME")=="Vulpra"
          assert get("MOZ_DEVTOOLS")=="all"
          for key in ("MOZ_SANDBOX","MOZ_WAYLAND","MOZ_SERVICES_SYNC","MOZ_NORMANDY"):
              assert str(get(key)) in ("1","True"),(key,get(key))
          for feature in ("VULPRA_NO_NEWTAB_ADSFEED","VULPRA_NO_ASROUTER_PROMOS"):
              assert get(feature) in (False,None,0,""),(feature,get(feature))
              assert not (root/"defines"/feature).exists(),("FALSE #ifdef MACRO",feature)
          print("PASS: BOTH opt-out macros absent; normal sponsored feed and normal ASRouter required")
          PY

      - name: Reserve matching 24 GiB compilation swap
        shell: bash
        run: |
          set -euo pipefail
          bytes=$((24*1024*1024*1024))
          available="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( available > bytes + 8*1024*1024*1024 ))
          sudo fallocate -l 24G /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo chmod 0600 /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo mkswap /mnt/vulpra-m3-adsfeed-baseline.swap
          sudo swapon /mnt/vulpra-m3-adsfeed-baseline.swap
          grep -Fq '/mnt/vulpra-m3-adsfeed-baseline.swap' /proc/swaps

      - name: Compile full baseline Linux browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-adsfeed-baseline-build.log"

      - name: Package full baseline and verify original sponsored resource
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist=obj-vulpra-linux-m3-baseline/dist
          mapfile -d '' -t archives < <(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print0)
          [[ "${#archives[@]}" -eq 1 ]]
          bash packaging/stage.sh "${archives[0]}" "$RUNNER_TEMP/vulpra-m3-adsfeed-full-baseline.tar.xz"
          (cd "$RUNNER_TEMP" && sha256sum -c vulpra-m3-adsfeed-full-baseline.tar.xz.sha256)
          python3 - <<'PY'
          import hashlib,io,json,os,tarfile,zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          archive=root/"vulpra-m3-adsfeed-full-baseline.tar.xz"
          entries=set()
          jars=0
          with tarfile.open(archive,"r:xz") as tf:
              for item in tf:
                  if item.isfile() and item.name.endswith("/omni.ja"):
                      jars+=1
                      with zipfile.ZipFile(io.BytesIO(tf.extractfile(item).read())) as jar:
                          entries.update(jar.namelist())
          required=[
              "builtin-addons/newtab/lib/AdsFeed.sys.mjs",
              "builtin-addons/newtab/lib/ActivityStream.sys.mjs",
              "builtin-addons/newtab/lib/DiscoveryStreamFeed.sys.mjs",
              "builtin-addons/newtab/lib/AdsClient.sys.mjs",
              "builtin-addons/newtab/lib/Store.sys.mjs",
              "builtin-addons/newtab/lib/TopStoriesFeed.sys.mjs",
          ]
          absent=[x for x in required if not any(n.endswith(x) for n in entries)]
          assert jars >= 2 and not absent,(jars,absent)
          report={
              "schema_version":1,
              "source_commit":os.environ["GITHUB_SHA"],
              "variant":"full-newtab-adsfeed-normal-linux",
              "baseline_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "normal_adsfeed_resource_present":True,
              "protected_resources_present":True,
              "omni_jar_count":jars,
              "compressed_package_bytes":archive.stat().st_size,
              "sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "status":"full baseline native compilation and exact resource check accepted",
          }
          (root/"m3-newtab-adsfeed-full-baseline-evidence.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          print("PASS: real full baseline contains AdsFeed and all protected New Tab modules")
          PY

      - name: Upload bounded independent baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-full-baseline-evidence
          path: |
            ${{ runner.temp }}/m3-newtab-adsfeed-full-baseline-evidence.json
            ${{ runner.temp }}/vulpra-m3-adsfeed-full-baseline.tar.xz.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Capture baseline failure tail
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-adsfeed-baseline-build.log"; then
            tail -n 3000 "$RUNNER_TEMP/m3-adsfeed-baseline-build.log" > "$RUNNER_TEMP/m3-adsfeed-baseline-failure-tail.log"
          fi

      - name: Upload baseline failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-baseline-failure-tail
          path: ${{ runner.temp }}/m3-adsfeed-baseline-failure-tail.log
          if-no-files-found: warn
          retention-days: 14

  compare-successful-native:
    if: >-
      github.repository == 'sguzman/vulpra' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact successful native source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Fetch exact candidate and parallel full-baseline source SHA evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/adsfeed-candidate" "$RUNNER_TEMP/adsfeed-baseline"
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-newtab-adsfeed-native-evidence \
            --dir "$RUNNER_TEMP/adsfeed-candidate"
          echo "Looking up independent parallel full baseline for source $CANDIDATE_SHA"
          baseline_id=""
          for attempt in $(seq 1 100); do
            data="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/m3-newtab-adsfeed-matched-baseline.yml/runs?head_sha=$CANDIDATE_SHA&event=push&per_page=30")"
            baseline_id="$(jq -r '[.workflow_runs[] | select(.event=="push" and .head_sha=="'"$CANDIDATE_SHA"'" and .conclusion=="success")] | sort_by(.id) | last | .id // empty' <<< "$data")"
            if test -n "$baseline_id"; then break; fi
            failure="$(jq -r '[.workflow_runs[] | select(.event=="push" and .head_sha=="'"$CANDIDATE_SHA"'" and .conclusion=="failure")] | length' <<< "$data")"
            if test "$failure" != "0"; then
              echo "FAIL: full native baseline failed for source $CANDIDATE_SHA" >&2
              exit 1
            fi
            if (( attempt % 10 == 0 )); then echo "Waiting for source-pinned native baseline, attempt $attempt/100"; fi
            sleep 20
          done
          if test -z "$baseline_id"; then
            echo "FAIL: full parallel baseline has not succeeded for $CANDIDATE_SHA" >&2
            exit 1
          fi
          echo "PASS: matched full baseline run $baseline_id"
          gh run download "$baseline_id" --repo "$GITHUB_REPOSITORY" \
            --name m3-newtab-adsfeed-full-baseline-evidence \
            --dir "$RUNNER_TEMP/adsfeed-baseline"
          printf '%s\n' "$baseline_id" > "$RUNNER_TEMP/adsfeed-baseline/run-id.txt"

      - name: Compare independently checked source-matched package bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          cs=list((root/"adsfeed-candidate").rglob("m3-newtab-adsfeed-evidence.json"))
          bs=list((root/"adsfeed-baseline").rglob("m3-newtab-adsfeed-full-baseline-evidence.json"))
          assert len(cs)==len(bs)==1,(cs,bs)
          candidate=json.loads(cs[0].read_text())
          baseline=json.loads(bs[0].read_text())
          source=os.environ["CANDIDATE_SHA"]
          assert candidate["source_commit"]==baseline["source_commit"]==source
          assert candidate["status"]=="native and runtime accepted; matched baseline comparison pending"
          assert candidate["variant"]=="linux-newtab-adsfeed-experimental-omission"
          assert baseline["variant"]=="full-newtab-adsfeed-normal-linux"
          assert baseline["status"]=="full baseline native compilation and exact resource check accepted"
          assert candidate["omitted_resource"].endswith("/AdsFeed.sys.mjs")
          assert candidate["tested"]["wayland"] and candidate["tested"]["newtab"]
          assert candidate["tested"]["webextensions"] and candidate["tested"]["nimbus"]
          assert baseline["normal_adsfeed_resource_present"] and baseline["protected_resources_present"]
          assert baseline["omni_jar_count"]>=2 and candidate["omni_jar_count"]>=2
          for item in (candidate,baseline):
              assert re.fullmatch("[0-9a-f]{64}",item["sha256"])
              assert isinstance(item["compressed_package_bytes"],int) and item["compressed_package_bytes"]>0
          full=baseline["compressed_package_bytes"]
          lean=candidate["compressed_package_bytes"]
          report={
              "schema_version":1,
              "source_commit":source,
              "native_candidate_run_id":int(os.environ["NATIVE_RUN_ID"]),
              "baseline_run_id":baseline["baseline_run_id"],
              "normal_adsfeed_resource_present":True,
              "full_compressed_package_bytes":full,
              "lean_compressed_package_bytes":lean,
              "saved_compressed_package_bytes":full-lean,
              "reduction_percent":round((full-lean)/full*100,6),
              "baseline_package_sha256":baseline["sha256"],
              "candidate_package_sha256":candidate["sha256"],
              "same_source_commit":True,
              "native_candidate_runtime_accepted":True,
          }
          outfile=root/"m3-newtab-adsfeed-matched-size.json"
          outfile.write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          assert full>lean,("No demonstrated positive compressed-package saving",report)
          print("PASS: source-matched independent real package-byte saving")
          PY

      - name: Upload verified paired package-size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-newtab-adsfeed-matched-size
          path: ${{ runner.temp }}/m3-newtab-adsfeed-matched-size.json
          if-no-files-found: warn
          retention-days: 14
