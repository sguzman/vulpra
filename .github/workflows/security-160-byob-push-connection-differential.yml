name: Firefox 160 BYOB Disposable Push Network Control Differential (No Egress)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths: [ci/smoke-byob-push-connection-differential.py, .github/workflows/security-160-byob-push-connection-differential.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  disposable-push-control:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authenticate native BYOB producer
        id: identity
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const r=(await github.rest.actions.getWorkflowRun({owner,repo,run_id:44350848442})).data;
            if (r.repository?.full_name!=='sguzman/vulpra' ||
                r.head_sha!=='ffec2b1bfcc816385f72301cce2e71fa0f1ac337' ||
                r.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
                r.status!=='completed' || r.conclusion!=='success')
              throw Error('BYOB native producer not authenticated');
            const a=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:44350848442,per_page:100});
            for(const name of ['firefox160-byob-vulpra-unreleased-native-preview-not-approved',
                               'firefox160-byob-vulpra-materialized-source-proof']) {
              if(a.filter(x=>x.name===name && !x.expired && x.size_in_bytes>0).length!==1)
                throw Error('Missing or expired verified source/native package: '+name);
            }
            core.setOutput('ready','true');
      - name: Checkout only BYOB test harness
        if: steps.identity.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/smoke-byob-push-connection-differential.py
            ci/smoke-webextension-package-local.py
      - name: Retrieve original compiled BYOB package
        if: steps.identity.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          repository: sguzman/vulpra
          run-id: 44350848442
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: firefox160-byob-vulpra-unreleased-native-preview-not-approved
          path: ${{ runner.temp }}/producer
      - name: Retrieve original BYOB source identity
        if: steps.identity.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          repository: sguzman/vulpra
          run-id: 44350848442
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: firefox160-byob-vulpra-materialized-source-proof
          path: ${{ runner.temp }}/source
      - name: Verify source identity and native package checksum
        if: steps.identity.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .upstream_release_commit == "2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree == "c17d957eb58741df2855dc9b6c577be192315410" and
            .verified_overlays == 28 and .exact_assembly_tree_match == true and
            .byob_source_variant_verified == true and
            .byob_branding_blob == "ae3fd50a6aee0ad58933dca09db39b7b87c0eb5e"
          ' "$RUNNER_TEMP/source/materialized-candidate.json" >/dev/null
          archive="$RUNNER_TEMP/producer/vulpra-firefox160-byob-native-ci.tar.xz"
          test -s "$archive" && test -s "$archive.sha256"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$archive" "$dest/vulpra-local-firefox160-bitwarden-qa.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-firefox160-bitwarden-qa.tar.xz > vulpra-local-firefox160-bitwarden-qa.tar.xz.sha256)
      - name: Install test dependencies and verified geckodriver
        if: steps.identity.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 jq curl iproute2 util-linux libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          curl --fail --location --show-error --silent --retry 3 --max-time 90 \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz' \
            -o "$RUNNER_TEMP/geckodriver.tar.gz"
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$RUNNER_TEMP/geckodriver.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP/bin" geckodriver
          "$RUNNER_TEMP/bin/geckodriver" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Preflight redacted Push A-B-A controls and malformed evidence fixtures
        if: steps.identity.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/smoke-byob-push-connection-differential.py --self-test
      - name: Run three independent Firefox160 Push state arms inside no-egress namespace
        id: test
        if: steps.identity.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            exec runuser -u runner -- env PATH="$1" \
              python3 "$2/ci/smoke-byob-push-connection-differential.py" --differential "$2"
          ' _ "$PATH" "$GITHUB_WORKSPACE"
          report="$GITHUB_WORKSPACE/.git/vulpra-native-build/byob-push-differential-proof.json"
          test -s "$report"
          jq -e '
            .schema_version == 1 and .status == "pass" and
            .source_verified_original_native_archive == true and
            .three_separate_ephemeral_browser_sessions == true and
            .all_arms_loopback_only_no_external_routes == true and
            .isolated_profile_only_push_preference_change == true and
            .production_push_default_unchanged == true and
            .real_browser_http_observer_tested == true and
            .no_user_profiles_accounts_or_credentials == true and
            .raw_url_hosts_ping_bodies_saved == false and
            .causal_attribution_established == false and
            .push_websocket_handshake_confirmed == false and
            .full_network_lifecycle_tested == false and
            .safe_browsing_provider_verified == false and
            .release_ready == false and
            (.arms | length) == 3 and
            .arms[0].arm == "default_first" and
            .arms[0].push_pref_default_enabled == true and
            .arms[0].push_pref_effective_enabled == true and
            .arms[0].push_pref_user_override == false and
            .arms[1].arm == "push_disabled" and
            .arms[1].push_pref_default_enabled == true and
            .arms[1].push_pref_effective_enabled == false and
            .arms[1].push_pref_user_override == true and
            .arms[2].arm == "default_repeat" and
            .arms[2].push_pref_default_enabled == true and
            .arms[2].push_pref_effective_enabled == true and
            .arms[2].push_pref_user_override == false and
            all(.arms[]; .local_positive_control_passed == true and
                          .observer_removed == true and .push_pref_locked == false and
                          (.push_http_attempts_observed | type) == "number" and
                          (.push_http_attempts_observed >= 0))
          ' "$report" >/dev/null
          echo "PASS: actual Firefox160 three-profile Push connection preference differential and bounded HTTP attempts"
          echo "LIMIT: short no-egress periods, not WebSocket causality, notifications compatibility or release security"
      - name: Upload privacy-bounded disposable Push preference differential proof
        id: proof
        if: success() && steps.identity.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-byob-disposable-push-differential-proof
          path: .git/vulpra-native-build/byob-push-differential-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on skipped browser or proof
        if: always()
        shell: bash
        env:
          ID: ${{ steps.identity.outcome }}
          READY: ${{ steps.identity.outputs.ready }}
          TEST: ${{ steps.test.outcome }}
          PROOF: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          if [[ "$ID" != success || "$READY" != true || "$TEST" != success || "$PROOF" != success ]]; then
            echo 'FAIL: disposable Push differential browser arms or proof failed' >&2
            exit 1
          fi
          echo 'PASS: real Firefox160 Push A-B-A differential with final uploaded proof'
