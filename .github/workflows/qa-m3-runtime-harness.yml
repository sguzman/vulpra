name: M3 Validate Packaged Runtime Harness

on:
  push:
    branches: [main]
    paths:
      - ci/test-m3-localhost-smoke.py
      - ci/smoke-m3-localhost-package.py
      - ci/smoke-webextension-package-local.py
      - ci/diagnose-remote-settings-local.sh
      - ci/test-remote-settings-diagnostic.sh
      - ci/capture-hyprland-gpu-baseline.sh
      - ci/test-capture-hyprland-gpu-baseline.sh
      - ci/build-local.sh
      - ci/package-smoke-local.sh
      - ci/test-build-lock-inheritance.sh
      - ci/measure-input-frame-local.sh
      - ci/test-input-frame-local.sh
      - ci/fixtures/input-to-raf.html
      - .github/workflows/qa-m3-runtime-harness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-runtime-fixtures:
    if: github.repository == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout test harness only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Check syntax of packaged browser acceptance scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ci/smoke-m3-localhost-package.py \
            ci/test-m3-localhost-smoke.py \
            ci/smoke-webextension-package-local.py
      - name: Validate local JS redirect, private home and checksum refusal with mock package
        run: |
          set -euo pipefail
          python3 ci/test-m3-localhost-smoke.py
          echo "QA fixture only: native Firefox compilation/browser behavior are NOT tested here."
      - name: Validate live versus shutdown-only Remote Settings diagnostics with mock package
        run: |
          set -euo pipefail
          bash -n ci/diagnose-remote-settings-local.sh ci/test-remote-settings-diagnostic.sh
          bash ci/test-remote-settings-diagnostic.sh
          echo "QA fixture only: no real browser or remote Settings endpoint is used here."
      - name: Validate privacy-filtered Hyprland GPU baseline with mock compositor
        run: |
          set -euo pipefail
          bash -n ci/capture-hyprland-gpu-baseline.sh ci/test-capture-hyprland-gpu-baseline.sh
          bash ci/test-capture-hyprland-gpu-baseline.sh
          echo "QA fixture only: no real GPUs, compositor or Firefox profiles used in CI."
      - name: Prevent orphaned mach helpers from retaining build/package lock
        run: |
          set -euo pipefail
          bash -n ci/build-local.sh ci/package-smoke-local.sh ci/test-build-lock-inheritance.sh
          bash ci/test-build-lock-inheritance.sh
          echo "QA fixture only: mock browser and build tool; no native Gecko compilation."
      - name: Validate isolated synthetic typing and event-to-frame metrics via mock WebDriver
        run: |
          set -euo pipefail
          bash -n ci/measure-input-frame-local.sh ci/test-input-frame-local.sh
          bash ci/test-input-frame-local.sh
          echo "QA fixture only: no native Firefox, GPU or physical input timing measured."
