# Real source-pinned alternate Vulpra ELF's graphical startup under isolated
# disposable launcher shim; the original normal packaged launcher is unchanged.
name: M3 Original Alternate vulpra-bin Actual Runtime Bindings
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-vulpra-bin-runtime-bindings.yml
      - ci/m3-vulpra-bin-wayland.sh
      - ci/m3-vulpra-bin-version-reconcile.py
      - ci/m3-native-original-feature-module-bindings.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  alternate-original-vulpra-bin-bindings-under-private-wayland:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout exact native acceptance harness and temporary alternate source helper
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packaging
            ci
      - name: Reject synthetic version spoofing and authenticate original source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n packaging/test-wayland.sh ci/m3-vulpra-bin-wayland.sh
          rustc --edition=2021 --test ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/alt-binding-tests"
          "$RUNNER_TEMP/alt-binding-tests"
          rustc --edition=2021 -O ci/m3-native-original-feature-module-bindings.rs -o "$RUNNER_TEMP/alt-binding-parser"
          python3 ci/m3-vulpra-bin-version-reconcile.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha' >/dev/null
      - name: Install real Weston pixman and full-original Wayland native runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
      - name: Retrieve only SHA-authenticated immutable original compiled package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/vulpra/vulpra-bin"
      - name: Exercise exact compiled original alternate executable and observe symbol bindings
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          M3_NATIVE_BINDINGS_PARSER="$RUNNER_TEMP/alt-binding-parser" \
          M3_ALT_BINDINGS_REPORT="$RUNNER_TEMP/m3-alternate-vulpra-bin-actual-bindings.json" \
          bash ci/m3-vulpra-bin-wayland.sh \
            "$RUNNER_TEMP/package/vulpra" \
            "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz.sha256" \
            "$RUNNER_TEMP/unused-alternate-version-report.json" "$GITHUB_WORKSPACE"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_native_feature_module_actual_symbol_bindings" and
            .original_source_commit==$src and .original_archive_sha256==$sha and
            .original_requester_basename=="vulpra-bin" and
            .pid_traces_with_original_requester_bindings>=1 and
            .normal_symbol_binding_events>=1 and
            .distinct_symbol_provider_pairs>=1 and
            .observed_provider_basename_count==(.observed_provider_basenames|length) and
            .alternate_browser_wayland_frame_only==true and
            .private_weston_wayland_gfx_probe_only==false and
            .original_c_api_diagnostic_only==false and
            .synthetic_loopback_telemetry_only==false and
            .no_network_egress==false and
            .actual_normal_symbol_bindings_observed==true and
            .raw_loader_logs_exported==false and .symbol_names_exported==false and
            .model_inference_or_drm_decryption_proven==false and
            .all_lazy_or_transitive_bindings_proven==false and
            .new_source_pruning_authorized==false' \
            "$RUNNER_TEMP/m3-alternate-vulpra-bin-actual-bindings.json" >/dev/null
          echo 'PASS: original compiled alternate browser actual bindings under private Weston'
      - name: Preserve bounded alternate original executable evidence only
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-alternate-vulpra-bin-actual-bindings
          path: ${{ runner.temp }}/m3-alternate-vulpra-bin-actual-bindings.json
          if-no-files-found: error
          retention-days: 14
