# Real original compiled UPDATER executable, same 7 source-declared Linux
# staging args as verified in browser-owned native execv CI 41731162834.
# Synthetic missing MAR only; private no-egress Arch, original install RO.
# This is a DIRECT CI replay, NOT actual original browser launching updater.
# Native test accepted source-pinned original compiled updater CI 41733351456
# PASS, sanitized artifact 13276607606, READ_ERROR 6 and status failed: 6,
# 11 forged summary variants rejected, real updater exit 1.
# No MAR provided; original install hashes unchanged; stage fixture empty.
# Manual-only after acceptance.
# Separate writable /original/updated staging fixture permits reaching the
# original archive-open rejection, while source/package ELF remains read-only.
name: M3 Original Updater Missing MAR Failure Replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-updater-missing-mar-failure:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
    steps:
      - name: Checkout only disposable missing-payload replay
        uses: actions/checkout@v4
        with:
          path: diagnostics
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-updater-missing-mar-replay.sh
      - name: Checkout exact original native updater error-handler source
        uses: actions/checkout@v4
        with:
          path: original-source
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            toolkit/mozapps/update/updater/updater.cpp
            toolkit/mozapps/update/updater/archivereader.cpp
            toolkit/mozapps/update/common/updatererrors.h
            toolkit/xre/nsUpdateDriver.cpp
      - name: Source-check exact MAR-open error and original browser stage args
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C diagnostics rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-source rev-parse HEAD)" = "$SOURCE"
          bash -n diagnostics/ci/m3-original-updater-missing-mar-replay.sh
          grep -Fq '#define READ_ERROR 6' original-source/toolkit/mozapps/update/common/updatererrors.h
          grep -Fq 'int ArchiveReader::Open(const NS_tchar* path)' original-source/toolkit/mozapps/update/updater/archivereader.cpp
          grep -Fq 'mar_open(path, &mArchive)' original-source/toolkit/mozapps/update/updater/archivereader.cpp
          grep -Fq 'if (result != MAR_READ_SUCCESS)' original-source/toolkit/mozapps/update/updater/archivereader.cpp
          grep -Fq 'return READ_ERROR;' original-source/toolkit/mozapps/update/updater/archivereader.cpp
          grep -Fq 'rv = gArchiveReader.Open(dataFile);' original-source/toolkit/mozapps/update/updater/updater.cpp
          grep -Fq 'rv = GetUpdateFileName(dataFile, sizeof(dataFile) / sizeof(dataFile[0]));' \
            original-source/toolkit/mozapps/update/updater/updater.cpp
          grep -Fq 'WriteStatusFile(rv);' original-source/toolkit/mozapps/update/updater/updater.cpp
          grep -Fq '"failed: %d\n", status' original-source/toolkit/mozapps/update/updater/updater.cpp
          grep -Fq 'return retVal ? retVal : (gSucceeded ? 0 : 1);' \
            original-source/toolkit/mozapps/update/updater/updater.cpp
          grep -Fq 'argv[1] = const_cast<char*>("3");' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'pid.AssignLiteral("-1");' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'argv[5] = const_cast<char*>("first");' original-source/toolkit/xre/nsUpdateDriver.cpp
          grep -Fq 'int execResult = execv(updaterPath.get(), argv);' original-source/toolkit/xre/nsUpdateDriver.cpp
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg sha "$SOURCE" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package" "$RUNNER_TEMP/fixture/updates" "$RUNNER_TEMP/reports"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          for name in vulpra updater; do
            test -x "$RUNNER_TEMP/package/vulpra/$name"
            test "$(head -c 4 "$RUNNER_TEMP/package/vulpra/$name" | od -An -tx1 | tr -d ' \n')" = 7f454c46
          done
          grep -Fxq 'Name=Vulpra' "$RUNNER_TEMP/package/vulpra/application.ini"
          (cd "$RUNNER_TEMP" && sha256sum package/vulpra/vulpra package/vulpra/updater >original-native-ELF.sha256)
          test ! -e "$RUNNER_TEMP/package/vulpra/updated"
          mkdir -p "$RUNNER_TEMP/package/vulpra/updates" "$RUNNER_TEMP/package/vulpra/updated" "$RUNNER_TEMP/fixture/updated"
          test ! -e "$RUNNER_TEMP/fixture/updates/0"
          test -z "$(find "$RUNNER_TEMP/fixture/updated" -mindepth 1 -print -quit)"
      - name: Build disposable no-egress original updater native Linux runtime
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arch-missing-mar"
          cat >"$RUNNER_TEMP/arch-missing-mar/Dockerfile" <<'EOF'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed \
            bash coreutils jq grep findutils gtk3 dbus-glib alsa-lib nss \
            mesa libglvnd ttf-dejavu \
            && command -v timeout && command -v jq \
            && rm -rf /var/cache/pacman/pkg/*
          EOF
          docker build --pull --no-cache -t m3-original-updater-no-mar:ci \
            "$RUNNER_TEMP/arch-missing-mar"
      - name: Execute real packaged original updater against absent MAR only
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --shm-size 128m \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            -v "$RUNNER_TEMP/package/vulpra:/original:ro" \
            -v "$RUNNER_TEMP/fixture/updates:/original/updates:rw" \
            -v "$RUNNER_TEMP/fixture/updated:/original/updated:rw" \
            -v "$GITHUB_WORKSPACE/diagnostics/ci/m3-original-updater-missing-mar-replay.sh:/audit/replay.sh:ro" \
            -v "$RUNNER_TEMP/reports:/reports:rw" \
            -e VULPRA_M3_DISPOSABLE_MISSING_MAR_REPLAY=1 \
            -e VULPRA_OFFLINE_CONTAINER_ONLY=1 \
            m3-original-updater-no-mar:ci \
            /bin/bash /audit/replay.sh /reports/m3-original-updater-missing-mar-replay.json
          (cd "$RUNNER_TEMP" && sha256sum -c original-native-ELF.sha256)
          test -d "$RUNNER_TEMP/package/vulpra/updated"
          test -z "$(find "$RUNNER_TEMP/fixture/updated" -mindepth 1 -print -quit)"
          test ! -e "$RUNNER_TEMP/fixture/updates/0/update.mar"
          test "$(tr -d '\r\n' <"$RUNNER_TEMP/fixture/updates/0/update.status")" = 'failed: 6'
          report="$RUNNER_TEMP/reports/m3-original-updater-missing-mar-replay.json"
          jq -e --arg src "$SOURCE" --arg sha "$ARCHIVE" '
            .schema_version==1 and
            .status=="original_updater_executes_and_rejects_absent_mar_with_original_read_error" and
            .source_commit==$src and .archive_sha256==$sha and
            .original_compiled_updater_actually_executed==true and
            .updater_invoked_by_disposable_ci_replay_not_original_browser==true and
            .exact_original_linux_stage_arguments_replayed==true and
            .original_updater_exit_code==1 and
            .actual_original_update_status=="failed: 6" and
            .expected_original_read_error_code==6 and
            .original_updater_open_missing_mar_failure_confirmed==true and
            .no_mar_payload_created_or_available==true and
            .original_install_read_only==true and
            .isolated_staging_target_separate_writable_mount==true and
            .isolated_staging_target_remained_empty==true and
            .original_updater_error_status_written_in_disposable_fixture==true and
            .no_real_user_profile_or_device_accessed==true and
            .network_egress_allowed==false and
            .no_update_installation_or_success_claimed==true and
            .no_callback_application_requested==true and
            .no_raw_stdout_stderr_argv_pids_or_profiles_exported==true and
            .browser_controlled_actual_updater_exec_proven==false and
            .native_update_success_proven==false and
            .full_dependency_closure_proven==false and
            .source_pruning_authorized==false and
            .native_bytes_saved==0 and .m3_sixth_gate_closed==false
          ' "$report" >/dev/null
          verify() {
            jq -e --arg src "$SOURCE" --arg sha "$ARCHIVE" '
              .source_commit==$src and .archive_sha256==$sha and
              .original_compiled_updater_actually_executed==true and
              .updater_invoked_by_disposable_ci_replay_not_original_browser==true and
              .original_updater_exit_code==1 and
              .actual_original_update_status=="failed: 6" and
              .no_mar_payload_created_or_available==true and
              .original_install_read_only==true and
              .isolated_staging_target_remained_empty==true and
              .browser_controlled_actual_updater_exec_proven==false and
              .source_pruning_authorized==false
            ' "$1" >/dev/null
          }
          for mutation in \
            '.original_compiled_updater_actually_executed=false' \
            '.updater_invoked_by_disposable_ci_replay_not_original_browser=false' \
            '.original_updater_exit_code=0' \
            '.actual_original_update_status="succeeded"' \
            '.actual_original_update_status="failed: 20"' \
            '.no_mar_payload_created_or_available=false' \
            '.original_install_read_only=false' \
            '.isolated_staging_target_remained_empty=false' \
            '.browser_controlled_actual_updater_exec_proven=true' \
            '.archive_sha256="fake"' \
            '.source_pruning_authorized=true'; do
            jq "$mutation" "$report" >"$RUNNER_TEMP/reports/forged.json"
            if verify "$RUNNER_TEMP/reports/forged.json"; then
              echo 'FAIL: forged original updater missing-MAR report was accepted' >&2
              exit 1
            fi
          done
          rm -f "$RUNNER_TEMP/reports/forged.json"
          echo 'M3_ORIGINAL_MISSING_MAR_NATIVE=PASS exact source READ_ERROR 6, 11 forged outputs rejected'
      - name: Upload only sanitized original updater failure status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-updater-missing-mar-replay
          path: ${{ runner.temp }}/reports/m3-original-updater-missing-mar-replay.json
          if-no-files-found: warn
          retention-days: 14
