# Run only a historical, checksum-verified NORMAL browser package, no omissions.
name: M3 Historical Hungarian CSS Hyphenation Runtime Baseline

on:
  push:
    branches: [main]
    paths:
      - ci/m3-hu-css-native-baseline.py
      - .github/workflows/m3-hu-css-native-baseline.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  packaged-hungarian-css:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout only the offline layout harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci

      - name: Reject synthetic false hyphenation results
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/m3-hu-css-native-baseline.py
          python3 ci/m3-hu-css-native-baseline.py --self-test

      - name: Install local headless Gecko runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends curl python3 ca-certificates \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"

      - name: Fetch immutable historical unomitted package with checksum and exact source ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40567473401 --repo "$GITHUB_REPOSITORY" \
            --name m3-asrouter-promo-matched-baseline \
            --dir "$RUNNER_TEMP/historical"
          (
            cd "$RUNNER_TEMP/historical"
            sha256sum -c vulpra-promo-full-baseline.tar.xz.sha256
            jq -e '.source_commit == "1683ca67b69389a879717bcd537772c3b40624b6" and
                   .full_promo_resources_present == true' m3-promo-matched-size.json >/dev/null
          )

      - name: Test hu and hu-HU hyphens auto against none, with English control
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP:$PATH" python3 ci/m3-hu-css-native-baseline.py \
            --archive "$RUNNER_TEMP/historical/vulpra-promo-full-baseline.tar.xz" \
            --source-commit "1683ca67b69389a879717bcd537772c3b40624b6" \
            --output "$RUNNER_TEMP/m3-hu-css-historical-baseline.json"
          jq -e '
            .status == "passed_historical_normal_hyphenation_runtime" and
            .actual_packaged_vulpra_executed == true and
            .runtime_limited_to_localhost == true and
            .isolated_home_and_firefox_profile == true and
            .hu_autobreak_observed == true and
            .hu_HU_autobreak_observed == true and
            .en_US_autobreak_control_observed == true and
            .missing_hungarian_pattern_fallback_verified == false and
            .guarded_pattern_omission_built == false and
            .compressed_archive_bytes_saved == null and
            .normal_package_altered == false' \
            "$RUNNER_TEMP/m3-hu-css-historical-baseline.json" >/dev/null

      - name: Save private localhost, measured normal baseline only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-hu-css-normal-historical-baseline
          path: ${{ runner.temp }}/m3-hu-css-historical-baseline.json
          if-no-files-found: warn
          retention-days: 14
