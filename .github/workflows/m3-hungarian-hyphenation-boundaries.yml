# Read-only source audit. Never remove default language resources.
name: M3 Hungarian Hyphenation Source and Fallback Boundaries

on:
  push:
    branches: [main]
    paths:
      - ci/m3-hungarian-hyphenation-boundaries.py
      - .github/workflows/m3-hungarian-hyphenation-boundaries.yml
      - intl/moz.build
      - intl/locales/moz.build
      - intl/hyphenation/glue/moz.build
      - intl/hyphenation/glue/nsHyphenationManager.cpp
      - intl/hyphenation/glue/nsHyphenator.cpp
      - browser/installer/package-manifest.in
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-contracts:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sparse checkout only bounded source audit code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci

      - name: Verify exact-source hyphenation guards and 12 negative mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-hungarian-hyphenation-boundaries.py
          python3 ci/m3-hungarian-hyphenation-boundaries.py \
            --self-test --output "$RUNNER_TEMP/m3-hungarian-hyphenation.json"
          jq -e '
            .source_commit == env.GITHUB_SHA and
            .source_only == true and
            .source_removal_authorized == false and
            .layout_css_language_fallback_runtime_verified == false and
            .selected_hu_zip_entry_bytes_is_tar_saving == false and
            (.boundaries | length) == 6 and
            .source_mutations_rejected == 12
          ' "$RUNNER_TEMP/m3-hungarian-hyphenation.json" >/dev/null

      - name: Preserve bounded source evidence without language pattern content
        uses: actions/upload-artifact@v4
        with:
          name: m3-hungarian-hyphenation-source
          path: ${{ runner.temp }}/m3-hungarian-hyphenation.json
          if-no-files-found: error
          retention-days: 14
