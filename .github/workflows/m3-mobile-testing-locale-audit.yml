# M3 mobile/test/localization scope: fail-closed preservation audit.
# This is a read-only cross-evidence audit, NOT native compilation or new pruning.
name: M3 Verify Mobile Testing and Locale Safe Boundaries
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-mobile-testing-locale-audit.yml
      - ci/m3-testing-shared-qa-preservation.sh
      - ci/m3-testing-localization-boundaries.py
      - docs/vulpra/DEBLOAT-CANDIDATES.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve-desktop-and-original-accepted-prunes:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact source and QA contracts without compiling
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
            mach
            docs/vulpra/DEBLOAT-CANDIDATES.json
      - name: Current-source testing and localization guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq -e -f ci/m3-candidate-decision-contract.jq \
            docs/vulpra/DEBLOAT-CANDIDATES.json > "$RUNNER_TEMP/candidate-guard.json"
          bash -n ci/m3-testing-shared-qa-preservation.sh
          bash ci/m3-testing-shared-qa-preservation.sh \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/current-testing-source.json"
          python3 ci/m3-testing-localization-boundaries.py --self-test \
            --output "$RUNNER_TEMP/current-testing-locale-source.json"
          jq -e --arg sha "$GITHUB_SHA" \
            '.source_commit==$sha and .verified_source_boundaries==25 and
             .deliberately_broken_boundaries_rejected==25 and
             .source_removal_authorized==false and
             .optional_peripheral_test_fixtures_individually_audited==false' \
            "$RUNNER_TEMP/current-testing-source.json" >/dev/null
          jq -e --arg sha "$GITHUB_SHA" \
            '.source_commit==$sha and
             (.boundaries|length)==14 and .invalid_mutations_rejected==17 and
             .removal_authorized==false and
             .compiled_package_savings_verified==false' \
            "$RUNNER_TEMP/current-testing-locale-source.json" >/dev/null
      - name: Reject resurrected non-Linux platform leaves and missing shared Linux code
        shell: bash
        run: |
          set -euo pipefail
          # Exact previously accepted eight platform leaves. No broader mobile deletion.
          for removed in \
            mobile/android/fonts \
            mobile/android/geckoview_example \
            mobile/android/examples \
            mobile/android/test_infra \
            mobile/android/test_runner \
            mobile/android/branding \
            mobile/ios \
            widget/uikit; do
            test -z "$(git ls-tree HEAD -- "$removed")" || {
              echo "FAIL: previously removed non-Linux-only path reappeared: $removed" >&2
              exit 1
            }
          done
          # Shared GeckoView, Android toolkit and Linux browsing remain in the tree.
          for retained in \
            mobile/shared/moz.build \
            mobile/android/geckoview/build.gradle \
            widget/android/AndroidBridge.cpp \
            widget/gtk/moz.build \
            testing/moz.build \
            testing/mozbase/moz.build \
            testing/marionette/moz.build \
            browser/locales/jar.mn \
            toolkit/locales/moz.build \
            browser/installer/package-manifest.in \
            browser/l10n-registry.manifest \
            toolkit/l10n-registry.manifest; do
            git cat-file -e "HEAD:$retained" || {
              echo "FAIL: protected shared source or locale registry missing: $retained" >&2
              exit 1
            }
          done
          jq -e '
            .accepted_source_pruning_cohort_totals.aggregate_removed_git_paths==14867 and
            .accepted_source_pruning_cohort_totals.aggregate_original_git_blob_bytes==129967585 and
            (.accepted_source_pruning_cohort_totals.cohorts|length)==3 and
            ([.accepted_source_pruning_cohort_totals.cohorts[].removed_git_paths]==[453,14134,280]) and
            .accepted_source_pruning_cohort_totals.compiled_package_bytes_saved==null and
            .accepted_source_pruning_cohort_totals.new_pruning_authorized==false and
            ([.candidates[]|select(.id=="source_testing" or
                .id=="localization_default_and_repack" or
                .id=="android_mobile" or
                .id=="remaining_mobile_platform_leaves")]|length)==4' \
            docs/vulpra/DEBLOAT-CANDIDATES.json >/dev/null
      - name: Authenticate native Linux browser and prior source/localization audit passes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 40519242468 40585240593 40600510147 \
            40922064826 40923776304 40937941448 \
            41077034156 41077783489 41107821628 41109168322 \
            41106584931 40997075527 41110565740; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" |
              jq -e '.status=="completed" and .conclusion=="success"' >/dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40997075527" |
            jq -e '.head_sha=="b1482404dfb8b01342990ee99ea3df0f9756b5f7"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41107821628" |
            jq -e '.head_sha=="adaeb72804192a2a91995617708429f346796e93"' >/dev/null
          mkdir -p "$RUNNER_TEMP/physical" "$RUNNER_TEMP/qa"
          gh run download 41077783489 --repo "$GITHUB_REPOSITORY" \
            --name m3-newer-source-full-elf-locale-inventory --dir "$RUNNER_TEMP/physical"
          gh run download 41109168322 --repo "$GITHUB_REPOSITORY" \
            --name m3-testing-qa-source-native-crosswalk --dir "$RUNNER_TEMP/qa"
      - name: Check physically packaged en-US, language and remote QA resources
        shell: bash
        run: |
          set -euo pipefail
          l="$RUNNER_TEMP/physical/newer-full-localization-census.json"
          inv="$RUNNER_TEMP/physical/m3-newer-full-elf-locale-inventory.json"
          f="$RUNNER_TEMP/physical/m3-newer-full-feature-resource-crosswalk.json"
          qa="$RUNNER_TEMP/qa/m3-testing-qa-source-native-crosswalk.json"
          for item in "$l" "$inv" "$f" "$qa"; do
            if [[ ! -s "$item" ]]; then
              echo "FAIL: required original physical evidence unavailable: $(basename "$item")" >&2
              exit 1
            fi
          done
          echo "PASS: original physical files present and nonempty"
          echo "CHECK: native locale resource JSON"
          jq -e '
            .schema_version==1 and
            .sha256=="7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a" and
            .localized_content_present==true and
            .tar_regular_members==47 and
            (.omni_ja|length)==2 and
            (.nested_omni_ja_members.browser_l10n.files)==137 and
            (.nested_omni_ja_members.toolkit_l10n.files)==104 and
            (.nested_omni_ja_members.default_locale.files)==1 and
            (.nested_omni_ja_members.dictionaries.files)==2 and
            (.nested_omni_ja_members.hyphenation.files)==46 and
            (.nested_omni_ja_members.legacy_chrome_locale.files)==93 and
            .source_removal_authorized==false and
            .compiled_bytes_saved==null' "$l" >/dev/null
          echo "PASS: native locale resource JSON"
          echo "CHECK: normal native inventory JSON"
          jq -e '
            .compiled_source_sha=="b1482404dfb8b01342990ee99ea3df0f9756b5f7" and
            .native_build_run_id==40997075527 and
            .full_normal_archive_sha256=="7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a" and
            .original_normandy_runner_physically_present==true and
            .original_required_newtab_modules_present==true and
            .elf_regular_members==28 and
            .same_physical_package_for_both_scans==true and
            .candidate_source_removal_authorized==false' "$inv" >/dev/null
          echo "PASS: normal native inventory JSON"
          echo "CHECK: physical feature root JSON"
          jq -e '
            .compiled_source_sha=="b1482404dfb8b01342990ee99ea3df0f9756b5f7" and
            .archive_sha256=="7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a" and
            .nested_entries==8001 and
            .feature_prefix_groups.fluent.entries==241 and
            .feature_prefix_groups.hyphenation.entries==46 and
            .feature_prefix_groups.dictionary.entries==2 and
            .feature_prefix_groups.remote_qa.entries==157 and
            .runtime_reachability_proven==false and
            .removal_authorized==false and
            .compressed_byte_savings==null' "$f" >/dev/null
          echo "PASS: physical feature root JSON"
          echo "CHECK: original testing QA native crosswalk"
          jq -e '
            .current_testing_qa_source_guards==25 and
            .current_testing_locale_manifests_checked==14 and
            .independent_real_native_browser_qa_passed==true and
            .peripheral_fixture_omissions_proven==false and
            .new_source_deletion_authorized==false' "$qa" >/dev/null
          echo "PASS: original testing QA native crosswalk"
          jq -n --arg sha "$GITHUB_SHA" '{
            schema_version:1,
            checkout_source:$sha,
            mobile_prior_accepted_source_prune_cohorts:3,
            mobile_prior_accepted_source_git_paths:14867,
            current_checked_absent_nonlinux_leaves:8,
            current_checked_retained_shared_source_and_locale_paths:12,
            current_testing_source_boundaries:25,
            current_testing_source_mutants_rejected:25,
            current_locale_and_test_build_boundaries:14,
            current_locale_build_mutants_rejected:17,
            original_full_normal_compiled_source:"b1482404dfb8b01342990ee99ea3df0f9756b5f7",
            normal_native_browser_build_verified:true,
            separate_original_native_QA_verified:true,
            physical_fluent_entries:241,
            physical_hyphenation_entries:46,
            physical_dictionary_entries:2,
            physical_remote_qa_entries:157,
            physical_nested_total_entries:8001,
            package_sha256:"7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a",
            default_locale_and_language_resources_retained:true,
            testing_qa_root_and_unmeasured_fixtures_retained:true,
            optional_l10n_prune_trial_executed:false,
            live_language_repack_or_langpack_tested:false,
            unsupported_android_taskcluster_jobs_restored:false,
            generated_full_build_graph_complete:false,
            no_new_source_omission:true,
            no_normal_browser_behavior_change:true,
            new_compiled_package_savings_bytes:null,
            no_other_M3_gates_proven_by_this_check:true
          }' > "$RUNNER_TEMP/m3-mobile-testing-locale-safety-audit.json"
          echo 'PASS: three accepted source cohorts, preserved QA and physical locale categories, no deletion'
      - name: Archive bounded current and original acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-mobile-testing-locale-audit-evidence
          path: ${{ runner.temp }}/m3-mobile-testing-locale-safety-audit.json
          if-no-files-found: warn
          retention-days: 14
