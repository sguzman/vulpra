# A real-browser Safe Browsing configuration gate. Does not navigate to harmful
# sites, download threat lists on demand, log API keys or certify protection.
name: Firefox 160 Archived Safe Browsing Provider/Classifier Readiness (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-safebrowsing-readiness.yml
      - ci/security-160-safebrowsing-readiness.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observed-native-safebrowsing-readiness:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Confirm original exact-source native Firefox 160 build and source artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo,id=43138458940;
            const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
            if(r.repository?.full_name!=='sguzman/vulpra' ||
               r.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               r.head_sha!=='0624235fdc956ab18af3c3f310b3588ca72fff61' ||
               r.name!=='Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate' ||
               r.status!=='completed' || r.conclusion!=='success')
              throw Error('Refusing incorrect original native Firefox 160 build');
            const artifacts=await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:id,per_page:100});
            for(const name of ['firefox160-vulpra-unreleased-native-preview-not-approved',
                               'firefox160-vulpra-materialized-source-proof',
                               'firefox160-vulpra-complete-git-tree-candidate']){
              if(!artifacts.some(a=>a.name===name&&!a.expired&&a.size_in_bytes>0))
                throw Error('Missing/expired original authenticated artifact '+name);
            }
            core.info('PASS: original successful exact-source native candidate pinned');
      - name: Checkout only read-only Safe Browsing and WebDriver helpers
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/security-160-safebrowsing-readiness.py
            ci/smoke-webextension-package-local.py
      - name: Download original unpublished Firefox 160 package with SHA-256
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-unreleased-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native-package
      - name: Download original materialized Firefox 160 source identity
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source-proof
      - name: Download original complete Git-tree/28-overlay ledger
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-complete-git-tree-candidate
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/candidate-ledger
      - name: Test rejection of forged Safe Browsing readiness and authenticate candidate source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/security-160-safebrowsing-readiness.py
          python3 ci/security-160-safebrowsing-readiness.py --self-test
          source="$RUNNER_TEMP/source-proof/materialized-candidate.json"
          ledger="$RUNNER_TEMP/candidate-ledger/candidate-tree-report.json"
          overlays="$RUNNER_TEMP/candidate-ledger/overlay-paths.txt"
          archive="$RUNNER_TEMP/native-package/vulpra-firefox160-native-ci.tar.xz"
          test -s "$source" && test -s "$ledger" && test -s "$overlays" &&
            test -s "$archive" && test -s "$archive.sha256"
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$source" >/dev/null
          jq -e '
            .firefox160_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .assembled_git_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .source_files_modified==26 and .vulpra_source_files_added==2 and
            .upstream_files_deleted==0 and
            .all_other_upstream_files_preserved==true and .security_current==false
          ' "$ledger" >/dev/null
          test "$(wc -l < "$overlays")" -eq 28
          test "$(sort -u "$overlays" | wc -l)" -eq 28
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          # Exact original Firefox 160 source blobs under review are not
          # overwritten by Vulpra. No API keys, URLs or source contents logged.
          while IFS=$'\t' read -r path expected; do
            if grep -Fxq "$path" "$overlays"; then
              echo "FAIL: Safe Browsing original source overwritten: $path" >&2; exit 1
            fi
            actual="$(gh api \
              "repos/mozilla-firefox/firefox/contents/$path?ref=2887d9de1f69c0e9776413da80e7ba0d1225dd9b" --jq '.sha')"
            test "$actual" = "$expected" || {
              echo "FAIL: official Firefox 160 source blob differs: $path" >&2; exit 1;
            }
          done <<'CHECKED_SOURCE'
          toolkit/components/url-classifier/SafeBrowsing.sys.mjs	fd8285620dd9e56deab8f3a80a10cd7f09188a4a
          toolkit/components/url-classifier/UrlClassifierListManager.sys.mjs	e2f703adbaf014c44a4c8948c9e5021348c06b88
          modules/libpref/init/all.js	fe38d0281a27648e34fff5c457ad7dc8c1841f5c
          remote/shared/RecommendedPreferences.sys.mjs	5a2038843353eb01443edee215465f7ff88675e5
          CHECKED_SOURCE
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$archive" "$dest/vulpra-local-firefox160-safebrowsing-ci.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-firefox160-safebrowsing-ci.tar.xz > vulpra-local-firefox160-safebrowsing-ci.tar.xz.sha256)
          echo 'PASS: real native Firefox 160 SHA/source, original classifier files and negative fixtures'
      - name: Install native browser libraries and pinned geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends curl jq python3 libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          file="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl -fLsS --retry 3 --max-time 90 -o "$file" \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz'
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/geckodriver-bin"
          tar -xzf "$file" -C "$RUNNER_TEMP/geckodriver-bin" geckodriver
          test -x "$RUNNER_TEMP/geckodriver-bin/geckodriver"
          echo "$RUNNER_TEMP/geckodriver-bin" >> "$GITHUB_PATH"
      - name: Observe actual Firefox 160 Safe Browsing preferences, features, credential acceptance and classifier services
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 ci/security-160-safebrowsing-readiness.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/firefox160-safebrowsing-runtime.json" \
            2>&1 | tee "$RUNNER_TEMP/firefox160-safebrowsing.log"
          archive="$RUNNER_TEMP/native-package/vulpra-firefox160-native-ci.tar.xz"
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          jq -e --arg sha "$sha" '
            .schema_version==1 and
            .kind=="firefox160_native_safebrowsing_effective_configuration_audit" and
            .status=="configuration_ready" and
            .package_sha256==$sha and
            .native_firefox160_webdriver_and_disposable_profile_verified==true and
            .original_firefox_profile_preserved==true and
            .strict_webdriver_tls_configuration==true and
            .configuration_readiness_gate_passed==true and
            (.blocking_reasons|length)==0 and
            .web_driver_recommended_security_disabling_prefs_off==true and
            .observed.automation_recommended_prefs_disabled==true and
            .observed.google5_credential_check_accepted==true and
            .observed.google5_https_update_endpoint_present==true and
            .observed.google5_https_hash_lookup_endpoint_present==true and
            .observed.secret_values_or_endpoint_urls_returned==false and
            .observed.no_malicious_url_or_threat_update_requested_by_probe==true and
            .actual_threat_list_download_verified==false and
            .actual_malicious_navigation_denied_verified==false and
            .network_protection_coverage_certified==false and
            .security_current==false and .release_ready==false
          ' "$RUNNER_TEMP/firefox160-safebrowsing-runtime.json" >/dev/null
          echo 'PASS: actual native Firefox 160 Safe Browsing effective configuration/credential check'
          echo 'LIMIT: actual threat-list downloads and malicious navigation denial not exercised'
      - name: Archive bounded real browser readiness or blocker evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-safebrowsing-effective-provider-readiness-or-blocker-proof
          path: ${{ runner.temp }}/firefox160-safebrowsing-runtime.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve bounded failure reason log, never API keys or provider URLs
        if: failure()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/firefox160-safebrowsing.log"; then
            tail -n 100 "$RUNNER_TEMP/firefox160-safebrowsing.log" > "$RUNNER_TEMP/firefox160-safebrowsing-failure-tail.log"
          fi
      - name: Archive non-secret Safe Browsing failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-safebrowsing-failure-reason-log
          path: ${{ runner.temp }}/firefox160-safebrowsing-failure-tail.log
          if-no-files-found: ignore
          retention-days: 14
