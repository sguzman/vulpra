name: Vulpra 160 Native Main Build Contract (No Mozilla Source Download)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vulpra-160-local-build-entrypoint.yml
      - scripts/vulpra-build-160.sh
      - scripts/vulpra-package-160.sh
      - ci/package-smoke-local.sh
      - ci/test-direct-main-build.sh
      - nix/vulpra
      - nix/vulpra-dev.sh
      - ci/mozconfig-linux
      - packaging/vulpra
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-direct-main-native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/vulpra-160-local-build-entrypoint.yml
            browser/config/version.txt
            scripts/vulpra-build-160.sh
            scripts/vulpra-package-160.sh
            ci/package-smoke-local.sh
            ci/test-direct-main-build.sh
            ci/mozconfig-linux
            packaging/vulpra
            nix/vulpra
            nix/vulpra-dev.sh
      - name: Syntax and actual main source version
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/vulpra-build-160.sh
          bash -n scripts/vulpra-package-160.sh
          bash -n ci/test-direct-main-build.sh
          bash -n ci/package-smoke-local.sh
          bash -n nix/vulpra
          bash -n nix/vulpra-dev.sh
          test "$(cat browser/config/version.txt)" = '160.0.1'
          test "$(git show HEAD:browser/config/version.txt)" = '160.0.1'
          echo 'PASS: main contains real Firefox160.0.1 and native scripts parse'
      - name: Exercise direct main build through an offline fake mach
        shell: bash
        run: |
          set -euo pipefail
          bash ci/test-direct-main-build.sh
      - name: Default Nix commands route to main instead of a source downloader
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          grep -Fq 'bash "$repo/scripts/vulpra-build-160.sh" --preflight "$@"' nix/vulpra
          # shellcheck disable=SC2016
          grep -Fq 'command_args=(vulpra-dev build "$@")' nix/vulpra
          # shellcheck disable=SC2016
          grep -Fq 'bash "$repo/scripts/vulpra-package-160.sh" --preflight' nix/vulpra
          # shellcheck disable=SC2016
          grep -Fq 'exec bash "$root/scripts/vulpra-build-160.sh" "$@"' nix/vulpra-dev.sh
          if grep -Fq 'source checkout independently' scripts/vulpra-build-160.sh; then
            echo 'Unexpected legacy secondary source build path' >&2
            exit 1
          fi
          echo 'PASS: source is compiled from current main, not a secondary checkout'
      - name: Verify workflow left main checkout unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'PASS: source checkout unchanged, no remote browser or Mozilla source downloaded'
