# Read-only independent triage of already successful source-matched native
# loader API machine branches. No native browser rebuild, pruning or release.
name: M3 Current Conditional Loader Callsite Triage
on:
  push:
    branches: [main]
    paths:
      - ci/m3-current-conditional-loader-triage.jq
      - ci/tests/m3-current-conditional-loader-triage-tests.sh
      - ci/m3-current-conditional-loader-source-anchors.rs
      - dom/media/platforms/ffmpeg/FFmpegRuntimeLinker.cpp
      - dom/media/platforms/ffmpeg/VALibWrapper.cpp
      - widget/gtk/DMABufDevice.cpp
      - .github/workflows/m3-current-conditional-loader-triage.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-matched-direct-loader-triage:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_RUN_ID: "42507965586"
      NATIVE_SOURCE_SHA: "bd2499aeadce0368faa8b717b0e8a17e9c9dc317"
      RECONCILIATION_RUN_ID: "42513861084"
    steps:
      - name: Checkout bounded direct-loader evidence classifier only
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-current-conditional-loader-triage.jq
            ci/tests/m3-current-conditional-loader-triage-tests.sh
            ci/m3-current-conditional-loader-source-anchors.rs
            dom/media/platforms/ffmpeg/FFmpegRuntimeLinker.cpp
            dom/media/platforms/ffmpeg/VALibWrapper.cpp
            widget/gtk/DMABufDevice.cpp

      - name: Authenticate successful full-native and independent reconciliation run origins
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" > "$RUNNER_TEMP/native-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$NATIVE_SOURCE_SHA" \
            --argjson run "$NATIVE_RUN_ID" '
              .id == $run and .head_sha == $sha and
              .head_repository.full_name == $repo and
              .head_branch == "main" and .event == "push" and
              .name == "M3 Source Matched Native Link Inputs and Runtime" and
              .path == ".github/workflows/m3-source-matched-native-link.yml" and
              .run_attempt == 1 and .status == "completed" and .conclusion == "success"
            ' "$RUNNER_TEMP/native-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECONCILIATION_RUN_ID" \
            > "$RUNNER_TEMP/recon-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson run "$RECONCILIATION_RUN_ID" '
            .id == $run and .head_repository.full_name == $repo and
            .name == "M3 Source Matched Native Evidence Reconciliation" and
            .path == ".github/workflows/m3-native-link-evidence-reconcile.yml" and
            .event == "workflow_run" and .status == "completed" and
            .conclusion == "success"
          ' "$RUNNER_TEMP/recon-run.json" >/dev/null
          echo "PASS: authenticated native and independent reconciler run origins"

      - name: Download exact successful native and independent reconciled artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-source-matched-native-link-evidence \
            --dir "$RUNNER_TEMP/native"
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-current-native-loader-callsite-evidence \
            --dir "$RUNNER_TEMP/loader"
          gh run download "$RECONCILIATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-link-reconciled-evidence \
            --dir "$RUNNER_TEMP/reconciled"
          mapfile -t link < <(find "$RUNNER_TEMP/native" -type f -name m3-native-link-inputs.json -print)
          mapfile -t package < <(find "$RUNNER_TEMP/native" -type f -name m3-native-link-elf-package-graph.json -print)
          mapfile -t loader < <(find "$RUNNER_TEMP/loader" -type f -name m3-current-native-loader-callsite.json -print)
          mapfile -t accepted < <(find "$RUNNER_TEMP/reconciled" -type f -name m3-native-link-reconciled.json -print)
          test "${#link[@]}" -eq 1
          test "${#package[@]}" -eq 1
          test "${#loader[@]}" -eq 1
          test "${#accepted[@]}" -eq 1
          jq -e --arg src "$NATIVE_SOURCE_SHA" --argjson id "$NATIVE_RUN_ID" \
            --arg expected "$(jq -r '.package.package_sha256' "${link[0]}")" '
            .schema_version == 1 and
            .status == "passed_full_native_evidence_reconciliation" and
            .source_commit == $src and .workflow_run_id == $id and
            .package_sha256 == $expected and
            .Wayland_JS_WebExtension_Nimbus_passed == true and
            .native_elf_member_count == 28 and
            .native_direct_needed_edges == 268 and
            .complete_resolved_linker_symbol_map == false and
            .host_transitive_and_dlopen_dependencies_closed == false and
            .additional_source_removal_authorized == false
          ' "${accepted[0]}" >/dev/null
          printf '%s\n' "${link[0]}" "${loader[0]}" "${package[0]}" \
            > "$RUNNER_TEMP/triage-input-paths"
          echo "PASS: exact source/package bound to independent native reconciliation"

      - name: Reject forged compiled-loader and safety-closure claims
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < "$RUNNER_TEMP/triage-input-paths"
          test "${#paths[@]}" -eq 3
          bash ci/tests/m3-current-conditional-loader-triage-tests.sh \
            "${paths[0]}" "${paths[1]}" "${paths[2]}" \
            "$NATIVE_SOURCE_SHA" "$NATIVE_RUN_ID"

      - name: Produce bounded current conditional feature gap triage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < "$RUNNER_TEMP/triage-input-paths"
          jq -n --slurpfile link "${paths[0]}" \
            --slurpfile loader "${paths[1]}" \
            --slurpfile package "${paths[2]}" \
            --arg source "$NATIVE_SOURCE_SHA" --argjson run "$NATIVE_RUN_ID" \
            -f ci/m3-current-conditional-loader-triage.jq \
            > "$RUNNER_TEMP/m3-current-conditional-loader-triage.json"
          jq -e '
            .authenticated_compiled_source_package_runtime_and_direct_loader_report_joined == true and
            .scoped_compiled_direct_loader_branches == 73 and
            .scoped_distinct_caller_api_kind_records == 47 and
            .scoped_targeted_risk_witnesses == 12 and
            .scoped_targeted_direct_branches == 19 and
            .indirect_loader_calls_enumerated == false and
            .library_name_arguments_and_dlsym_targets_proven == false and
            .alternative_runtime_feature_paths_exercised == false and
            .platform_endeavouros_hyprland_parity_proven == false and
            .full_dependency_ffi_and_feature_closure_proven == false and
            .additional_source_pruning_authorized == false and
            .m3_sixth_gate_closed == false and .release_ready == false
          ' "$RUNNER_TEMP/m3-current-conditional-loader-triage.json" >/dev/null
          echo "PASS: 12 current conditional-loader caller witnesses / 19 direct branches"
          echo "LIMIT: not library arguments, indirect calls, fallbacks, platform QA or pruning"

      - name: Compile/test Rust source anchor examiner and verify three actual compiled-source Git blobs
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test \
            ci/m3-current-conditional-loader-source-anchors.rs \
            -o "$RUNNER_TEMP/m3-loader-source-anchor-tests"
          "$RUNNER_TEMP/m3-loader-source-anchor-tests" --nocapture
          rustc --edition=2021 -D warnings -O \
            ci/m3-current-conditional-loader-source-anchors.rs \
            -o "$RUNNER_TEMP/m3-loader-source-anchor-check"
          for path in \
            dom/media/platforms/ffmpeg/FFmpegRuntimeLinker.cpp \
            dom/media/platforms/ffmpeg/VALibWrapper.cpp \
            widget/gtk/DMABufDevice.cpp; do
            blob="$(git rev-parse "HEAD:$path")"
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$NATIVE_SOURCE_SHA" \
              > "$RUNNER_TEMP/native-source-object.json"
            jq -e --arg path "$path" --arg blob "$blob" '
              .path == $path and .sha == $blob and
              .type == "file"
            ' "$RUNNER_TEMP/native-source-object.json" >/dev/null
          done
          "$RUNNER_TEMP/m3-loader-source-anchor-check" \
            --audit "$GITHUB_WORKSPACE" "$NATIVE_SOURCE_SHA" \
            "$RUNNER_TEMP/m3-current-conditional-loader-source-anchors.json"
          jq -e --slurpfile triage "$RUNNER_TEMP/m3-current-conditional-loader-triage.json" \
            --arg sha "$NATIVE_SOURCE_SHA" '
            .schema_version == 1 and
            .status == "three_current_source_owned_conditional_loader_name_and_failure_guards" and
            .native_source_commit == $sha and
            .source_rows_count == 3 and
            .source_literal_library_candidates_checked == 7 and
            ([.source_rows[].id] | sort) == ["ffmpeg_runtime_init","gbm_widget","vaapi_loader"] and
            all(.source_rows[];
              (.exact_compiled_source_git_blob|test("^[0-9a-f]{40}$")) and
              .source_guard_and_failure_anchors_observed == true and
              .runtime_requested_library_name_verified == false and
              .missing_library_fallback_exercised == false) and
            all(.source_rows[].id; . as $id |
              any($triage[0].scoped_witnesses[]; .id == $id and .observed_direct_branches > 0)) and
            .compiled_native_branch_reconciliation_performed_by_this_observer == false and
            .library_names_at_actual_machine_call_arguments_verified == false and
            .all_indirect_loader_and_symbol_edges_known == false and
            .source_guards_exercised_at_runtime == false and
            .safe_feature_fallback_proven == false and
            .target_endeavouros_hyprland_tested == false and
            .source_pruning_authorized == false and
            .m3_sixth_gate_closed == false and .release_ready == false
          ' "$RUNNER_TEMP/m3-current-conditional-loader-source-anchors.json" >/dev/null
          echo "PASS: exact current FFmpeg/VA-API/GBM source blobs, named library literals and guarded loader callsites"
          echo "LIMIT: no proof of runtime requested arguments, actual missing-provider fallback or indirect FFI closure"

      - name: Preserve bounded conditional native loader gap evidence only
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-conditional-loader-source-linked-triage
          path: |
            ${{ runner.temp }}/m3-current-conditional-loader-triage.json
            ${{ runner.temp }}/m3-current-conditional-loader-source-anchors.json
          if-no-files-found: error
          retention-days: 14
