# Real packaged opt-in Normandy-free native browser: New Tab retained fallbacks.
# Reuses previously built archived source-matched candidate; no Firefox compiler.
name: M3 Archived Lean Native New Tab Pocket Factory Runtime
on:
  push:
    branches: [main]
    paths:
      - ci/smoke-newtab-pocket-retained-runtime.py
      - .github/workflows/m3-newtab-pocket-archived-lean-runtime.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  newtab-legacy-modern-registrations-in-real-native-browser:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ARCHIVED_SOURCE_COMMIT: '034ddd665a080f173ce45094ae3afb8868b45e1a'
      ARCHIVED_LEAN_SHA256: '7095a57083a6211177fd182a2c5275d0ef8c8b2398f4eb1b3298ae951861adac'
      MOZ_HEADLESS: '1'
    steps:
      - name: Sparse checkout CI private browser test only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Validate bounded test fixtures and unchanged Pocket/New Tab critical source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/smoke-webextension-package-local.py \
            ci/smoke-newtab-pocket-retained-runtime.py
          python3 ci/smoke-newtab-pocket-retained-runtime.py --self-test
          python3 - <<'PY'
          import subprocess
          # These six exact source blobs match both the archived candidate's
          # Git SHA and current main. Other config/platform/source not checked.
          required={
            "browser/extensions/newtab/lib/ActivityStream.sys.mjs":"e0b0eef5a3f4a9814888b60f5617d105db739454",
            "browser/extensions/newtab/lib/DiscoveryStreamFeed.sys.mjs":"aa6239b92899d0ee3a0a57a6023d89109eb8829f",
            "browser/extensions/newtab/lib/TopStoriesFeed.sys.mjs":"0bed6344ba11903efc06a31e98b7bf1737e68278",
            "browser/extensions/newtab/moz.build":"9c9836ad4136dd4419ec56694c64176c4e9534a6",
            "browser/extensions/newtab/addon-jar.mn":"6b3cce522bbff4ae6b3df3b1c44a771e64392c67",
            "browser/extensions/newtab/content-src/components/DiscoveryStreamComponents/AdBanner/AdBanner.jsx":"e1c3614ad411e764748edea5291d4dc92978dbf9",
          }
          for path,expected in required.items():
              got=subprocess.check_output(
                  ["git","rev-parse","HEAD:"+path],text=True).strip()
              assert got==expected,(path,"source code changed since archived candidate")
          print("PASS: six specific Pocket/New Tab source blob hashes unchanged")
          PY
      - name: Require originally successful native build and packaged runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40954193793" |
            jq -e --arg source "$ARCHIVED_SOURCE_COMMIT" \
              '.status == "completed" and .conclusion == "success" and .head_sha == $source' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40968542013" |
            jq -e '.status == "completed" and .conclusion == "success"' >/dev/null
          gh run download 40954193793 --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-linux-candidate \
            --dir "$RUNNER_TEMP/lean"
      - name: Rehash original lean binary and verify source/version/feature guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["RUNNER_TEMP"])/"lean"
          pkg=root/"vulpra-normandy-candidate.tar.xz"
          metadata=json.loads((root/"m3-normandy-package.json").read_text())
          digest=hashlib.sha256(pkg.read_bytes()).hexdigest()
          assert digest==os.environ["ARCHIVED_LEAN_SHA256"]==metadata["sha256"]
          assert metadata["source_commit"]==os.environ["ARCHIVED_SOURCE_COMMIT"]
          assert metadata["schema_version"]==1
          assert metadata["compressed_bytes"]==pkg.stat().st_size==87138100
          assert (root/"vulpra-normandy-candidate.tar.xz.sha256").read_text().split()[0]==digest
          assert "res/normandy/Normandy.sys.mjs" in metadata["forbidden_resource_absent"]
          print("PASS: original source-matched lean native archive digest, guarded omission")
          PY
          mkdir -p .git/vulpra-native-build/packages
          cp "$RUNNER_TEMP/lean/vulpra-normandy-candidate.tar.xz" \
             .git/vulpra-native-build/packages/vulpra-local-pocket-ci.tar.xz
          sha256sum .git/vulpra-native-build/packages/vulpra-local-pocket-ci.tar.xz \
             > .git/vulpra-native-build/packages/vulpra-local-pocket-ci.tar.xz.sha256
      - name: Install only Ubuntu normal-browser libraries and geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends libgtk-3-0t64 libdbus-glib-1-2 \
            libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
      - name: Exercise real about:newtab and both retained source feed factories
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP:$PATH" \
            python3 ci/smoke-newtab-pocket-retained-runtime.py "$GITHUB_WORKSPACE"
          jq -e \
            '.schema_version == 1 and
             .status == "real_normandy_free_native_newtab_feed_factories_retained" and
             .verified_archive_sha256 == true and
             .private_browser_profile_verified == true and
             .gecko_nonlocal_connection_guard_enabled == true and
             .full_default_normandy_runner_present == false and
             .newtab_document_loaded == true and
             (.protected_newtab_factories_and_registry | length) == 26 and
             .real_shipped_legacy_method_exercised_with_inert_side_effect_hooks == true and
             (.protected_newtab_factories_and_registry | all(. == true)) and
             .pocket_recommendation_data_downloaded_by_probe == false and
             .actual_legacy_fallback_invoked == false and
             .actual_modern_content_fetch_invoked == false and
             .runtime_signed_in_user_data_used == false and
             .complete_current_head_native_binary_proven == false and
             .source_removal_authorized == false and
             .new_m3_whole_gate_passed == false' \
            .git/vulpra-native-build/m3-newtab-pocket-preservation.json >/dev/null
          echo "PASS: packaged lean native New Tab retains legacy, modern and sponsored factories"
      - name: Save bounded actual browser module/factory read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-archived-lean-pocket-native-registration-smoke
          path: .git/vulpra-native-build/m3-newtab-pocket-preservation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
