name: M3 Verify Native Candidate Runtime

on:
  workflow_run:
    workflows: ["M3 Build Isolated Normandy-Free Linux Candidate"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  native-runtime:
    if: >-
      github.repository == 'sguzman/vulpra' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out regression scripts only
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout: |
            ci
            packaging
          persist-credentials: false

      - name: Install packaged-browser dependencies and pinned geckodriver
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          # The real Weston fixture previously timed out at 20 minutes while
          # its Ubuntu mirror was still downloading transitive dependencies.
          # Do not lose a successful several-hour native browser build to a
          # shorter runtime-job apt window. No feature/runtime gates relaxed.
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 install -y --no-install-recommends \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1 \
            weston wayland-utils
          command -v weston
          command -v wayland-info
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Fetch exact successful native-build artifact and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-artifact"
          gh run download "$NATIVE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-linux-candidate \
            --dir "$RUNNER_TEMP/native-artifact"
          (cd "$RUNNER_TEMP/native-artifact" && sha256sum --check vulpra-normandy-candidate.tar.xz.sha256)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"native-artifact"/"m3-normandy-package.json").read_text())
          assert report["source_commit"]==os.environ["NATIVE_SOURCE_SHA"], (report["source_commit"], os.environ["NATIVE_SOURCE_SHA"])
          assert report["compressed_bytes"]>0
          assert report["omni_jar_count"]>=2
          print("PASS: original CI artifact SHA-256 and source-commit attribution")
          PY
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/native-artifact/vulpra-normandy-candidate.tar.xz" "$dest/vulpra-local-m3-normandy-ci.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-m3-normandy-ci.tar.xz > vulpra-local-m3-normandy-ci.tar.xz.sha256)
          cp "$RUNNER_TEMP/native-artifact/m3-normandy-package.json" \
            "$GITHUB_WORKSPACE/.git/vulpra-native-build/m3-normandy-package.json"
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
          NATIVE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Require a real Wayland framebuffer attachment and commit
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages/vulpra-local-m3-normandy-ci.tar.xz"
          (cd "$(dirname "$archive")" && sha256sum --check "$(basename "$archive").sha256")
          unpack="$RUNNER_TEMP/m3-wayland-unpacked"
          mkdir -p "$unpack"
          tar -xf "$archive" -C "$unpack"
          mapfile -d '' -t inis < <(find "$unpack" -maxdepth 5 -type f -name application.ini -print0)
          [[ "${#inis[@]}" -eq 1 ]] || { echo "Not exactly one native application.ini" >&2; exit 1; }
          VULPRA_WAYLAND_TEST_SECONDS=15 bash packaging/test-wayland.sh "$(dirname "${inis[0]}")"
          echo "PASS: candidate packaged browser attached and committed real Weston Wayland surface frames"

      - name: Verify actual local HTTP JavaScript navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/smoke-m3-localhost-package.py "$GITHUB_WORKSPACE"

      - name: Verify actual packaged WebExtension lifecycle and Nimbus initialization
        shell: bash
        env:
          VULPRA_M3_VERIFY_NIMBUS: "1"
        run: |
          set -euo pipefail
          geckodriver --version
          python3 ci/smoke-webextension-package-local.py "$GITHUB_WORKSPACE"

      - name: Preserve regression reports and bounded browser driver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulpra-m3-normandy-runtime-evidence
          path: |
            .git/vulpra-native-build/packages/vulpra-local-m3-normandy-ci.tar.xz
            .git/vulpra-native-build/packages/vulpra-local-m3-normandy-ci.tar.xz.sha256
            .git/vulpra-native-build/m3-normandy-package.json
            .git/vulpra-native-build/m3-localhost-acceptance.json
            .git/vulpra-native-build/webextension-smoke-*.json
            .git/vulpra-native-build/webextension-geckodriver-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Record native candidate validation on evidence issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VULPRA_JOB_STATUS: ${{ job.status }}
          NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
          NATIVE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          {
            echo '## M3 packaged native runtime acceptance'
            echo
            echo "Native source commit: \`$NATIVE_SOURCE_SHA\`"
            echo "Native build: https://github.com/sguzman/vulpra/actions/runs/$NATIVE_RUN_ID"
            echo "Runtime check: https://github.com/sguzman/vulpra/actions/runs/$GITHUB_RUN_ID"
            echo "Runtime suite status: **$VULPRA_JOB_STATUS**"
            echo
            echo 'Required: committed Weston Wayland frame; local JS redirect; packaged WebExtension install, content/background/storage, uninstall; Nimbus store ready; Firefox profile preserved.'
            echo 'No M3 package-size credit until same-toolchain original-vs-lean measurement and complete acceptance.'
          } > "$RUNNER_TEMP/m3-runtime-comment.md"
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/m3-runtime-comment.md"
