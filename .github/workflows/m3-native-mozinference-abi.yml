
# Source-authenticated original packaged mozinference C API under no-egress netns.
# Exercises a retained ML backend; no model, browser settings, or user data.
name: M3 Original Native Mozinference C API No-Egress Activation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-mozinference-abi.yml
      - ci/m3-mozinference-capi-probe.rs
      - ci/m3-mozinference-no-egress.sh
      - ci/m3-mozinference-version-checks.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-mozinference-loader-and-llama-c-api:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
      STATIC_RUN: '41157293087'
      STATIC_HEAD: 184d5b33678152c1bd28b0c35cecc450e49c93f1
    steps:
      - name: Checkout bounded original module ABI probe
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Test forged trace rejection and compile no-dependency Rust C ABI probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-mozinference-version-checks.py
          python3 ci/m3-mozinference-version-checks.py --self-test
          bash -n ci/m3-mozinference-no-egress.sh
          rustc --edition=2021 -C opt-level=1 ci/m3-mozinference-capi-probe.rs \
            -o "$RUNNER_TEMP/moz-original-probe"
          test -x "$RUNNER_TEMP/moz-original-probe"
      - name: Install restricted Linux ELF and namespace prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 libstdc++6 libgomp1 binutils
      - name: Verify original compiled source and immutable package identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_RUN" |
            jq -e --arg sha "$STATIC_HEAD" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha and
              .name=="M3 Source-Pinned Native ELF Version-Name Inventory"' >/dev/null
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package" "$RUNNER_TEMP/static"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          gh run download "$STATIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-version-name-contract --dir "$RUNNER_TEMP/static"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/vulpra/libmozinference.so"
          readelf -Ws "$RUNNER_TEMP/package/vulpra/libmozinference.so" | grep -q ' llama_backend_init$'
      - name: Invoke original llama backend and reconcile real native GNU loader checks
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo unshare --net -- bash ci/m3-mozinference-no-egress.sh \
            "$RUNNER_TEMP/package/vulpra" "$RUNNER_TEMP/moz-original-probe" \
            "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" \
            "$RUNNER_TEMP/m3-mozinference-native-abi.json"
          jq -e --arg source "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and .original_native_compiled_source==$source and
            .original_native_archive_sha256==$sha and
            .real_original_libmozinference_dlopen_and_llama_api_invoked==true and
            .original_mozinference_version_contracts==24 and
            .observed_original_mozinference_version_checks==24 and
            .not_observed_original_mozinference_version_checks==0 and
            (.observed_original_version_contracts|length)==24 and
            .model_loaded_or_inference_performed==false and
            .browser_ml_integration_tested==false and
            .external_network_or_user_profile_accessed==false and
            .raw_loader_paths_and_pids_retained==false and
            .safe_source_pruning_authorized==false and
            .m3_sixth_gate_closed==false'             "$RUNNER_TEMP/m3-mozinference-native-abi.json" >/dev/null
          echo 'PASS: original mozinference real C API and all compiled version checks'
      - name: Preserve bounded sanitized compiled backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-mozinference-native-capi
          path: ${{ runner.temp }}/m3-mozinference-native-abi.json
          if-no-files-found: error
          retention-days: 14
