# Historical filename retained to preserve links to the successful pre-merge
# experiment. The deletions are now committed; this job must not repeat them.
name: M3 Verify Committed Linux Platform Source Prune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-platform-prune-experiment.yml
      - widget/windows/**
      - widget/cocoa/**
      - browser/installer/windows/**
      - toolkit/library/rust/shared/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-platform-prune:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout retained source and dependency manifests only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            widget/windows
            widget/cocoa
            browser/installer/windows
            toolkit/library/rust/shared
          sparse-checkout-cone-mode: true

      - name: Verify exactly eight shared files remain at committed HEAD
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          trap 'rm -f -- "$expected" "$actual"' EXIT
          cat > "$expected" <<'EXPECTED'
          browser/installer/windows/nsis/updater_append.ini
          widget/cocoa/metrics.yaml
          widget/windows/metrics.yaml
          widget/windows/rust/Cargo.toml
          widget/windows/rust/src/AlertsServiceRust.h
          widget/windows/rust/src/PermissionMonitor.h
          widget/windows/rust/src/lib.rs
          widget/windows/rust/src/permission_monitor.rs
          EXPECTED
          git ls-tree -r --name-only HEAD -- \
            widget/windows widget/cocoa browser/installer/windows \
            | LC_ALL=C sort > "$actual"
          LC_ALL=C sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          while IFS= read -r path; do
            test -f "$path" || { echo "Missing retained dependency: $path" >&2; exit 1; }
          done < "$expected"
          grep -Fq 'widget_windows = { path = "../../../../widget/windows/rust" }' \
            toolkit/library/rust/shared/Cargo.toml
          grep -Fq 'name = "widget_windows"' widget/windows/rust/Cargo.toml
          echo 'PASS: only eight essential shared inputs survive on main.'
          echo 'This is a source invariant, not a fresh native build or binary size measurement.'
