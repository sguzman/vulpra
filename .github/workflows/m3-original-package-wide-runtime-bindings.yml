# Source-pinned glibc binding census of all packaged ELF requesters seen by one original native browser workload.
# Rust observer exports only counts and safe provider basenames, never symbols or raw traces.
name: M3 Original Package-Wide ELF Requester Runtime Bindings
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-package-wide-runtime-bindings.yml
      - ci/m3-native-original-package-binding-census.rs
      - ci/smoke-newtab-asrouter-native-bridge.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-compiled-package-elf-binding-census-under-headless-qa:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout read-only native smoke and bounded parser
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci
      - name: Unit-test bounded Rust parser and authenticate original source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-native-original-package-binding-census.rs -o "$RUNNER_TEMP/m3-bindings-tests"
          "$RUNNER_TEMP/m3-bindings-tests"
          rustc --edition=2021 -O ci/m3-native-original-package-binding-census.rs -o "$RUNNER_TEMP/m3-package-parser"
          python3 ci/smoke-newtab-asrouter-native-bridge.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA"               '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
      - name: Download original compiled full-Normandy archive with checksum provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original"
          (cd "$RUNNER_TEMP/original" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path(os.environ["RUNNER_TEMP"])/"original"
          archive=root/"full-normandy-baseline.tar.xz"
          m=json.loads((root/"m3-full-normandy-baseline.json").read_text())
          assert m["schema_version"]==1
          assert m["source_commit"]==os.environ["SOURCE_SHA"]
          assert m["variant"]=="full-normandy"
          assert m["required_newtab_modules_present"] is True
          assert m["normandy_runner_present"] is True
          assert m["sha256"]==os.environ["ARCHIVE_SHA256"]==hashlib.sha256(archive.read_bytes()).hexdigest()
          assert m["compressed_bytes"]==archive.stat().st_size==87154544
          print("PASS: original compiled Vulpra source and archive authenticated")
          PY
          mkdir -p .git/vulpra-native-build/packages
          cp "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" \
            .git/vulpra-native-build/packages/vulpra-local-loader-observation.tar.xz
          (cd .git/vulpra-native-build/packages && \
           sha256sum vulpra-local-loader-observation.tar.xz > \
               vulpra-local-loader-observation.tar.xz.sha256)
      - name: Install runtime libraries and pinned GeckoDriver only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends binutils libgtk-3-0t64 libdbus-glib-1-2 \
            libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
      - name: Inspect exactly 28 checksum-authenticated regular packaged ELF members
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-package-elf"
          tar -xf "$RUNNER_TEMP/original/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/original-package-elf"
          test -d "$RUNNER_TEMP/original-package-elf/vulpra"
          while IFS= read -r -d '' file; do
            if readelf -h "$file" >/dev/null 2>&1; then
              printf '%s\n' "${file##*/}"
            fi
          done < <(find "$RUNNER_TEMP/original-package-elf/vulpra" -type f -print0) |
            sort > "$RUNNER_TEMP/original-28-native-elf-allowlist.txt"
          test "$(wc -l < "$RUNNER_TEMP/original-28-native-elf-allowlist.txt")" -eq 28
          test "$(sort -u "$RUNNER_TEMP/original-28-native-elf-allowlist.txt" | wc -l)" -eq 28
          grep -Fxq 'libxul.so' "$RUNNER_TEMP/original-28-native-elf-allowlist.txt"
          echo 'PASS: all 28 native ELF file basenames derived from original checksum-pinned archive'
      - name: Measure actual original package requesters on native New Tab QA
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-binding-traces"
          trap 'rm -rf -- "$RUNNER_TEMP/package-binding-traces"' EXIT
          env PATH="$RUNNER_TEMP:$PATH" MOZ_HEADLESS=1 LD_DEBUG=bindings \
            LD_DEBUG_OUTPUT="$RUNNER_TEMP/package-binding-traces/m3-package-bindings" \
            python3 ci/smoke-newtab-asrouter-native-bridge.py "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/m3-package-parser" \
            "$RUNNER_TEMP/package-binding-traces" \
            "$RUNNER_TEMP/original-28-native-elf-allowlist.txt" \
            "$RUNNER_TEMP/m3-original-package-elf-runtime-binding-census.json"
          jq -e --arg sha "$ARCHIVE_SHA256" --arg source "$SOURCE_SHA" '
            .schema_version==1 and
            .status=="original_package_elf_requester_live_binding_inventory" and
            .original_source_commit==$source and .original_archive_sha256==$sha and
            .original_package_elf_count==28 and
            .original_requester_basenames_observed>=2 and
            .pid_traces_with_package_requester_bindings>=1 and
            .normal_symbol_binding_events>=1 and
            .sum_distinct_requester_symbol_provider_combinations>=1 and
            ((.observed_requester_basenames|length)==.original_requester_basenames_observed) and
            ((.observed_requester_basenames|length)+
             (.unobserved_requester_basenames_on_this_workload|length)==28) and
            ((.per_original_requester|keys)==.observed_requester_basenames) and
            ((.observed_provider_basenames|length)==.observed_provider_basename_count) and
            .raw_loader_logs_exported==false and .symbol_names_exported==false and
            .private_browser_profile_only==true and
            .complete_lazy_transitive_or_feature_coverage_proven==false and
            .safety_of_source_removal_proven==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-original-package-elf-runtime-binding-census.json" >/dev/null
          echo 'PASS: actual glibc binding census for source-pinned packaged original ELF requesters'
      - name: Upload only sanitized original ELF requester binding census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-package-elf-runtime-bindings-sanitized
          path: ${{ runner.temp }}/m3-original-package-elf-runtime-binding-census.json
          if-no-files-found: warn
          retention-days: 14
