# One full normal exact-source native browser build, no feature omission.
# Retry native package replay after the recorded 2,590,378,712-byte linked
# debug ELF exceeded the former 2 GiB check; the bounded source-side self-test
# now explicitly covers that real size. Runtime and independent acceptance
# remain mandatory, and source-only self-tests cannot stand in for either.
name: M3 Source Matched Native Link Inputs and Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-source-matched-native-link.yml
      - ci/smoke-webextension-package-local.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulpra-m3-source-matched-native-link
  cancel-in-progress: false

jobs:
  compile-link-package-runtime:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-m3-baseline
      MOZ_HEADLESS: "1"
      DEBIAN_FRONTEND: noninteractive
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "vulpra-1590b5-m3-normandy-v1"
      CARGO_BUILD_JOBS: "1"
      VULPRA_M3_VERIFY_NIMBUS: "1"
    steps:
      - name: Checkout exactly the source that will be configured and built
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject broken link-input and protected normal-browser contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # This run must compile current pruned main, not replay the historical
          # original full-normal source used by the M3 dependency register.
          test "$GITHUB_SHA" != b1482404dfb8b01342990ee99ea3df0f9756b5f7
          python3 ci/m3-native-build-link-inputs.py --self-test
          python3 -m py_compile ci/m3-native-replay-packager.py
          python3 ci/m3-native-replay-packager.py --self-test
          python3 ci/m3-configure-only-substs.py --self-test
          python3 -m py_compile ci/smoke-webextension-package-local.py
          python3 ci/smoke-webextension-package-local.py --self-test-cert-parser
          python3 ci/tests/m3-promocard-bundle-contract.py
          python3 -m py_compile ci/m3-native-elf-package-graph.py
          echo "PASS: exact source and original unomitted normal Vulpra"

      - name: Prepare native compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Export GitHub compiler-cache backend credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap supported compiler and private browser test dependencies
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends python3 python3-venv python3-dev git curl make jq \
            weston wayland-utils libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 \
            libnss3 libgbm1 binutils ffmpeg
          ./mach --no-interactive bootstrap --application-choice browser
          if ! test -x "$HOME/.mozbuild/clang/bin/clang" || \
             ! test -x "$HOME/.mozbuild/clang/bin/clang++"; then
            (cd "$HOME/.mozbuild" && "$GITHUB_WORKSPACE/mach" artifact toolchain --from-build linux64-clang)
          fi
          major="$("$HOME/.mozbuild/clang/bin/clang" --version | head -1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          [[ "$major" =~ ^[0-9]+$ ]] && (( major >= 19 ))

      - name: Compile and test bounded current-native loader callsite examiner
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-current-compiled-loader-api-census.rs \
            -o "$RUNNER_TEMP/m3-current-loader-census-tests"
          "$RUNNER_TEMP/m3-current-loader-census-tests" --nocapture
          rustc --edition=2021 -O ci/m3-current-compiled-loader-api-census.rs \
            -o "$RUNNER_TEMP/m3-current-loader-census"
          echo "PASS: current native loader observer compiled and tests executed"
          rustc --edition=2021 -D warnings --test ci/m3-current-ffi-archive-members.rs \
            -o "$RUNNER_TEMP/m3-current-ffi-archive-members-tests"
          "$RUNNER_TEMP/m3-current-ffi-archive-members-tests"
          rustc --edition=2021 -D warnings -O ci/m3-current-ffi-archive-members.rs \
            -o "$RUNNER_TEMP/m3-current-ffi-archive-members"
          echo "PASS: compiled native Rust archive-member inspector with real GNU nm/ar test fixtures"
          rustc --edition=2021 -D warnings --test ci/m3-current-gkrust-direct-branches.rs \
            -o "$RUNNER_TEMP/m3-current-gkrust-direct-branch-tests"
          "$RUNNER_TEMP/m3-current-gkrust-direct-branch-tests"
          rustc --edition=2021 -D warnings -O ci/m3-current-gkrust-direct-branches.rs \
            -o "$RUNNER_TEMP/m3-current-gkrust-direct-branches"
          echo "PASS: compiled real C++ machine-call FFI fixture and negative branch tests"
          rustc --edition=2021 -D warnings --test ci/m3-current-crashhelper-direct-branch.rs \
            -o "$RUNNER_TEMP/m3-current-crashhelper-direct-branch-tests"
          "$RUNNER_TEMP/m3-current-crashhelper-direct-branch-tests"
          rustc --edition=2021 -D warnings -O ci/m3-current-crashhelper-direct-branch.rs \
            -o "$RUNNER_TEMP/m3-current-crashhelper-direct-branch"
          echo "PASS: linked Rust staticlib to crashhelper C++ machine-branch fixtures"
          rustc --edition=2021 -D warnings --test ci/m3-current-crashhelper-archive-ffi.rs \
            -o "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi-tests"
          "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi-tests"
          rustc --edition=2021 -D warnings -O ci/m3-current-crashhelper-archive-ffi.rs \
            -o "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi"
          echo "PASS: actual Rust staticlib member/linked CXX definition observer compiled and fixtures executed"

      - name: Record exact-source generated configure substitutions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./mach configure
          python3 ci/m3-configure-only-substs.py \
            --objdir "$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline" \
            --output "$RUNNER_TEMP/m3-native-link-config.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"m3-native-link-config.json").read_text())
          assert x["source_commit"]==os.environ["GITHUB_SHA"]
          f=x["observed_generated_substs"]
          for k in ("MOZ_WAYLAND","MOZ_X11","MOZ_SANDBOX","ENABLE_WEBDRIVER",
                    "MOZ_SERVICES_SYNC","MOZ_NORMANDY","MOZ_CRASHREPORTER",
                    "MOZ_UPDATER"):
              assert f[k]["value"]=="1",(k,f[k])
          assert f["MOZ_DEVTOOLS"]["value"]=="all"
          assert f["VULPRA_NO_ASROUTER_PROMOS"]["value"] in ("",None)
          # These two opt-out substitutions are intentionally not in the
          # older bounded config snapshot; read the generated files directly.
          substs=Path(os.environ["GITHUB_WORKSPACE"])/"obj-vulpra-linux-m3-baseline/config.statusd/substs"
          for k in ("VULPRA_NO_NEWTAB_ADSFEED","VULPRA_NO_NEWTAB_PROMOCARD"):
              p=substs/k
              value=json.loads(p.read_text()) if p.exists() else None
              assert value in (None,False,0,""),(k,value)
          print("PASS: current source identity, protected features and all three normal-build opt-outs")
          PY

      - name: Reserve sufficient swap for native Rust/C++ build
        shell: bash
        run: |
          set -euo pipefail
          free="$(df --output=avail -B1 /mnt | tail -1 | tr -d ' ')"
          (( free > 24*1024*1024*1024 + 8*1024*1024*1024 ))
          sudo fallocate -l 24G /mnt/vulpra-m3-native-link.swap
          sudo chmod 0600 /mnt/vulpra-m3-native-link.swap
          sudo mkswap /mnt/vulpra-m3-native-link.swap
          sudo swapon /mnt/vulpra-m3-native-link.swap
          grep -Fq /mnt/vulpra-m3-native-link.swap /proc/swaps

      - name: Compile complete normal exact-source native Vulpra
        shell: bash
        run: |
          set -euo pipefail
          ./mach build 2>&1 | tee "$RUNNER_TEMP/m3-native-link-build.log"

      # Preserve the actual Rust/C++ archive ABI evidence immediately after
      # the full native build, before packaging can change/remove intermediate
      # Cargo or moz.build staticlib outputs. The same unstripped crashhelper
      # ELF is rehashed after package/runtime smoke below.
      - name: Verify actual current native crashhelper CXX main direct branch to Rust FFI
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          crashhelper="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline/dist/bin/crashhelper"
          test -s "$crashhelper"
          test ! -L "$crashhelper"
          # Diagnose exact main binding if the real linked ELF uses local (t) text.
          # Do not print raw global symbols or run the crash helper process.
          nm --defined-only --format=posix "$crashhelper" | \
            awk '$1 == "main" { print "AUDIT: compiled crashhelper main nm binding " $2 }'
          "$RUNNER_TEMP/m3-current-crashhelper-direct-branch" \
            "$GITHUB_SHA" "$crashhelper" \
            "$RUNNER_TEMP/m3-current-crashhelper-direct-branch.json"
          jq -e --arg sha "$GITHUB_SHA" \
            --arg binary "$(sha256sum "$crashhelper" | cut -d' ' -f1)" '
              .schema_version == 1 and
              .status == "one_current_linked_crashhelper_main_direct_branch_to_named_ffi_definition" and
              .source_commit == $sha and
              .consumer_elf == "crashhelper" and
              .unstripped_crashhelper_sha256 == $binary and
              (.unstripped_crashhelper_bytes > 64) and
              .main_strong_text_definitions == 1 and
              .crash_generator_logic_desktop_text_definitions == 1 and
              .main_to_crash_generator_logic_desktop_direct_branches == 1 and
              .compiled_direct_branch_to_named_ffi_export_verified == true and
              .real_rust_archive_member_proven == false and
              .all_cpp_rust_ffi_edges_enumerated == false and
              .conditional_or_indirect_ffi_closure_proven == false and
              .source_pruning_authorized == false and
              .m3_sixth_gate_closed == false
            ' "$RUNNER_TEMP/m3-current-crashhelper-direct-branch.json" >/dev/null
          echo "PASS: real current linked crashhelper main issues one direct branch to named crash-helper FFI export"
          echo "LIMIT: no claimed Rust archive member provenance, complete FFI closure or source pruning"

      - name: Verify actual source-matched crashhelper Rust staticlib export archive owner
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          obj="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline"
          crashhelper="$obj/dist/bin/crashhelper"
          archive="$(bash ci/m3-locate-crashhelper-archive.sh "$obj")"
          test -s "$crashhelper"
          test ! -L "$crashhelper"
          test -s "$archive"
          test ! -L "$archive"
          test -s "$RUNNER_TEMP/m3-current-crashhelper-direct-branch.json"
          "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi" \
            "$GITHUB_SHA" "$archive" "$crashhelper" \
            "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi.json"
          jq -e --arg source "$GITHUB_SHA" \
            --arg archive "$(sha256sum "$archive" | cut -d' ' -f1)" \
            --arg elf "$(jq -r '.unstripped_crashhelper_sha256' "$RUNNER_TEMP/m3-current-crashhelper-direct-branch.json")" \
            --argjson size "$(jq -r '.unstripped_crashhelper_bytes' "$RUNNER_TEMP/m3-current-crashhelper-direct-branch.json")" '
              .schema_version == 1 and
              .status == "bounded_current_crashhelper_rust_staticlib_export_and_linked_elf_definition" and
              .source_commit == $source and
              .rust_staticlib == "libcrash_helper_server.a" and
              .consumer_elf == "crashhelper" and
              .rust_archive_sha256 == $archive and
              .unstripped_crashhelper_sha256 == $elf and
              .unstripped_crashhelper_bytes == $size and
              (.rust_archive_bytes > 64 and .rust_archive_bytes < 17179869184) and
              (.rust_archive_members > 0 and .rust_archive_members <= 1000000) and
              .export_name == "crash_generator_logic_desktop" and
              .export_strong_archive_definition_count == 1 and
              .export_linked_elf_text_definition_count == 1 and
              (.export_archive_member | type == "string" and test("^[A-Za-z0-9._+@$-]{1,255}$")) and
              .real_rust_archive_member_definition_observed == true and
              .real_linked_elf_definition_observed == true and
              .archive_member_selected_by_final_linker_proven == false and
              .all_rust_archive_member_selection_edges_proven == false and
              .complete_cpp_rust_ffi_graph_proven == false and
              .conditional_or_indirect_ffi_closure_proven == false and
              .source_pruning_authorized == false and .m3_sixth_gate_closed == false
            ' "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi.json" >/dev/null
          echo "PASS: named Rust crashhelper archive owner and linked consumer ELF accepted from one actual native build"
          echo "LIMIT: full linker archive selection and conditional FFI closure are not proven"


      - name: Package and independently verify native browser
        shell: bash
        run: |
          set -euo pipefail
          ./mach package
          dist="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline/dist"
          archive="$(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' -print -quit)"
          test -n "$archive"
          test "$(find "$dist" -maxdepth 1 -type f -name '*.tar.xz' | wc -l)" -eq 1
          mkdir -p .git/vulpra-native-build/packages
          bash packaging/stage.sh "$archive" \
            "$GITHUB_WORKSPACE/.git/vulpra-native-build/packages/vulpra-local-m3-native-link-ci.tar.xz"
          (cd .git/vulpra-native-build/packages && sha256sum -c vulpra-local-m3-native-link-ci.tar.xz.sha256)

      - name: Validate generated libxul inputs, preload order and all packaged native ELFs
        shell: bash
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages/vulpra-local-m3-native-link-ci.tar.xz"
          # Gecko's executable packager may STRIP/elfhack the output of
          # dist/bin, so independently reproduce the actual transformation.
          # Never overwrite the linked library, staged package or source.
          objdir="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline"
          for lib in "$objdir/dist/bin/libxul.so" "$objdir/dist/vulpra/libxul.so"; do
            test -f "$lib"
            stat -c 'Native packaging replay input: %n (%s bytes)' "$lib"
            file "$lib"
          done
          ./mach python ci/m3-native-replay-packager.py \
            --objdir "$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline" \
            --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/m3-native-packager-replay.json"
          python3 ci/m3-native-build-link-inputs.py \
            --objdir "$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline" \
            --package "$package" --source-sha "$GITHUB_SHA" \
            --transform-report "$RUNNER_TEMP/m3-native-packager-replay.json" \
            --output "$RUNNER_TEMP/m3-native-link-inputs.json"
          python3 ci/m3-native-elf-package-graph.py "$package" \
            --output "$RUNNER_TEMP/m3-native-link-elf-package-graph.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((p/"m3-native-link-inputs.json").read_text())
          b=json.loads((p/"m3-native-link-elf-package-graph.json").read_text())
          c=json.loads((p/"m3-native-link-config.json").read_text())
          assert a["source_commit"]==c["source_commit"]==os.environ["GITHUB_SHA"]
          assert a["package"]["package_sha256"]==b["archive_sha256"]
          # Exact historical full-normal package had 28 native ELFs and 268
          # direct DT_NEEDED declarations. Never silently accept omissions
          # while claiming this is the protected normal-browser baseline.
          assert len(b["elf_members"])==28,len(b["elf_members"])
          assert b["direct_needed_edges"]==268,b["direct_needed_edges"]
          assert a["dist_native_loader_order"]["mozgtk_before_mozwayland"]
          assert a["packaging_transform_replay"]["deterministic_reproduction_verified"] is True
          assert a["packaging_transform_replay"]["staged_and_reproduced_libxul_sha256"]==a["package"]["libxul_member"]["sha256"]
          a["workflow_run_id"]=int(os.environ["GITHUB_RUN_ID"])
          a["runtime_passed_after_link_audit"]=False
          (p/"m3-native-link-inputs.json").write_text(json.dumps(a,indent=2)+"\n")
          b["source_commit"]=os.environ["GITHUB_SHA"]
          (p/"m3-native-link-elf-package-graph.json").write_text(json.dumps(b,indent=2)+"\n")
          print("PASS: exact-source native libxul response, real ELF and compressed package evidence")
          PY

      - name: Smoke real packaged Wayland, JS navigation, WebExtensions and Nimbus
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"
          folder="$(mktemp -d)"
          trap 'rm -rf -- "$folder"' EXIT
          tar -xf .git/vulpra-native-build/packages/vulpra-local-m3-native-link-ci.tar.xz -C "$folder"
          app="$(find "$folder" -maxdepth 5 -type f -name application.ini -print -quit)"
          test -n "$app"
          # Ordinary Ubuntu-host Weston smoke must remain offline with a strict
          # non-local network guard. Gecko intentionally fails a prohibited
          # background request when this guard runs in online startup mode.
          # Scope both settings to this graphical probe; WebDriver exercises
          # localhost JavaScript separately and normal browser mode is unchanged.
          VULPRA_WAYLAND_TEST_OFFLINE=1 MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            VULPRA_WAYLAND_TEST_SECONDS=10 bash packaging/test-wayland.sh "$(dirname "$app")"
          python3 ci/smoke-m3-localhost-package.py "$GITHUB_WORKSPACE"
          PATH="$RUNNER_TEMP:$PATH" python3 ci/smoke-webextension-package-local.py "$GITHUB_WORKSPACE"
          # Independently fail if current packaged browser did not report
          # strict loopback self-signed TLS rejection under ordinary trust.
          webext="$(find .git/vulpra-native-build -maxdepth 1 -type f -name 'webextension-smoke-*.json' -print -quit)"
          test -n "$webext"
          jq -e '
            .status == "pass" and
            .security.original_firefox_profile_preserved == true and
            .security.temporary_home == true and
            (.security.local_untrusted_tls_denial as $tls |
              $tls.verified == true and
              $tls.local_self_signed_only == true and
              $tls.fixture_health_passed == true and
              $tls.ordinary_tls_client_rejected == true and
              $tls.webdriver_accept_insecure_certs == false and
              $tls.webdriver_error == "insecure certificate" and
              $tls.certificate_store_modified == false and
              $tls.safebrowsing_tested == false and
              $tls.sandbox_denial_tested == false and
              $tls.no_external_egress_proven == false)
          ' "$webext" >/dev/null
          echo "PASS: strict current-browser TLS rejection; not Safe Browsing or sandbox enforcement"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"m3-native-link-inputs.json"
          x=json.loads(p.read_text())
          x["runtime_passed_after_link_audit"]=True
          x["runtime_gates"]=["Wayland private Weston","localhost JS navigation",
                              "isolated profile and WebExtension","Nimbus check"]
          p.write_text(json.dumps(x,indent=2)+"\n")
          print("PASS: normal browser packaged runtime acceptance")
          PY

      - name: Probe actual packaged Vulpra with isolated optional GBM VA-API and FFmpeg denial
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-smoke-packaged-optional-provider-denial.sh
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            ci/m3-deny-optional-native-providers.c \
            -o "$RUNNER_TEMP/m3-deny-native-providers.so" -ldl
          bash ci/m3-smoke-packaged-optional-provider-denial.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/m3-deny-native-providers.so" \
            "$RUNNER_TEMP/m3-packaged-provider-denial-runtime.json"
          jq -e --arg sha "$GITHUB_SHA" \
            --arg archive "$(jq -r '.package.package_sha256' "$RUNNER_TEMP/m3-native-link-inputs.json")" '
              .schema_version == 1 and
              .status == "real_packaged_native_browser_optional_provider_denial_probe" and
              .native_source_commit == $sha and
              .verified_packaged_archive_sha256 == $archive and
              .actual_normal_packaged_browser_relaunched == true and
              .every_scenario_attached_and_screenshot_passed == true and
              ([.runtime_modes[].provider_group] | sort) == ["ffmpeg","gbm","vaapi"] and
              .original_private_home_and_profiles_untouched == true and
              .system_libraries_modified == false and
              .used_compiled_LD_PRELOAD_interposer == true and
              .all_requested_library_arguments_and_indirect_edges_proven == false and
              .hardware_video_or_Wayland_gpu_fallback_complete == false and
              .target_endeavouros_hyprland_verified == false and
              .source_pruning_authorized == false and
              .m3_sixth_gate_closed == false and
              .release_ready == false
            ' "$RUNNER_TEMP/m3-packaged-provider-denial-runtime.json" >/dev/null
          echo "PASS: normal packaged Vulpra survived bounded three-mode optional-provider denial smoke"
          echo "LIMIT: denial paths only proven for observed attempted loads; screenshot alone is not media/Wayland feature fallback proof"

      - name: Preserve bounded packaged browser optional-provider runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-packaged-optional-provider-denial-evidence
          path: ${{ runner.temp }}/m3-packaged-provider-denial-runtime.json
          if-no-files-found: warn
          retention-days: 14

      - name: Revalidate exact compiled crashhelper ELF after packaging and runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          obj="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline"
          elf="$obj/dist/bin/crashhelper"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$elf"
          test ! -L "$elf"
          test -s "$RUNNER_TEMP/m3-current-crashhelper-direct-branch.json"
          test -s "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi.json"
          actual="$(sha256sum "$elf" | cut -d' ' -f1)"
          jq -e --arg src "$GITHUB_SHA" --arg sha "$actual" \
            --argjson bytes "$(stat -c '%s' "$elf")" '
            .source_commit == $src and
            .unstripped_crashhelper_sha256 == $sha and
            .unstripped_crashhelper_bytes == $bytes and
            .main_to_crash_generator_logic_desktop_direct_branches == 1 and
            .source_pruning_authorized == false and
            .m3_sixth_gate_closed == false
          ' "$RUNNER_TEMP/m3-current-crashhelper-direct-branch.json" >/dev/null
          jq -e --arg src "$GITHUB_SHA" --arg sha "$actual" \
            --argjson bytes "$(stat -c '%s' "$elf")" '
            .source_commit == $src and
            .unstripped_crashhelper_sha256 == $sha and
            .unstripped_crashhelper_bytes == $bytes and
            .real_rust_archive_member_definition_observed == true and
            .real_linked_elf_definition_observed == true and
            .archive_member_selected_by_final_linker_proven == false and
            .complete_cpp_rust_ffi_graph_proven == false and
            .source_pruning_authorized == false and
            .m3_sixth_gate_closed == false
          ' "$RUNNER_TEMP/m3-current-crashhelper-archive-ffi.json" >/dev/null
          echo "PASS: original source-linked crashhelper ELF hash unchanged after packaging and real browser runtime"
          echo "LIMIT: archive-member selection and full FFI/feature closure remain unproven"

      - name: Audit current-source linked native loader callsites
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$RUNNER_TEMP/m3-current-loader-census" "$GITHUB_SHA" \
            "$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline/dist/bin/libxul.so" \
            "$RUNNER_TEMP/m3-current-native-loader-callsite.json"
          jq -e \
            --arg source "$GITHUB_SHA" \
            --arg binary "$(jq -r '.built_libxul_sha256' "$RUNNER_TEMP/m3-native-link-inputs.json")" \
            '
              .schema_version == 1 and
              .source_commit == $source and
              .binary == "libxul.so" and
              .unstripped_native_elf_sha256 == $binary and
              (.unstripped_native_elf_bytes > 10000000) and
              .status == "compiled_direct_loader_api_callsite_census" and
              (.native_instruction_lines > 1000) and
              (.direct_loader_branches > 0) and
              (.direct_loader_branches <= 100000) and
              (.distinct_caller_loader_kind_records == (.direct_loader_callsite_records | length)) and
              (.direct_loader_branches == ([.direct_loader_callsite_records[].native_branches] | add)) and
              (.independently_accepted_ffmpeg_to_nspr_call_count == 1) and
              (all(.direct_loader_callsite_records[];
                (.caller_symbol | type == "string" and length > 0) and
                (.loader_api | IN("PR_LoadLibraryWithFlags","PR_LoadLibrary",
                  "PR_LoadLibraryByPathname","dlopen","dlmopen")) and
                (.branch_kind | IN("call","tail-jump")) and
                (.native_branches | type == "number" and . > 0))) and
              .indirect_loader_calls_enumerated == false and
              .every_dynamic_loader_api_enumerated == false and
              .actual_dynamic_library_names_verified == false and
              .conditional_runtime_routes_exercised == false and
              .all_elf_consumers_covered == false and
              .arch_workstation_verified == false and
              .source_pruning_authorized == false and
              .m3_sixth_gate_closed == false
            ' "$RUNNER_TEMP/m3-current-native-loader-callsite.json" >/dev/null
          echo "PASS: current linked native loader branches tied to source and unstripped libxul ELF; no full dlopen closure"

      - name: Inspect real current compiled Rust archive members and ELF definitions
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          obj="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline"
          # Do not trust one assumed archive path. This helper selects the
          # expected normal-build owner when present or exactly one real
          # in-objdir candidate; absent/ambiguous inputs fail closed.
          rust_archive="$(bash ci/m3-locate-gkrust-archive.sh "$obj")"
          libxul="$obj/dist/bin/libxul.so"
          # Individual checks: bash -e does NOT reliably abort an AND-list
          # when its first 'test -s' fails.
          test -s "$rust_archive"
          test -s "$libxul"
          test ! -L "$rust_archive"
          test ! -L "$libxul"
          echo "AUDIT: source-matched gkrust archive bytes $(stat -c %s "$rust_archive")"
          echo "AUDIT: source-matched unstripped libxul bytes $(stat -c %s "$libxul")"
          "$RUNNER_TEMP/m3-current-ffi-archive-members" \
            "$GITHUB_SHA" "$rust_archive" "$libxul" \
            "$RUNNER_TEMP/m3-current-ffi-archive-members.json"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg elf "$(jq -r '.built_libxul_sha256' "$RUNNER_TEMP/m3-native-link-inputs.json")" \
            '
            .schema_version == 1 and
            .status == "bounded_real_compiled_gkrust_archive_member_and_libxul_definitions" and
            .source_commit == $sha and
            .rust_staticlib == "libgkrust.a" and
            .consumer_elf == "libxul.so" and
            .libxul_unstripped_sha256 == $elf and
            (.rust_archive_bytes > 64) and
            (.rust_archive_members > 0) and
            .named_ffi_symbol_pairs == 2 and
            ([.symbol_members[].symbol] | sort) == ["GkRust_Init","GkRust_Shutdown"] and
            all(.symbol_members[];
              (.archive_member | type) == "string" and
              (.archive_member | length) > 0 and
              .archive_definition_count == 1 and .consumer_definition_count == 1) and
            .compiled_current_rust_archive_member_definitions_observed == true and
            .compiled_current_elf_named_definitions_observed == true and
            .complete_member_to_linker_selection_graph_proven == false and
            .complete_rust_cpp_ffi_graph_proven == false and
            .dynamic_or_indirect_ffi_closure_proven == false and
            .additional_source_pruning_authorized == false and
            .m3_sixth_gate_closed == false
            ' "$RUNNER_TEMP/m3-current-ffi-archive-members.json" >/dev/null
          echo "PASS: two gkrust symbols verified in actual current native archive and linked libxul"
          echo "LIMIT: archive/ELF definitions only; no full FFI closure or source pruning"

      - name: Verify three actual current native C++ XPCOM direct branches to gkrust FFI
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          libxul="$GITHUB_WORKSPACE/obj-vulpra-linux-m3-baseline/dist/bin/libxul.so"
          test -s "$libxul"
          test ! -L "$libxul"
          test -s "$RUNNER_TEMP/m3-current-ffi-archive-members.json"
          "$RUNNER_TEMP/m3-current-gkrust-direct-branches" \
            "$GITHUB_SHA" "$libxul" \
            "$RUNNER_TEMP/m3-current-gkrust-direct-branches.json"
          jq -e --arg sha "$GITHUB_SHA" \
            --arg elf "$(jq -r '.built_libxul_sha256' "$RUNNER_TEMP/m3-native-link-inputs.json")" \
            --arg rust_elf "$(jq -r '.libxul_unstripped_sha256' "$RUNNER_TEMP/m3-current-ffi-archive-members.json")" '
              .schema_version == 1 and
              .status == "three_current_compiled_cpp_direct_branches_to_named_gkrust_abi_exports" and
              .source_commit == $sha and
              .linked_consumer == "libxul.so" and
              .unstripped_consumer_sha256 == $elf and
              .unstripped_consumer_sha256 == $rust_elf and
              (.unstripped_consumer_bytes > 10000000) and
              .caller_functions_verified == 3 and
              .ns_init_xpcom_to_gkrust_init_branches == 1 and
              .ns_init_minimal_xpcom_to_gkrust_init_branches == 1 and
              .mozilla_shutdown_xpcom_to_gkrust_shutdown_branches == 1 and
              .current_machine_code_direct_branch_targets_verified == true and
              .all_cpp_rust_ffi_callers_enumerated == false and
              .all_rust_archive_members_to_linker_edges_verified == false and
              .conditional_or_indirect_ffi_closure_proven == false and
              .source_pruning_authorized == false and
              .m3_sixth_gate_closed == false
            ' "$RUNNER_TEMP/m3-current-gkrust-direct-branches.json" >/dev/null
          echo "PASS: three source-matched current XPCOM compiled machine branches to real gkrust exports"
          echo "LIMIT: no full FFI map, additional source pruning or release authority"

      - name: Preserve bounded current linked crashhelper CXX to FFI branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-native-crashhelper-direct-branch-evidence
          path: ${{ runner.temp }}/m3-current-crashhelper-direct-branch.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded current crashhelper Rust archive owner and ELF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-native-crashhelper-rust-archive-evidence
          path: ${{ runner.temp }}/m3-current-crashhelper-archive-ffi.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve source-linked current native direct-branch evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-native-gkrust-direct-branch-evidence
          path: ${{ runner.temp }}/m3-current-gkrust-direct-branches.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded source-pinned current native FFI archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-native-rust-ffi-archive-evidence
          path: ${{ runner.temp }}/m3-current-ffi-archive-members.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded current-source native loader callsite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-current-native-loader-callsite-evidence
          path: ${{ runner.temp }}/m3-current-native-loader-callsite.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded native evidence and checksum without full archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-source-matched-native-link-evidence
          path: |
            ${{ runner.temp }}/m3-native-link-config.json
            ${{ runner.temp }}/m3-native-link-inputs.json
            ${{ runner.temp }}/m3-native-packager-replay.json
            ${{ runner.temp }}/m3-native-link-elf-package-graph.json
            .git/vulpra-native-build/packages/vulpra-local-m3-native-link-ci.tar.xz.sha256
            .git/vulpra-native-build/m3-localhost-acceptance.json
            .git/vulpra-native-build/webextension-smoke-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Run real H264 video playback under available and blocked FFmpeg providers
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -x "$RUNNER_TEMP/geckodriver"
          bash -n ci/m3-packaged-ffmpeg-h264-video.sh
          bash ci/m3-packaged-ffmpeg-h264-video.sh --self-test
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            ci/m3-deny-optional-native-providers.c \
            -o "$RUNNER_TEMP/m3-deny-native-providers.so" -ldl
          bash ci/m3-packaged-ffmpeg-h264-video.sh \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/m3-deny-native-providers.so" \
            "$RUNNER_TEMP/geckodriver" \
            "$RUNNER_TEMP/m3-packaged-ffmpeg-h264-video.json"
          jq -e --arg sha "$GITHUB_SHA" \
            --arg archive "$(jq -r '.package.package_sha256' "$RUNNER_TEMP/m3-native-link-inputs.json")" '
            .schema_version==1 and
            .status=="real_packaged_H264_WebDriver_video_decode_with_FFmpeg_denial" and
            .source_commit==$sha and
            .normal_packaged_archive_sha256==$archive and
            .fixture_H264_codec_validated==true and
            .real_browser_decoded_frames_and_time_measured==true and
            .baseline_H264_playback_passed==true and
            .exact_source_private_webdriver_modes_safe==true and
            .real_denied_FFmpeg_attempt_observed==true and
            ([.modes[].mode]|sort)==["baseline","denied"] and
            .alternative_software_H264_decoder_fallback_proven==false and
            .VAAPI_Wayland_DMABuf_runtime_fallback_proven==false and
            .complete_indirect_dynamic_loader_graph_closed==false and
            .m3_sixth_gate_closed==false and
            .source_pruning_authorized==false and .release_ready==false
          ' "$RUNNER_TEMP/m3-packaged-ffmpeg-h264-video.json" >/dev/null
          echo "PASS: real packaged baseline decoded H264 frames and explicit denied-FFmpeg video outcome observed"
          echo "LIMIT: denied-video behavior is measured, not necessarily software codec fallback; no GPU or full closure proof"

      - name: Preserve real packaged H264 video FFmpeg denial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-packaged-h264-video-ffmpeg-denial-evidence
          path: ${{ runner.temp }}/m3-packaged-ffmpeg-h264-video.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve bounded failure tail
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/m3-native-link-build.log"; then
            tail -n 3000 "$RUNNER_TEMP/m3-native-link-build.log" > "$RUNNER_TEMP/m3-native-link-failure-tail.log"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-link-failure-tail
          path: |
            ${{ runner.temp }}/m3-native-link-failure-tail.log
            .git/vulpra-native-build/webextension-tls-failure-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
