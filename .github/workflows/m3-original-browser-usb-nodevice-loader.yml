# Real original compiled Vulpra physical-USB-token backend no-key negative probe.
# Original authrs_bridge sends registration to usb_token_manager, with no
# device passthrough, network egress, or changes to an installed browser.
name: M3 Original Browser USB Backend No-Device Loader Probe
# Bounded experimental original-browser USB backend diagnostic. A negative
# request response is expected with no physical authenticator; actual mapped
# libudev evidence is measured independently. This is not sixth-gate closure.
# A source-pinned original-browser mapping transition passed 41371647131.
# Actual three-phase versioned libudev mapping and four negative mutants
# passed in original native CI 41674689904. Glibc no-LD_PRELOAD actual
# original browser provider and 15 source-matching / 1 unattributed symbol
# accepted in CI 41692027881, four negative mutations rejected. Same
# glibc libudev request/provider evidence and seven native negative tests
# accepted in CI 41694350808. Manual-only expensive native workflow.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-original-browser-usb-nodevice-loader.yml
      - ci/m3-original-browser-libudev-host-fingerprint.rs
      - ci/m3-original-browser-libudev-hash-crosswalk.jq
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-native-browser-usb-no-device:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
    steps:
      - name: Checkout only CI Rust local-origin and WebDriver test
        uses: actions/checkout@v4
        with:
          path: diagnostics
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-browser-webauthn-local-origin.rs
            ci/m3-original-browser-webauthn-webdriver.sh
            ci/m3-original-browser-on-demand-maps.rs
            ci/m3-original-webauthn-usb-maps-crosswalk.jq
            ci/m3-original-udev-glibc-bindings.rs
            ci/m3-original-udev-glibc-bindings-crosswalk.jq
            ci/m3-original-browser-libudev-host-fingerprint.rs
            ci/m3-original-browser-libudev-hash-crosswalk.jq
      - name: Checkout original source WebAuthn virtual-authenticator regression
        uses: actions/checkout@v4
        with:
          path: original-source
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            dom/webauthn/tests/test_webauthn_webdriver_virtual_authenticator.html
            dom/webauthn/tests/browser/browser.toml
            dom/webauthn/authrs_bridge/src/lib.rs
      - name: Authenticate immutable original native browser and offline test code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C diagnostics rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original-source rev-parse HEAD)" = "$SOURCE_SHA"
          grep -Fq 'addVirtualAuthenticator()' original-source/dom/webauthn/tests/test_webauthn_webdriver_virtual_authenticator.html
          grep -Fq 'security.webauth.webauthn_enable_usbtoken=false' original-source/dom/webauthn/tests/browser/browser.toml
          grep -Fq 'We disable the USB transport in tests that use virtual devices.' original-source/dom/webauthn/authrs_bridge/src/lib.rs
          grep -Fq 'self.usb_token_manager.lock().unwrap().register(' original-source/dom/webauthn/authrs_bridge/src/lib.rs
          grep -Fq 'if static_prefs::pref!("security.webauth.webauthn_enable_usbtoken")' original-source/dom/webauthn/authrs_bridge/src/lib.rs
          grep -Fq 'authenticatorAttachment:"cross-platform"' diagnostics/ci/m3-original-browser-webauthn-local-origin.rs
          grep -Fq 'usb-no-device' diagnostics/ci/m3-original-browser-webauthn-webdriver.sh
          bash -n diagnostics/ci/m3-original-browser-webauthn-webdriver.sh
          rustc --edition=2021 -O diagnostics/ci/m3-original-browser-webauthn-local-origin.rs \
            -o "$RUNNER_TEMP/m3-original-local-origin"
          rustc --edition=2021 -D warnings --test diagnostics/ci/m3-original-browser-on-demand-maps.rs \
            -o "$RUNNER_TEMP/m3-webauthn-map-tests"
          "$RUNNER_TEMP/m3-webauthn-map-tests"
          rustc --edition=2021 -D warnings -O diagnostics/ci/m3-original-browser-on-demand-maps.rs \
            -o "$RUNNER_TEMP/m3-webauthn-on-demand-maps"
          rustc --edition=2021 -D warnings --test diagnostics/ci/m3-original-udev-glibc-bindings.rs \
            -o "$RUNNER_TEMP/m3-original-udev-glibc-bindings-tests"
          "$RUNNER_TEMP/m3-original-udev-glibc-bindings-tests"
          rustc --edition=2021 -D warnings -O diagnostics/ci/m3-original-udev-glibc-bindings.rs \
            -o "$RUNNER_TEMP/m3-original-udev-glibc-observer"
          rustc --edition=2021 -D warnings --test diagnostics/ci/m3-original-browser-libudev-host-fingerprint.rs \
            -o "$RUNNER_TEMP/m3-original-browser-libudev-fingerprint-tests"
          "$RUNNER_TEMP/m3-original-browser-libudev-fingerprint-tests"
          rustc --edition=2021 -D warnings -O diagnostics/ci/m3-original-browser-libudev-host-fingerprint.rs \
            -o "$RUNNER_TEMP/m3-original-browser-libudev-fingerprint"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg src "$SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$src' >/dev/null
          mkdir -p "$RUNNER_TEMP/original-archive" "$RUNNER_TEMP/packaged" "$RUNNER_TEMP/reports"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/original-archive"
          (cd "$RUNNER_TEMP/original-archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/original-archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/original-archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/packaged"
          test -x "$RUNNER_TEMP/packaged/vulpra/vulpra"
          grep -Fxq 'Name=Vulpra' "$RUNNER_TEMP/packaged/vulpra/application.ini"
          # Independently verify original WebAuthn Rust source's 49-symbol
          # allowlist via a previous exact-success no-browser ABI test.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41358205206" |
            jq -e '.status=="completed" and .conclusion=="success" and
              .head_sha=="3243200db85c6d75e4847b1e2b34ec3ee92e7673" and
              .path==".github/workflows/m3-original-webauthn-libudev-host-abi.yml"' >/dev/null
          mkdir -p "$RUNNER_TEMP/udev-abi"
          gh run download 41358205206 --repo "$GITHUB_REPOSITORY" \
            --name m3-original-webauthn-libudev-two-host-abi --dir "$RUNNER_TEMP/udev-abi"
          jq -e --arg src "$SOURCE_SHA" '
            .schema_version==1 and
            .status=="pinned_webauthn_libudev_isolated_host_dynamic_abi" and
            .original_source_commit==$src and .isolated_host=="archlinux-container" and
            .source_declared_udev_soname=="libudev.so.1" and
            .source_declared_udev_symbol_count==49 and
            .host_resolved_udev_symbol_count==49 and
            (.source_declared_udev_symbols|unique|length)==49 and
            .original_browser_executed==false and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/udev-abi/m3-original-udev-arch.json" >/dev/null
      - name: Build disposable Arch userspace with WebDriver and original browser dependencies
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arch-webauthn"
          cat >"$RUNNER_TEMP/arch-webauthn/Dockerfile" <<'EOF'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed \
            bash coreutils curl jq grep findutils procps-ng util-linux \
            iproute2 geckodriver gtk3 dbus-glib alsa-lib nss weston wayland-utils \
            mesa libglvnd ttf-dejavu \
            && command -v geckodriver && command -v ip && command -v setpriv \
            && command -v weston && command -v wayland-info \
            && rm -rf /var/cache/pacman/pkg/*
          EOF
          docker build --pull --no-cache -t vulpra-m3-original-webauthn:ci "$RUNNER_TEMP/arch-webauthn"
      - name: Execute real original native browser USB token no-device registration under loopback
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # NETWORK NONE: no internet or bridge. Grant NET_ADMIN only to
          # transient root namespace setup so private loopback can be raised.
          # Drop it before executing geckodriver, original browser and test.
          docker run --rm --network none --read-only --shm-size 256m \
            --cap-drop ALL --cap-add NET_ADMIN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --pids-limit 512 --memory 4g \
            --tmpfs /tmp:rw,nosuid,nodev,size=600m,mode=1777 \
            -v "$RUNNER_TEMP/packaged/vulpra:/original:ro" \
            -v "$RUNNER_TEMP/m3-original-local-origin:/audit/local-origin:ro" \
            -v "$RUNNER_TEMP/m3-webauthn-on-demand-maps:/audit/on-demand-maps:ro" \
            -v "$RUNNER_TEMP/m3-original-udev-glibc-observer:/audit/glibc-observer:ro" \
            -v "$RUNNER_TEMP/m3-original-browser-libudev-fingerprint:/audit/host-libudev-fingerprint:ro" \
            -v "$GITHUB_WORKSPACE/diagnostics/ci/m3-original-browser-webauthn-webdriver.sh:/audit/webdriver.sh:ro" \
            -v "$RUNNER_TEMP/reports:/reports:rw" \
            -e CI_UID="$(id -u)" -e CI_GID="$(id -g)" \
            -e MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 \
            -e VULPRA_OFFLINE_CONTAINER_ONLY=1 \
            -e VULPRA_M3_ORIGINAL_WEBAUTHN_MODE=usb-no-device \
            -e VULPRA_M3_NO_USB_PASSTHROUGH=1 \
            -e VULPRA_M3_WEBAUTHN_MAP_PHASES=1 \
            -e VULPRA_M3_GLIBC_BINDINGS=1 \
            -e VULPRA_M3_LIBUDEV_HOST_FINGERPRINT=1 \
            vulpra-m3-original-webauthn:ci /bin/bash -c '
              set -euo pipefail
              ip link set lo up
              exec setpriv --reuid "$CI_UID" --regid "$CI_GID" \
                --clear-groups \
                /bin/bash /audit/webdriver.sh /original/vulpra /audit/local-origin \
                /reports/m3-original-browser-usb-nodevice-loader.json
            '
      - name: Accept bounded original USB backend no-device negative result without claiming hardware
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .status=="original_browser_usb_backend_no_device_negative_probe" and
            .original_source_commit==$src and .original_archive_sha256==$sha and
            .original_native_browser_executed==true and
            .real_browser_usbtoken_pref==true and
            .real_browser_softtoken_pref==false and
            .real_original_web_authn_create_called_from_user_click==true and
            .virtual_authenticator_registered==false and
            .physical_usb_device_passthrough==false and
            .credential_create_result=="NotAllowedError" and
            (.libudev_mapped_before_attempt|type)=="boolean" and
            .libudev_mapped_during_or_after_attempt==true and
            .actual_original_dlopen_call_stack_observed==false and
            .original_browser_libudev_runtime_dependency_proven==false and
            .physical_security_key_authentication_verified==false and
            .network_egress_allowed==false and
            .real_user_profile_or_browser_accessed==false and
            .whole_dynamic_loader_graph_proven==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/reports/m3-original-browser-usb-nodevice-loader.json" >/dev/null
          echo 'PASS: original browser USB no-device negative probe; actual libudev mapping flag recorded; no full closure'
      - name: Reconcile three original browser USB backend mapped-ELF phases and negative mutations
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/reports/m3-original-webauthn-usb-before-maps.json"
          during="$RUNNER_TEMP/reports/m3-original-webauthn-usb-during-maps.json"
          after="$RUNNER_TEMP/reports/m3-original-webauthn-usb-after-maps.json"
          feature="$RUNNER_TEMP/reports/m3-original-browser-usb-nodevice-loader.json"
          cross="$RUNNER_TEMP/reports/m3-original-webauthn-usb-maps-crosswalk.json"
          test -s "$before" && test -s "$during" && test -s "$after" && test -s "$feature"
          verify_map() {
            jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
              --slurpfile before "$1" --slurpfile during "$2" \
              --slurpfile after "$3" --slurpfile feature "$4" \
              -f diagnostics/ci/m3-original-webauthn-usb-maps-crosswalk.jq
          }
          verify_map "$before" "$during" "$after" "$feature" >"$cross"
          jq -e '
            .schema_version==1 and
            .status=="original_webauthn_usb_nodevice_three_phase_browser_mappings_verified" and
            .original_browser_usbtoken_pref_verified==true and
            .original_browser_softtoken_disabled==true and
            .physical_hardware_device_used==false and
            .real_user_clicked_create_ended_notallowed==true and
            .libudev_real_browser_mapped_during_attempt==true and
            (.before_browser_processes|type=="number" and .>=1) and
            (.while_udev_mapped_browser_processes|type=="number" and .>=1) and
            (.after_notallowed_browser_processes|type=="number" and .>=1) and
            (.during_udev_mapped_filenames|length)>=1 and
            .snapshots_not_transient_dlopen_log_or_abi_resolution==true and
            .full_physical_webauthn_or_feature_ffi_closure==false and
            .source_pruning_authorized==false and
            .native_bytes_saved==0 and
            .m3_sixth_gate_closed==false
          ' "$cross" >/dev/null
          # The validator must reject mutations of actual source-pinned
          # mapped-file records, not an unresolved SONAME alias.
          jq '.host_mapped_shared_library_basenames |=
                map(select(startswith("libudev.so.1") | not))' "$during" \
            >"$RUNNER_TEMP/reports/m3-usb-mutant.json"
          if verify_map "$before" "$RUNNER_TEMP/reports/m3-usb-mutant.json" \
            "$after" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: missing actual mapped libudev ELF accepted' >&2; exit 1
          fi
          jq '.original_archive_sha256="invalid-source-sha"' "$before" \
            >"$RUNNER_TEMP/reports/m3-usb-mutant.json"
          if verify_map "$RUNNER_TEMP/reports/m3-usb-mutant.json" "$during" \
            "$after" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: untrusted original source archive accepted' >&2; exit 1
          fi
          jq '.package_mapped_shared_library_basenames |= . + [.[0]]' "$during" \
            >"$RUNNER_TEMP/reports/m3-usb-mutant.json"
          if verify_map "$before" "$RUNNER_TEMP/reports/m3-usb-mutant.json" \
            "$after" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: duplicated package-mapped ELF accepted' >&2; exit 1
          fi
          jq '.libudev_mapped_in_original_browser |= not' "$before" \
            >"$RUNNER_TEMP/reports/m3-usb-mutant.json"
          if verify_map "$RUNNER_TEMP/reports/m3-usb-mutant.json" "$during" \
            "$after" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: inconsistent original pre-click libudev state accepted' >&2; exit 1
          fi
          echo 'PASS: three original WebAuthn USB-backend real mapped-ELF phases and four negative mutants'
      - name: Crosscheck real original browser glibc bindings against exact Rust WebAuthn symbols
        shell: bash
        run: |
          set -euo pipefail
          observation="$RUNNER_TEMP/reports/m3-original-udev-glibc-bindings.json"
          feature="$RUNNER_TEMP/reports/m3-original-browser-usb-nodevice-loader.json"
          abi="$RUNNER_TEMP/udev-abi/m3-original-udev-arch.json"
          out="$RUNNER_TEMP/reports/m3-original-udev-glibc-bindings-crosswalk.json"
          test -s "$observation" && test -s "$feature" && test -s "$abi"
          crosswalk() {
            jq -n --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" \
              --slurpfile glibc "$1" --slurpfile abi "$abi" \
              --slurpfile feature "$2" \
              -f diagnostics/ci/m3-original-udev-glibc-bindings-crosswalk.jq
          }
          crosswalk "$observation" "$feature" >"$out"
          jq -e '
            .schema_version==1 and
            .status=="original_browser_source_pinned_glibc_no_preload_udev_binding_reconciled" and
            .source_declared_udev_ffi_symbols==49 and
            .native_glibc_binding_event_count>=1 and
            .native_glibc_unique_udev_symbol_count==16 and
            .native_glibc_source_declared_web_authn_symbol_count==15 and
            .native_glibc_unattributed_external_symbol_names==["udev_monitor_filter_update"] and
            .extra_symbol_original_caller_ownership_proven==false and
            .native_glibc_unattributed_symbol_binding_events>=1 and
            (.native_glibc_unattributed_symbol_glibc_requester_basenames|length)>=1 and
            (.native_glibc_unattributed_symbol_provider_basenames|length)>=1 and
            .native_glibc_binding_file_requester_not_definitive_original_caller==true and
            (.native_glibc_resolved_udev_names|index("udev_new"))!=null and
            .original_libxul_loaded_pid_traces_with_udev_bindings>=1 and
            .no_ld_preload_or_ld_audit_used==true and
            .glibc_bindings_debug_changes_timing==true and
            .provider_resolved_in_actual_original_browser_trace==true and
            .glibc_dlsym_binding_requester_not_rust_caller==true and
            .original_browser_rust_to_ffi_uninstrumented_stack_proven==false and
            .full_49_original_browser_symbols_proven==false and
            .raw_private_logs_or_process_ids_exported==false and
            .source_pruning_authorized==false and
            .native_bytes_saved==0 and .m3_sixth_gate_closed==false
          ' "$out" >/dev/null
          # Four mutations of actual native evidence must be rejected.
          jq '.original_browser_resolved_udev_symbol_names |= . + ["udev_forged_symbol"] |
              .original_browser_unique_udev_symbol_count += 1' "$observation" \
            >"$RUNNER_TEMP/reports/m3-glibc-mutant.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-glibc-mutant.json" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: source-undeclared provider symbol accepted' >&2; exit 1
          fi
          jq '.original_browser_udev_provider_basenames=["libxul.so"]' "$observation" \
            >"$RUNNER_TEMP/reports/m3-glibc-mutant.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-glibc-mutant.json" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: invalid native symbol provider accepted' >&2; exit 1
          fi
          jq '.original_libxul_and_libudev_binding_same_trace_count=0' "$observation" \
            >"$RUNNER_TEMP/reports/m3-glibc-mutant.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-glibc-mutant.json" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: no common native browser trace accepted' >&2; exit 1
          fi
          jq '.original_archive_sha256="sha-drift"' "$observation" \
            >"$RUNNER_TEMP/reports/m3-glibc-mutant.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-glibc-mutant.json" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: wrong original archive accepted' >&2; exit 1
          fi
          jq '.unattributed_udev_monitor_filter_update_requester_basenames=[]' "$observation" \
            >"$RUNNER_TEMP/reports/m3-glibc-mutant.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-glibc-mutant.json" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: missing actual glibc binding requester accepted' >&2; exit 1
          fi
          jq '.unattributed_udev_monitor_filter_update_binding_events=0' "$observation" \
            >"$RUNNER_TEMP/reports/m3-glibc-mutant.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-glibc-mutant.json" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: no glibc unattributed symbol binding event accepted' >&2; exit 1
          fi
          jq '.unattributed_udev_monitor_filter_update_provider_basenames=["libxul.so"]' "$observation" \
            >"$RUNNER_TEMP/reports/m3-glibc-mutant.json"
          if crosswalk "$RUNNER_TEMP/reports/m3-glibc-mutant.json" "$feature" >/dev/null 2>&1; then
            echo 'FAIL: wrong native backing provider for extra symbol accepted' >&2; exit 1
          fi
          echo 'PASS: actual glibc provider and extra symbol requester distinguished; seven negative mutations rejected'
      - name: Reconcile live original-browser libudev hash against independently inspected Arch ELF
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41707399519" |
            jq -e '.status=="completed" and .conclusion=="success" and
              .head_sha=="5370275c2098cadde4c628ef82985a68829f3f46" and
              .path==".github/workflows/m3-original-libudev-host-self-reloc.yml"' >/dev/null
          mkdir -p "$RUNNER_TEMP/prior-arch-elf"
          gh run download 41707399519 --repo "$GITHUB_REPOSITORY" \
            --name m3-original-libudev-host-self-reloc-crosswalk --dir "$RUNNER_TEMP/prior-arch-elf"
          live="$RUNNER_TEMP/reports/m3-original-browser-libudev-host-fingerprint.json"
          maps="$RUNNER_TEMP/reports/m3-original-webauthn-usb-maps-crosswalk.json"
          glibc="$RUNNER_TEMP/reports/m3-original-udev-glibc-bindings-crosswalk.json"
          arch="$RUNNER_TEMP/prior-arch-elf/m3-original-host-libudev-self-reloc-crosswalk.json"
          result="$RUNNER_TEMP/reports/m3-original-browser-libudev-hash-crosswalk.json"
          test -s "$live" && test -s "$maps" && test -s "$glibc" && test -s "$arch"
          check() {
            jq -n --arg source "$SOURCE_SHA" --arg archive "$ARCHIVE_SHA" \
              --slurpfile live "$1" --slurpfile maps "$2" \
              --slurpfile glibc "$3" --slurpfile arch "$4" \
              -f diagnostics/ci/m3-original-browser-libudev-hash-crosswalk.jq
          }
          check "$live" "$maps" "$glibc" "$arch" > "$result"
          jq -e '.schema_version==1 and
            .status=="source_pinned_original_browser_host_libudev_elf_fingerprint_reconciled" and
            .mapped_file_device_and_inode_checked==true and
            (.separate_arch_host_elf_byte_identical_to_browser_host|type)=="boolean" and
            .byte_identity_proves_exact_instruction_or_rust_ffi_caller==false and
            .full_native_dependency_closure_proven==false and
            .source_pruning_authorized==false and .native_bytes_saved==0 and
            .m3_sixth_gate_closed==false' "$result" >/dev/null
          for change in \
            '.host_mapped_elf_sha256="bad-hash"' \
            '.mapped_elf_device_and_inode_verified=false' \
            '.original_source_commit="forged-source"' \
            '.host_mapped_elf_backing_name="libudev.so.1.7.10"'; do
            jq "$change" "$live" > "$RUNNER_TEMP/reports/fingerprint-mutant.json"
            if check "$RUNNER_TEMP/reports/fingerprint-mutant.json" "$maps" "$glibc" "$arch" >/dev/null 2>&1; then
              echo "FAIL: forged original browser host libudev fingerprint accepted" >&2; exit 1
            fi
          done
          echo "PASS: original browser mapped libudev SHA evidence and four corruptions rejected"
          jq -r '"M3_HOST_LIBUDEV_BYTE_IDENTICAL_TO_INDEPENDENT_ARCH_ELF=\(.separate_arch_host_elf_byte_identical_to_browser_host)"' "$result"
      - name: Upload only sanitized browser feature observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-browser-usb-nodevice-loader
          path: |
            ${{ runner.temp }}/reports/m3-original-browser-libudev-host-fingerprint.json
            ${{ runner.temp }}/reports/m3-original-browser-libudev-hash-crosswalk.json
            ${{ runner.temp }}/reports/m3-original-browser-usb-nodevice-loader.json
            ${{ runner.temp }}/reports/m3-original-webauthn-usb-before-maps.json
            ${{ runner.temp }}/reports/m3-original-webauthn-usb-during-maps.json
            ${{ runner.temp }}/reports/m3-original-webauthn-usb-after-maps.json
            ${{ runner.temp }}/reports/m3-original-webauthn-usb-maps-crosswalk.json
            ${{ runner.temp }}/reports/m3-original-udev-glibc-bindings.json
            ${{ runner.temp }}/reports/m3-original-udev-glibc-bindings-crosswalk.json
          if-no-files-found: error
          retention-days: 14
