# A behavioral browser regression check, not an exploit replay or security fix audit.
# Uses only existing Firefox 160 native package from pinned exact-source CI.
name: Firefox 160 Archived Blob URL Cross-Origin/Opaque-Origin WebDriver (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/security-160-blob-origin-isolation.yml
      - ci/security-160-blob-origin-isolation.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cross-origin-blob-url-access:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Authenticate completed exact-source native Firefox 160 run and artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo,id=43138458940;
            const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
            if(r.repository?.full_name!=='sguzman/vulpra' ||
               r.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               r.head_sha!=='0624235fdc956ab18af3c3f310b3588ca72fff61' ||
               r.name!=='Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate' ||
               r.status!=='completed' || r.conclusion!=='success')
              throw Error('Refusing wrong or unsuccessful original Firefox 160 native run');
            const all=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:id,per_page:100});
            for(const name of ['firefox160-vulpra-unreleased-native-preview-not-approved',
                               'firefox160-vulpra-materialized-source-proof']){
              if(!all.some(a=>a.name===name&&!a.expired&&a.size_in_bytes>0))
                throw Error('Missing or expired original native artifact '+name);
            }
            core.info('PASS: exact original source/build identity and archived artifact presence');
      - name: Checkout only bounded browser Blob URL regression harness and existing WebDriver helpers
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/security-160-blob-origin-isolation.py
            ci/smoke-webextension-package-local.py
      - name: Download existing unreleased Firefox 160 native package and checksum
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-unreleased-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-native-archive
      - name: Download complete original Firefox 160 source identity from same native CI
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43138458940
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firefox160-source-proof
      - name: Prove exact source/tree/archive identity and reject forged Blob URL outcomes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/security-160-blob-origin-isolation.py
          python3 ci/security-160-blob-origin-isolation.py --self-test
          source="$RUNNER_TEMP/firefox160-source-proof/materialized-candidate.json"
          package="$RUNNER_TEMP/firefox160-native-archive/vulpra-firefox160-native-ci.tar.xz"
          test -s "$source" && test -s "$package" && test -s "$package.sha256"
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$source" >/dev/null
          (cd "$(dirname "$package")" && sha256sum -c "$(basename "$package").sha256")
          dest="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$dest"
          cp "$package" "$dest/vulpra-local-firefox160-blob-origin-ci.tar.xz"
          (cd "$dest" && sha256sum vulpra-local-firefox160-blob-origin-ci.tar.xz > vulpra-local-firefox160-blob-origin-ci.tar.xz.sha256)
          echo 'PASS: exact native Firefox 160 binary, SHA-256, source and origin-contract negatives'
      - name: Install Firefox shared libraries and checksum-pinned geckodriver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends curl jq python3 libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          file="$RUNNER_TEMP/geckodriver-v0.37.1-linux64.tar.gz"
          curl -fLsS --retry 3 --max-time 90 -o "$file" \
            'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz'
          printf '%s  %s\n' 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e' "$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/geckodriver-bin"
          tar -xzf "$file" -C "$RUNNER_TEMP/geckodriver-bin" geckodriver
          echo "$RUNNER_TEMP/geckodriver-bin" >> "$GITHUB_PATH"
      - name: Test real same-origin Blob URL fetch versus cross-origin and sandboxed opaque-origin denial
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 ci/security-160-blob-origin-isolation.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/firefox160-blob-origin-isolation.json" \
            2>&1 | tee "$RUNNER_TEMP/firefox160-blob-origin-isolation.log"
          package="$RUNNER_TEMP/firefox160-native-archive/vulpra-firefox160-native-ci.tar.xz"
          digest="$(sha256sum "$package" | cut -d' ' -f1)"
          jq -e --arg sha "$digest" '
            .schema_version==1 and
            .kind=="firefox160_bounded_blob_url_origin_isolation_runtime_smoke" and
            .status=="pass" and
            .package_sha256==$sha and
            .real_native_firefox160_webdriver==true and
            .two_distinct_loopback_http_origins==true and
            .same_origin_blob_fetch_allowed==true and
            .cross_origin_blob_fetch_denied==true and
            .sandboxed_opaque_blob_null_creator_tested==true and
            .sandboxed_opaque_blob_null_foreign_fetch_denied==true and
            .original_firefox_profile_preserved==true and
            .accept_insecure_certs_disabled==true and
            ([.modes[].mode]|sort)==["cross-origin","opaque-origin"] and
            all(.modes[]; .creator_can_fetch_own_blob==true and
                .cross_origin_parent_cannot_fetch_blob==true) and
            .cve2026_124852_fix_commit_provenance_verified==false and
            .cve2026_124852_exploit_regression_executed==false and
            .cve2026_124855_complete_fix_verified==false and
            .all_blob_principal_security_semantics_verified==false and
            .security_current==false and .release_ready==false
          ' "$RUNNER_TEMP/firefox160-blob-origin-isolation.json" >/dev/null
          jq --arg tree '42dd7439a27dde92f89ac5eed13f88117a4d7ab5' '
            . + {original_native_run_id:43138458940,
                 original_candidate_git_tree:$tree,
                 original_package_reused_without_browser_rebuild:true}
          ' "$RUNNER_TEMP/firefox160-blob-origin-isolation.json" \
            > "$RUNNER_TEMP/firefox160-blob-origin-proof.json"
          echo 'PASS: two standard Blob URL origin isolation negative checks on Firefox 160'
          echo 'LIMIT: no protected CVE fix source provenance or exploit regression established'
      - name: Archive source-bound real browser Blob URL behavior proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-bounded-blob-origin-isolation-runtime-proof
          path: ${{ runner.temp }}/firefox160-blob-origin-proof.json
          retention-days: 30
          if-no-files-found: error
      - name: Preserve bounded failure log without existing Firefox profile content
        if: failure()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/firefox160-blob-origin-isolation.log"; then
            tail -n 200 "$RUNNER_TEMP/firefox160-blob-origin-isolation.log" > "$RUNNER_TEMP/blob-origin-failure-tail.log"
          fi
      - name: Archive bounded test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-bounded-blob-origin-isolation-failure
          path: ${{ runner.temp }}/blob-origin-failure-tail.log
          retention-days: 14
          if-no-files-found: ignore
