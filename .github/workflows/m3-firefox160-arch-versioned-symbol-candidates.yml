# Reuse original signed-off source/byte-identical native Firefox160 package and
# the bounded historical versioned .dynsym candidate inspector inside Arch
# Linux userspace. Metadata only: not actual browser ELF load/relocation.
name: M3 Firefox 160 Arch Userland Versioned Symbol Candidates (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/m3-firefox160-arch-versioned-symbol-candidates.yml
      - ci/m3-native-elf-symbol-provider-candidates.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  arch-native-versioned-imports:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Authenticate exact original native Firefox160 producer and preserved version contracts
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            for(const [id,sha,name] of [
              [43138458940,'0624235fdc956ab18af3c3f310b3588ca72fff61',
                'Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate'],
              [43724886827,'54728803f058c3edf54d2e8d3f6e0a7d2af0aec6',
                'Firefox 160 Verified Native Archive Preservation (No Build)'],
              [43730900702,'fd4dee8a9999c303ff35e45fbcd619abe230d30e',
                'M3 Firefox 160 Exact-Source Native ELF Package Graph (No Build)'],
              [43733061688,'1408af56f4435db8c730be94b67cbc44a110c772',
                'M3 Firefox 160 Arch Userland GNU Version-Name Contract (No Build)']]){
              const {data:run}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
              if(run.repository?.full_name!=='sguzman/vulpra' ||
                 run.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
                 run.head_sha!==sha || run.name!==name ||
                 run.status!=='completed' || run.conclusion!=='success')
                throw Error('Source-pinned native Firefox160 ABI provenance failed '+id);
            }
            for(const [id,name] of [
              [43724886827,'firefox160-vulpra-preserved-native-preview-not-approved'],
              [43724886827,'firefox160-vulpra-preserved-materialized-source-proof'],
              [43730900702,'firefox160-source-matched-native-elf-package-graph-not-m3-closure'],
              [43733061688,'firefox160-arch-native-verneed-names-not-target-m3-approval']]){
              const a=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                {owner,repo,run_id:id,per_page:100});
              if(a.filter(x=>x.name===name&&!x.expired&&x.size_in_bytes>0 &&
                new Date(x.expires_at)>new Date()).length!==1)
                throw Error('Required exact original ABI evidence missing '+name);
            }
      - name: Checkout only existing source-pinned version-name and versioned-symbol scanners
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-native-elf-version-contract.py
            ci/m3-native-elf-symbol-provider-candidates.py
      - name: Verify source and reject malformed symbol/version-index fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object ci/m3-native-elf-version-contract.py)" = "4239b4851966fdb796e02f38fcd0f9db161293e2"
          test "$(git hash-object ci/m3-native-elf-symbol-provider-candidates.py)" = "8af90376a8ea598b0e17e728ae00b18977774c93"
          python3 -m py_compile ci/m3-native-elf-version-contract.py ci/m3-native-elf-symbol-provider-candidates.py
          python3 ci/m3-native-elf-version-contract.py --self-test
          python3 ci/m3-native-elf-symbol-provider-candidates.py --self-test
      - name: Retrieve original checksum-pinned Firefox160 native archive
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native
      - name: Retrieve original exact Firefox160 materialized-source tree identity
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source
      - name: Retrieve independent exact Firefox160 28-ELF package graph
        uses: actions/download-artifact@v4
        with:
          name: firefox160-source-matched-native-elf-package-graph-not-m3-closure
          repository: sguzman/vulpra
          run-id: 43730900702
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/graph
      - name: Retrieve original Arch userspace 521 GNU-version name proof
        uses: actions/download-artifact@v4
        with:
          name: firefox160-arch-native-verneed-names-not-target-m3-approval
          repository: sguzman/vulpra
          run-id: 43733061688
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/versions
      - name: Check original Firefox160 package bytes, complete source and required names
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and
            .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$RUNNER_TEMP/source/materialized-candidate.json" >/dev/null
          (cd "$RUNNER_TEMP/native" && sha256sum -c vulpra-firefox160-native-ci.tar.xz.sha256)
          digest="$(sha256sum "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz" | cut -d' ' -f1)"
          jq -e --arg digest "$digest" '
            .schema_version==1 and .archive_sha256==$digest and
            .firefox160_upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .firefox160_candidate_git_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .native_browser_producer_run==43138458940 and
            (.elf_members|length)==28 and .direct_needed_edges==268 and
            .all_native_binary_execution_avoided==true and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/graph/firefox160-source-matched-native-elf-graph.json" >/dev/null
          jq -e --arg digest "$digest" '
            .schema_version==1 and
            .source_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .original_archive_sha256==$digest and
            .scanned_userspace_id=="arch" and
            .scanned_userspace_version==null and
            .native_elf_declared_version_requirements==521 and
            .candidate_version_name_present_count==521 and
            .candidate_version_name_absent_count==0 and
            .candidate_version_name_unavailable_count==0 and
            .target_host_kernel_verified==false and
            .actual_symbol_resolution_proven==false and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/versions/firefox160-arch-native-verneed.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/results"
      - name: Build disposable Arch x86-64 GNU symbol-name provider metadata userspace
        shell: bash
        run: |
          set -euo pipefail
          docker pull archlinux:base
          docker image inspect --format '{{index .RepoDigests 0}}' archlinux:base \
            > "$RUNNER_TEMP/results/arch-base-image-digest.txt"
          cat > "$RUNNER_TEMP/Dockerfile.vulpra-arch-symbols" <<'DOCKER'
          FROM archlinux:base
          RUN pacman -Syu --noconfirm --needed \
              python binutils jq gtk3 dbus-glib alsa-lib nss mesa libglvnd \
              libx11 libxcomposite libxdamage libxfixes libxrandr libxt libxcb \
              fontconfig ttf-dejavu ca-certificates
          DOCKER
          docker build -f "$RUNNER_TEMP/Dockerfile.vulpra-arch-symbols" \
            -t vulpra-firefox160-arch-symbols:ci "$RUNNER_TEMP"
      - name: Scan real Firefox160 28 ELF indexed symbol names against Arch userspace providers
        shell: bash
        timeout-minutes: 10
        run: |
          # shellcheck disable=SC2086 # Intentional verified fixture formatting; no effect on runtime assertions
          set -euo pipefail
          digest="$(sha256sum "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz" | cut -d' ' -f1)"
          docker run --rm --network none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 4g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777,size=768m \
            -v "$RUNNER_TEMP/native:/native:ro" \
            -v "$GITHUB_WORKSPACE/ci:/scanners:ro" \
            -v "$RUNNER_TEMP/results:/results:rw" \
            --entrypoint /bin/sh vulpra-firefox160-arch-symbols:ci -c '
              set -eu
              grep -Fxq "ID=arch" /etc/os-release
              test -x /sbin/ldconfig
              python /scanners/m3-native-elf-version-contract.py --self-test
              python /scanners/m3-native-elf-symbol-provider-candidates.py --self-test
              python /scanners/m3-native-elf-symbol-provider-candidates.py \
                --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b \
                --archive-sha256 "'$digest'" \
                --archive /native/vulpra-firefox160-native-ci.tar.xz \
                --output /results/firefox160-arch-versioned-symbol-candidates.json
              python /scanners/m3-native-elf-symbol-provider-candidates.py \
                --mode unversioned \
                --source-commit 2887d9de1f69c0e9776413da80e7ba0d1225dd9b \
                --archive-sha256 "'$digest'" \
                --archive /native/vulpra-firefox160-native-ci.tar.xz \
                --output /results/firefox160-arch-unversioned-symbol-candidates.json
            '
          jq -e --arg digest "$digest" '
            .schema_version==1 and
            .original_native_source_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .original_archive_sha256==$digest and
            .scanned_userspace_id=="arch" and
            .scanned_userspace_version==null and
            .target_host_kernel_verified==false and
            .original_native_elf_members==28 and
            .versioned_undefined_dynamic_symbol_imports==4592 and
            .versioned_undefined_dynamic_symbol_imports==(.versioned_import_candidate_details|length) and
            .versioned_undefined_dynamic_symbol_imports==
              (.declared_provider_candidate_export_name_matches+
               .modern_glibc_libc_consolidation_name_candidates+
               .provider_candidate_unavailable+
               .versioned_symbol_candidate_name_not_found) and
            .provider_candidate_unavailable==0 and
            .versioned_symbol_candidate_name_not_found==0 and
            .unversioned_imports_examined==false and
            .actual_elf_symbol_bindings_resolved==false and
            .host_ldconfig_candidate_is_runtime_selected_proven==false and
            .target_arch_hyprland_symbol_abi_proven==false and
            .browser_or_host_elf_executed==false and
            .new_source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/results/firefox160-arch-versioned-symbol-candidates.json" >/dev/null
          jq -e --arg digest "$digest" '
            .schema_version==1 and
            .original_native_source_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .original_archive_sha256==$digest and
            .scanned_userspace_id=="arch" and
            .scanned_userspace_version==null and
            .original_native_elf_members==28 and
            (.unversioned_undefined_dynamic_symbol_imports>0) and
            .unversioned_undefined_dynamic_symbol_imports==(.unversioned_import_candidate_details|length) and
            .unversioned_undefined_dynamic_symbol_imports==
              (.direct_needed_export_name_candidates+
               .weak_imports_without_direct_candidate+
               .strong_imports_without_direct_candidate) and
            .unversioned_imports_examined==true and
            .all_unversioned_imports_loader_resolved==false and
            .actual_elf_symbol_bindings_resolved==false and
            .transitive_preload_and_dynamic_scope_complete==false and
            .runtime_dlopen_or_feature_coverage_complete==false and
            .target_arch_hyprland_symbol_abi_proven==false and
            .browser_or_host_elf_executed==false and
            .new_source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/results/firefox160-arch-unversioned-symbol-candidates.json" >/dev/null
          echo 'PASS: source-authenticated Firefox160 indexed versioned symbol candidate export names available in isolated Arch userspace.' >> "$GITHUB_STEP_SUMMARY"
          echo 'LIMIT: native Arch userspace only; Ubuntu host kernel, no target Arch hardware, dynamic loader/FFI or live symbol bindings.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Arch candidate-name outcomes and immutable image provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-arch-versioned-symbol-candidates-not-target-abi-release
          path: |
            ${{ runner.temp }}/results/firefox160-arch-versioned-symbol-candidates.json
            ${{ runner.temp }}/results/firefox160-arch-unversioned-symbol-candidates.json
            ${{ runner.temp }}/results/arch-base-image-digest.txt
          if-no-files-found: warn
          retention-days: 30
