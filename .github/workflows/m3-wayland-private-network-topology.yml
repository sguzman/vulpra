# Compare three disconnected network-interface topologies using one
# authenticated original full-normal native browser and private Weston.
name: M3 Native Wayland Isolated Interface Topology
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-wayland-private-network-topology.yml
      - ci/m3-wayland-private-topology.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  disconnected-interface-matrix:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA256: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout topology and original Wayland harness
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
            packaging
      - name: Authenticate native package and exercise shell syntax contracts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n ci/m3-wayland-private-topology.sh
          bash -n packaging/test-wayland.sh
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" \
              '.status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/archived" "$RUNNER_TEMP/extracted"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archived"
          (cd "$RUNNER_TEMP/archived" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archived/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA256"
          tar -xf "$RUNNER_TEMP/archived/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/extracted"
          test -x "$RUNNER_TEMP/extracted/vulpra/vulpra"
      - name: Install disconnected namespace and Wayland tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 util-linux weston wayland-utils \
            libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
      - name: Run three ten-second private Weston probes with no outside routes
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/extracted/vulpra"
          harness="$GITHUB_WORKSPACE/packaging/test-wayland.sh"
          user="$(id -un)"
          # The caller owns private log redirection; sudo only creates
          # disposable network namespaces. Never upload raw browser logs.
          isolated_launch() {
            sudo unshare --net -- bash ci/m3-wayland-private-topology.sh "$@"
          }
          probe() {
            local topology="$1"
            local status=0
            if isolated_launch "$topology" "$user" "$harness" "$app" \
              >"$RUNNER_TEMP/$topology-private.log" 2>&1; then
              echo "DIAGNOSTIC $topology: full native Weston 10-second PASS"
            else
              status="$?"
              echo "DIAGNOSTIC $topology: full native Weston 10-second FAIL (harness $status)"
              if grep -Fq 'native exit status: 11' "$RUNNER_TEMP/$topology-private.log"; then
                echo "DIAGNOSTIC $topology: browser exit 11"
              fi
              if grep -Eiq 'Operation not permitted|unknown device|not supported' \
                "$RUNNER_TEMP/$topology-private.log"; then
                echo "DIAGNOSTIC $topology: topology unavailable, no causal inference"
              fi
            fi
          }
          probe lo_down
          probe lo_up
          probe dummy_up
          echo 'DIAGNOSTIC ONLY: network-interface states compared, no M3 gate credit'
