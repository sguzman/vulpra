# Source-pinned original ONNX native C API activation without a model.
# Rust helper dynamically loads original compiled library within no-egress netns.
name: M3 Original Native ONNX Runtime C ABI No-Egress Activation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-onnxruntime-abi.yml
      - ci/m3-onnxruntime-capi-probe.rs
      - ci/m3-onnxruntime-no-egress.sh
      - ci/m3-onnxruntime-version-checks.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-original-onnx-c-api-no-egress:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      ORIGINAL_RUN: '40997075527'
      STATIC_RUN: '41157293087'
      STATIC_HEAD: 184d5b33678152c1bd28b0c35cecc450e49c93f1
    steps:
      - name: Checkout minimal Rust dynamic-library C API probe
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Compile Rust C ABI probe and guard synthetic loader validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          command -v rustc
          bash -n ci/m3-onnxruntime-no-egress.sh
          python3 -m py_compile ci/m3-onnxruntime-version-checks.py
          python3 ci/m3-onnxruntime-version-checks.py --self-test
          rustc --edition=2021 -C opt-level=1 \
            ci/m3-onnxruntime-capi-probe.rs -o "$RUNNER_TEMP/onnx-original-probe"
          test -x "$RUNNER_TEMP/onnx-original-probe"
      - name: Install original native CPU ELF ABI runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends iproute2 libstdc++6 libgomp1 binutils
          command -v unshare
          command -v ip
      - name: Authenticate original native compiled package and static version report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_RUN" |
            jq -e --arg sha "$STATIC_HEAD" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha and .name=="M3 Source-Pinned Native ELF Version-Name Inventory"' >/dev/null
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/package" "$RUNNER_TEMP/static"
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/archive"
          gh run download "$STATIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-version-name-contract --dir "$RUNNER_TEMP/static"
          (cd "$RUNNER_TEMP/archive" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          tar -xf "$RUNNER_TEMP/archive/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/vulpra/libonnxruntime.so"
      - name: Run original binary library via Rust C ABI only in no-egress network namespace
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo unshare --net -- bash ci/m3-onnxruntime-no-egress.sh \
            "$RUNNER_TEMP/package/vulpra" "$RUNNER_TEMP/onnx-original-probe" \
            "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" \
            "$RUNNER_TEMP/m3-onnxruntime-native-capi-verification.json"
          jq -e --arg sha "$ARCHIVE_SHA" --arg src "$SOURCE_SHA" '
            .schema_version==1 and .original_native_compiled_source==$src and
            .original_native_archive_sha256==$sha and
            .real_onxx_native_dlopen_and_c_api_version_invoked==true and
            .original_onnxruntime_version_contracts==20 and
            .observed_original_onnxruntime_version_checks>0 and
            (.observed_original_onnxruntime_version_checks+
             .not_observed_original_onnxruntime_version_checks)==20 and
            .model_loaded_or_inference_performed==false and
            .browser_ml_feature_integrated_and_passed==false and
            .external_network_or_user_data_exposed==false and
            .raw_loader_paths_and_pids_retained==false and
            .safe_original_source_removal_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-onnxruntime-native-capi-verification.json" >/dev/null
          echo 'PASS: isolated original ONNX C API base and declared native ELF loader ABI checks'
      - name: Upload bounded sanitized original ONNX Runtime C API evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-onnxruntime-capi-no-egress
          path: ${{ runner.temp }}/m3-onnxruntime-native-capi-verification.json
          if-no-files-found: error
          retention-days: 14
