# Diagnose telemetry on an already-built Vulpra package. No compilation.
# Exact native compiled source is newer and pinned to b148240, not later main HEAD.
name: M3 Newer Normal Native Telemetry Local-Only Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-telemetry-newer-full-native.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vulpra-m3-telemetry-newer-full
  cancel-in-progress: false

jobs:
  replay-newer-full-normal-package:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Sparse checkout exact source of diagnostics (no native build)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci

      - name: Test local sink and reject unsupported runtime reports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/smoke-telemetry-loopback-package.py
          python3 ci/tests/m3-telemetry-loopback-harness-test.py

      - name: Enforce exact source continuity of six telemetry transport modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected={
            "toolkit/components/telemetry/app/TelemetryControllerParent.sys.mjs":
              "54727bf2024cedb83f39037aed930ac926cc584f",
            "toolkit/components/telemetry/app/TelemetrySend.sys.mjs":
              "2ebae13763c51cad5e8652e9ab4a66907197099f",
            "toolkit/components/telemetry/app/TelemetryReportingPolicy.sys.mjs":
              "6f0982dbae00342fdd38d537bf2dc18333184787",
            "toolkit/components/telemetry/app/TelemetryUtils.sys.mjs":
              "51525bc8f94da207c186ee743a5e23001e0bbd66",
            "toolkit/components/telemetry/app/TelemetryControllerBase.sys.mjs":
              "fdd0a947e908a5376c2883d544a67c24a81d3c4d",
            "toolkit/modules/ServiceRequest.sys.mjs":
              "74241892821532785a468ffc01ac68cb83e5ba04",
          }
          for path, pinned in expected.items():
              actual=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              assert actual==pinned,(path,actual,pinned)
          print("PASS: 6 protected telemetry/transport source blobs still match source-pinned newer full browser")
          print("LIMIT: checkout HEAD may differ from native compiled source; module hashes were verified")
          PY

      - name: Restore checksummed older normal Vulpra package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40997075527 --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/replay"
          (
            cd "$RUNNER_TEMP/replay"
            sha256sum -c full-normandy-baseline.tar.xz.sha256
            jq -e '.source_commit == "b1482404dfb8b01342990ee99ea3df0f9756b5f7" and .normandy_runner_present == true and .required_newtab_modules_present == true' \
              m3-full-normandy-baseline.json >/dev/null
          )
          pkg="$GITHUB_WORKSPACE/.git/vulpra-native-build/packages"
          mkdir -p "$pkg"
          cp "$RUNNER_TEMP/replay/full-normandy-baseline.tar.xz" \
            "$pkg/vulpra-local-telemetry-replay.tar.xz"
          sha256sum "$pkg/vulpra-local-telemetry-replay.tar.xz" \
            > "$pkg/vulpra-local-telemetry-replay.tar.xz.sha256"
          echo "PASS: historical normal Vulpra archive SHA-256 independently verified"

      - name: Install Firefox runtime requirements and geckodriver, not compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
            install -y --no-install-recommends libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          curl -fL --retry 3 -o "$RUNNER_TEMP/geckodriver.tar.gz" \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/geckodriver.tar.gz" -C "$RUNNER_TEMP" geckodriver
          chmod 0755 "$RUNNER_TEMP/geckodriver"

      - name: Observe natural sender initialization across default 60-second delay
        shell: bash
        timeout-minutes: 5
        env:
          MOZ_HEADLESS: "1"
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP:$PATH" python3 \
            ci/smoke-telemetry-loopback-package.py "$GITHUB_WORKSPACE" \
            --observe-natural-startup

      - name: Run isolated local telemetry runtime diagnostic
        shell: bash
        env:
          MOZ_HEADLESS: "1"
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP:$PATH" python3 \
            ci/smoke-telemetry-loopback-package.py "$GITHUB_WORKSPACE"

      - name: Attach diagnostic provenance even if runtime fails
        if: always()
        shell: bash
        run: |
          if test -f .git/vulpra-native-build/m3-telemetry-loopback.json; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(".git/vulpra-native-build/m3-telemetry-loopback.json")
          result=json.loads(p.read_text())
          result["diagnostic_script_commit"]=os.environ["GITHUB_SHA"]
          result["compiled_native_original_archive_sha256"]="7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a"
          result["native_package_origin_run_id"]=40997075527
          result["native_package_baseline_commit"]="b1482404dfb8b01342990ee99ea3df0f9756b5f7"
          result["six_critical_telemetry_source_blobs_matched_current_head"]=True
          result["source_matched_for_current_main"]=False
          result["newer_full_normal_exact_compiled_source_pinned"]=True
          result["original_newtab_full_normal_runtime_run_id"]=41004025705
          result["removal_authorized"]=False
          p.write_text(json.dumps(result,indent=2)+"\n")
          print("NATIVE TELEMETRY STATUS:",result["status"])
          print("LOCAL POST COUNTS BEFORE OPTOUT:",result.get("before_optout_requests"))
          print("LOCAL POST COUNTS AFTER OPTOUT:",result.get("after_optout_requests"))
          print("RECEIVER REJECTIONS:",result.get("receiver_rejections"))
          print("TEST INITIALIZATION:",{
              "naturally_initialized":result.get("runtime",{}).get("naturally_initialized"),
              "test_setup_used":result.get("runtime",{}).get("test_setup_used")})
          PY
          fi

      - name: Preserve local evidence without browser payloads, IDs or archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-telemetry-newer-native-diagnostic
          path: |
            .git/vulpra-native-build/m3-telemetry-loopback.json
            .git/vulpra-native-build/m3-telemetry-natural-startup.json
            .git/vulpra-native-build/packages/vulpra-local-telemetry-replay.tar.xz.sha256
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
