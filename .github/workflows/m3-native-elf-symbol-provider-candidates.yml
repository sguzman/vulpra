# Actual original compiled source ELF undefined symbol/version candidate coverage.
# No ldd, no native Vulpra execution, no source pruning or loader-closure claim.
name: M3 Source-Pinned Native Versioned Symbol Candidate Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-elf-symbol-provider-candidates.yml
      - ci/m3-native-elf-symbol-provider-candidates.py
      - ci/m3-native-elf-version-contract.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-original-elf-versioned-undefined-symbols:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
    steps:
      - name: Checkout source/ABI contracts only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: Reject corrupt GNU version index and source fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-native-elf-version-contract.py ci/m3-native-elf-symbol-provider-candidates.py
          python3 ci/m3-native-elf-version-contract.py --self-test
          python3 ci/m3-native-elf-symbol-provider-candidates.py --self-test
      - name: Install metadata-only Ubuntu x86-64 ELF provider candidates
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends binutils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
          command -v readelf
          test -x /sbin/ldconfig
      - name: Authenticate full-normal immutable compiled source and archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and
              .head_sha==$sha' >/dev/null
          mkdir -p "$RUNNER_TEMP/native"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/native"
          (cd "$RUNNER_TEMP/native" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
      - name: Verify individual original imported GNU symbol-version candidate names
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 ci/m3-native-elf-symbol-provider-candidates.py \
            --archive "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" \
            --output "$RUNNER_TEMP/m3-native-versioned-symbol-candidates.json"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .schema_version==1 and
            .original_native_source_commit==$src and
            .original_archive_sha256==$sha and
            .original_native_elf_members==28 and
            .versioned_undefined_dynamic_symbol_imports>0 and
            .versioned_undefined_dynamic_symbol_imports==
              (.versioned_import_candidate_details|length) and
            .versioned_undefined_dynamic_symbol_imports==
              (.declared_provider_candidate_export_name_matches+
               .modern_glibc_libc_consolidation_name_candidates+
               .provider_candidate_unavailable+
               .versioned_symbol_candidate_name_not_found) and
            .actual_elf_symbol_bindings_resolved==false and
            .unversioned_imports_examined==false and
            .host_ldconfig_candidate_is_runtime_selected_proven==false and
            .target_arch_hyprland_symbol_abi_proven==false and
            .new_source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/m3-native-versioned-symbol-candidates.json" >/dev/null
          echo 'PASS: source-pinned undefined symbol candidate matching only, no full ABI gate'
      - name: Upload bounded compiled-version symbol names and limitations only
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-versioned-symbol-candidates
          path: ${{ runner.temp }}/m3-native-versioned-symbol-candidates.json
          if-no-files-found: error
          retention-days: 14
