name: M3 Configure Isolated Normandy-Free Vulpra

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-m3-normandy.yml
      - ci/mozconfig-linux-normandy-experiment
      - browser/moz.configure
      - browser/components/BrowserComponents.manifest
      - toolkit/components/moz.build
      - toolkit/components/normandy/moz.build
      - toolkit/components/normandy/vulpra-shared.jar.mn
      - toolkit/components/nimbus/moz.build
      - toolkit/components/nimbus/NimbusBootstrap.sys.mjs
      - browser/components/DesktopActorRegistry.sys.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-normandy-configure:
    if: github.repository == 'sguzman/vulpra'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MOZCONFIG: ${{ github.workspace }}/ci/mozconfig-linux-normandy-experiment
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out pinned Vulpra source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Provide sccache needed by experimental mozconfig
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Bootstrap Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev git curl make
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Configure experimental native target in independent object directory
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'export VULPRA_EXPERIMENT_NO_NORMANDY=1' "$MOZCONFIG"
          grep -Fxq 'mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-vulpra-linux-normandy-experiment' "$MOZCONFIG"
          ./mach configure
          test -s obj-vulpra-linux-normandy-experiment/config.status

      - name: Verify optional feature off and protected features on
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("obj-vulpra-linux-normandy-experiment/config.statusd/substs")
          def value(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else None
          assert value("MOZ_BUILD_APP") == "browser", value("MOZ_BUILD_APP")
          assert value("MOZ_WIDGET_TOOLKIT") == "gtk", value("MOZ_WIDGET_TOOLKIT")
          assert value("MOZ_APP_BASENAME") == "Vulpra", value("MOZ_APP_BASENAME")
          assert value("MOZ_NORMANDY") in (None, False, 0), value("MOZ_NORMANDY")
          for key in ("MOZ_SANDBOX", "MOZ_SERVICES_SYNC", "MOZ_WAYLAND"):
              assert str(value(key)) in ("1", "True"), (key, value(key))
          assert value("MOZ_DEVTOOLS") == "all", value("MOZ_DEVTOOLS")
          print("PASS: Separate M3 native configure disabled Normandy while preserving GTK, sandbox, Sync, Wayland, DevTools, app identity")
          print("CONFIGURE ONLY: no alternate browser compiled, shipped, or runtime-tested.")
          PY

      - name: Validate lean source and Nimbus preservation invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def data(path):
              return Path(path).read_text()
          shared = data("toolkit/components/normandy/vulpra-shared.jar.mn")
          for name in ("ClientEnvironment.sys.mjs", "NormandyApi.sys.mjs",
                       "NormandyUtils.sys.mjs", "LegacyHeartbeat.schema.json"):
              assert name in shared, name
          for name in ("Normandy.sys.mjs", "RecipeRunner.sys.mjs",
                       "ShieldFrameParent.sys.mjs", "ShieldFrameChild.sys.mjs"):
              assert name not in shared, name
          assert 'JAR_MANIFESTS += ["jar.mn"]' in data("toolkit/components/normandy/moz.build")
          assert 'JAR_MANIFESTS += ["vulpra-shared.jar.mn"]' in data("toolkit/components/normandy/moz.build")
          assert 'DIRS += ["normandy"]' in data("toolkit/components/moz.build")
          assert 'MOZ_SRC_FILES += ["NimbusBootstrap.sys.mjs"]' in data("toolkit/components/nimbus/moz.build")
          manifest = data("browser/components/BrowserComponents.manifest")
          assert "NimbusBootstrap.sys.mjs NimbusBootstrap.init" in manifest
          actor = data("browser/components/DesktopActorRegistry.sys.mjs")
          assert "if (!AppConstants.MOZ_NORMANDY)" in actor
          assert "delete JSWINDOWACTORS.ShieldFrame;" in actor
          assert "await ExperimentAPI.init();" in data("toolkit/components/nimbus/NimbusBootstrap.sys.mjs")
          print("PASS: lean resources and preserved Nimbus startup have explicit source guards")
          print("CONFIGURE AND SOURCE ONLY: native package and runtime remain unverified")
          PY

      - name: Record runner resource diagnostics
        if: always()
        shell: bash
        run: |
          df -h .
          free -h
