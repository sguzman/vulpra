# Exact-original seven feature-only ELF native loader candidates; no app
# executions, no source pruning, no inference from absent graphical traces.
name: M3 Original Feature-Only ELF Native Loader Candidate Boundaries
on:
  push:
    branches: [main]
    paths:
      - ci/m3-original-feature-only-native-loader-candidates.jq
      - .github/workflows/m3-original-feature-only-native-loader-candidates.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-feature-only-candidates:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SRC: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
    steps:
      - name: Checkout read-only pinned feature boundary checker
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-original-feature-only-native-loader-candidates.jq
      - name: Authenticate original compiled 27-ELF census and distinct independent runtime reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          jq --version
          while read -r id sha path artifact; do
            test -n "$id" || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" |
              jq -e --arg sha "$sha" --arg path "$path" '
                .status=="completed" and .conclusion=="success" and
                .head_sha==$sha and .path==$path
              ' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=40" |
              jq -e --arg name "$artifact" '
                [.artifacts[]|select(.name==$name and
                  .expired==false and .size_in_bytes>0)]|length==1
              ' >/dev/null
          done <<'RUNS'
          41350581069 729d3583737f10b7eba1f5891f2f317cbc52c638 .github/workflows/m3-original-other-elf-loader-api-census.yml m3-original-non-libxul-loader-api-census
          41515803526 cda3fb08d1d55fd94f4063921b6d4cc9644b225c .github/workflows/m3-original-ubuntu-arch-per-elf-crosswalk.yml m3-original-per-elf-ubuntu-arch-source-loader-crosswalk
          41522017287 51372521dc2ae325d137813741e1235c3faaa60e .github/workflows/m3-original-21-dynamic-vs-per-elf-loader.yml m3-original-21-conditional-vs-per-elf-loader
          RUNS
      - name: Download only three bounded original compiled ELF evidence artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/census" "$RUNNER_TEMP/platform" "$RUNNER_TEMP/dynamic"
          gh run download 41350581069 --repo "$GITHUB_REPOSITORY" \
            --name m3-original-non-libxul-loader-api-census --dir "$RUNNER_TEMP/census"
          gh run download 41515803526 --repo "$GITHUB_REPOSITORY" \
            --name m3-original-per-elf-ubuntu-arch-source-loader-crosswalk --dir "$RUNNER_TEMP/platform"
          gh run download 41522017287 --repo "$GITHUB_REPOSITORY" \
            --name m3-original-21-conditional-vs-per-elf-loader --dir "$RUNNER_TEMP/dynamic"
          test -s "$RUNNER_TEMP/census/m3-original-non-libxul-loader-census.json"
          test -s "$RUNNER_TEMP/platform/original-28-per-elf-ubuntu-arch-crosswalk.json"
          test -s "$RUNNER_TEMP/dynamic/m3-original-21-dynamic-vs-per-elf-loader.json"
      - name: Reconcile seven feature-only compiled native loader candidates without making pruning claims
        shell: bash
        run: |
          set -euo pipefail
          census="$RUNNER_TEMP/census/m3-original-non-libxul-loader-census.json"
          platform="$RUNNER_TEMP/platform/original-28-per-elf-ubuntu-arch-crosswalk.json"
          dynamic="$RUNNER_TEMP/dynamic/m3-original-21-dynamic-vs-per-elf-loader.json"
          out="$RUNNER_TEMP/m3-original-feature-only-native-loader-candidates.json"
          audit() {
            jq -n --arg src "$SRC" --arg sha "$ARCHIVE" \
              --slurpfile census "$1" --slurpfile map "$2" --slurpfile dynamic "$3" \
              -f ci/m3-original-feature-only-native-loader-candidates.jq
          }
          audit "$census" "$platform" "$dynamic" >"$out"
          jq -e --arg sha "$ARCHIVE" --arg src "$SRC" '
            .schema_version==1 and
            .status=="original_feature_only_seven_elf_compiled_loader_candidate_boundaries" and
            .original_source_commit==$src and .original_archive_sha256==$sha and
            .original_feature_only_elf_count==7 and
            .feature_only_compiled_loader_importer_count==4 and
            .feature_only_with_named_direct_loader_branches==3 and
            .feature_only_named_direct_loader_branches==8 and
            .per_elf_source_and_ubuntu_arch_direct_needed_verified==true and
            .original_feature_specific_real_binding_witnesses==7 and
            .feature_only_elves_not_seen_in_this_graphical_dynamic_request_trace==7 and
            (.rows|length)==7 and
            ([.rows[].elf]|sort)==[
              "crashreporter","libclearkey.so","libmozinference.so","libonnxruntime.so",
              "pingsender","updater","vulpra-bin"] and
            all(.rows[];
              .selected_feature_workload_native_binding_observed==true and
              .observed_in_graphical_21_dynamic_request_trace==false and
              .direct_branch_runtime_execution_proven==false and
              .not_seen_in_graphical_trace_does_not_authorize_pruning==true) and
            .missing_from_one_graphical_trace_does_not_prove_dead_code==true and
            .no_selected_feature_native_dynamic_calls_executed_by_this_test==true and
            .other_indirect_dynamic_loads_not_enumerated==true and
            .all_future_optional_or_required_loader_routes_proven==false and
            .no_native_application_rebuilt_or_run_by_crosscheck==true and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$out" >/dev/null
          jq '.original_native_archive_sha256="ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"' "$census" \
            >"$RUNNER_TEMP/altered-census.json"
          if audit "$RUNNER_TEMP/altered-census.json" "$platform" "$dynamic" >/dev/null 2>&1; then
            echo 'FAIL: wrong exact original compiled ELF provenance accepted' >&2; exit 1
          fi
          jq '(.per_elf[]|select(.elf_basename=="libonnxruntime.so")|.named_direct_loader_api_branches)+=1' "$census" \
            >"$RUNNER_TEMP/altered-census.json"
          if audit "$RUNNER_TEMP/altered-census.json" "$platform" "$dynamic" >/dev/null 2>&1; then
            echo 'FAIL: mutated original ONNX loader direct branch accepted' >&2; exit 1
          fi
          jq '(.rows[]|select(.elf=="libonnxruntime.so")|.original_native_binding_observation)="headless_startup_only"' "$platform" \
            >"$RUNNER_TEMP/altered-platform.json"
          if audit "$census" "$RUNNER_TEMP/altered-platform.json" "$dynamic" >/dev/null 2>&1; then
            echo 'FAIL: forged original feature-only runtime binding classification accepted' >&2; exit 1
          fi
          echo 'PASS: seven original feature-only ELF native loader imports/direct branches classified, absence from graphical trace does not allow pruning'
      - name: Preserve bounded seven-row original compiled native loader candidate report
        uses: actions/upload-artifact@v4
        with:
          name: m3-original-seven-feature-only-loader-candidates
          path: ${{ runner.temp }}/m3-original-feature-only-native-loader-candidates.json
          if-no-files-found: error
          retention-days: 14
