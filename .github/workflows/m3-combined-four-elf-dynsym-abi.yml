# Same source and authenticated native archives; exported dynamic ABI only.
name: M3 Compiled Full Versus Four-Opt-In ELF Dynamic Export ABI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-combined-four-elf-dynsym-abi.yml
      - ci/m3-combined-four-elf-dynsym-abi.rs
      - ci/m3-libxul-exported-function-bodies.rs
      - ci/m3-libxul-unwind-fde-shift.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-matched-dynamic-exports:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ORIGINAL_FULL_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      COMBINED_LEAN_SHA: e7aa6273fc1078134c216408c7cc110886dc60ada90c062d7f2482fd3f288eec
      FULL_RUN: '40997075527'
      COMBINED_RUN: '41222758405'
    steps:
      - name: Checkout bounded Rust ABI observer
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-combined-four-elf-dynsym-abi.rs
            ci/m3-libxul-exported-function-bodies.rs
            ci/m3-libxul-unwind-fde-shift.rs
      - name: Compile and run Rust negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-combined-four-elf-dynsym-abi.rs -o "$RUNNER_TEMP/abi-test"
          "$RUNNER_TEMP/abi-test"
          rustc --edition=2021 -O ci/m3-combined-four-elf-dynsym-abi.rs -o "$RUNNER_TEMP/abi-observer"
          rustc --edition=2021 --test ci/m3-libxul-exported-function-bodies.rs -o "$RUNNER_TEMP/libxul-func-test"
          "$RUNNER_TEMP/libxul-func-test"
          rustc --edition=2021 -O ci/m3-libxul-exported-function-bodies.rs -o "$RUNNER_TEMP/libxul-func-observer"
          rustc --edition=2021 --test ci/m3-libxul-unwind-fde-shift.rs -o "$RUNNER_TEMP/unwind-fde-test"
          "$RUNNER_TEMP/unwind-fde-test"
          rustc --edition=2021 -O ci/m3-libxul-unwind-fde-shift.rs -o "$RUNNER_TEMP/unwind-fde-observer"
          command -v readelf
          command -v objcopy
          command -v cmp
      - name: Authenticate independently compiled original full and lean packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FULL_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '.conclusion=="success" and .head_sha==$sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMBINED_RUN" |
            jq -e --arg sha "e9e52a0ca36f54fab071784cea31d2a6a55789ad" '.conclusion=="success" and .head_sha==$sha and .path==".github/workflows/m3-original-four-optin-native-build.yml"' >/dev/null
          mkdir -p "$RUNNER_TEMP/packages/full" "$RUNNER_TEMP/packages/lean" "$RUNNER_TEMP/audit"
          gh run download "$FULL_RUN" --repo "$GITHUB_REPOSITORY" --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/packages/full"
          gh run download "$COMBINED_RUN" --repo "$GITHUB_REPOSITORY" --name m3-original-native-combined-four-optin-candidate --dir "$RUNNER_TEMP/packages/lean"
          (cd "$RUNNER_TEMP/packages/full" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          (cd "$RUNNER_TEMP/packages/lean" && sha256sum -c vulpra-four-lean.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/packages/full/full-normandy-baseline.tar.xz" | awk '{print $1}')" = "$ORIGINAL_FULL_SHA"
          test "$(sha256sum "$RUNNER_TEMP/packages/lean/vulpra-four-lean.tar.xz" | awk '{print $1}')" = "$COMBINED_LEAN_SHA"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$COMBINED_LEAN_SHA" '.original_source_commit==$src and .combined_native_archive_sha256==$sha and .all_four_generated_config_guards_verified==true and .source_pruning_authorized==false and .m3_sixth_gate_closed==false' "$RUNNER_TEMP/packages/lean/m3-original-four-native-size.json" >/dev/null
      - name: Compare read-only dynamic export symbol sets for all 28 ELF files
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages/full/extracted" "$RUNNER_TEMP/packages/lean/extracted"
          tar -xf "$RUNNER_TEMP/packages/full/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/packages/full/extracted"
          tar -xf "$RUNNER_TEMP/packages/lean/vulpra-four-lean.tar.xz" -C "$RUNNER_TEMP/packages/lean/extracted"
          "$RUNNER_TEMP/abi-observer" "$RUNNER_TEMP/packages/full/extracted" "$RUNNER_TEMP/packages/lean/extracted" "$RUNNER_TEMP/audit/compiled-full-versus-lean-exported-dynsym.json"
          jq -e '.status=="compiled_full_vs_four_optin_elf_dynamic_exports_compared" and .original_full_elf_count==28 and .combined_lean_elf_count==28 and .full_exported_symbol_occurrences>0 and .lean_exported_symbol_occurrences>0 and .full_undefined_import_symbol_occurrences>0 and .lean_undefined_import_symbol_occurrences>0 and .text_sections_compared==28 and (.text_sections_equal + .text_sections_different)==28 and (.differing_text_section_byte_metrics|length)==.text_sections_different and (.differing_text_section_alignment|length)==.text_sections_different and .only_text_section_bytes_examined==true and (.per_elf|length)==28 and .actual_compiled_elf_dynamics_examined==true and .all_rust_cpp_ffi_and_static_symbols_proven==false and .runtime_dlopen_closure_proven==false and .binary_size_reduction_proven==false and .source_removal_authorized==false and .m3_sixth_gate_closed==false' "$RUNNER_TEMP/audit/compiled-full-versus-lean-exported-dynsym.json" >/dev/null
          jq -c '{exports:[.full_exported_symbol_occurrences,.lean_exported_symbol_occurrences],parity:.exact_exported_dynamic_abi_parity,differences:.changed_export_records,undefined_imports:[.full_undefined_import_symbol_occurrences,.lean_undefined_import_symbol_occurrences],import_parity:.exact_undefined_dynamic_import_parity,import_differences:.differing_undefined_import_records,text_sections_equal:.text_sections_equal,text_sections_different:.text_sections_different}' "$RUNNER_TEMP/audit/compiled-full-versus-lean-exported-dynsym.json"
      - name: Compare compiled libxul named dynamic-exported function bytes by symbol address
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/libxul-func-observer" \
            "$RUNNER_TEMP/packages/full/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/packages/lean/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/audit/compiled-libxul-exported-function-bodies.json"
          jq -e '
            .schema_version==1 and
            .status=="pinned_original_libxul_named_dynsym_function_code_comparison" and
            .full_text_bytes==128073093 and
            .lean_text_bytes==128073125 and
            .shared_mappable_named_functions>0 and
            (.byte_identical_named_functions +
             .byte_different_equal_size_named_functions +
             .changed_size_named_functions)==.shared_mappable_named_functions and
            (.full_only_mappable_function_records +
             .shared_mappable_named_functions)==.full_mappable_function_records and
            (.lean_only_mappable_function_records +
             .shared_mappable_named_functions)==.lean_mappable_function_records and
            .scope_is_exported_dynsym_funcs_only==true and
            .all_internal_or_static_ffi_functions_verified==false and
            .runtime_dlopen_graph_verified==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/audit/compiled-libxul-exported-function-bodies.json" >/dev/null
          jq -c '{full_functions:.full_mappable_function_records,lean_functions:.lean_mappable_function_records,matched:.shared_mappable_named_functions,identical:.byte_identical_named_functions,changed:.byte_different_equal_size_named_functions,resized:.changed_size_named_functions}' "$RUNNER_TEMP/audit/compiled-libxul-exported-function-bodies.json"
      - name: Compare compiled libxul unwind FDE ranges with and without 32-byte shift
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/unwind-fde-observer" \
            "$RUNNER_TEMP/packages/full/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/packages/lean/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/audit/compiled-libxul-unwind-fde-shift.json"
          jq -e '
            .schema_version==1 and
            .status=="original_compiled_libxul_unwind_fde_shift_comparison" and
            .full_text_bytes==128073093 and
            .lean_text_bytes==128073125 and
            .full_fde_records>10 and .lean_fde_records>10 and
            .full_unique_in_text_fde_ranges>10 and
            .lean_unique_in_text_fde_ranges>10 and
            (.zero_shift_identical_code_ranges +
             .zero_shift_different_code_ranges)==.zero_shift_matching_fde_ranges and
            (.plus_32_shift_identical_code_ranges +
             .plus_32_shift_different_code_ranges)==.plus_32_shift_matching_fde_ranges and
            (.unwind_fde_both_alignments +
             .unwind_fde_zero_only +
             .unwind_fde_plus_32_only +
             .unwind_fde_neither_alignment)==.full_unique_in_text_fde_ranges and
            (.unwind_fde_both_alignments +
             .unwind_fde_zero_only)==.zero_shift_matching_fde_ranges and
            (.unwind_fde_both_alignments +
             .unwind_fde_plus_32_only)==.plus_32_shift_matching_fde_ranges and
            .unwind_fde_identical_under_either <=
              (.full_unique_in_text_fde_ranges - .unwind_fde_neither_alignment) and
            (.unwind_fde_eighth_bins|length)==8 and
            (.unwind_fde_layout_transition.unmatched_original_fde_offsets|length)==.unwind_fde_neither_alignment and
            (.unwind_fde_layout_transition.first_eighth_local_sixteenth_bins|length)==16 and
            .unwind_fde_layout_transition.code_offset_not_source_line_or_function_identity==true and
            .sum_of_fde_span_bytes_not_unique_code_coverage==true and
            .only_unwind_described_code_ranges_examined==true and
            .all_compiled_functions_or_rust_ffi_proven==false and
            .runtime_dlopen_closure_proven==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/audit/compiled-libxul-unwind-fde-shift.json" >/dev/null
          jq -c '{fde_ranges:[.full_unique_in_text_fde_ranges,.lean_unique_in_text_fde_ranges],zero_offset:[.zero_shift_matching_fde_ranges,.zero_shift_identical_code_ranges],plus_32:[.plus_32_shift_matching_fde_ranges,.plus_32_shift_identical_code_ranges],exclusive_alignment:[.unwind_fde_both_alignments,.unwind_fde_zero_only,.unwind_fde_plus_32_only,.unwind_fde_neither_alignment],identical_under_either:.unwind_fde_identical_under_either}' "$RUNNER_TEMP/audit/compiled-libxul-unwind-fde-shift.json"
      - name: Archive bounded comparison rather than compiled browser code
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m3-source-matched-28-elf-dynamic-export-abi
          path: |
            ${{ runner.temp }}/audit/compiled-full-versus-lean-exported-dynsym.json
            ${{ runner.temp }}/audit/compiled-libxul-exported-function-bodies.json
            ${{ runner.temp }}/audit/compiled-libxul-unwind-fde-shift.json
          if-no-files-found: error
          retention-days: 14
