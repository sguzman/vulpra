               $source.compiled_module_array_index_and_cid_source_layout_verified==true and
               $binary.compiled_module_id_452_is_about_redirector==true and
               $binary.binary_module_452_full_about_redirector_cid.compiled_cid_bytes_exact_match==true and
               $binary.binary_module_452_lean_about_redirector_cid.compiled_cid_bytes_exact_match==true and
               $literal.full_aboutstudies_contract_present==true and
               $literal.four_optin_lean_aboutstudies_contract_present==false and
               $literal.retained_welcomeback_contract_present_in_both==true and
               $literal.retained_profilemanager_contract_present_in_both==true and
               $source.source_removal_authorized==false and
