          jq -c '{hash_modulus_pairs:[.ranges[]|[.full_remainder_divisor,.lean_remainder_divisor]],instructions:[.ranges[]|[.full_instructions,.lean_instructions]]}' \
            "$RUNNER_TEMP/audit/compiled-libxul-hinge-assembly.json"
      - name: Reconcile pinned source about studies contract delta with actual compiled native hash table
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile s "$RUNNER_TEMP/audit/original-xpcom-aboutstudies-contract-source.json" \
            --slurpfile b "$RUNNER_TEMP/audit/compiled-libxul-hinge-assembly.json" \
