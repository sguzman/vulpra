              source_full_about_contracts:$source.normal_about_contracts,
              source_lean_about_contracts:$source.four_optin_lean_about_contracts,
              compiled_full_anonymous_module_id_frequency:$binary.full_occurrences_of_changed_field_value,
              compiled_lean_anonymous_module_id_frequency:$binary.lean_occurrences_of_changed_field_value,
              omitted_lean_about_contract:$source.excluded_lean_contract,
              raw_module_index_proven_from_unstripped_symbols:false,
              compiled_module_index_452_cid_directly_verified:true,
              actual_compiled_contract_literal_and_two_retained_controls_verified:true,
              actual_full_contract_registry_execution_verified:false,
