          jq -e '.schema_version==1 and .status=="pinned_original_xpcom_aboutstudies_contract_source_matches_native_36_to_35_delta" and .source_full_about_contracts==36 and .source_lean_about_contracts==35 and .compiled_full_anonymous_module_id_frequency==36 and .compiled_lean_anonymous_module_id_frequency==35 and .raw_module_index_proven_from_unstripped_symbols==false and .compiled_module_index_452_cid_directly_verified==true and .actual_compiled_contract_literal_and_two_retained_controls_verified==true and .actual_full_contract_registry_execution_verified==false and .source_pruning_authorized==false and .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/audit/pinned-source-to-native-xpcom-contract-crosswalk.json" >/dev/null
          jq -c '{source:[.source_full_about_contracts,.source_lean_about_contracts],native:[.compiled_full_anonymous_module_id_frequency,.compiled_lean_anonymous_module_id_frequency],omitted:.omitted_lean_about_contract}' \
