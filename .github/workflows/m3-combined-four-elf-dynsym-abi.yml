# Same source and authenticated native archives; exported dynamic ABI only.
name: M3 Compiled Full Versus Four-Opt-In ELF Dynamic Export ABI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-combined-four-elf-dynsym-abi.yml
      - ci/m3-combined-four-elf-dynsym-abi.rs
      - ci/m3-libxul-exported-function-bodies.rs
      - ci/m3-libxul-unwind-fde-shift.rs
      - ci/m3-libxul-hinge-assembly.rs
      - ci/m3-xpcom-contract-source-witness.rs
      - ci/m3-original-native-relocation-shape.rs
      - ci/m3-libxul-packed-relr.rs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-matched-dynamic-exports:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ORIGINAL_FULL_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      COMBINED_LEAN_SHA: e7aa6273fc1078134c216408c7cc110886dc60ada90c062d7f2482fd3f288eec
      FULL_RUN: '40997075527'
      COMBINED_RUN: '41222758405'
    steps:
      - name: Checkout bounded Rust ABI observer
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-combined-four-elf-dynsym-abi.rs
            ci/m3-libxul-exported-function-bodies.rs
            ci/m3-libxul-unwind-fde-shift.rs
            ci/m3-libxul-hinge-assembly.rs
            ci/m3-xpcom-contract-source-witness.rs
            ci/m3-original-native-relocation-shape.rs
            ci/m3-libxul-packed-relr.rs
            ci/mozconfig-linux-m3-baseline
            ci/mozconfig-linux-m3-combined-lean
      - name: Checkout exact pinned original Mozilla XPCOM contract source only
        uses: actions/checkout@v4
        with:
          ref: b1482404dfb8b01342990ee99ea3df0f9756b5f7
          path: original-contract-source
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            browser/components/about/components.conf
            browser/components/about/AboutRedirector.cpp
            browser/moz.configure
            toolkit/moz.configure
            xpcom/components/gen_static_components.py
            xpcom/components/StaticComponents.cpp.in
            xpcom/components/StaticComponents.h
            xpcom/ds/PerfectHash.h
      - name: Compile and run Rust negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc --edition=2021 --test ci/m3-combined-four-elf-dynsym-abi.rs -o "$RUNNER_TEMP/abi-test"
          "$RUNNER_TEMP/abi-test"
          rustc --edition=2021 -O ci/m3-combined-four-elf-dynsym-abi.rs -o "$RUNNER_TEMP/abi-observer"
          rustc --edition=2021 --test ci/m3-libxul-exported-function-bodies.rs -o "$RUNNER_TEMP/libxul-func-test"
          "$RUNNER_TEMP/libxul-func-test"
          rustc --edition=2021 -O ci/m3-libxul-exported-function-bodies.rs -o "$RUNNER_TEMP/libxul-func-observer"
          rustc --edition=2021 --test ci/m3-libxul-unwind-fde-shift.rs -o "$RUNNER_TEMP/unwind-fde-test"
          "$RUNNER_TEMP/unwind-fde-test"
          rustc --edition=2021 -O ci/m3-libxul-unwind-fde-shift.rs -o "$RUNNER_TEMP/unwind-fde-observer"
          command -v readelf
          rustc --edition=2021 --test ci/m3-libxul-hinge-assembly.rs -o "$RUNNER_TEMP/hinge-assembly-test"
          "$RUNNER_TEMP/hinge-assembly-test"
          rustc --edition=2021 -O ci/m3-libxul-hinge-assembly.rs -o "$RUNNER_TEMP/hinge-assembly-observer"
          rustc --edition=2021 --test ci/m3-xpcom-contract-source-witness.rs -o "$RUNNER_TEMP/xpcom-contract-source-test"
          "$RUNNER_TEMP/xpcom-contract-source-test"
          rustc --edition=2021 -O ci/m3-xpcom-contract-source-witness.rs -o "$RUNNER_TEMP/xpcom-contract-source-observer"
          rustc --edition=2021 --test ci/m3-original-native-relocation-shape.rs -o "$RUNNER_TEMP/relocation-audit-test"
          "$RUNNER_TEMP/relocation-audit-test"
          rustc --edition=2021 -O ci/m3-original-native-relocation-shape.rs -o "$RUNNER_TEMP/relocation-audit"
          rustc --edition=2021 --test ci/m3-libxul-packed-relr.rs -o "$RUNNER_TEMP/packed-relr-test"
          "$RUNNER_TEMP/packed-relr-test"
          rustc --edition=2021 -O ci/m3-libxul-packed-relr.rs -o "$RUNNER_TEMP/packed-relr-audit"
          command -v objdump
          command -v objcopy
          command -v cmp
      - name: Prove 36 full versus 35 lean original about:studies XPCOM contract source guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-contract-source rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/xpcom-contract-source-observer" \
            "$GITHUB_WORKSPACE/original-contract-source" \
            "$GITHUB_WORKSPACE/ci/mozconfig-linux-m3-baseline" \
            "$GITHUB_WORKSPACE/ci/mozconfig-linux-m3-combined-lean" \
            "$RUNNER_TEMP/audit/original-xpcom-aboutstudies-contract-source.json"
          jq -e '
            .schema_version==1 and
            .status=="pinned_original_normandy_aboutstudies_contract_source_guard" and
            .unconditional_about_pages==31 and
            .selectable_profile_pages==4 and
            .full_normandy_only_pages==1 and
            .normal_about_contracts==36 and
            .four_optin_lean_about_contracts==35 and
            .about_contract_delta==1 and
            .excluded_lean_contract=="@mozilla.org/network/protocol/about;1?what=studies" and
            .about_redirector_constructor_preserved==true and
            .source_cpp_route_guarded_by_normandy==true and
            .xpcom_perfecthash_contract_entries_verified==true and
            .xpcom_contract_entries_store_module_ids==true and
            .compiled_module_array_index_and_cid_source_layout_verified==true and
            .compiled_raw_module_id_452_independently_named==false and
            .actual_compiled_binary_verified_by_this_source_guard==false and
            .unrelated_static_module_dependencies_verified==false and
            .source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/audit/original-xpcom-aboutstudies-contract-source.json" >/dev/null
      - name: Authenticate independently compiled original full and lean packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FULL_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '.conclusion=="success" and .head_sha==$sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMBINED_RUN" |
            jq -e --arg sha "e9e52a0ca36f54fab071784cea31d2a6a55789ad" '.conclusion=="success" and .head_sha==$sha and .path==".github/workflows/m3-original-four-optin-native-build.yml"' >/dev/null
          mkdir -p "$RUNNER_TEMP/packages/full" "$RUNNER_TEMP/packages/lean" "$RUNNER_TEMP/audit"
          gh run download "$FULL_RUN" --repo "$GITHUB_REPOSITORY" --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/packages/full"
          gh run download "$COMBINED_RUN" --repo "$GITHUB_REPOSITORY" --name m3-original-native-combined-four-optin-candidate --dir "$RUNNER_TEMP/packages/lean"
          (cd "$RUNNER_TEMP/packages/full" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          (cd "$RUNNER_TEMP/packages/lean" && sha256sum -c vulpra-four-lean.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/packages/full/full-normandy-baseline.tar.xz" | awk '{print $1}')" = "$ORIGINAL_FULL_SHA"
          test "$(sha256sum "$RUNNER_TEMP/packages/lean/vulpra-four-lean.tar.xz" | awk '{print $1}')" = "$COMBINED_LEAN_SHA"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$COMBINED_LEAN_SHA" '.original_source_commit==$src and .combined_native_archive_sha256==$sha and .all_four_generated_config_guards_verified==true and .source_pruning_authorized==false and .m3_sixth_gate_closed==false' "$RUNNER_TEMP/packages/lean/m3-original-four-native-size.json" >/dev/null
      - name: Compare read-only dynamic export symbol sets for all 28 ELF files
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages/full/extracted" "$RUNNER_TEMP/packages/lean/extracted"
          tar -xf "$RUNNER_TEMP/packages/full/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/packages/full/extracted"
          tar -xf "$RUNNER_TEMP/packages/lean/vulpra-four-lean.tar.xz" -C "$RUNNER_TEMP/packages/lean/extracted"
          "$RUNNER_TEMP/abi-observer" "$RUNNER_TEMP/packages/full/extracted" "$RUNNER_TEMP/packages/lean/extracted" "$RUNNER_TEMP/audit/compiled-full-versus-lean-exported-dynsym.json"
          jq -e '.status=="compiled_full_vs_four_optin_elf_dynamic_exports_compared" and .original_full_elf_count==28 and .combined_lean_elf_count==28 and .full_exported_symbol_occurrences>0 and .lean_exported_symbol_occurrences>0 and .full_undefined_import_symbol_occurrences>0 and .lean_undefined_import_symbol_occurrences>0 and .text_sections_compared==28 and (.text_sections_equal + .text_sections_different)==28 and (.differing_text_section_byte_metrics|length)==.text_sections_different and (.differing_text_section_alignment|length)==.text_sections_different and .only_text_section_bytes_examined==true and (.per_elf|length)==28 and .actual_compiled_elf_dynamics_examined==true and .all_rust_cpp_ffi_and_static_symbols_proven==false and .runtime_dlopen_closure_proven==false and .binary_size_reduction_proven==false and .source_removal_authorized==false and .m3_sixth_gate_closed==false' "$RUNNER_TEMP/audit/compiled-full-versus-lean-exported-dynsym.json" >/dev/null
          jq -c '{exports:[.full_exported_symbol_occurrences,.lean_exported_symbol_occurrences],parity:.exact_exported_dynamic_abi_parity,differences:.changed_export_records,undefined_imports:[.full_undefined_import_symbol_occurrences,.lean_undefined_import_symbol_occurrences],import_parity:.exact_undefined_dynamic_import_parity,import_differences:.differing_undefined_import_records,text_sections_equal:.text_sections_equal,text_sections_different:.text_sections_different}' "$RUNNER_TEMP/audit/compiled-full-versus-lean-exported-dynsym.json"
      - name: Verify actual compiled about studies contract absent only in opt-in lean native libxul
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          normal="$RUNNER_TEMP/packages/full/extracted/vulpra/libxul.so"
          lean="$RUNNER_TEMP/packages/lean/extracted/vulpra/libxul.so"
          studies='@mozilla.org/network/protocol/about;1?what=studies'
          grep -aFq -- "$studies" "$normal"
          set +e
          grep -aFq -- "$studies" "$lean"
          lean_studies_status=$?
          set -e
          test "$lean_studies_status" -eq 1
          for retained in welcomeback profilemanager; do
            contract="@mozilla.org/network/protocol/about;1?what=$retained"
            grep -aFq -- "$contract" "$normal"
            grep -aFq -- "$contract" "$lean"
          done
          jq -n --arg source "$SOURCE_SHA" '{
            schema_version:1,
            status:"original_compiled_native_aboutstudies_contract_literal_removed_as_guarded",
            original_source_commit:$source,
            full_aboutstudies_contract_present:true,
            four_optin_lean_aboutstudies_contract_present:false,
            retained_welcomeback_contract_present_in_both:true,
            retained_profilemanager_contract_present_in_both:true,
            real_packaged_compiled_libxul_read_only:true,
            contract_lookup_actually_executed:false,
            all_static_modules_proven:false,
            source_removal_authorized:false,
            m3_sixth_gate_closed:false
          }' > "$RUNNER_TEMP/audit/original-compiled-aboutstudies-contract-strings.json"
          jq -e '.full_aboutstudies_contract_present==true and
            .four_optin_lean_aboutstudies_contract_present==false and
            .retained_welcomeback_contract_present_in_both==true and
            .retained_profilemanager_contract_present_in_both==true and
            .real_packaged_compiled_libxul_read_only==true and
            .contract_lookup_actually_executed==false and
            .source_removal_authorized==false and
            .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/audit/original-compiled-aboutstudies-contract-strings.json" >/dev/null
      - name: Audit actual compiled 28-ELF dynamic relocation types and referenced symbols
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/relocation-audit" \
            "$RUNNER_TEMP/packages/full/extracted" \
            "$RUNNER_TEMP/packages/lean/extracted" \
            "$RUNNER_TEMP/audit/compiled-28-elf-relocation-shape.json"
          jq -e '
            .schema_version==1 and
            .status=="source_matched_28_compiled_elf_dynamic_relocation_shape_compared" and
            .elf_files_compared==28 and
            (.per_elf|length)==28 and
            .full_relocation_records==46356 and
            .lean_relocation_records==46356 and
            .full_named_relocation_occurrences==8894 and
            .lean_named_relocation_occurrences==8894 and
            .changed_per_elf_relocation_type_records==0 and
            .changed_per_elf_named_relocation_reference_records==0 and
            .elf_paths_with_relocation_record_differences==0 and
            .actual_compiled_elf_relocation_sections_inspected==true and
            .relocation_offsets_and_addends_not_equated==true and
            .relocations_do_not_prove_static_ffi_or_runtime_bindings==true and
            .complete_dlopen_closure_proven==false and
            .source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/audit/compiled-28-elf-relocation-shape.json" >/dev/null
          jq -c '{full:.full_relocation_records,lean:.lean_relocation_records,named:[.full_named_relocation_occurrences,.lean_named_relocation_occurrences],changed_type_records:.changed_per_elf_relocation_type_records,changed_named_records:.changed_per_elf_named_relocation_reference_records,changed_files:.elf_paths_with_relocation_record_differences}' "$RUNNER_TEMP/audit/compiled-28-elf-relocation-shape.json"
      - name: Decode packed original compiled libxul ELF64 RELR targets in both variants
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/packed-relr-audit" \
            "$RUNNER_TEMP/packages/full/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/packages/lean/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/audit/compiled-libxul-packed-relr.json"
          jq -e '
            .schema_version==1 and
            .status=="source_matched_original_native_libxul_packed_relr_decoded" and
            .normal_encoded_word_count==13206 and
            .lean_encoded_word_count==13206 and
            .normal_relr_vma==.lean_relr_vma and
            .normal_direct_base_words==26 and
            .lean_direct_base_words==26 and
            .normal_decoded_target_addresses==478592 and
            .lean_decoded_target_addresses==478592 and
            .same_encoded_word_values==6884 and
            .identical_position_target_addresses==0 and
            .set_intersection_of_relocation_target_addresses==327359 and
            .unique_position_shift_values==43 and
            (.top_relative_address_shift_counts|length)>0 and
            .all_decoded_target_offsets_sorted_unique==true and
            .same_relocation_targets_or_addends_proven==false and
            .actual_runtime_relocation_resolution_verified==false and
            .complete_static_rust_cpp_ffi_verified==false and
            .conditional_dlopen_closure_verified==false and
            .source_removal_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/audit/compiled-libxul-packed-relr.json" >/dev/null
          jq -c '{records:[.normal_decoded_target_addresses,.lean_decoded_target_addresses],encoded_words:[.normal_encoded_word_count,.lean_encoded_word_count],common_target_offsets:.set_intersection_of_relocation_target_addresses,top_shifts:.top_relative_address_shift_counts[:3]}' "$RUNNER_TEMP/audit/compiled-libxul-packed-relr.json"
      - name: Fail closed on combined original typed and packed relocation witness
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile typed "$RUNNER_TEMP/audit/compiled-28-elf-relocation-shape.json" \
            --slurpfile relr "$RUNNER_TEMP/audit/compiled-libxul-packed-relr.json" '
            ($typed[0]) as $a |
            ($relr[0]) as $b |
            if $a.elf_files_compared==28 and
               $a.full_relocation_records==$a.lean_relocation_records and
               $a.full_named_relocation_occurrences==$a.lean_named_relocation_occurrences and
               $a.changed_per_elf_relocation_type_records==0 and
               $a.changed_per_elf_named_relocation_reference_records==0 and
               $a.elf_paths_with_relocation_record_differences==0 and
               $b.normal_decoded_target_addresses==$b.lean_decoded_target_addresses and
               $b.normal_encoded_word_count==$b.lean_encoded_word_count and
               $b.all_decoded_target_offsets_sorted_unique==true and
               $b.same_relocation_targets_or_addends_proven==false and
               $a.complete_dlopen_closure_proven==false and
               $b.complete_static_rust_cpp_ffi_verified==false and
               $a.m3_sixth_gate_closed==false and $b.m3_sixth_gate_closed==false
            then {
              schema_version:1,
              status:"original_compiled_28_elf_typed_and_packed_relocation_count_parity",
              source_commit:"b1482404dfb8b01342990ee99ea3df0f9756b5f7",
              normal_typed_relocations:$a.full_relocation_records,
              lean_typed_relocations:$a.lean_relocation_records,
              normal_named_references:$a.full_named_relocation_occurrences,
              lean_named_references:$a.lean_named_relocation_occurrences,
              normal_packed_relr_targets:$b.normal_decoded_target_addresses,
              lean_packed_relr_targets:$b.lean_decoded_target_addresses,
              normal_combined_record_count:($a.full_relocation_records + $b.normal_decoded_target_addresses),
              lean_combined_record_count:($a.lean_relocation_records + $b.lean_decoded_target_addresses),
              actual_relocation_target_values_equivalent:false,
              complete_rust_cpp_static_ffi_graph_proven:false,
              all_runtime_dlopen_edges_proven:false,
              source_removal_authorized:false,
              m3_sixth_gate_closed:false
            } else error("Typed/packed relocation census no longer reconciles") end
          ' > "$RUNNER_TEMP/audit/original-compiled-typed-packed-relocation-crosswalk.json"
          jq -e '
            .status=="original_compiled_28_elf_typed_and_packed_relocation_count_parity" and
            .normal_typed_relocations==46356 and .lean_typed_relocations==46356 and
            .normal_named_references==8894 and .lean_named_references==8894 and
            .normal_packed_relr_targets==478592 and .lean_packed_relr_targets==478592 and
            .normal_combined_record_count==524948 and .lean_combined_record_count==524948 and
            .actual_relocation_target_values_equivalent==false and
            .complete_rust_cpp_static_ffi_graph_proven==false and
            .all_runtime_dlopen_edges_proven==false and
            .source_removal_authorized==false and .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/audit/original-compiled-typed-packed-relocation-crosswalk.json" >/dev/null
          jq -c '{typed:.normal_typed_relocations,packed:.normal_packed_relr_targets,total:.normal_combined_record_count}' \
            "$RUNNER_TEMP/audit/original-compiled-typed-packed-relocation-crosswalk.json"
      - name: Compare compiled libxul named dynamic-exported function bytes by symbol address
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/libxul-func-observer" \
            "$RUNNER_TEMP/packages/full/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/packages/lean/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/audit/compiled-libxul-exported-function-bodies.json"
          jq -e '
            .schema_version==1 and
            .status=="pinned_original_libxul_named_dynsym_function_code_comparison" and
            .full_text_bytes==128073093 and
            .lean_text_bytes==128073125 and
            .shared_mappable_named_functions>0 and
            (.byte_identical_named_functions +
             .byte_different_equal_size_named_functions +
             .changed_size_named_functions)==.shared_mappable_named_functions and
            (.full_only_mappable_function_records +
             .shared_mappable_named_functions)==.full_mappable_function_records and
            (.lean_only_mappable_function_records +
             .shared_mappable_named_functions)==.lean_mappable_function_records and
            .scope_is_exported_dynsym_funcs_only==true and
            .all_internal_or_static_ffi_functions_verified==false and
            .runtime_dlopen_graph_verified==false and
            .source_pruning_authorized==false and
            .m3_sixth_gate_closed==false
          ' "$RUNNER_TEMP/audit/compiled-libxul-exported-function-bodies.json" >/dev/null
          jq -c '{full_functions:.full_mappable_function_records,lean_functions:.lean_mappable_function_records,matched:.shared_mappable_named_functions,identical:.byte_identical_named_functions,changed:.byte_different_equal_size_named_functions,resized:.changed_size_named_functions}' "$RUNNER_TEMP/audit/compiled-libxul-exported-function-bodies.json"
      - name: Compare compiled libxul unwind FDE ranges with and without 32-byte shift
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/unwind-fde-observer" \
            "$RUNNER_TEMP/packages/full/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/packages/lean/extracted/vulpra/libxul.so" \
            "$RUNNER_TEMP/audit/compiled-libxul-unwind-fde-shift.json"
          jq -e '
            .schema_version==1 and
            .status=="original_compiled_libxul_unwind_fde_shift_comparison" and
            .full_text_bytes==128073093 and
            .lean_text_bytes==128073125 and
            .full_fde_records>10 and .lean_fde_records>10 and
            .full_unique_in_text_fde_ranges>10 and
            .lean_unique_in_text_fde_ranges>10 and
            (.zero_shift_identical_code_ranges +
             .zero_shift_different_code_ranges)==.zero_shift_matching_fde_ranges and
            (.plus_32_shift_identical_code_ranges +
             .plus_32_shift_different_code_ranges)==.plus_32_shift_matching_fde_ranges and
            (.unwind_fde_both_alignments +
             .unwind_fde_zero_only +
             .unwind_fde_plus_32_only +
             .unwind_fde_neither_alignment)==.full_unique_in_text_fde_ranges and
            (.unwind_fde_both_alignments +
             .unwind_fde_zero_only)==.zero_shift_matching_fde_ranges and
            (.unwind_fde_both_alignments +
             .unwind_fde_plus_32_only)==.plus_32_shift_matching_fde_ranges and
            .unwind_fde_identical_under_either <=
