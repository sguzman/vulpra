# Read-only native Gecko / Rust build dependency audit; no browser compilation.
name: M3 Linux Native and Rust Feature Boundary Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-build-feature-boundaries.yml
      - ci/m3-native-build-feature-boundaries.py
      - browser/app.mozbuild
      - browser/moz.configure
      - toolkit/toolkit.mozbuild
      - widget/moz.build
      - toolkit/library/moz.build
      - toolkit/library/rust/**
      - toolkit/components/moz.build
      - toolkit/components/telemetry/moz.build
      - services/moz.build
      - devtools/moz.build
      - browser/components/moz.build
      - browser/components/newtab/moz.build
      - browser/extensions/newtab/moz.build
      - browser/components/genai/moz.build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-native-source-bounds:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sparse checkout source audit script, retain complete pinned Git objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ci

      - name: Assert bounded native dependency source relationships
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile ci/m3-native-build-feature-boundaries.py
          python3 ci/m3-native-build-feature-boundaries.py --self-test \
            --output "$RUNNER_TEMP/m3-native-build-feature-boundaries.json"
          jq -e '
            .source_commit == env.GITHUB_SHA and
            .source_only == true and
            .removal_authorized == false and
            .config_guard_values_not_evaluated == true and
            .package_bytes_saved == null and
            .invalid_mutations_rejected == 18 and
            (.boundaries | length) == 14 and
            ([.boundaries[].id] | unique | length) == 14 and
            (all(.boundaries[]; (.anchors | length) >= 1))
          ' "$RUNNER_TEMP/m3-native-build-feature-boundaries.json" >/dev/null

      - name: Preserve source-only dependency crosswalk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-build-feature-boundaries
          path: ${{ runner.temp }}/m3-native-build-feature-boundaries.json
          if-no-files-found: warn
          retention-days: 14
