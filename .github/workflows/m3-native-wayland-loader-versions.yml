# Actual original compiled browser and checked static version names.
# Real native 10s Wayland frame required both with and without LD_DEBUG=versions.
name: M3 Native Wayland Real GNU Loader Version Check Reconciliation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-native-wayland-loader-versions.yml
      - ci/m3-native-loader-version-checks.py
      - packaging/test-wayland.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observe-original-native-version-checks:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      SOURCE_SHA: b1482404dfb8b01342990ee99ea3df0f9756b5f7
      ARCHIVE_SHA: 7aa4f20d1f6058e2ef92d73dec875f3bbfe98ee5a5fe1ea1b11fcb294762069a
      SOURCE_RUN: '40997075527'
      STATIC_RUN: '41157293087'
      STATIC_HEAD: 184d5b33678152c1bd28b0c35cecc450e49c93f1
    steps:
      - name: Checkout isolated native browser version-check parser
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
            packaging
      - name: Reject counterfeit version checks and authenticate source runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n packaging/test-wayland.sh
          python3 ci/m3-native-loader-version-checks.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --arg sha "$SOURCE_SHA" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STATIC_RUN" |
            jq -e --arg sha "$STATIC_HEAD" '
              .status=="completed" and .conclusion=="success" and .head_sha==$sha and
              .name=="M3 Source-Pinned Native ELF Version-Name Inventory"' >/dev/null
      - name: Download only exact original native browser and successful original static ABI report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/static" "$RUNNER_TEMP/extracted"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name vulpra-m3-normandy-matched-full-baseline --dir "$RUNNER_TEMP/native"
          gh run download "$STATIC_RUN" --repo "$GITHUB_REPOSITORY" \
            --name m3-native-version-name-contract --dir "$RUNNER_TEMP/static"
          (cd "$RUNNER_TEMP/native" && sha256sum -c full-normandy-baseline.tar.xz.sha256)
          test "$(sha256sum "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" | cut -d ' ' -f 1)" = "$ARCHIVE_SHA"
          jq -e --arg src "$SOURCE_SHA" --arg sha "$ARCHIVE_SHA" '
            .source_commit==$src and .original_archive_sha256==$sha and
            .native_elf_declared_version_requirements==519 and
            .actual_symbol_resolution_proven==false' \
            "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" >/dev/null
          tar -xf "$RUNNER_TEMP/native/full-normandy-baseline.tar.xz" -C "$RUNNER_TEMP/extracted"
          test -x "$RUNNER_TEMP/extracted/vulpra/vulpra"
      - name: Install private Weston and original native GTK runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            --no-install-recommends weston wayland-utils libgtk-3-0t64 \
            libdbus-glib-1-2 libasound2t64 libnss3 libgbm1
      - name: Preserve real original native offline Wayland ten-second baseline
        shell: bash
        run: |
          set -euo pipefail
          env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 VULPRA_WAYLAND_TEST_OFFLINE=1 \
            VULPRA_WAYLAND_TEST_SECONDS=10 \
            bash packaging/test-wayland.sh "$RUNNER_TEMP/extracted/vulpra"
          echo 'PASS: real native 10s same-surface Wayland frame under strict network guard'
      - name: Record only bounded browser-specific glibc version name checks
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          umask 077
          folder="$(mktemp -d)"
          trap 'rm -rf -- "$folder"' EXIT
          env MOZ_DISABLE_NONLOCAL_CONNECTIONS=1 VULPRA_WAYLAND_TEST_OFFLINE=1 \
            VULPRA_WAYLAND_TEST_SECONDS=10 \
            VULPRA_M3_LOADER_TRACE_PREFIX="$folder/m3-loader" \
            VULPRA_M3_LOADER_TRACE_KIND=versions \
            bash packaging/test-wayland.sh "$RUNNER_TEMP/extracted/vulpra"
          python3 ci/m3-native-loader-version-checks.py \
            --actual "$folder" \
            --static "$RUNNER_TEMP/static/m3-native-elf-version-contract.json" \
            --output "$RUNNER_TEMP/m3-native-loader-version-checks.json"
          jq -e --arg sha "$ARCHIVE_SHA" --arg src "$SOURCE_SHA" '
            .schema_version==1 and .source_commit==$src and
            .original_archive_sha256==$sha and
            .browser_libxul_pid_trace_count>0 and
            .static_version_name_contracts==519 and
            .observed_original_static_version_checks>0 and
            .observed_original_static_version_checks+
              .unobserved_original_static_version_checks==519 and
            .raw_loader_paths_or_pids_retained==false and
            .actual_dynamic_symbol_bindings_proven==false and
            .unexecuted_feature_routes_proven==false and
            .new_source_removal_authorized==false and .m3_sixth_gate_closed==false' \
            "$RUNNER_TEMP/m3-native-loader-version-checks.json" >/dev/null
          echo 'PASS: verified native original glibc loader version checks; no complete ABI gate'
      - name: Preserve only sanitized requested version triples
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-graphical-loader-version-checks
          path: ${{ runner.temp }}/m3-native-loader-version-checks.json
          if-no-files-found: error
          retention-days: 14
