name: Vulpra Security QA Worktree Isolation Fixtures
on:
  push:
    branches: [main]
    paths:
      - scripts/vulpra-security-qa.sh
      - scripts/vulpra-security-qa-build.sh
      - nix/vulpra
      - ci/test-vulpra-security-qa.sh
      - ci/smoke-webextension-package-local.py
      - .github/workflows/security-qa-worktree-fixtures.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated QA source files only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/vulpra-security-qa.sh
            scripts/vulpra-security-qa-build.sh
            nix/vulpra
            ci/test-vulpra-security-qa.sh
            ci/smoke-webextension-package-local.py
      - name: Verify no-Nix, detached, disposable QA safety contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/vulpra-security-qa.sh
          bash -n scripts/vulpra-security-qa-build.sh
          bash -n nix/vulpra
          bash -n ci/test-vulpra-security-qa.sh
          bash ci/test-vulpra-security-qa.sh
          python3 ci/smoke-webextension-package-local.py --self-test-cert-parser
          python3 ci/smoke-webextension-package-local.py --self-test-synthetic-extension-fixture
          python3 ci/smoke-webextension-package-local.py --self-test-byob-assertions
          python3 ci/smoke-webextension-package-local.py --self-test-user-agent-parser
          python3 ci/smoke-webextension-package-local.py --self-test-style-geometry
          echo 'LIMIT: synthetic mock only; real Gecko QA is separate'
