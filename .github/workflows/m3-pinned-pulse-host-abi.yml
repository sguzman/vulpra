# Exact external cubeb PulseAudio function ABI vs disposable Ubuntu CI host.
# A single host ABI check, not all Vulpra dlopen dependencies or Arch proof.
name: M3 Pinned PulseAudio Real Host Export ABI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m3-pinned-pulse-host-abi.yml
      - ci/m3-pinned-pulse-host-abi.rs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-host-pulse-elf:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CUBEB_SHA: 88194f91c8778fa608a19af7b91306094525595d
    steps:
      - name: Checkout source-only bounded inspector
        uses: actions/checkout@v4
        with:
          path: inspector
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-pinned-pulse-host-abi.rs
      - name: Checkout exact external Mozilla cubeb-pulse-rs FFI implementation
        uses: actions/checkout@v4
        with:
          repository: mozilla/cubeb-pulse-rs
          path: external
          ref: 88194f91c8778fa608a19af7b91306094525595d
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pulse-ffi/src/ffi_funcs.rs
      - name: Install host PulseAudio runtime SONAME
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends libpulse0 binutils
          test -r /usr/lib/x86_64-linux-gnu/libpulse.so.0
      - name: Compile and test bounded Rust ABI verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C inspector rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C external rev-parse HEAD)" = "$CUBEB_SHA"
          rustc --edition=2021 --test inspector/ci/m3-pinned-pulse-host-abi.rs -o "$RUNNER_TEMP/pulse-abi-tests"
          "$RUNNER_TEMP/pulse-abi-tests"
          rustc --edition=2021 inspector/ci/m3-pinned-pulse-host-abi.rs -o "$RUNNER_TEMP/pulse-abi-proof"
      - name: Verify pinned dynamic symbols against actual Ubuntu ELF export table
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pulse-abi-proof" "$CUBEB_SHA" \
            "$GITHUB_WORKSPACE/external/pulse-ffi/src/ffi_funcs.rs" \
            /usr/lib/x86_64-linux-gnu/libpulse.so.0 \
            "$RUNNER_TEMP/m3-pinned-pulse-host-abi.json"
          jq -e --arg sha "$CUBEB_SHA" '
            .external_cubeb_source_commit==$sha and
            .requested_dlsym_function_count==82 and
            .host_exported_requested_functions==82 and
            .missing_requested_host_functions==0 and
            .single_host_library_abi_compatible==true and
            .glibc_dlopen_and_dlsym_resolved_all_requested==true and
            .arch_host_abi_verified==false and
            .all_dlopen_dependencies_closed==false and
            .m3_sixth_gate_closed==false' "$RUNNER_TEMP/m3-pinned-pulse-host-abi.json" >/dev/null
      - name: Save bounded host ABI evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-pinned-pulse-host-abi
          path: ${{ runner.temp }}/m3-pinned-pulse-host-abi.json
          if-no-files-found: warn
          retention-days: 14
