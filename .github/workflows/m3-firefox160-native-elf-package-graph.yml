# Source-pinned, no-build Firefox 160 ELF package census for M3 dependency closure.
# Read-only archive inspection: never load binaries or claim dynamic/FFI completeness.
name: M3 Firefox 160 Exact-Source Native ELF Package Graph (No Build)
on:
  push:
    branches: [upgrade/firefox-160-overlay-prototype]
    paths:
      - .github/workflows/m3-firefox160-native-elf-package-graph.yml
      - ci/m3-native-elf-package-graph.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-elf-package-graph:
    if: github.repository == 'sguzman/vulpra' && github.ref == 'refs/heads/upgrade/firefox-160-overlay-prototype'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate original native Firefox 160 producer and preserved source/package archive
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const {data:producer}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:43138458940});
            if(producer.repository?.full_name!=='sguzman/vulpra' ||
               producer.head_sha!=='0624235fdc956ab18af3c3f310b3588ca72fff61' ||
               producer.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               producer.name!=='Firefox 160 Vulpra Exact-Source Native Build & Runtime Candidate' ||
               producer.status!=='completed' || producer.conclusion!=='success')
              throw Error('Native producer mismatch');
            const {data:mirror}=await github.rest.actions.getWorkflowRun({owner,repo,run_id:43724886827});
            if(mirror.repository?.full_name!=='sguzman/vulpra' ||
               mirror.head_sha!=='54728803f058c3edf54d2e8d3f6e0a7d2af0aec6' ||
               mirror.head_branch!=='upgrade/firefox-160-overlay-prototype' ||
               mirror.name!=='Firefox 160 Verified Native Archive Preservation (No Build)' ||
               mirror.status!=='completed' || mirror.conclusion!=='success')
              throw Error('Preservation identity mismatch');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner,repo,run_id:43724886827,per_page:100});
            for(const name of ['firefox160-vulpra-preserved-native-preview-not-approved',
                               'firefox160-vulpra-preserved-materialized-source-proof']){
              if(artifacts.filter(a=>a.name===name && !a.expired && a.size_in_bytes>0 &&
                new Date(a.expires_at)>new Date()).length!==1)
                throw Error('Required preserved package/source proof unavailable: '+name);
            }
            core.info('PASS: original native Firefox160 build, archive mirror and complete source identities pinned');
      - name: Checkout existing read-only ELF parser only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ci/m3-native-elf-package-graph.py
      - name: Validate parser identity and reject corrupt archive/ELF fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object ci/m3-native-elf-package-graph.py)" = '2953ff3a1dff6512e5c69c6b0dded193e8f87945'
          command -v readelf
          python3 -m py_compile ci/m3-native-elf-package-graph.py
          python3 ci/m3-native-elf-package-graph.py --self-test
      - name: Download original archived Firefox 160 package and checksum
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-native-preview-not-approved
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/native
      - name: Download original complete materialized-source identity
        uses: actions/download-artifact@v4
        with:
          name: firefox160-vulpra-preserved-materialized-source-proof
          repository: sguzman/vulpra
          run-id: 43724886827
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source
      - name: Verify exact Firefox160 materialized source and native checksum
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .upstream_release_commit=="2887d9de1f69c0e9776413da80e7ba0d1225dd9b" and
            .complete_materialized_source_tree=="42dd7439a27dde92f89ac5eed13f88117a4d7ab5" and
            .verified_overlays==28 and .exact_assembly_tree_match==true and
            .upstream_paths_otherwise_preserved==true
          ' "$RUNNER_TEMP/source/materialized-candidate.json" >/dev/null
          (cd "$RUNNER_TEMP/native" && sha256sum -c vulpra-firefox160-native-ci.tar.xz.sha256)
          test -s "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz"
      - name: Inspect all source-authenticated Firefox160 packaged ELF files, without loading native code
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 ci/m3-native-elf-package-graph.py             "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz"             --output "$RUNNER_TEMP/firefox160-source-matched-native-elf-graph.json"
          digest="$(sha256sum "$RUNNER_TEMP/native/vulpra-firefox160-native-ci.tar.xz" | cut -d ' ' -f 1)"
          jq -e --arg digest "$digest" '
            .schema_version==1 and .archive_sha256==$digest and
            (.elf_members|length)>=20 and (.elf_members|length)<=100 and
            (.direct_needed_edges>=100 and .direct_needed_edges<=2000) and
            (.archive_regular_members>=30 and .archive_regular_members<=1024) and
            (.unique_needed_names>=20 and .unique_needed_names<=200) and
            ([.elf_members[]|select(.name=="libxul.so")]|length)==1 and
            (.elf_members|all(.sha256|test("^[a-f0-9]{64}$"))) and
            (.direct_edges|length)==.direct_needed_edges and
            (.not_packaged_needed_names|length)>0 and
            .host_dependency_resolution_verified==false and
            .dlopen_and_indirect_runtime_dependencies_complete==false and
            .all_native_binary_execution_avoided==true and
            .no_package_source_edited==true and
            .source_removal_authorized==false and
            .marginal_compressed_saving_bytes==null
          ' "$RUNNER_TEMP/firefox160-source-matched-native-elf-graph.json" >/dev/null
          tmp="$RUNNER_TEMP/firefox160-source-matched-native-elf-graph-tagged.json"
          jq --arg head "$GITHUB_SHA" --arg digest "$digest" '
            . + {
              firefox160_upstream_release_commit:"2887d9de1f69c0e9776413da80e7ba0d1225dd9b",
              firefox160_candidate_git_tree:"42dd7439a27dde92f89ac5eed13f88117a4d7ab5",
              firefox160_verified_overlays:28,
              native_browser_producer_run:43138458940,
              exact_source_archive_mirror_run:43724886827,
              dependency_scanner_commit:$head,
              checked_native_archive_sha256:$digest,
              current_main_binary_equivalence_proven:false,
              complete_host_loader_closure_proven:false,
              complete_native_ffi_dependency_map_proven:false,
              arch_hyprland_workstation_verified:false,
              security_current:false,
              release_ready:false,
              m3_sixth_gate_closed:false
            }
          ' "$RUNNER_TEMP/firefox160-source-matched-native-elf-graph.json" > "$tmp"
          mv "$tmp" "$RUNNER_TEMP/firefox160-source-matched-native-elf-graph.json"
          jq -r '"Actual Firefox160 packaged native ELF files: " + (.elf_members|length|tostring) +
            "; direct declared DT_NEEDED edges: " + (.direct_needed_edges|tostring) +
            "; host-absent-in-archive library names: " + (.not_packaged_needed_names|length|tostring)'             "$RUNNER_TEMP/firefox160-source-matched-native-elf-graph.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'LIMIT: direct package ELF declarations only; no exhaustive runtime dlopen, FFI, host ABI or release conclusion.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive sanitized exact-source native ELF graph, not binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox160-source-matched-native-elf-package-graph-not-m3-closure
          path: ${{ runner.temp }}/firefox160-source-matched-native-elf-graph.json
          if-no-files-found: warn
          retention-days: 30
